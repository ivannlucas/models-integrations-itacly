  # dentro de data/splits/test.csv). "expected" es la salida REAL de ejecutar
  # load_artifacts_src() + predict_next_month() del codigo entregado tal cual,
  # contra los artefactos .pkl reales y el dataset_v7_fe.csv real (no inventado,
  # no generado sinteticamente) -- verifica el wiring del plugin, no "si el
  # modelo acierta el mercado" (para eso estan metrics_reported arriba).
