model_id: ml19-cereals-cost-forecast
sector: cerealista
nombre: "DATAGIA-19 -- Desarrollo de un modelo predictivo de coste de materias primas, basado en redes neuronales recurrentes (CORE-CEREAL)"
task_type: regression_classification_ensemble  # multi-horizonte: regresion (retorno %) + clasificacion (direccion) combinadas en una senal ensemble
framework: [scikit-learn==1.8.0, xgboost==3.2.0, pandas, numpy]

# -----------------------------------------------------------------------------
# DECISION DE ARQUITECTURA (confirmada con el usuario antes de completar este
# manifest -- ver hilo de la integracion): a diferencia de los modelos 13/14/18,
# aqui NO tiene sentido que el cliente aporte un historico de precios en la
# request. El pipeline de features depende de 7 fuentes externas heterogeneas
# (MAPA, ESYRCE, clima via Google Earth Engine, FAO, Yahoo Finance, BCE) y usa
# estadisticos expanding() (media/std desde 2006), que ningun caller de API
# puede reproducir por si mismo. El propio codigo de produccion (predict.py)
# confirma este diseno: no recibe datos del caller, lee la ultima fila (o una
# fecha concreta) de un dataset_v7_fe.csv ya pre-calculado por el pipeline ETL
# completo (src/data_processing/), y la memoria lo confirma explicitamente
# (seccion 4.4 "Entradas del modelo": "La entrada esperada es el dataset
# resultante del pipeline de ingenieria de caracteristicas (dataset_v7_fe.csv)").
#
# Decision: el plugin empaqueta data/processed/auto/dataset_v7_fe.csv (484 KB,
# 238 filas) como artefacto estatico de referencia, igual que otros plugins
# empaquetan un diccionario de vecindad o un scaler. predict_inline no exige
# ningun campo obligatorio; admite un "date" opcional (YYYY-MM) para elegir un
# mes historico, igual que el --date del CLI original; sin fecha, devuelve la
# fila mas reciente del dataset empaquetado.
#
# LIMITACION IMPORTANTE (ver known_issues): este dataset queda CONGELADO en la
# fecha de entrega (ultima fila real: 2026-01). No se actualiza solo -- mantenerlo
# vivo exige credenciales GEE, descargas manuales de Excel del MAPA y llamadas a
# Yahoo Finance, es decir, re-ejecutar el pipeline completo de
# src/data_processing/, que queda fuera del alcance de este plugin.
# -----------------------------------------------------------------------------

artifacts:
  folder: models/artifacts/     # ruta dentro del codigo entregado
  files:
    - training_meta.json          # features (lista de 48, orden vinculante), best_reg/best_clf por horizonte, train_end
    - best_reg_h1m_ridge.pkl       # {model, scaler, model_name} -- Ridge(alpha=100)
    - best_reg_h2m_xgboost.pkl     # {model, scaler, model_name} -- XGBoost regresor
    - best_reg_h3m_xgboost.pkl     # {model, scaler, model_name} -- XGBoost regresor
    - best_clf_h1m_logreg.pkl      # {model, scaler, model_name} -- LogisticRegression(C=0.1)
    - best_clf_h2m_xgboost.pkl     # {model, scaler, model_name} -- XGBoost clasificador
    - best_clf_h3m_xgboost.pkl     # {model, scaler, model_name} -- XGBoost clasificador
  # Nota de integridad: el codigo original guarda sidecars *.sha256 por cada
  # artefacto (src/utils/io.py::load_pickle/load_json, validate_integrity=True,
  # strict_integrity=True) y valida ademas que training_meta["features"] case
  # con cada scaler.n_features_in_ y cada model.n_features_in_ (ver
  # validate_artifacts_compatibility). El plugin deberia portar al menos la
  # validacion de compatibilidad (no necesariamente el sha256 estricto, que es
  # un detalle de higiene del repo original); documentar en plugin-integration
  # si se omite.
  reference_dataset:
    file: data/processed/auto/dataset_v7_fe.csv   # 238 filas x 145 columnas, 484 KB -- empaquetar junto al modelo
    note: >
      Dataset de features ya calculado (salida de src/data_processing/feature_engineering.py).
      El motor de inferencia selecciona por NOMBRE las 48 columnas de
      training_meta.json["features"]; el resto (incluidos los targets) se
      ignora. CONGELADO a la fecha de entrega (ultima fila: 2026-01).

inputs:
  fixed: []        # no hay inputs fijos obligatorios -- ver decision de arquitectura arriba
  control:
    - name: date
      type: str | null
      format: "YYYY-MM"
      required: false
      description: >
        Mes a consultar dentro del dataset_v7_fe.csv empaquetado (igual que
        --date en el CLI original). Si se omite, se usa la fila mas reciente
        del dataset (equivalente a --last). Si la fecha no existe en el
        dataset empaquetado, error de dominio (ValueError en el codigo
        original -- ver get_row_from_dataset).
  derived_if_missing: {}   # no aplica: no hay features derivadas de input de cliente en este plugin

outputs:
  predict_inline:
    - date_label: str          # mes "hoy" usado (fila de referencia), YYYY-MM
    - mapa_month_used: str     # mes MAPA real que alimenta las features de esa fila (date_label desplazado -3 meses)
    - train_cutoff: str        # artifacts["meta"]["train_end"], 2019-12-31
    - horizons:                # uno por horizonte disponible (1, 2, 3)
        - horizon: int            # 1, 2 o 3 (meses)
          predicted_for: str       # mes calendario que predice este horizonte (date_label + horizon)
          reg:
            model_name: str        # Ridge | XGBoost
            pred: float             # retorno % esperado
            signal: int              # -1, 0, 1 (np.sign(pred), 0 solo si pred==0 exacto)
            signal_str: str          # LONG | SHORT | FLAT
          clf:
            model_name: str        # LogReg | XGBoost
            prob_up: float           # P(subida) de predict_proba
            pred_class: int          # 0 | 1
            signal: int               # -1 | 1
            signal_str: str           # LONG | SHORT
          ensemble_signal: int       # np.sign(signal_reg + signal_clf)
          ensemble_str: str           # LONG | SHORT | FLAT
          confidence: str              # ALTA (reg y clf coinciden en signo) | BAJA (discrepan)

training:
  supported: false
  target_column: null
  required_columns: null
  hyperparams: null
  metrics_returned: null
  source: null
  reason: >
    El codigo de entrenamiento (src/training/train.py) SI existe, pero opera
    exclusivamente sobre data/processed/auto/dataset_v7_fe.csv -- no acepta un
    CSV de usuario como data_path (a diferencia de los modelos 13/14/18). Para
    regenerar ese dataset hace falta ejecutar el pipeline ETL completo
    (src/data_processing/), que requiere autenticacion Google Earth Engine,
    descarga manual de ficheros Excel del MAPA/ESYRCE y llamadas en vivo a
    Yahoo Finance -- infraestructura externa fuera del alcance de un endpoint
    de reentrenamiento de plugin. No se inventa un contrato de
    train(data_path=<csv_usuario>) que el equipo de IA no definio para este
    modelo. La memoria (seccion 10.4, "Protocolo de reentrenamiento") confirma
    que el reentrenamiento es una operacion manual semestral
    (`python -m src.main all`), no un servicio expuesto.

constraints: {}   # no se han encontrado restricciones duras de negocio tipo "PU >= X" en el codigo

metrics_reported:
  # Tabla 38 + Tabla 39 de la memoria v6.1 -- "Resultados en el periodo de
  # prueba (Test Out-of-sample)", periodo walk-forward 2020-01..2025-09.
  # Coincide con models/artifacts/model_selection_audit.json (best_reg/best_clf
  # seleccionados por Sharpe maximo / AUC maximo respectivamente).
  regresion:
    h1m: {modelo: Ridge, pearson_r: 0.604, dir_accuracy_pct: 80.9, sharpe: 2.61}
    h2m: {modelo: XGBoost, pearson_r: 0.559, dir_accuracy_pct: 71.6, sharpe: 1.66}
    h3m: {modelo: XGBoost, pearson_r: 0.611, dir_accuracy_pct: 77.3, sharpe: 2.71}
  clasificacion:
    h1m: {modelo: LogReg, auc_roc: 0.802, accuracy_pct: 68.1}
    h2m: {modelo: XGBoost, auc_roc: 0.778, accuracy_pct: 71.0}
    h3m: {modelo: XGBoost, auc_roc: 0.842, accuracy_pct: 78.3}
  criterios_exito_memoria:
    direction_accuracy_h1_min: 60    # %
    sharpe_h1_min: 1.0
    auc_roc_clasificacion_min: 0.65
    da_alta_confianza_min: 65         # %
  kpi_contractual: "Todos los umbrales de la Tabla 35 superados en h=1m; h=2m y h=3m son senal orientativa (menor N independiente: ~34 y ~22 obs.)"

golden_cases:
