known_issues:
  - id: arquitectura_dataset_congelado
    detail: >
      El plugin empaqueta data/processed/auto/dataset_v7_fe.csv como artefacto
      estatico (ver nota de arquitectura al inicio de este manifest). La ultima
      fila real es 2026-01 -- el plugin NUNCA avanzara mas alla de esa fecha
      salvo que alguien regenere el dataset ejecutando el pipeline ETL completo
      (credenciales GEE, descargas manuales MAPA/ESYRCE, llamadas Yahoo
      Finance) fuera del plugin y se vuelva a desplegar con el CSV actualizado.
      Esto debe quedar explicito en la ficha funcional: no es un modelo que
      "siga el mercado en vivo" salvo mantenimiento manual periodico.
  - id: discrepancia_memoria_vs_codigo_mitigacion_riesgos
    detail: >
      La memoria (Tabla 48, seccion "Plan de mitigacion de riesgos") describe
      dos mecanismos operativos que NO existen en el codigo entregado: (1) un
      "Gate automatico en predict.py: si la volatilidad > threshold, se emite
      el flag ALTA VOLATILIDAD" -- no hay ningun flag ni gate de volatilidad en
      src/predict/predict.py; (2) un "Filtro de confianza: Solo se actuan
      senales con probabilidad > 0.65 o < 0.35" -- el codigo real no filtra
      senales por prob_up, siempre devuelve el resultado de los 3 horizontes.
      Las constantes 0.65/0.35 que SI existen en el codigo
      (REL_CLF_STRONG.auc=0.65, REL_REG_STRONG.r=0.35, src/utils/constants.py)
      son umbrales de un veredicto de FIABILIDAD para los reportes de
      get_stats, no un filtro operativo de predict.py. El plugin NO debe
      inventar estos mecanismos para "cumplir" la memoria -- debe replicar
      fielmente predict_next_month() tal cual esta, y esta discrepancia debe
      quedar senalada para revision humana (igual que el caso RNN-vs-modelo-
      tabular de otros modelos de este repo).
  - id: discrepancia_memoria_modelo_clasificacion_h1
    detail: >
      La memoria es inconsistente consigo misma sobre el modelo ganador de
      clasificacion en H1: el resumen inicial (seccion "Objetivos", parrafo de
      alcance) dice en un sitio "RandomForest para H1, H2 y H3 en
      clasificacion" pero mas adelante, en el mismo parrafo, corrige a "LogReg
      gana en h=1m y XGBoost en h=2m y h=3m". La Tabla 39 (resultados de test,
      autoritativa) y los artefactos realmente entregados (best_clf_h1m_logreg.pkl,
      training_meta.json["best_clf"]["1"]="LogReg") confirman LogReg en H1 --
      es la version correcta; la mencion a RandomForest en el resumen inicial
      parece una frase no actualizada de una iteracion anterior de la memoria.
  - id: discrepancia_metricas_tabla35_vs_tabla38
    detail: >
      Tabla 36 (seccion "Evaluacion de cumplimiento") reporta "Direction
      Accuracy H1 (Ridge) 78.8%" y "AUC-ROC H1 (XGBoost) 0.877", mientras que
      Tabla 38/39 (seccion "Resultados en el periodo de prueba", la que se usa
      en metrics_reported de este manifest) reportan DA=80.9% para Ridge H1 y
      AUC=0.802 para LogReg H1 (no XGBoost). Los numeros y hasta el modelo
      citado no coinciden entre ambas tablas de la misma memoria. Se ha tomado
      Tabla 38/39 como referencia por estar mas proxima a la seccion de
      resultados oficiales y coincidir con model_selection_audit.json, pero
      la discrepancia debe quedar documentada, no silenciada.
  - id: requirements_encoding
    detail: >
      requirements.txt viene con BOM UTF-8 y terminadores CRLF (Windows). Se
      normalizo a UTF-8/LF en requirements_fixed.txt para esta extraccion;
      aplicar la misma normalizacion antes de usarlo en cualquier pipeline
      (pip install, pip-audit, etc.) en plugin-integration.
  - id: version_pins_pickle
    detail: >
      Los artefactos .pkl se serializaron con scikit-learn==1.8.0 y
      xgboost==3.2.0 (ver requirements.txt). Cargarlos con scikit-learn 1.9.1
      emite InconsistentVersionWarning (no error) para Ridge/StandardScaler/
      LogisticRegression; xgboost emite un UserWarning de formato de
      serializacion con xgboost 3.4.1. Verificado que las predicciones no
      cambian (18 golden cases arriba generados exactamente con estas
      versiones no-pineadas y coinciden con model_selection_audit.json), pero
      el plugin deberia pinear scikit-learn==1.8.0 y xgboost==3.2.0 en su
      propio requirements para eliminar el riesgo en vez de confiar en que la
      compatibilidad se mantenga.
  - id: golden_cases_fuente
    detail: >
      Los 18 golden_cases de arriba son la salida real de ejecutar
      load_artifacts_src()+predict_next_month() (codigo entregado, sin
      modificar) contra los 6 artefactos .pkl reales y
      data/processed/auto/dataset_v7_fe.csv real, para 18 fechas de
      data/splits/test.csv repartidas trimestralmente (2020-01..2024-04). No
      son casos de la memoria ni inventados -- son trazables y reproducibles
      con el comando usado en esta extraccion.
