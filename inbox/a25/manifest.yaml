known_issues:
  - "La memoria (secciones 3.4 'Tabla 2 Pipeline de ETL', 6.4, 9.2-9.3) describe una
     estructura de proyecto genérica (scripts/train.py, scripts/predict.py, src/main.py,
     config/config.yaml, data/raw/, data/processed/, data/splits/, data/predictions/,
     models/metrics/) que NO coincide con la estructura real entregada en
     inbox/a25/codigo/ (modules/wine_quality/src/{training/train_rf.py,wine_quality/pipeline.py},
     sin config.yaml, sin data/splits/, sin scripts/train.py). Parece texto de plantilla del
     proyecto no actualizado para esta entrega concreta — no se ha podido verificar ninguno
     de esos paths porque no existen en el código entregado."
  - "La memoria referencia 'Tabla 5 Hiperparámetros del mejor modelo' y 'Tabla 6 Pruebas
     realizadas y combinaciones evaluadas por modelo' (sección 5.1.C) y 'Tabla 7 Métricas de
     validación cruzada' (sección 7.2), pero el .docx solo contiene 6 tablas insertadas en
     total (verificado extrayendo todas las tablas del documento) — las tablas 5 y 6
     referenciadas en el texto no están embebidas en el documento entregado."
  - "No existe split de test explícito (data/splits/X_test.csv + y_test.csv ni equivalente)
     en inbox/a25/codigo/ — el protocolo oficial de evaluación es KFold(5, shuffle=True,
     random_state=42) sobre el dataset completo (white_wine.csv, 4898 filas), y el modelo
     final que se sirve se ajusta sobre el 100% de esos datos (train_rf.py:
     train_dual_models, protocol='official_cv5_full_dataset'). Los golden_cases de arriba
     son por tanto filas reales del dataset de entrenamiento comparadas contra su valor
     real (ground truth), con tolerancia = 2x el MAE de CV reportado — no son predicciones
     sobre datos nunca vistos por el modelo."
  - "Los artefactos .pkl entregados (modules/wine_quality/models/{quality_rf,bound_rf}.pkl)
     se serializaron con scikit-learn 1.8.0; el venv de este repo tiene scikit-learn 1.5.2.
     joblib.load() los carga correctamente (atributos y feature_names_in_ verificados) pero
     emite sklearn.exceptions.InconsistentVersionWarning — cosmético, no impide la inferencia,
     documentado aquí para que no se interprete como fallo en producción."
  - "BUG ENCONTRADO Y CORREGIDO (plugin-integration, ya en app/plugins/ml25_wine_sulphites/):
     el artefacto base servido en artifacts/ml25_wine_sulphites/ NO era el entregado por el equipo
     de IA, sino uno generado por una versión anterior, incorrecta, de Ml25WineSulphitesPlugin.train()
     (n_estimators=200 en vez de 300, split 80/20 cronológico sin shuffle sobre solo el 80% de
     los datos en vez de CV 5-fold sobre el 100%, sin el filtro de limpieza química de
     wine_quality.common.load_wine_data). Confirmado comparando
     artifacts/ml25_wine_sulphites/metadata.json (n_train=3918, n_test=980, sin 'protocol') contra
     inbox/a25/codigo/modules/wine_quality/models/metadata.json (protocol=
     official_cv5_full_dataset, n_estimators=300). Se sustituyó el artefacto base por el
     entregado y se corrigió train() para replicar el protocolo real (ver verification_report.md)."
  - "BUG ENCONTRADO Y CORREGIDO: build_simulation_grid() (preprocessing.py) no acotaba el
     rango de dosis simulado por el percentil 99 de 'free sulfur dioxide' en el dataset de
     entrenamiento (wine_quality.common.SimulationConfig(sim_free_p_high=99.0), usado por el
     pipeline de inferencia real para no extrapolar fuera de la distribución de
     entrenamiento) — solo usaba delta_max, pudiendo explorar dosis muy por encima del rango
     de entrenamiento para vinos con free SO2 actual alto. Corregido: train() ahora guarda
     los percentiles reales en metadata['simulation'], con fallback a las constantes
     BASE_FREE_SO2_P1/P99 (6.0/81.0 mg/L, calculadas del propio white_wine.csv) para el
     artefacto base."
