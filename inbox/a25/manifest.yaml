# [RENOMBRADO 2026-10-06] Nomenclatura alineada con el estándar mlNN_<sector>_<desc>:
#   wine-sulphite (model_id) / wine_sulphite (artefactos)  ->  ml25-wine-sulphites / ml25_wine_sulphites (el paquete ya era app/plugins/ml25_wine_sulphites/)
#   Artefactos (local y S3): artifacts/wine_sulphite/ -> artifacts/ml25_wine_sulphites/
#   Las menciones al nombre antiguo en comentarios/known_issues son históricas.
model_id: ml25-wine-sulphites
sector: vitivinicola
nombre: "Modelo para la predicción de niveles óptimos de sulfitos durante el proceso de elaboración del vino"
task_type: regression_prescriptive  # dos RandomForest (calidad + SO2 ligado) + simulación/optimización de dosis
framework:
  - scikit-learn==1.8.0   # version con la que el equipo de IA entrenó (inbox/a25/codigo/modules/wine_quality/models/metadata.json). El venv del repo usa 1.5.2 — ver known_issues.
  - pandas==2.3.3
  - numpy==2.3.5
  - joblib
  - xgboost        # solo para los artefactos legacy bound_xgb/quality_xgb (comparativa), no usados en producción

artifacts:
  folder: modules/wine_quality/models/     # ruta real dentro del código entregado (NO "models/artifacts/" que menciona la memoria genéricamente)
  files:
    - quality_rf.pkl    # RandomForestRegressor(n_estimators=300, random_state=42, n_jobs=-1) -> quality (0-10)
    - bound_rf.pkl      # RandomForestRegressor(n_estimators=300, random_state=42, n_jobs=-1) -> log1p(bound_so2)
    - metadata.json      # metrics, features, hyperparameters, bound_monotonicity, reproducibility
    - bound_xgb.json      # legacy, no usado por el plugin actual
    - bound_xgb.pkl        # legacy
    - quality_xgb.json      # legacy
    - quality_xgb.pkl        # legacy

inputs:
  # 11 parámetros fisicoquímicos de la muestra de vino — llegan siempre del análisis de laboratorio
  fixed:
    - name: fixed acidity
      type: float
      unit: "g/dm³"
      description: "Acidez fija"
      train_range: [3.8, 14.2]
    - name: volatile acidity
      type: float
      unit: "g/dm³"
      description: "Acidez volátil"
      train_range: [0.08, 1.1]
    - name: citric acid
      type: float
      unit: "g/dm³"
      description: "Ácido cítrico"
      train_range: [0.0, 1.66]
    - name: residual sugar
      type: float
      unit: "g/dm³"
      description: "Azúcar residual"
      train_range: [0.6, 65.8]
    - name: chlorides
      type: float
      unit: "g/dm³"
      description: "Cloruros"
      train_range: [0.009, 0.346]
    - name: density
      type: float
      unit: "g/cm³"
      description: "Densidad"
      train_range: [0.987, 1.039]
    - name: pH
      type: float
      description: "pH"
      train_range: [2.72, 3.82]
    - name: sulphates
      type: float
      unit: "g/dm³"
      description: "Sulfatos"
      train_range: [0.22, 1.08]
    - name: alcohol
      type: float
      unit: "% vol."
      description: "Graduación alcohólica"
      train_range: [8.0, 14.2]
    - name: free sulfur dioxide
      type: float
      unit: "mg/L"
      description: "SO2 libre actual (punto de partida de la simulación)"
      train_range: [2.0, 289.0]
    - name: total sulfur dioxide
      type: float
      unit: "mg/L"
      description: "SO2 total actual"
      train_range: [9.0, 440.0]

  # Parámetros operativos de la simulación/optimización — el usuario los puede
  # ajustar; si no los informa, el plugin usa los defaults de la memoria (sección 8.2)
  control:
    - name: min_molecular
      type: float
      default: 0.6
      unit: "mg/L"
      description: "SO2 molecular mínimo exigido por protección microbiológica (restricción dura)"
    - name: max_total
      type: float
      default: 200.0
      unit: "mg/L"
      description: "SO2 total máximo permitido por normativa (restricción dura)"
    - name: delta_max
      type: float
      default: 40.0
      unit: "mg/L"
      description: >
        Incremento máximo de free SO2 a explorar sobre el valor actual. El rango
        simulado real también se acota por el percentil 99 de 'free sulfur dioxide'
        en el dataset de entrenamiento (ver known_issues) — nunca se extrapola más
        allá de la distribución de entrenamiento aunque delta_max sea mayor.

  derived_if_missing: {}   # no hay — todas las columnas fisicoquímicas son obligatorias en la entrada

outputs:
  # Un único modo de inferencia (simulación prescriptiva de dosis); no hay predict_batch
  # separado a nivel de negocio, pero sí a nivel de API (mismo cálculo fila a fila)
  predict_inline:
    - name: recommended_free_so2
      type: float
      unit: "mg/L"
      description: "Dosis de SO2 libre recomendada"
    - name: recommended_bound_so2
      type: float
      unit: "mg/L"
      description: "SO2 ligado estimado en el punto recomendado"
    - name: recommended_total_so2
      type: float
      unit: "mg/L"
      description: "SO2 total estimado en el punto recomendado"
    - name: recommended_molecular_so2
      type: float
      unit: "mg/L"
      description: "SO2 molecular en el punto recomendado"
    - name: predicted_quality
      type: float
      description: "Calidad sensorial predicha en el punto recomendado (escala 0-10)"
    - name: baseline_predicted_quality
      type: float
      description: "Calidad sensorial predicha en la dosis actual (sin intervención)"
    - name: intervention_recommended
      type: bool
      description: "True si la mejora esperada supera 1x el MAE de calidad (umbral de intervención)"
    - name: recommendation_reason
      type: string
      description: "Explicación textual de la decisión (mejora significativa vs. mínima intervención segura)"
    - name: simulation_trajectory
      type: list
      description: "Trayectoria completa simulada (free/bound/total/molecular SO2 + calidad por cada dosis candidata)"

training:
  supported: true
  target_column: quality          # modelo de calidad; bound_so2 se deriva internamente (total - free, clip >=0), no es columna de entrada
  required_columns:
    - fixed acidity
    - volatile acidity
    - citric acid
    - residual sugar
    - chlorides
    - density
    - pH
    - sulphates
    - alcohol
    - free sulfur dioxide
    - total sulfur dioxide
    - quality
  hyperparams:
    model_qual: RandomForestRegressor
    model_bound: RandomForestRegressor
    n_estimators: 300
    random_state: 42
    n_jobs: -1
    cv_splits: 5
    cv_shuffle: true
    seed: 42
    protocol: official_cv5_full_dataset   # métricas = media de KFold(5, shuffle=True, seed=42); modelo final se ajusta sobre el 100% del dataset limpio (CV nunca retira datos del modelo servido)
    bound_target_transform: log1p          # y_train = log1p(bound_so2); predicción se decodifica con expm1
    bound_monotonicity: trajectory_postprocess_cumulative_max   # ajuste posterior en la simulación, no en el entrenamiento
  metrics_returned:
    - mae_quality
    - mae_bound_so2
    - n_train
    - n_test
    - training_time_s
  source: codigo_entrenamiento   # inbox/a25/codigo/modules/wine_quality/src/training/train_rf.py (train_dual_models + cv_regression_metrics)

constraints:
  min_molecular_so2_mg_l: 0.6
  max_total_so2_mg_l: 200.0
  decision_margin_mae_multiple: 1.0
  descripcion: >
    Restricciones duras de negocio (independientes de la calidad predicha): el
    optimizador descarta cualquier dosis simulada con SO2 molecular < 0.6 mg/L
    (riesgo microbiológico) o SO2 total > 200 mg/L (límite legal). Si ningún punto
    simulado cumple ambas, el plugin lanza NoValidSimulationPointError (422), nunca
    devuelve una recomendación inválida silenciosamente. La recomendación solo
    sugiere intervenir si la mejora de calidad esperada supera 1x el MAE de
    calidad (0.427); si no, recomienda la mínima intervención segura dentro del
    tramo válido.

# CV 5-fold sobre el dataset completo (white_wine.csv, 4898 filas), seed=42 — sin
# held-out test separado (no existe data/splits/ en el código entregado; el
# protocolo oficial es "official_cv5_full_dataset", ver metadata.json y memoria
# secciones 5.1/7.2). Fuente: inbox/a25/codigo/reports/baseline_metrics.csv +
# modules/wine_quality/models/metadata.json (idénticos).
metrics_reported:
  dataset: white_wine.csv
  n_samples: 4898
  protocol: official_cv5_full_dataset
  cv_splits: 5
  random_seed: 42
  quality:
    mae: 0.42703344034242907
    mae_std: 0.015273364901364958
    r2: 0.5393515210602864
    r2_std: 0.02357787224282418
    baseline_dummy_mae: 0.671
  bound_so2_mg_l:
    mae: 14.511090467553563
    mae_std: 0.49760873082923085
    r2: 0.6222357276886727
    r2_std: 0.02756539566674617
    baseline_dummy_mae: 27.760

# 14 filas reales de inbox/a25/codigo/data/white_wine.csv (mismo CSV usado para
# entrenar+evaluar los artefactos), elegidas para cubrir todo el rango de
# 'quality' (3 a 9) y un rango amplio de 'free sulfur dioxide' (11 a 118.5 mg/L).
# NO existe un held-out test split separado en el código entregado (ver
# known_issues) — el "expected" es el valor real (ground truth) del dataset:
# quality tal cual, bound_so2 = total - free (clip >=0). Se compara contra la
# salida del plugin (baseline_predicted_quality / recommended_bound_so2 en la
# simulación con delta_max=0, que fuerza al optimizador a evaluar solo el punto
# actual) con tolerancia = 2x el MAE de CV reportado (convención del repo).
# tolerance_quality = 2 * 0.427 = 0.854 puntos de calidad
# tolerance_bound_so2 = 2 * 14.511 = 29.02 mg/L
golden_cases:
  - id: caso_001
    source: dataset_real_white_wine_csv_row_0
    input: {fixed_acidity: 7.0, volatile_acidity: 0.27, citric_acid: 0.36, residual_sugar: 20.70, chlorides: 0.045, density: 1.00100, pH: 3.00, sulphates: 0.45, alcohol: 8.8, free_sulfur_dioxide: 45.0, total_sulfur_dioxide: 170.0}
    expected: {quality: 6, bound_so2: 125.0}
    tolerance: {quality: 0.854, bound_so2: 29.02}

