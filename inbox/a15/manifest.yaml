known_issues:
  - "Naming engañoso: la carpeta entregada se llama 'a15-rnn-vitivinicola-...' y el listado de
     abreviaturas de la memoria incluye LSTM/GRU, pero el modelo PRODUCTIVO es Ridge Regression
     (scikit-learn, lineal regularizado) -- no hay ninguna red neuronal recurrente en train.py,
     predictor.py ni en config.yaml::production_deployment. Tampoco aparecen LSTM/GRU en la
     sección de arquitecturas evaluadas de la memoria (Naive_Persistence, SARIMAX, Ridge, Lasso,
     ElasticNet, XGBoost, CatBoost). requirements.txt sí incluye tensorflow/keras, pero no se
     importan en ningún módulo de src/training ni src/predict -- confirmado por grep. No se ha
     podido confirmar contra la memoria si hubo una fase RNN descartada sin documentar, o si el
     nombre de carpeta es simplemente heredado de una plantilla de otro modelo del lote."
  - "RESUELTO en plugin-integration (post-revisión): el predictor NO es stateless respecto a
     un único artefacto .pkl -- para derivar features a partir de solo 'date'/'origin_date'
     (o de un CSV simple estilo data/input/ipi_history.csv) necesita, además de
     horizon_6_ridge.pkl, los CSV procesados data/processed/global_phytosanitary_prices_b2020.csv
     y data/processed/financial_proxies_monthly.csv como referencia histórica. Decisión tomada:
     se empaquetan ambos junto al .pkl en artifacts/ml15_wine_ipi_price_forecast/ (vía
     ArtifactStore, igual que el modelo -- ver app/plugins/ml15_wine_ipi_price_forecast/history.py,
     puerto de build_inference_panel_from_history/build_inference_panel_from_user_ipi_history).
     predict_inline acepta ahora 'date'+'ipi_national_current' solos (o incluso solo 'date');
     predict_batch detecta un CSV con forma de histórico simple (date/year+month +
     ipi_national_current, sin las 16 columnas del contrato) y lo trata como tal, fusionando
     todas sus filas en el histórico de referencia antes de predecir cada una -- así una fila
     puede servir de contexto de retardo a otra, igual que el pipeline original. Verificado
     contra el propio data/input/ipi_history.csv del equipo de IA: 15/15 filas, sin error,
     coincidencia exacta con los golden_cases en las 13 fechas que también cubre el split de
     test. Limitación que sigue existiendo: estos dos CSV de referencia son un snapshot estático
     (hasta feb-2026/jun-2026 respectivamente) que solo se actualiza si el equipo de IA
     regenera y resube el snapshot -- no se refrescan automáticamente."
  - "El modo regional_layer (capa regional contextual) es un post-proceso pesado y con fuentes
     propias (RECAN anual, IPC autonómico mensual, clima GEE mensual) que NO se han evaluado
     como necesarias para el contrato mínimo predict_inline. Documentado en el manifest por
     completitud (outputs.regional_context_batch), pero su integración como modo del plugin es
     una decisión de alcance a tomar explícitamente en plugin-integration, no asumida aquí."
  - "trainer.py::_select_feature_columns no usa una lista de columnas hardcodeada: selecciona
     automáticamente TODAS las columnas numéricas del CSV de entrenamiento salvo
     non_predictor_columns y las que empiezan por 'ipi_national_t_plus_'. Si el endpoint train()
     del plugin permite al cliente aportar un CSV con columnas numéricas extra no vistas en
     producción, el modelo reentrenado las incorporaría como features silenciosamente, rompiendo
     el contrato feature_columns=16 esperado por verification/golden_cases. plugin-integration
     debe decidir si valida/restringe el esquema de entrada a train() o replica este
     comportamiento tal cual (con el riesgo documentado)."
  - "Solo 8 de las 13 filas del split de test tienen y_true real (ipi_national_t_plus_6 no nulo);
     las 5 restantes (origin_date 2025-09 a 2026-01) tienen target_date posterior al último dato
     disponible en la serie IPI nacional bundled (feb-2026). Los golden_cases incluyen las 13
     filas pero solo 8 permiten verificar contra un valor real; las otras 5 solo verifican
     reproducibilidad numérica del wiring (y_pred determinista), no exactitud."
  - "El .pkl fue serializado con scikit-learn==1.8.0 (ver requirements.txt y metadata interna del
     payload); al cargarlo con scikit-learn==1.9.1 (entorno usado para esta extracción) sklearn
     emite InconsistentVersionWarning para StandardScaler/Ridge/Pipeline. Las predicciones
     recalculadas coinciden a precisión de máquina con final_evaluation.json pese al warning,
     pero plugin-integration debería fijar scikit-learn==1.8.0 exacto (no >=) para evitar drift
     silencioso de comportamiento entre versiones."
  - "Los umbrales numéricos exactos del criterio técnico más estricto que el KPI contractual
     (basado en R² de validación y en mantener mejora vs. baseline en test) están embebidos como
     objetos de ecuación (OMML) en el .docx de la memoria y no se extrajeron como texto plano por
     el parser usado (python-docx, sin pandoc disponible en este entorno). El KPI contractual
     (accuracy=1-MAPE >= 80%) sí se extrajo con claridad y se cumple (MAPE test = 0,74%). Si se
     necesitan los umbrales técnicos exactos para la ficha técnica, revisar el .docx original
     abriéndolo con Word/LibreOffice."
  - "No se ha encontrado ninguna restricción dura de negocio tipo 'PU >= 13' en código ni memoria
     -- constraints queda vacío. La única regla explícita de negocio es cualitativa: la capa
     regional nunca debe presentarse como predicción oficial de precio autonómico (disclaimer
     obligatorio, ver outputs.regional_context_batch)."
  - "requirements.txt entregado está en ASCII plano (sin BOM, sin UTF-16LE) -- a diferencia de
     otros modelos del lote, aquí NO hace falta normalizar encoding antes de pip install/pip-audit."
