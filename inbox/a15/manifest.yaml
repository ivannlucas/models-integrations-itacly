model_id: ml15-wine-ipi-price-forecast
sector: vitivinicola
nombre: "Modelo espacial para la predicción de precios de productos fitosanitarios en áreas concretas"
# El título habla de "modelo espacial", pero el sistema entregado NO modela precios a nivel de
# provincia/CCAA (a diferencia de, p. ej., m21-cereal-price-spatial, que sí usa `provincia` como
# feature). Aquí la dimensión "espacial" es una CAPA CONTEXTUAL POSTERIOR (modo `regional_layer`)
# que cruza la predicción nacional con RECAN/IPC/clima por CCAA -- no es una predicción oficial de
# precio regional y no modifica la variable objetivo. Ver known_issues.
task_type: regression  # serie temporal univariante, direct multi-step (horizonte fijo t+6)
framework:
  # Librerías realmente cargadas por src/training/trainer.py y src/predict/predictor.py
  # (el pipeline de inferencia/entrenamiento productivo, sin contar EDA/adquisición de datos):
  - scikit-learn==1.8.0
  - pandas==3.0.1
  - numpy==2.4.2
  - joblib==1.5.3
  - PyYAML==6.0.3
  # NO cargadas en train/predict productivos -- solo en notebooks de EDA/benchmarking
  # (tensorflow, keras) o en adquisición/regeneración de datos brutos (yfinance,
  # earthengine-api, openpyxl, odfpy). Ver known_issues sobre tensorflow/keras.
  # experimental_only: [tensorflow==2.21.0, keras==3.13.2, xgboost==3.2.0, catboost==1.2.10]
  # data_acquisition_only: [yfinance==1.2.0, earthengine-api==1.7.16, openpyxl==3.1.5, odfpy==1.4.1]

artifacts:
  folder: models/artifacts/     # ruta dentro del código entregado
  files:
    - horizon_6_ridge.pkl
    # ^ payload joblib con: model (sklearn Pipeline: StandardScaler + Ridge(alpha=25.0)),
    #   feature_columns (16, contrato exacto), target_column, anchor_column, horizon,
    #   model_name, model_kind, model_params, metadatos de entrenamiento.
  extra_bundled_data_required_at_inference:
    # NO son artefactos de modelo pero SIN ELLOS el predictor no puede construir features
    # cuando la entrada es solo origin_date o un CSV simple de IPI (ver known_issues).
    - data/processed/global_phytosanitary_prices_b2020.csv   # serie IPI nacional + intl (usa_lag_1)
    - data/processed/financial_proxies_monthly.csv            # copper/oil_brent/eur_usd/chem_sector
  extra_bundled_data_required_for_regional_layer_mode:
    # Solo necesarios si se integra el modo regional_layer (ver outputs.regional_context_batch)
    - data/processed/recan_structural_variables_annual.csv
    - data/processed/ipc_general_ccaa_monthly.csv
    - data/processed/climate_ccaa_GEE_monthly.csv

inputs:
  # Contrato mínimo operativo real: predict.py permite invocar el modelo aportando solo una
  # fecha de origen (origin_date); TODAS las demás features se reconstruyen automáticamente
  # desde las series históricas bundled (ver derived_if_missing). También admite, como
  # alternativas, (a) un panel técnico ya con las 16 feature_columns, o (b) un CSV simple con
  # date/year/month + ipi_national_current que sobrescribe el histórico nacional interno.
  fixed:
    - name: origin_date
      type: date (YYYY-MM-01, primer día de mes)
      description: >
        Mes de origen desde el que se predice el IPI fitosanitario nacional a t+6.
        Si se omite y se aporta un histórico simple de IPI, se usa la última fecha del CSV.
    - name: ipi_national_current
      type: float
      required: false
      description: >
        Valor actual del IPI fitosanitario nacional (base 2020=100) en origin_date. Opcional:
        si no se aporta, se toma de la serie histórica interna bundled en esa fecha (modo
        origin_date puro); si se aporta, sobrescribe el histórico interno para ese mes
        (modo user_ipi_history, prepare_user_ipi_history en predictor.py).

  control: []   # no hay optimizador/GA; no hay variables de decisión

  # Las 15 features restantes del contrato feature_columns del artefacto .pkl. El sistema las
  # calcula siempre automáticamente por lookup en las series históricas bundled (no se piden
  # nunca directamente al usuario final, salvo que este aporte un panel técnico ya preparado
  # con feature_status=exact per contrato completo).
  derived_if_missing:
    ipi_national_lag_1: "lookup en serie nacional (spain, base2020) a origin_date - 1 mes"
    ipi_national_lag_2: "lookup en serie nacional a origin_date - 2 meses"
    ipi_national_lag_3: "lookup en serie nacional a origin_date - 3 meses"
    ipi_national_lag_4: "lookup en serie nacional a origin_date - 4 meses"
    ipi_national_lag_5: "lookup en serie nacional a origin_date - 5 meses"
    ipi_national_lag_6: "lookup en serie nacional a origin_date - 6 meses"
    usa_lag_1: "lookup en índice USA (PPI pesticidas, FRED) a origin_date - 1 mes; permite último valor disponible (feature_status=exogenous_last_available) si no hay dato exacto"
    chem_sector_lag_11: "lookup en índice sectorial químico (base 2020, reescalado media-2020) a origin_date - 11 meses; mismo fallback de último valor disponible"
    copper_lag_14: "lookup en cotización cobre (base 2020, reescalada) a origin_date - 14 meses; mismo fallback"
    eur_usd_lag_17: "lookup en tipo de cambio EUR/USD (base 2020, reescalado) a origin_date - 17 meses; mismo fallback"
    oil_brent_lag_12: "lookup en cotización Brent (base 2020, reescalada) a origin_date - 12 meses; mismo fallback"
    month_sin: "sin(2*pi*month/12)"
    month_cos: "cos(2*pi*month/12)"
    quarter: "trimestre natural de origin_date (1-4)"
    is_spring_risk: "1 si month in [4,5,6] (riesgo fúngico primaveral vid), 0 en otro caso"

outputs:
  predict_inline:
    - name: y_pred
      type: float
      unit: "índice IPI base 2020=100"
      description: "IPI fitosanitario nacional predicho a horizonte t+6 (target_date = origin_date + 6 meses)"
    - name: y_anchor
      type: float
      description: "ipi_national_current usado como ancla; sirve de referencia para MDA (acierto de dirección del cambio)"
    - name: target_date
      type: date
      description: "origin_date + 6 meses"
    - name: horizon
      type: int
      description: "siempre 6 en la configuración productiva vigente"
    - name: model_name
      type: str
      description: "Ridge"
    - name: y_true
      type: float | null
      description: "valor real observado en target_date si ya existe en la serie histórica bundled; null si target_date es futuro"
    - name: feature_status
      type: str
      description: "'exact' si todas las features se construyeron con dato exacto del mes requerido; 'exogenous_last_available' si alguna exógena usó el último valor disponible por desfase de publicación"
    - name: feature_notes
      type: str
      description: "detalle de qué variable(s) se completaron con último valor disponible y con qué desfase en meses; cadena vacía si feature_status=exact"

  # Modo CLI adicional real (`python -m src.main --mode predict --input <panel_técnico.csv>`):
  # idéntico contrato de salida que predict_inline, pero sobre un CSV con las 16 feature_columns
  # ya preparadas por el propio cliente en vez de reconstruidas desde origin_date.
  batch_external_panel:
    - "mismos campos que predict_inline; prediction_type=external_panel"

  # Modo CLI adicional real (`python -m src.main --mode regional_layer`), documentado en la
  # memoria como "capa regional contextual" -- NO es una predicción de precio, es información
  # derivada/interpretativa por CCAA a partir de la predicción nacional ya generada + RECAN/IPC/
  # clima. Requiere que predict_inline/batch se haya ejecutado antes (consume latest_predictions).
  # Incluido aquí por completitud documental del manifest; su integración como modo del plugin es
  # una decisión a tomar en plugin-integration (ver known_issues), no asumida por este manifest.
  regional_context_batch:
    fields:
      - name: regional_exposure_category
        type: str
        description: "baja | media | alta | muy_alta | sin_datos_recan, por CCAA (17 filas por predicción nacional)"
      - name: regional_exposure_score_0_100
        type: float
        description: "percentil ponderado: 0.55 coste RECAN relativo + 0.25 presión IPC relativa + 0.20 riesgo climático histórico"
      - name: regional_contextual_pressure_pct
        type: float
        description: "variación nacional prevista modulada por el multiplicador regional; NO es un precio regional oficial"
      - name: main_exposure_driver
        type: str
        description: "coste_RECAN | presion_IPC | clima | mixto | sin_datos_recan"
      - name: interpretation
        type: str
        description: "texto en lenguaje natural; siempre debe conservar el disclaimer de que no es una predicción oficial de precio autonómico"
    disclaimer_obligatorio: >
      "Esta salida contextualiza territorialmente la predicción nacional, pero no constituye una
      predicción oficial de precio autonómico." (memoria, sección "Generación de la Capa Regional
      Contextual") -- cualquier integración de este modo debe propagar este disclaimer al cliente.

constraints: {}
# No se ha encontrado ninguna restricción dura de negocio (tipo "PU >= 13") ni en el código ni en
# la memoria. La única regla de negocio explícita es de PRESENTACIÓN/INTERPRETACIÓN, no numérica:
# la capa regional nunca debe presentarse como predicción oficial de precio autonómico (ver
# outputs.regional_context_batch.disclaimer_obligatorio).

training:
  supported: true
  target_column: ipi_national_t_plus_6
  required_columns:
    hard_required:
      - date   # o year+month; _add_origin_date acepta cualquiera de los dos
      - ipi_national_current
      - ipi_national_lag_1
      - ipi_national_lag_2
      - ipi_national_lag_3
      - ipi_national_lag_4
      - ipi_national_lag_5
      - ipi_national_lag_6
      - usa_lag_1
      - chem_sector_lag_11
      - copper_lag_14
      - eur_usd_lag_17
      - oil_brent_lag_12
      - month_sin
      - month_cos
      - quarter
      - is_spring_risk
      - ipi_national_t_plus_6   # target; solo se exige en filas dentro de train_end_date
    note: >
      trainer.py::_select_feature_columns NO usa una lista fija hardcodeada: selecciona
      automáticamente todas las columnas numéricas del CSV de entrenamiento salvo
      feature_policy.non_predictor_columns (year, month, date, origin_date, target_date, split)
      y las que empiezan por feature_policy.target_prefixes (ipi_national_t_plus_). Si se aporta
      un CSV de reentrenamiento con columnas extra numéricas no vistas en producción, el modelo
      las incorporaría automáticamente como features -- ver known_issues.
  hyperparams:
    model_kind: ridge   # también soporta lasso (alpha + max_iter=20000) vía el mismo config.yaml
    alpha: 25.0
    scaler: StandardScaler   # Pipeline([("scaler", StandardScaler()), ("model", Ridge(alpha=alpha))])
    random_seed: 42   # global (config.yaml), no consumido directamente por Ridge (determinista) pero sí por el resto del pipeline
    source: codigo_entrenamiento   # config/config.yaml::production_deployment.models.horizon_6 + src/training/trainer.py::_build_model
  metrics_returned:
    - rmse
    - mae
    - mape_pct
    - r2
    - mda_pct
    - n_observations
    # nombres exactos devueltos por src/get_stats/get_stats.py::_regression_metrics
  source: codigo_entrenamiento

metrics_reported:
  # Holdout test oficial (models/metrics/final_evaluation.json, horizonte t+6, Ridge alpha=25.0)
  # -- coincide exactamente con la Tabla 4 de la memoria para t+6, verificado recalculando
  # manualmente model.predict() sobre data/splits/test/panel_test.csv (ver known_issues).
  dataset: test_holdout
  split_dates: {train: "2016-06 a 2023-12 (91 filas)", val: "2024-01 a 2024-12 (12 filas)", test: "2025-01 a 2026-01 (13 filas, 8 evaluables con y_true)"}
  random_seed: 42
  n_observations_test_evaluable: 8
  rmse: 1.0395874222606034
  mae: 0.9439915488990067
  mape_pct: 0.7377164503991782
  r2: 0.17513892031416456
  mda_pct: 100.0
  baseline_persistence_test:
    rmse: 2.26194606478581
    mae: 2.092500000000003
    mape_pct: 1.6349733557709603
    r2: -2.9050200647557833
  rmse_reduction_vs_baseline_pct: 54.040132147932326
  mape_reduction_vs_baseline_pct: 54.87899250496879
  # Referencia adicional -- validación fija (Tabla 3 de la memoria, criterio real de selección
  # de modelo; el test NUNCA se usó para seleccionar arquitectura):
  validation_reference:
    rmse: 1.2584
    mae: 1.0595
    mape_pct: 0.8495
    rmse_vs_naive_persistence_pct: -5.9
  kpi_contractual: "accuracy = 1 - MAPE >= 80% (MAPE <= 20%)  -->  CUMPLE (MAPE test = 0.74%)"
  kpi_tecnico_mas_estricto: >
    La memoria define un umbral técnico más exigente que el KPI contractual (basado en R² de
    validación y en mantener la mejora frente a persistencia en test), pero los valores numéricos
    exactos de esos umbrales están embebidos como objetos de ecuación (OMML) en el .docx y no se
    extrajeron como texto plano -- ver known_issues.

# 13 casos = TODAS las filas de data/splits/test/panel_test.csv (único split de test disponible;
# no se seleccionó un subconjunto porque el propio dataset ya es pequeño). expected.y_pred es la
# salida real de model.predict() sobre esas 16 features (payload de models/artifacts/horizon_6_ridge.pkl),
# recalculada y verificada en este proceso de extracción: reproduce el RMSE/MAE de
# models/metrics/final_evaluation.json a precisión de máquina sobre las 8 filas con y_true.
# tolerance_pct=1.0 es margen de reproducibilidad numérica entre entornos/versiones de
# scikit-learn (Ridge+StandardScaler es determinista y cerrado, no debería requerir más margen).
