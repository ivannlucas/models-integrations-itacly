project:
  name: "DatagIA"
  seed: 42
  deterministic_strict: true
  deterministic_warn_only: false

paths:
  raw_data: "data/raw/"
  input_data: "data/input/"
  processed_data: "data/processed/"
  splits: "data/splits/"
  predictions: "data/predictions/"
  model_artifacts: "models/artifacts/"
  model_metrics: "models/metrics/"
  model_checkpoint_dir: "models/artifacts/"
  model_filename: "best_dnf_model.pt"
  scaler_filename: "scaler.pkl"
  results_filename: "results.json"

data_generation:
  sampling_interval_sec: 60
  cycle_duration_hours: 10
  n_cycles_train: 2000
  n_cycles_val: 400
  n_cycles_test: 600
  split_ratios:
    train: {normal_ratio: 0.60, fault_ratio: 0.40}
    val: {normal_ratio: 0.80, fault_ratio: 0.20}
    test: {normal_ratio: 0.80, fault_ratio: 0.20}
  fault_start:
    min_pct: 0.20
    max_pct: 0.60
  fault_duration:
    min_pct: 0.30
    max_pct: 0.70
  severity:
    min: 0.6
    max: 0.9
  dryer:
    startup_pct: 0.15
    shutdown_pct: 0.10
    thermal_inertia_tau: 1080.0
    C_gain: 0.28
    C_loss: 0.18
    Kp: 2.5
    ambient_temp_range: [-5.0, 35.0]
    ambient_humidity_range: [15.0, 95.0]
    burner_power_pct_nominal: 55.0
    burner_power_modulation_pct: 4.0
    fan_speed_rpm_nominal: 1200.0
    pressure_fan_speed_divisor: 500.0
    pressure_fan_speed_exponent: 1.5
    pressure_grain_moisture_coeff: 0.30
    exhaust_humidity_base: 75.0
    exhaust_humidity_temp_coeff: 0.35
    exhaust_humidity_grain_coeff: 1.5
    exhaust_humidity_discharge_coeff: 0.15
    exhaust_temp_plenum_coeff: 0.60
    exhaust_temp_humidity_coeff: 0.15
    grain_profiles:
      CORN: {setpoint: 105.0, moisture_in: [25.0, 34.0], discharge_slope: 1.3, resistance: 0.8, drying_rate: 0.00035}
      WHEAT: {setpoint: 75.0, moisture_in: [14.0, 19.0], discharge_slope: 0.8, resistance: 1.2, drying_rate: 0.0006}
      BARLEY: {setpoint: 65.0, moisture_in: [13.5, 18.0], discharge_slope: 0.7, resistance: 1.3, drying_rate: 0.0007}
      SUNFLOWER: {setpoint: 55.0, moisture_in: [9.5, 14.0], discharge_slope: 0.5, resistance: 1.0, drying_rate: 0.0009}
  sensors:
    - {name: "plenum_temp", unit: "C", range: [-10, 130], noise_std: 0.6}
    - {name: "exhaust_air_temp", unit: "C", range: [-10, 95], noise_std: 0.7}
    - {name: "exhaust_air_humidity", unit: "%", range: [0, 100], noise_std: 0.8}
    - {name: "static_pressure", unit: "mbar", range: [-0.5, 100], noise_std: 0.12}
    - {name: "burner_power", unit: "%", range: [0, 100], noise_std: 0.4}
    - {name: "fan_speed", unit: "RPM", range: [0, 1800], noise_std: 3.0}
    - {name: "discharge_frequency", unit: "Hz", range: [0, 65], noise_std: 0.2}
    - {name: "grain_moisture_in", unit: "%", range: [10, 35], noise_std: 0.1}
    - {name: "ambient_temp", unit: "C", range: [-15, 50], noise_std: 0.05}
    - {name: "ambient_humidity", unit: "%", range: [0, 100], noise_std: 0.5}
    - {name: "setpoint_temp", unit: "C", range: [40, 120], noise_std: 0.0}
  fault_types:
    - {name: "NORMAL", label: 0, description: "Operation without faults"}
    - {name: "FILTER_CLOGGED", label: 1, description: "Lower airflow, higher pressure"}
    - {name: "BURNER_DEGRADED", label: 2, description: "Thermal power loss"}
    - {name: "DISCHARGE_JAM", label: 3, description: "Extraction system blockage"}
    - {name: "HUMIDITY_SENSOR_DRIFT", label: 4, description: "Exhaust humidity reading drift"}
    - {name: "PLENUM_THERMAL_LEAK", label: 5, description: "Plenum leak or poor insulation"}
  fault_profiles:
    FILTER_CLOGGED: {pressure_rise: 22.0, fan_speed_drop: 180.0}
    BURNER_DEGRADED: {gain_loss_factor: 0.6}
    DISCHARGE_JAM: {discharge_drop_factor: 0.9, exhaust_temp_rise: 15.0, exhaust_humidity_drop: 30.0}
    HUMIDITY_SENSOR_DRIFT: {exhaust_humidity_rise: 25.0}
    PLENUM_THERMAL_LEAK: {loss_increase: 0.25, plenum_temp_drop: 15.0}
    
data_processing:
  target_column: "fault_name"
  id_column: "cycle_id"
  timestamp_column: "timestamp"
  normal_tokens:
    - "0"
    - "normal"
    - "none"
    - "ok"
    - "healthy"
    - "no failure"
    - "no fallo"
    - "sin falla"
    - "sin fallo"
    - "nofailure"
    - "nofallo"
    - "normal operation"
  sequence_length: 240
  solapamiento_beta: 0.5
  partial_null_max_ratio: 0.10
  fuzzy_processing:
    stats_creation: ['mean', 'std', 'min', 'max', 'slope']
  external_data_split:
    train_pct: 66.7
    val_pct: 13.3
    test_pct: 20.0
            
model:
  lstm:
    hidden_size: 64
    num_layers: 1
    dropout: 0.25
    bidirectional: false
    embedding_dim: 32
  fuzzy:
    n_mf: 3
    n_rules: 48
    train_membership_params: true
    train_rule_params: true
    temperature: 0.7
    t_norm: "product"
    normalize_rules: true
    init_alpha: "sparse"
    use_log_bias: false
    lambda_anomaly: 0.80

training:
  shuffle_train: false
  batch_size: 128
  lr_rate: 0.002
  warmup_epochs: 10
  weight_decay: 0.00001
  num_epochs: 200
  patience: 20
  grad_clip: 1.0
  scheduler:
    type: "cosine"
    factor: 0.6
    patience: 3
    min_lr: 0.00005
    T_max: 200
    T_mult: 2
    eta_min: 0.000009
  monitor_metric: "0.50*val_anomaly_f1 + 0.35*fuzzy_f1 - 0.05*dead_rules_ratio - 0.05*alpha_entropy_mean - 0.05*rule_corr"
  dnf_loss:
    anomaly_weight: 2.0
    aux_anom_dl_weight: 0.35
    aux_anom_fuzzy_weight: 1.0
    diversity_weight: 0.0
    alpha_entropy_weight: 0.02
    rule_structure_div_weight: 0.04
    rule_usage_balance_weight: 0.05
    reduction: "mean"
    eps: 0.00000001

xai:
  n_background: 64
  top_rules: 5
  top_variables: 8
  dataset_generation:
    interpretability_val:
      seed: 32
      n_cycles: 1500
      fault_ratio: 0.5
    pcc_system_eval:
      seed: 40
      n_cycles: 500
      fault_ratio: 0.2
    xai_background:
      seed: 52
      n_cycles: 25
      fault_ratio: 0.5
  pcc:
    subsystems:
      - name: "humedad"
        features: ["exhaust_air_humidity", "grain_moisture_in"]
      - name: "termico_transferencia"
        features: ["plenum_temp", "exhaust_air_temp", "burner_power"]
      - name: "ventilacion_presion"
        features: ["static_pressure", "fan_speed"]
      - name: "descarga_control"
        features: ["discharge_frequency", "setpoint_temp"]
      - name: "contexto_operativo"
        features: ["ambient_temp", "ambient_humidity"]

    catalog:
      - sub1: "humedad"
        sub2: "termico_transferencia"
        span: "final"
        name: "PCC térmico-humedad tardío"
        message: "Perfil crítico asociado al acoplamiento entre transferencia térmica y eliminación de humedad."
        recommendation: "Revisar evolución de humedad del grano, temperatura de plenum, temperatura de salida y potencia del quemador. Validar que la transferencia térmica permite una evacuación adecuada de humedad."

      - sub1: "descarga_control"
        sub2: "termico_transferencia"
        span: "medio"
        name: "PCC térmico-descarga intermedio"
        message: "Perfil altamente discriminativo asociado a la interacción entre transferencia térmica y dinámica de descarga del material."
        recommendation: "Comprobar que la regulación de descarga mantiene tiempos de residencia adecuados y no compromete la transferencia térmica ni la uniformidad del secado."

      - sub1: "descarga_control"
        sub2: "termico_transferencia"
        span: "final"
        name: "Perfil ambiguo térmico-descarga tardío"
        message: "Perfil frecuente asociado a la interacción entre transferencia térmica y control de descarga, con separación limitada entre normalidad y anomalía."
        recommendation: "Mantener seguimiento reforzado de la frecuencia de descarga, temperaturas características del proceso y potencia térmica aplicada."

      - sub1: "descarga_control"
        sub2: "ventilacion_presion"
        span: "final"
        name: "Perfil ambiguo descarga-ventilación tardío"
        message: "Perfil asociado a posibles casos anómalos sobre la interacción entre descarga del material y condiciones de ventilación/presión."
        recommendation: "Monitorizar conjuntamente frecuencia de descarga, presión estática y condiciones de ventilación."

    monitor_policy:
      normal_margin: 0.35
      critical_margin: 0.15
      min_support_catalog: 0.75
      min_subsystem_score: 0.05
      min_subsystem_variables: 1