model_id: ml2-fungal-cnn-disease-detection
sector: vitivinicola
nombre: "Modelo de CNN para la detección de enfermedades fúngicas en la vid"
task_type: classification  # clasificación de imagen multiclase (5 clases), arquitectura CNN propia (LeafCNN)
framework:
  - torch>=2.5.0
  - torchvision>=0.20.0
  - pillow>=11.0.0
  - opencv-python>=4.10.0
  - scikit-learn>=1.7.0
  - grad-cam>=1.5.0

# Fuente: inbox/a02/codigo/.../config/config.py, src/training/model.py, src/predict/predict.py,
# src/training/train.py, src/training/evaluate.py y la memoria (entregable/*.docx).

artifacts:
  folder: models/artifacts/
  files:
    - leafcnn_best.pth   # state_dict de LeafCNN (3 bloques conv + BN + ReLU + MaxPool, GAP, Linear(128->5))

inputs:
  fixed:
    - name: image
      type: file
      format: [jpg, jpeg, png, bmp]
      description: >
        Imagen RGB de una hoja de vid. Inline: base64 de un único fichero. Batch: ZIP con
        varias imágenes (recorrido recursivo, filtrado por extensión).
  control: null   # no es un modelo prescriptivo/optimizador — clasificador puro
  derived_if_missing: null

outputs:
  predict_inline:
    - name: prediction
      type: str
      description: "Clase predicha (una de las 5 CLASS_NAMES, ver training.target_column más abajo)"
    - name: confidence
      type: float
      description: "Probabilidad softmax de la clase ganadora [0,1]"
    - name: probabilities
      type: dict
      description: "Probabilidad softmax por cada una de las 5 clases"
  predict_batch:
    - name: predictions
      type: list[dict]
      description: >
        Una entrada por imagen del ZIP: filename, prediction, confidence, probabilities,
        heatmap_url (CAM superpuesto en base64 JPEG data URI) o error si la imagen no es
        decodificable.

training:
  supported: true
  # Razonamiento (contradice el estado actual del plugin, que marca TrainingNotSupportedError):
  # inbox/a02/codigo/.../src/training/train.py (run_training) + src/training/model.py
  # (create_model/get_optimizer_scheduler) + config/config.py contienen un procedimiento de
  # entrenamiento real, completo y reproducible (semilla de splits fija = 42, según memoria
  # P93) que el equipo de IA ejecutó para producir leafcnn_best.pth. La memoria (P102) solo
  # dice que NO es necesario reentrenar para usar el sistema porque ya se entrega el artefacto
  # entrenado — no dice que el reentrenamiento no esté soportado. De hecho P303 recomienda
  # explícitamente reentrenar con imágenes propias del viñedo/cliente para un despliegue
  # fiable. Por tanto training.supported=true y se implementa train() real en el plugin.
  target_column: label  # columna del CSV/estructura de carpetas (VineDataset espera columnas ['path','label'])
  required_columns:
    - path   # ruta de la imagen (en el ZIP de /train, estructura de carpetas <clase>/*.jpg, no CSV)
    - label  # una de: black_rot, downy_mildew, healthy, powdery_mildew, trunk_disease
  # Nota de formato: el código original (src/training/dataset.py: VineDataset) consume un
  # DataFrame con columnas ['path','label'], pero el pipeline de datos real
  # (src/data_processing/load_data.py: organize_images_by_label) organiza las imágenes en
  # carpetas por clase (data/processed/Images_256/<label>/*.jpg) antes de generar ese CSV.
  # El endpoint /train de este plugin reutiliza esa misma convención de carpetas-por-clase
  # (ZIP con subcarpetas = nombre de clase) en vez de exigir un CSV, siguiendo el mismo
  # patrón ya usado por otros plugins de imagen de este repo con train() real
  # (modelo10_lacteo, ml8_cereals_img_anomaly_detector) — no se inventa un formato nuevo.
  hyperparams:
    optimizer: AdamW
    lr: 0.001065
    weight_decay: 0.000001
    scheduler: "ReduceLROnPlateau(mode=min, factor=0.3, patience=3)"
    loss: CrossEntropyLoss
    batch_size: 16
    max_epochs: 100
    early_stopping_patience: 10
    image_size: 224
    train_augmentation: "RandomHorizontalFlip + RandomRotation(30) + ColorJitter(0.4,0.4,0.4)"
    normalize_mean_std: [0.5, 0.5, 0.5]
    source: codigo_entrenamiento  # config/config.py + src/training/model.py get_optimizer_scheduler()
  metrics_returned:
    - accuracy
    - precision   # weighted, igual que src/training/evaluate.py (precision_score average=weighted)
    - recall      # weighted
    - f1           # weighted
  source: codigo_entrenamiento

constraints: null  # no hay restricciones de negocio documentadas (no es un modelo prescriptivo)

metrics_reported:
  # De la memoria (Sección 6.3 y 7, no verificable 1:1 porque no se entregaron imágenes ni
  # el CSV con los splits reales — ver known_issues). Solo referencia para tolerancia.
  accuracy_test: 0.98          # P198: "alcanzando un valor aproximado de 0,98 en el conjunto de test"
  mean_val_accuracy_cv: 0.992003  # P170: media de 5-fold CV con los mejores hiperparámetros
  kpi_target_accuracy: 0.95    # P40/P184: KPI de negocio IEIF > 95% == accuracy > 0.95
  source: memoria_secciones_6.3_7

