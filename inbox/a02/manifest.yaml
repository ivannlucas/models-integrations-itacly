known_issues:
  - "HISTÓRICO (ya resuelto el 2026-10-05): en la extracción inicial del manifest,
    inbox/a02/codigo/.../data/ solo contenía un README.md con instrucciones para descargar
    Kaggle Plant Village + NGLD externamente — no había imágenes reales ni CSV de splits, por
    lo que golden_cases quedó vacío. El equipo de IA ha añadido ahora los datasets reales
    (data/raw/datasets/, data/processed/Images_256/, data/splits/{train,val,test}.csv) y
    golden_cases se ha rellenado con 18 casos reales de data/splits/test.csv (ver arriba) —
    esta limitación ya NO aplica, se deja documentada solo por trazabilidad histórica."
  - "Bug nuevo encontrado y corregido en esta sesión (solo detectable con CUDA real
    funcional, antes el sandbox tenía una GTX 1060 que ya forzaba CPU por otras razones):
    model_loader.py:_safe_device() probaba torch.nn.Conv2d(1,1,1)(torch.zeros(1,1,4,4).cuda())
    — el Conv2d de prueba se queda en CPU (nunca se mueve con .cuda()/.to(device)) y se
    llama con un tensor de entrada en CUDA, lo que SIEMPRE lanza
    RuntimeError: Input type (torch.cuda.FloatTensor) and weight type (torch.FloatTensor)
    should be the same — el try/except lo interpretaba como 'CUDA no funcional' y forzaba
    CPU incondicionalmente, incluso con una GPU real y funcional. Corregido moviendo también
    el módulo de prueba a CUDA (torch.nn.Conv2d(1, 1, 1).cuda()) antes de invocarlo.
    Verificado end-to-end tras el fix: bundle['device']==cuda, model en cuda:0, logits
    resultantes en cuda — ver outputs/a02/verification_report.md. Mismo patrón de
    _safe_device() (mismo bug, no corregido aquí, fuera de alcance de esta sesión) presente
    en ml4_lactic_cnn_thermal_early_disease_detection, ml5_meat_cow_behaviour,
    ml8_cereals_img_anomaly_detector y ml41_meat_curing_machinery_acoustic_anomaly — se señala
    para que lo revise quien verifique esos modelos (ml4/ml8 ya están siendo reverificados en
    paralelo por otros agentes en esta misma sesión)."
  - "Tablas 3, 4 y 5 de la memoria (resultados comparativos, hiperparámetros, resultados por
    fold de CV) están embebidas como imágenes/capturas dentro del .docx, no como tablas de
    texto — no se pudieron extraer sus valores exactos por OCR; se usaron en su lugar los
    hiperparámetros y métricas que SÍ aparecen como texto plano (P170, P198) y, para
    hiperparámetros, el código fuente (config/config.py), que es la fuente preferida."
  - "El plugin ya integrado (app/plugins/ml2_fungal_cnn_disease_detection/) marcaba
    train() como TrainingNotSupportedError (501) sin que el manifest lo respaldara —
    bug de clase 3 (ver tarea): training.supported=true aquí, así que train() se
    reimplementa con un procedimiento real (ver training.hyperparams)."
  - "El endpoint /train espera un ZIP con subcarpetas por clase (black_rot/, downy_mildew/,
    healthy/, powdery_mildew/, trunk_disease/) en vez de un CSV, porque las imágenes no se
    pueden referenciar por ruta de fichero en una petición JSON/CSV igual que un dataset
    tabular — mismo patrón que modelo10_lacteo y ml8_cereals_img_anomaly_detector."
