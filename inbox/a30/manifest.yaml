known_issues:
  - "Dataset y target 100% sintéticos (generados por reglas internas del simulador, no datos
     reales de planta) — advertido explícitamente en la memoria secc. 10. Las métricas deben
     leerse como validación del pipeline, no como evidencia de generalización a planta real."
  - "requirements.txt entregado fija torch==2.11.0 / scikit-learn==1.5.2 / numpy==2.4.4; el
     entorno de este repo usa torch==2.13.0+cu130 / scikit-learn==1.5.2. La inferencia offline
     (ver golden_cases) reproduce las predicciones originales con diferencia <2e-8 en pred_score,
     así que la diferencia de versión de torch no afecta la correctitud numérica observada."
  - "requirements.txt tiene CRLF pero SÍ es ASCII/UTF-8 (no UTF-16LE como en otros modelos del
     proyecto) — confirmado con `file`, no requirió normalización de encoding."
  - "predict_inline existe en el plugin (ModelPluginPort lo exige) pero el router solo acepta
     'mode: batch' — decisión de producto documentada en predict_dto.py, coherente con 'despliegue
     de tipo batch' de la memoria 8.1. Se ha verificado igualmente que predict_inline reproduce
     la misma predicción que el pipeline original (ver sección de auditoría del plugin), por si se
     reactiva en el futuro."

