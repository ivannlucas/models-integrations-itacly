model_id: ml30-meat-traceability-detection
sector: carnico
nombre: "Implementación de un modelo DNL para la optimización de la trazabilidad del producto en planta"
task_type: classification_binary  # Scoring de incidencias de trazabilidad por evento/transición de lote (no timeseries; cada fila es un evento tabular independiente con features de "memoria" ya pre-calculadas)
framework: [pytorch, scikit-learn]

# ── Notas de alcance (de la memoria, sección 1/9.1) ─────────────────────────
# El dataset y el target son 100% SINTÉTICOS, generados por reglas internas del simulador
# (src/data_processing/pipeline.py) — NO hay datos reales de planta. El propio entregable (secc.
# 10 "Limitaciones") advierte que las métricas reflejan la capacidad de aprender las reglas del
# generador, no evidencia de generalización a incidencias reales. Esto no es un defecto de la
# integración — es una característica documentada del modelo tal como fue entregado.
#
# El despliegue original es BATCH ("El despliegue actual es de tipo batch", memoria 8.1): CLI
# sobre un CSV ya "procesado" (events_features.csv) con las 33 features ya calculadas — el
# código entregado NO hace feature engineering en tiempo real sobre eventos crudos secuenciales
# (eso solo ocurre en el pipeline de generación/entrenamiento, src/data_processing/pipeline.py,
# para construir el dataset). El plugin integrado respeta exactamente este contrato: exige las
# 33 features ya calculadas como entrada (ver inputs.fixed) — no intenta derivarlas de eventos
# crudos, que sería inventar un pipeline de feature engineering en tiempo real que el equipo de
# IA nunca entregó ni validó para ese modo.

artifacts:
  folder: models/artifacts/neuroevolution_mlp/   # ruta dentro del código entregado (inbox/a30/codigo/)
  files:
    - model_state.pt       # pesos PyTorch del MLP ganador (TorchBinaryMLP, hidden_layers=[12,32])
    - model_payload.json    # {input_dim: 97, hidden_layers: [12,32], activation: relu} — arquitectura
    - preprocessor.pkl      # TabularPreprocessor (fit sobre train): medianas/medias/stds + vocab one-hot
    - model_card.json        # ficha del modelo (uso previsto, I/O, métricas, limitaciones)
    - metadata.json          # contrato de features/target, métricas, hashes, seed — validado en carga

# feature_columns del artefacto (metadata.json) == FEATURE_COLUMNS del plugin, verificado byte
# a byte (19 numéricas + 14 categóricas = 33, mismo orden) — ver constants.py del plugin.
inputs:
  fixed:  # Las 33 features YA CALCULADAS del evento (contrato exacto de metadata.json/model_card.json)
    numeric:
      - {name: has_prev_event, type: int, values: [0, 1], description: "1 si el lote tiene evento previo"}
      - {name: cold_start_lot, type: int, values: [0, 1], description: "1 si es el primer evento del lote"}
      - {name: stage_order_obs, type: int, range: [0, 6], description: "orden observado de la etapa (0=desconocida)"}
      - {name: time_since_prev_lot_hours, type: float, description: "horas desde el evento previo del lote; -1.0 si no hay previo"}
      - {name: lot_stage_order_delta, type: float, description: "stage_order_obs actual - anterior; 1 en condiciones normales"}
      - {name: events_seen_before, type: int, description: "nº de eventos previos del lote"}
      - {name: max_stage_order_seen_before, type: int, description: "máximo stage_order_obs visto hasta ahora en el lote"}
      - {name: stages_seen_count_before, type: int, description: "nº de etapas distintas vistas hasta ahora"}
      - {name: prior_sequence_anomaly_count, type: int, description: "conteo acumulado de anomalías de secuencia previas"}
      - {name: sensor_temp_c, type: float, unit: "°C"}
      - {name: sensor_ph, type: float}
      - {name: sensor_weight_kg, type: float, unit: kg}
      - {name: ts_hour, type: int, range: [-1, 23]}
      - {name: ts_dayofweek, type: int, range: [-1, 6]}
      - {name: sensor_temp_c_delta_from_prev, type: float}
      - {name: sensor_ph_delta_from_prev, type: float}
      - {name: sensor_weight_kg_delta_from_prev, type: float}
      - {name: yield_pct_from_parent, type: float, description: "sensor_weight_kg / parent_input_weight_kg"}
      - {name: yield_delta_from_expected, type: float}
    categorical:
      - {name: stage, values: [recepcion, despiece, procesado, envasado, almacenamiento, expedicion]}
      - {name: prev_stage, description: "'__START__' si no hay evento previo"}
      - {name: plant_line, values: [linea_norte, linea_sur, linea_este]}
      - {name: operator_shift, values: [M, T, N]}
      - {name: process_route, values: [fresh_cut, minced, marinated], description: "null legítimo si stage_order < 3 (visibilidad progresiva, ver pipeline.py _visible_process_route)"}
      - {name: packaging_type, values: [vacuum, map, tray, skin_pack], description: "null legítimo si stage_order < 4 (_visible_packaging_type)"}
      - {name: trace_unit_type, values: [canal, sublote, batch, unidad_envasada, caja, pale]}
      - {name: prev_trace_unit_type}
      - {name: temp_sensor_location}
      - {name: prev_temp_sensor_location}
      - {name: ph_measurement_source, values: [qa_sample, spot_check, inline_probe]}
      - {name: prev_ph_measurement_source}
      - {name: cold_room_id, description: "'no_cold_room' fuera de almacenamiento/expedición"}
      - {name: scale_id}
  control: null   # no es un modelo de optimización/control — clasificación pura
  derived_if_missing:
    # El plugin NO deriva/calcula estas features desde eventos crudos (el código original tampoco
    # lo hace en inferencia — ver nota de alcance arriba). Si el caller omite una columna, el
    # plugin aplica un valor por defecto documentado (preprocessing.py:_coerce) y además EMITE UN
    # WARNING explícito vía contract.py (check_data_contract) — nunca falla en silencio:
    numeric_missing: 0.0        # valor por defecto si falta una columna numérica
    categorical_missing: "unknown"  # valor por defecto si falta una columna categórica (distinto de
                                      # "__MISSING__", el token interno del preprocessor entrenado —
                                      # pero contract.py reconoce ambos como "ausente" vía _MISSING_TOKENS)

outputs:
  predict_inline:  # método existe (ModelPluginPort lo exige) pero está DESCONECTADO del router a
                    # propósito (predict_dto.py: "Inline prediction removed for this model (product
                    # decision)" — PredictRequest = PredictBatchRequest). Coherente con la memoria
                    # 8.1: "El despliegue actual es de tipo batch". No es un bug, está documentado.
    - {name: pred_traceability_incident, type: int, values: [0, 1]}
    - {name: pred_score, type: float, range: [0.0, 1.0]}
    - {name: confidence, type: float}
    - {name: xai_feature_values, type: "dict|null", description: "features usadas, para el servicio XAI"}
  predict_batch:
    - {name: row_id, type: str, description: "si está en el CSV de entrada"}
    - {name: event_uid, type: str, description: "si está en el CSV de entrada"}
    - {name: pred_traceability_incident, type: int, values: [0, 1]}
    - {name: pred_score, type: float}
    - {name: model_name, type: str}
    - {name: xai_feature_values, type: "dict|null"}
    - {name: warnings, type: "list[str]", description: "avisos no bloqueantes del contrato de datos (contract.py)"}

training:
  supported: true
  target_column: target_traceability_incident   # config.yaml modeling.target_column, verificado en metadata.json
  required_columns:  # las 33 features (inputs.fixed) + target_column
    - has_prev_event
    - cold_start_lot
    - stage_order_obs
    - time_since_prev_lot_hours
    - lot_stage_order_delta
    - events_seen_before
    - max_stage_order_seen_before
    - stages_seen_count_before
    - prior_sequence_anomaly_count
    - sensor_temp_c
    - sensor_ph
    - sensor_weight_kg
    - ts_hour
    - ts_dayofweek
    - sensor_temp_c_delta_from_prev
    - sensor_ph_delta_from_prev
    - sensor_weight_kg_delta_from_prev
    - yield_pct_from_parent
    - yield_delta_from_expected
    - stage
    - prev_stage
    - plant_line
    - operator_shift
    - process_route
    - packaging_type
    - trace_unit_type
    - prev_trace_unit_type
    - temp_sensor_location
    - prev_temp_sensor_location
    - ph_measurement_source
    - prev_ph_measurement_source
    - cold_room_id
    - scale_id
    - target_traceability_incident
  hyperparams:
    # El entrenamiento ORIGINAL (src/training/neuroevolution_mlp.py) es una búsqueda genética
    # completa: población=8, generaciones=4, elite=3, mutation_rate=0.35, 2 candidatos aleatorios
    # por generación (32 configuraciones MLP evaluadas en total, cada una con su propio
    # learning_rate/l2/epochs/batch_size/hidden_layers/activation muestreados), seleccionando por
    # F1 de validación. El plugin integrado NO re-ejecuta esta búsqueda completa en cada /train —
    # reutiliza directamente el genoma ganador (best_genome en metadata.json) y reentrena SOLO esa
    # arquitectura fija con los datos nuevos. Esto es una simplificación deliberada y documentada
    # (ver plugin.py docstring de train() y constants.py), no una aproximación oculta: re-correr
    # una NAS de 32 configuraciones en cada petición de usuario sería impracticable para un
    # endpoint HTTP síncrono. El algoritmo de ajuste de PESOS (Adam + BCEWithLogitsLoss) y los
    # hiperparámetros del genoma ganador sí son IDÉNTICOS a los originales:
    hidden_layers: [12, 32]
    activation: relu
    learning_rate: 0.0556514207154333   # == best_genome.learning_rate (metadata.json)
    weight_decay: 0.0001236243687952708  # == best_genome.l2
    epochs: 147
    batch_size: 128
    optimizer: Adam
    loss: BCEWithLogitsLoss
    seed: 42
    test_split: 0.2   # NOTA: el split original de evaluación final usa train/val/test 70/15/15
                       # fijos por lote (config.yaml data.split_ratio); el train() del plugin, al
                       # recibir un único CSV de usuario (sin partición predefinida), hace un split
                       # 80/20 simple sobre ese CSV para reportar métricas de evaluación post-fit.
                       # Documentado en constants.py TRAIN_TEST_SPLIT — no es el split original,
                       # es el split que aplica train() sobre los datos que el usuario aporte.
  metrics_returned: [accuracy, f1, roc_auc, n_train, n_test, training_time_s]
  source: codigo_entrenamiento  # src/training/neuroevolution_mlp.py + src/training/torch_mlp.py
                                  # + models/artifacts/neuroevolution_mlp/metadata.json (best_genome)

constraints: null   # no hay restricciones de negocio tipo "PU >= 13" (a35) en memoria ni en código;
                     # decision_threshold=0.5 es un parámetro de clasificación, no una constraint de dominio

metrics_reported:  # Tabla 4 de la memoria (sección 7.2) — test hold-out, 379 filas, neuroevolution_mlp
  accuracy: 0.8707
  precision: 0.7400
  recall: 0.5068
  f1: 0.6016
  roc_auc: 0.7185
  # reproducido exactamente ejecutando src/predict/predictor.py del código entregado sobre
  # data/splits/test.csv con los artefactos entregados (ver golden_cases) — no se ha copiado
  # ciegamente de la memoria, se ha verificado bit a bit.

