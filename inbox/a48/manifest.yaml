# -----------------------------------------------------------------------------
# Manifest del modelo a48 - XAI (Grad-CAM + SHAP + CCP + motor prescriptivo) sobre el
# modelo DNSL del entregable 47, para deteccion de puntos criticos de control (CCP)
# en procesos y maquinaria de pasteurizado.
#
# Generado por manifest-extraction a partir de:
#   - codigo/ (a48-dnsl-dairy-xai-deteccion-puntos-criticos-control.zip, descomprimido)
#   - entregable/48 - ... - v1.3.docx (memoria vigente, version 1.3, 10/07/2026)
#   - inbox/a47/manifest.yaml y app/plugins/m47_* (plugin del modelo base ya integrado)
# -----------------------------------------------------------------------------

model_id: lacteo-xai-puntos-criticos-control
sector: lacteo
nombre: "Implementación del modelo basado en XAI para la detección de puntos críticos de control en los procesos y la maquinaria"
acronimo: XAI-DEFPAM-DNSL
organismo: AIR Institute
lote: 2
version_memoria: "1.3"          # 10/07/2026 (v1.1 y v1.2 superadas)
task_type: multi_label_classification_xai   # 4 componentes x 3 estados + explicabilidad + prescripcion
framework: [pytorch, "shap>=0.51.0 (equipo: 0.51.0; verificado tambien con 0.52.0)", scikit-learn, pandas, numpy, joblib, pyyaml]

relacion_con_otros_modelos:
  base: "a47 v2.0 (plugin m47_dnsl_fallas_maquinaria_pasteurizado, ya integrado)"
  nota: >
    a48 NO entrena un modelo propio: reutiliza la arquitectura CNN_Pasteurizer del a47 y añade el paquete
    src/xai/. Confirmado por el equipo de IA: en la v1.3 los artefactos neurosymbolic_cnn.pth (MD5 5b087a2c...),
    scaler_cnn_dns.pkl (ddae8685...), ts1_mean_train.pkl (fb5a0361...) y feature_columns.pkl (517503ee...) son
    los del Entregable 47 v2.0. Las v1.1/v1.2 del 48 usaban pesos de un entrenamiento anterior (30/04/2026,
    MD5 f79fd471...). El plugin m48 mantiene sus propios artefactos (autocontenido) y no depende de los de m47.
    Split identico al del 47 (1543/331/331, seed 42); cycle_splits.json guarda los IDs en el orden barajado
    (ordenado, el test empieza por 20, 23, 29, 32...).

arquitectura:
  tipo: "1D-CNN multitarea (CNN_Pasteurizer) + Physics-Guided Loss (DNSL)"
  backbone: "4 bloques Conv1d (k=7,5,3,3; 32->64->128->256) + BatchNorm + ReLU (+MaxPool 2 y Dropout en 1-3) + AdaptiveAvgPool1d(1)"
  cabezas: "head_fouling, head_valvula, head_bomba, head_acumulador - Linear(256, 3) cada una, dropout_final"
  entrada_tensor: "(batch, 28 canales, 600 pasos) - 7 sensores base + _rmean + _rstd + _lag1"
  xai:
    gradcam: "src/xai/gradcam.py - hooks en capa features.17 (ultima ReLU antes del pooling), CAM interpolado a 600 pasos y normalizado [0,1]"
    shap: "src/xai/shap_explainer.py - shap.GradientExplainer por cabeza; importancia por canal agrupada por sensor base y normalizada"
    ccp: "src/xai/critical_points.py - picos de CAM promedio >= 0.7 + sensor top SHAP + regla fisica + severidad agregada"
    prescriptivo: "src/xai/prescriptive.py - acciones por componente x clase, parametrizables en config/maintenance_actions.yaml"

artifacts:
  folder: models/artifacts/
  files:
    - neurosymbolic_cnn.pth    # state_dict CNN_Pasteurizer (n_sensors=28, n_classes=3, dropout=0.2022) - MD5 5b087a2c16777300521b08e7514fa0e8 (v1.3 = E47 v2.0)
    - scaler_cnn_dns.pkl       # StandardScaler (28 features). REGENERADO por nosotros con scikit-learn 1.5.2 (pin del repo) a partir del entregado por el equipo (MD5 entregado ddae8685a8571db6502364a43c7f701a, sklearn 1.6.1); atributos mean_/scale_/var_/n_samples_seen_ identicos - MD5 1149dc17cb04e243b7acc5b4cbacb980
    - feature_columns.pkl      # orden de las 28 columnas - MD5 517503ee6313305c7ffec69321c92620 (sin cambios)
    - ts1_mean_train.pkl       # media TS1 train (offset gemelo termico a 65 C) = 45.3110734 - MD5 fb5a036109839ee9ffe3fc3e3ec70a5a
  config_files:
    - config/config.yaml                  # hiperparametros, window_size, seccion xai
    - config/maintenance_actions.yaml     # acciones prescriptivas por componente/clase
  packaged_by_integration: ["shap_background.npy (50 ciclos de test escalados con el scaler v1.3)", "shap_background_meta.json"]
  no_usados_en_inferencia: ["models/fine_tuning/*.csv", "models/metrics/*"]   # trazabilidad Optuna / metricas

inputs:
  fixed:      # 7 sensores obligatorios, series temporales de un ciclo (60 s @ 10 Hz = 600 pasos)
    - {nombre: PS1,  tipo: "list[float]", unidad: bar,      descripcion: "Presión de entrada"}
    - {nombre: PS3,  tipo: "list[float]", unidad: bar,      descripcion: "Presión de salida"}
    - {nombre: EPS1, tipo: "list[float]", unidad: W,        descripcion: "Potencia activa del motor (regla física de la bomba)"}
    - {nombre: FS1,  tipo: "list[float]", unidad: "L/min", descripcion: "Caudal volumétrico"}
    - {nombre: TS1,  tipo: "list[float]", unidad: "°C",    descripcion: "Temperatura de entrada"}
    - {nombre: TS2,  tipo: "list[float]", unidad: "°C",    descripcion: "Temperatura de salida"}
    - {nombre: VS1,  tipo: "list[float]", unidad: "mm/s",  descripcion: "Vibración mecánica"}
  complementary:
    - {nombre: Time_Segundos, tipo: "list[float]", descripcion: "0.0-60.0 s; si falta se deriva de Time (round 1 decimal)"}
    - {nombre: Cycle_ID, tipo: int, opcional: true, descripcion: "Agrupa ciclos en modo batch"}
  derived_if_missing:
    _rmean: "media móvil ventana 5 (min_periods=1)"
    _rstd: "desv. típica móvil ventana 5, fillna(0)"
    _lag1: "shift(1) con bfill"
  digital_twin:
    descripcion: "TS1/TS2 += 65.0 - ts1_mean_train. Solo para datos UCI de laboratorio. En planta real debe estar desactivado."
    default_predict: false      # run_predict por defecto NO lo aplica
    default_xai: true           # run_xai_analysis por defecto SI lo aplica (--no_digital_twin para desactivar)
  xai_params:
    n_samples: {default: 50, descripcion: "ciclos máx. del test para el análisis global CCP (muestra aleatoria seed 42)"}
    cycle: {tipo: int, opcional: true, descripcion: "Cycle_ID para análisis local; error explícito si no existe"}

outputs:
  predict:    # src/predict/postprocess.py
    - {nombre: Componente, valores: [Enfriador_Fouling, Válvula_Switch, Bomba_Leakage, Acumulador_Gas]}
    - {nombre: Prediccion_Numerica, valores: "0=SANO, 1=WARNING, 2=CRÍTICO"}
    - {nombre: Confianza, rango: "0-1", descripcion: "softmax de la clase ganadora"}
  xai_local:  # xai_report_cycle.csv - por componente de un ciclo
    columnas: [cycle_id, componente, prediccion, confianza, sensor_mas_relevante, importancia_sensor, ventana_critica_inicio_s, ventana_critica_fin_s, intensidad_ventana, accion, urgencia, intervalo_ciclos, riesgo_score, riesgo_nivel]
    componente: [Fouling, Válvula, Bomba, Acumulador]
    prediccion: [Sano, Warning, Crítico]
    urgencia: [Alta, Media, Ninguna]
    riesgo_nivel: [NORMAL, WARNING, CRÍTICO]
    nota: "intervalo_ciclos es NaN en Sano. La memoria dice que riesgo_score no se serializa, pero el CSV entregado sí lo trae."
  xai_global_ccp:    # xai_report.csv - una fila por ventana crítica detectada
    columnas: [componente, sensor_critico, sensor_importancia, ventana_inicio, ventana_fin, ventana_inicio_s, ventana_fin_s, intensidad_media, regla_fisica, severidad, descripcion_operador, n_ciclos_analizados, ciclos_analizados]
  xai_global_shap:   # xai_report_shap.csv - 28 filas (4 componentes x 7 sensores)
    columnas: [componente, sensor, importancia, n_ciclos_agregados, ciclos_agregados]

training:
  supported: true
  # El codigo entregado incluye src/training/trainer.py (entrenamiento con PhysicsGuidedLoss) y
  # src/fine_tuning/fine_tuner.py (transfer learning, backbone congelado). La parte XAI NO reentrena.
  target_column: [Target_Fouling, Target_Valvula, Target_Bomba, Target_Acumulador]   # nombres internos del codigo (0/1/2)
  required_columns: [Cycle_ID, Time_Segundos, PS1, PS3, EPS1, FS1, TS1, TS2, VS1, Target_Fouling, Target_Valvula, Target_Bomba, Target_Acumulador]
  hyperparams:    # config/config.yaml (optimos Optuna; models/fine_tuning/optuna_best_params_dns.csv)
    optimizer: Adam
    learning_rate: 0.0022243234786004373
    dropout_rate: 0.20219689010649033
    max_lambda: 3.7585293696964697
    lambda_phys: 1.0
    batch_size: 32
    epochs: 300
    patience: 15
    warmup_epochs: 10
    ramp_up_epochs: 80
    window_size: 600
    noise_level: 0.2
    random_state: 42
    split: {test_size_1: 0.30, test_size_2: 0.50}   # 70/15/15 por Cycle_ID
  metrics_returned: [exact_match, accuracy, f1_macro, recall_macro]
  fine_tuning:
    supported_en_codigo: true
    hyperparams: {epochs: 50, patience: 7, lr_divisor: 10, batch_size: 32, fluid_density_kg_l: 1.03, fluid_cp_kj_kgK: 3.93}
    output: models/artifacts/neurosymbolic_cnn_finetuned.pth
  source: codigo_entrenamiento    # config/config.yaml + src/training/trainer.py + src/fine_tuning/fine_tuner.py

constraints:
  window_size: "600 pasos; menos -> padding con ceros, más -> truncado"
  features: "orden y número exacto de feature_columns.pkl (28)"
  umbrales_xai:
    gradcam_pico: 0.7
    severidad_critico_pct_ciclos: 0.10   # >10 % de ciclos clase Critico -> CRITICO
    severidad_warning_pct_ciclos: 0.20   # >20 % de ciclos clase Warning -> WARNING
    risk_warning: 0.5
    risk_critical: 0.8
    severity_weights: {Sano: 0.0, Warning: 0.5, Crítico: 1.0}
  shap: {n_background: 50, n_samples: 100, random_state: 42}
  reglas_fisicas:
    Bomba: "eff = PS1*FS1*1.6666/(|EPS1|+1) < 0.75 -> penaliza 'Sano'"
    Fouling: "Heat = FS1*0.017*3.9*(TS2-TS1); eff = Heat/(FS1*0.017*3.9*2.0+0.1) < 0.80 -> penaliza 'Sano'"
  uso: "Apoyo a la decisión técnica, no sustituto del criterio de mantenimiento (memoria s.11)"

metrics_reported:
  fuente: "models/metrics/test_metrics_confusion.csv (artefacto del código); memoria v1.3: Exact Match 98.79 %, F1 macro 99.70 %"
  dataset: test_hold_out
  n_test_ciclos: 331
  exact_match_global: 0.9879
  por_componente_accuracy: {Fouling: 1.0, Valvula: 1.0, Bomba: 0.9940, Acumulador: 0.9940}
  errores_conocidos: "2 ciclos Sano->Warning en Bomba y 2 en Acumulador (falsas alarmas)"
  baseline_mayoritaria_exact_match: 0.0906
  cv_kfold_exact_match: [0.968, 0.977, 0.975, 0.971, 0.975]
  memoria_v1_3: {exact_match: 0.9879, f1_macro: 0.9970}   # reproducidas por el equipo con los artefactos E47 v2.0 sobre el test de 331 ciclos

# Golden cases - dos familias, ninguna inventada.
#  (A) 20 ciclos de test_cycles (data/splits/cycle_splits.json), seleccion numpy seed 42 garantizando que
#      las 12 parejas (componente, clase) aparecen al menos una vez.
#      expected = ETIQUETA REAL de Dataset_Hydraulic/profile.txt mapeada con src/utils/target_mapping.py.
#      NO se ha ejecutado el modelo para elegirlos: si el modelo falla alguno (esperable en ~1-2 % de ciclos
#      de test: Bomba/Acumulador Sano->Warning) NO se ajusta nada, se documenta en verification.
#      Entrada: codigo/golden/golden_cycles_10hz.csv (extraido de data/processed/hydraulic_10hz_raw.csv).
