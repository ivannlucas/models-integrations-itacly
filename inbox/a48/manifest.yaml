golden_cases_xai:
  - id: xai_local_cycle_123
    source: "memoria_tabla_3 + data/predictions/xai_report_cycle.csv"
    input: {cycle_id: 123, window_source: "codigo/golden/golden_cycles_10hz.csv, Cycle_ID=123", apply_digital_twin: true, split_real: val}
    etiqueta_real: {Fouling: 2, Valvula: 0, Bomba: 0, Acumulador: 0}    # profile.txt fila 124 = 3,100,0,130
    expected:
      Fouling:    {prediccion: Crítico, confianza: 0.9964, sensor_mas_relevante: FS1, importancia_sensor: 0.2288, accion: "Detener producción y ejecutar limpieza CIP inmediata", urgencia: Alta, intervalo_ciclos: 0}
      Válvula:    {prediccion: Sano, confianza: 1.0000, sensor_mas_relevante: FS1, importancia_sensor: 0.3224, urgencia: Ninguna}
      Bomba:      {prediccion: Sano, confianza: 1.0000, sensor_mas_relevante: TS2, importancia_sensor: 0.2639, urgencia: Ninguna}
      Acumulador: {prediccion: Sano, confianza: 0.9995, sensor_mas_relevante: TS2, importancia_sensor: 0.3334, urgencia: Ninguna}
    tolerancia: "predicción, acción, urgencia, ventana Grad-CAM (s) y riesgo exactos; confianza +-0.001. El SHAP (sensor_mas_relevante/importancia_sensor) solo es comparable con shap>=0.51 (ver known_issues: depende de la versión de shap)."
    verificado_plugin_m48: "2026-10-05: con shap==0.52.0 (Python 3.12, deps del repo) el plugin reproduce EXACTAMENTE Tabla 3/xai_report_cycle.csv incluyendo SHAP (FS1 0.2288, FS1 0.3224, TS2 0.2639, TS2 0.3334). Con shap==0.42.0 (Python 3.11) predicción/confianza/ventana/acción/riesgo coinciden y el SHAP difiere (VS1/PS3/PS3/PS3), igual que el código original con esa versión."

known_issues:
