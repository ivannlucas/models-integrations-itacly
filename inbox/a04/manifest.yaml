known_issues:
  - "ACTUALIZADO (ciclo 2): TIDS Dataset ya se entrega en inbox/a04/codigo/.../TIDS Dataset/
    (862 imágenes). test_images/ (vacío en la entrega) se ha poblado con las 42 imágenes del
    split test oficial (test_ids_20260526_074452.txt) — ver golden_cases arriba. Sobre los
    42/42 casos del split oficial ejecutados contra el servidor real: 26/42 aciertan la clase
    (accuracy=61.90%), coherente con el accuracy=59.52% (25/42) reportado en la memoria/JSON
    auditado para este mismo split exacto — diferencia de 1 muestra, achacable al mismo drift
    de versión de timm/PyTorch entre el entorno de entrenamiento original y este ya señalado
    más abajo. NO es un bug de integración: los 16 casos que fallan la clase reproducen el
    rendimiento moderado ya documentado del modelo, no un error de wiring (confirmado
    comparando predict_inline vs predict_batch: salidas idénticas bit a bit)."
  - "BUG DE CUDA REAL encontrado y corregido este ciclo:
    model_loader.py::_safe_device() probaba la GPU con
    'torch.nn.Conv2d(1,1,1)(torch.zeros(1,1,4,4).cuda())' — el módulo Conv2d NUNCA se movía a
    .cuda(), solo el tensor de entrada, así que la prueba lanzaba SIEMPRE
    'RuntimeError: Input type (cuda) and weight type (cpu) should be the same' y el except
    hacía fallback a CPU incondicionalmente, incluso con una GPU real y compatible. En el
    ciclo anterior esto quedó enmascarado porque el sandbox tenía una GTX 1060 (CC 6.1)
    genuinamente incompatible con torch==2.13.0+cu130 — el fallback a CPU era 'correcto' por
    la razón incorrecta. Con la RTX 2070 SUPER (CC 7.5) de este ciclo el bug se hizo visible:
    el modelo cargaba en CPU en vez de CUDA a pesar de tener GPU funcional. Corregido
    siguiendo el patrón ya usado en ml2_fungal_cnn_disease_detection/ml8_cereals_img_anomaly_detector
    (probe = torch.nn.Conv2d(1,1,1).cuda(); probe(torch.zeros(1,1,4,4).cuda())). Verificado:
    arranque real ahora reporta 'device=cuda'; /predict (inline y batch) y /train (fine-tuning
    con copy.deepcopy + .to(device) sobre datos TIDS reales) ejecutados end-to-end sobre CUDA
    real sin errores. NOTA: el mismo patrón roto existe en otros plugins (modelo10_lacteo,
    ml41_meat_curing_machinery_acoustic_anomaly, ml5_meat_cow_behaviour,
    ml7_cereals_grain_pest_detection) — fuera de alcance de este ciclo (solo se tocó ml4), se
    señala para una revisión futura."
  - "Discrepancia menor memoria vs. artefacto: la memoria (sección 7.3, Fase 2) afirma que el
    reentrenamiento final usó exactamente '15 épocas', pero el JSON auditado
    (experiments/results/rigorous_final/baseline_efficientnet_rigorous_results_20260526_074452.json)
    reporta cv_results.avg_optimal_epochs=12. No afecta al pipeline de inferencia; se señala pero
    no se investiga más a fondo por no ser bloqueante."
  - "El modelo requiere imagen ya encuadrada en la región mamaria (sin detección/segmentación de
    ROI) — fuera de ese dominio de captura (TIDS, FLIR E96, condiciones controladas) el rendimiento
    reportado (F1=0.60, Accuracy=59.5%) no está garantizado (memoria, 'Limitaciones')."
  - "El modelo tiene rendimiento moderado (F1 test=0.60, apenas por encima del azar en accuracy);
    esto es del modelo entregado, no un bug de integración — documentado tal cual en LIMITATIONS.md
    y en la memoria. Confirmado de nuevo este ciclo sobre el split de test real completo (42/42
    casos, accuracy=61.90%)."
