# Manifest — a04 / ml4-lactic-cnn-thermal-early-disease-detection
#
# Fuente del código entregado: inbox/a04/codigo/retech-lote2-cnn-thermal-early-disease-detection/
# Fuente de la memoria: inbox/a04/entregable/4 - Modelo de CNN para la detección temprana de
#   enfermedades a través del análisis de imágenes termográficas - v6 (1).docx
#
# NOTA IMPORTANTE: este modelo YA estaba integrado en app/plugins/ antes de pasar por este
# skill (ver auditoría en outputs/a04/verification_report.md). Este manifest se generó a
# POSTERIORI contra el plugin ya existente, exactamente como exige el flujo estándar, para
# poder auditar el plugin contra él.

model_id: ml4-lactic-cnn-thermal-early-disease-detection
sector: lacteo
nombre: "Modelo de CNN para la detección temprana de enfermedades a través del análisis de imágenes termográficas"
task_type: binary_image_classification
framework: [pytorch, timm, albumentations, opencv-python, grad-cam]

artifacts:
  folder: experiments/results/rigorous_final/
  files:
    - baseline_efficientnet_final_model.pth   # checkpoint EfficientNet-B0, ~16MB (memoria, sección "Inventario de artefactos de producción")

inputs:
  fixed:
    - name: image
      type: file
      format: [jpg, jpeg, png, bmp]
      description: >
        Imagen térmica RGB de la ubre (de cualquier dimensión de entrada; se redimensiona
        automáticamente a 224x224). Debe venir ya encuadrada/centrada en la región mamaria —
        el modelo NO incluye detección/segmentación de ROI (memoria, "Requisito Operativo de
        Captura").
  control: null   # no es un modelo de optimización/control
  derived_if_missing: null   # no hay features derivadas; la imagen se consume directamente

outputs:
  predict_inline:
    - prediction            # 'Healthy' | 'SCM'
    - predicted_class_index # 0=Healthy, 1=SCM
    - confidence            # softmax de la clase ganadora
    - probability_healthy
    - probability_scm
    - heatmap_url            # CAM superpuesto (auxiliar, no fallar la predicción si falla)

training:
  supported: true
  # El código entregado incluye un procedimiento de entrenamiento real y reproducible:
  # src/training/trainer.py (bucle train/val + early stopping + checkpoint),
  # src/training/losses.py (FocalLoss/BaselineLoss), src/training/metrics.py,
  # scripts/train_kfold.py (orquestación K-Fold + reentrenamiento final),
  # configs/baseline_efficientnet.yaml (hiperparámetros del modelo campeón).
  # El plugin YA integrado tenía train() marcado como TrainingNotSupportedError (501) —
  # esto es un bug de integración (clase 3 del informe de auditoría), corregido en este ciclo.
  target_column: label   # columna binaria en ID_Labels.csv (0=Healthy, 1=SCM) — src/data/dataset.py
  required_columns: [ID, label]   # + imágenes en TIDS_cropped/{healthy,SCM}/<ID>.jpg (misma estructura que TIDSDataset)
  hyperparams:
    backbone: efficientnet_b0
    dropout: 0.3
    optimizer: adam
    learning_rate: 0.0001
    weight_decay: 0.0001
    batch_size: 16
    scheduler: reduce_on_plateau
    scheduler_params: {mode: min, factor: 0.5, patience: 5, min_lr: 0.000001}
    loss: focal_loss
    focal_alpha: 0.25
    focal_gamma: 2.0
    max_epochs: 100
    early_stopping_patience: 15
    image_size: 224
    random_seed: 42
  metrics_returned: [accuracy, precision, recall, f1, auc, n_train, n_val]
  source: codigo_entrenamiento   # configs/baseline_efficientnet.yaml + src/training/{trainer,losses,metrics}.py

constraints: null   # no se detectó ninguna restricción dura de negocio en memoria ni en el código

metrics_reported:
  # Tabla 9 / experiments/results/rigorous_final/baseline_efficientnet_rigorous_results_20260526_074452.json
  test_holdout_n42:
    accuracy: 0.5952380952380952
    precision: 0.5909090909090909
    recall: 0.6190476190476191
    f1: 0.6046511627906976
    auc: 0.6167800453514739
  # Tabla 8 — 5-Fold CV sobre el 90% dev set (n=376)
