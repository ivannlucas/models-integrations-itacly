      features_split: {logret: 0.02731195486, distsma12: 0.0456871345, rsi14: 57.31452456, bollingerpos: 0.8454746424, weeksin: -0.8229838659, weekcos: 0.5680647467}
    expected:
      target: 0

known_issues:
  - id: artefactos_no_en_s3
    detail: >
      [NUEVO 2026-10-08] s3://<STORAGE_BUCKET>/artifacts/fixed/ml13_wine_price_fluctuation_prediction/
      no existe (listado de solo lectura). Lo más parecido es artifacts/fixed/wine_price_fluctuation/
      (marzo de 2026, anterior a la entrega de junio). Hay que subir los 4 ficheros de
      inbox/a13/codigo/models/prod/ a la carpeta con el nombre del plugin; sin ellos el servicio
      arranca con loaded=false. Acción humana (el agente no escribe en S3).
  - id: titulo_rnn_vs_modelo_produccion
    detail: >
      El título del proyecto/memoria y el nombre del repo dicen "redes neuronales recurrentes" (RNN),
      pero el modelo entregado para producción es una Regresión Logística tabular. La memoria lo
      justifica (sec. "Análisis de Modelos Recurrentes (GRU)": volumen de datos insuficiente) y
      deja GRU/ensemble como experimentales sin artefacto entrenado. Se integra SOLO LogReg.
      DECISIÓN HUMANA: confirmar que es aceptable publicar este modelo bajo el título "RNN" en las
      fichas, o pedir al equipo de IA que ajuste el título.
  - id: metricas_cv_no_cumplen_criterios
    detail: >
      La propia memoria (Tabla 5, sec. 7.2) reconoce que en validación cruzada el modelo NO cumple
      sus criterios de éxito (AUC 0.656 < 0.70; F1 0.171 < 0.50; Recall 0.290 < 0.65; AUC std 0.27).
      Solo los cumple en el hold-out de 24 semanas, que la memoria califica de "límite superior
      alcanzable bajo condiciones de mercado favorables" (33,3% positivos vs 20% en CV). Esperable
      en producción según la memoria: AUC 0.72-0.89, F1 0.19-0.33 (Folds 3-4).
  - id: precision_baja_test
    detail: >
      Tabla 6 implica TP=8, FP=11, TN=5, FN=0 sobre 24 semanas: 19 alertas de 24 semanas (79%), de
      las que 11 son falsas. Recall=1.0 se obtiene alertando casi siempre. Relevante para la ficha
      funcional: no presentar el Recall 100% sin este contexto.
  - id: sklearn_version_mismatch
    detail: >
      ml_model.pkl y scaler.pkl serializados con scikit-learn 1.3.2 (requirements del equipo de
      IA); el repo fija scikit-learn==1.5.2 (compatibilidad con el servicio XAI). Deserializa con
      InconsistentVersionWarning. Se verifica equivalencia numérica en verification (Parte B).
  - id: requirements_entregado
    detail: >
      requirements.txt entregado en ASCII/LF sin BOM (sin problema de encoding). Fija
      tensorflow==2.15.0 y pandas==2.1.4/numpy==1.24.3, versiones no necesarias/compatibles con el
      repo; no se añaden dependencias nuevas a requirements.txt del repo (sklearn, pandas, numpy,
      joblib y xgboost ya están).
  - id: convencion_bulletin
    detail: >
      El esquema 'bulletin' usa "SEMANA {week}/{year_end}" con year_end = segundo año de la campaña
      (p. ej. SEMANA 46/2026 = semana 46 de 2025, campaña 2025/2026). NO coincide con la rotulación
      literal de los PDF del MAPA ("46-2025"): un usuario que copie el año del boletín oficial
      obtendría fechas desplazadas un año sin ningún error. Se mantiene el comportamiento original
      (data/README.md lo documenta así) y se avisa en el DTO.
  - id: sin_validacion_huecos
    detail: >
      El código original no valida huecos semanales ni duplicados: los indicadores (rolling por
      filas, no por calendario) se calcularían igualmente sobre una serie con huecos. El dataset
      entregado no tiene huecos (verificado: 174 semanas consecutivas 2022-08-01..2025-11-24, una
      sin price_red -> 173 válidas, cuadra con la memoria). El plugin replica el comportamiento
      original y no añade validación nueva (sería cambiar el contrato del modelo).
  - id: validacion_precio_anadida
    detail: >
      (Revisión PR 2026-10-08) El código original no valida que el precio sea > 0 y finito: un 0
      produce logret=-inf que dropna() no filtra, y un negativo/inf descarta en silencio la última
      semana. El plugin añade validate_prices(): cualquier precio informado no numérico, <= 0 o
      no finito -> DataContractError (422). Precios vacíos se siguen omitiendo como en el original.
  - id: dataset_raw_vs_memoria
    detail: >
      La memoria dice 173 semanas; el CSV crudo tiene 174 filas, una sin precio (SEMANA 31/2023 =
      2022-08-01) que el ETL descarta -> 173. Coherente.
  - id: periodo_test_inconsistente_en_memoria
    detail: >
      La memoria describe el test como "19/05/2025 al 27/10/2025" (EDA) y en otro punto como
      "mayo-noviembre 2025" (sec. 7.3). El split entregado confirma 2025-05-19..2025-10-27.
      Errata menor de la memoria; también "p=0002" (debería ser p=0,0002) en el EDA.
  - id: formulas_memoria_en_ecuaciones
    detail: >
      Las fórmulas del target, Smart Score, estabilidad y criterios de éxito están como ecuaciones
      OMML/imagen en la memoria y se pierden en la conversión a texto; se han tomado del código
      (training.py, features.py) y del texto adyacente, que son coherentes entre sí.
  - id: memoria_metadatos
    detail: >
      Portada fechada 18/12/2025 y versión 1.10 de 23/06/2026; campo "Entregable" vacío en la tabla
      de control. Sin impacto técnico; a revisar para la ficha de metadatos.
  - id: semana_iso_53
    detail: >
      weeksin/weekcos usan semana/52; en años con semana ISO 53 (p. ej. 2026) el valor 53 se
      codifica como ligeramente posterior a la semana 1. No afecta al dataset entregado (sin semana
      53); comportamiento heredado, no se corrige en el plugin.
  - id: train_desde_cero
    detail: >
      El reentrenamiento original reajusta desde cero y puede cambiar de familia (logreg -> xgboost)
      según Smart Score; el target se deriva del precio (no viene en el CSV). El plugin lo replica
      y guarda el resultado como artefacto de usuario (nunca sobreescribe models/prod).
  - id: golden_sin_probabilidades_publicadas
    detail: >
      El código entregado no incluye output/test_predictions.csv ni output/test_metrics.json (están
      en .gitignore del equipo de IA): no hay probabilidades por fila publicadas. Los golden cases
      llevan solo la etiqueta real del split; la correctitud se contrasta (1) agregadamente con la
      Tabla 6 y (2) por fila contra la salida del código original del equipo de IA ejecutado sobre
      los artefactos entregados (cross-check de wiring, documentado en verification_report.md).
