model_id: ml13-wine-price-fluctuation-prediction
plugin_name: ml13_wine_price_fluctuation_prediction
sector: vitivinicola
nombre: "Modelo para la predicción de fluctuaciones de precios basado en redes neuronales recurrentes"
acronimo: RNN-VINO
memoria: "inbox/a13/entregable/13 - Modelo para la predicción de fluctuaciones de precios vino v1.10.docx (v1.10, 23/06/2026)"
codigo: "inbox/a13/codigo/luce_back_front-retech-lote2-rnn-vitivinicola-price-fluctuation-prediction-50bf1214d89c/ (zip a13-luce_back_front-retech-lote2-rnn-vitivinicola-price-fluctuation-prediction.zip, commit 50bf1214d89c)"
task_type: classification_binary_timeseries_tabular
task_type_note: >
  Clasificación binaria semanal: probabilidad de que la media del precio del vino tinto a granel
  de las 4 semanas siguientes (t+1..t+4) supere en más de un 2,5% el precio de la semana t.
  A PESAR DEL TÍTULO ("redes neuronales recurrentes"), el modelo de PRODUCCIÓN es una Regresión
  Logística tabular sobre 6 indicadores técnicos (models/prod/model_config.json = logreg; memoria
  sec. "Conclusiones y Selección Final"). GRU y ensemble GRU+LogReg son solo experimentales
  (modules/RNN_models/), no se entrega artefacto GRU entrenado y la memoria los excluye
  explícitamente del pipeline de producción. El plugin integra solo la rama de producción.

framework:
  - scikit-learn   # LogisticRegression + StandardScaler. Artefactos serializados con 1.3.2
                   # (requirements del equipo de IA); el repo fija 1.5.2 -> InconsistentVersionWarning
                   # al deserializar (ver known_issues y verification_report: equivalencia numérica comprobada)
  - pandas
  - numpy
  - joblib
  - xgboost        # solo para train(): el procedimiento original compite LogReg vs XGBoost por Smart Score
  # requirements.txt del código entregado: ASCII, LF, sin BOM -- SIN problema de encoding.
  # tensorflow==2.15.0, matplotlib, seaborn, requests, pdfplumber, beautifulsoup4 solo se usan en
  # notebooks/RNN_models/scraper -- no forman parte de la inferencia de producción.

artifacts:
  folder: models/prod/
  files:
    - ml_model.pkl          # LogisticRegression(C=1.0, penalty=l2, class_weight=balanced, max_iter=1000, random_state=42)
    - scaler.pkl            # StandardScaler ajustado sobre train+val (126 semanas)
    - feature_schema.json   # orden de columnas de entrada + metadatos de fórmulas/umbral
    - model_config.json     # {"model_type": "logreg"}
  local_destination: artifacts/ml13_wine_price_fluctuation_prediction/

inputs:
  # El input NO es una fila de features: inference.py::predict_from_csv() recibe una serie semanal
  # cruda y recalcula internamente los indicadores técnicos (ventana dominante Bollinger-20).
  fixed:
    - {name: campaign, type: str, example: "2024/2025", description: "Campaña vitivinícola (agosto año N - julio año N+1). Semana >= 31 -> año N; semana < 31 -> año N+1 (data.py::parse_campaign_date)."}
    - {name: week, type: int, range: [1, 53], description: "Semana ISO. Fecha = lunes de la semana ISO (%G-W%V-%u)."}
    - {name: price_red, type: float, unit: "EUR/hl", description: "Precio medio nacional semanal del vino tinto a granel (boletín MAPA). Detección automática de columna de precio en el orden: preciotinto, price_red, precio_blanco, price_white (config.py::DataConfig.price_column_candidates)."}
  alternative_time_key:
    - {name: bulletin, type: str, example: "SEMANA 50/2023", description: "Alternativa a campaign+week: SEMANA {week}/{year_end}; se deriva campaign='{year_end-1}/{year_end}'. Si vienen campaign+week, tienen prioridad."}
  optional:
    - {name: price_white, type: float, description: "Se acepta; solo se usa si no existe ninguna columna de tinto (orden de candidatos). La memoria afirma que el pipeline funciona con blanco, pero el artefacto entregado está entrenado SOLO con tinto."}
  derived_internally: [logret, distsma12, rsi14, bollingerpos, weeksin, weekcos]
  constraints:
    min_historical_weeks: 20   # config.py::MIN_INFERENCE_WEEKS; memoria sec. "Mecanismo de Inferencia"
    ordering: "Se reordena internamente por fecha reconstruida. El código original NO valida huecos semanales ni duplicados (ver known_issues)."

outputs:
  predict_batch:
    # predict_from_csv(): left-merge sobre TODAS las filas de entrada; NaN en las ~19 primeras (warm-up).
    - {name: fecha, type: date, description: "Lunes de la semana ISO de la fila de entrada (semana t de referencia, NO t+4)."}
    - {name: campaign, type: str}
    - {name: week, type: int}
    - {name: price, type: float}
    - {name: "logret|distsma12|rsi14|bollingerpos|weeksin|weekcos", type: float}
    - {name: pred_proba_up, type: float, description: "P(mean(price[t+1..t+4]) > price_t * 1.025). NaN si la fila cae en el warm-up."}
  predict_inline:
    - {name: pred_proba_up, type: float, description: "Probabilidad para la ÚLTIMA semana del historial enviado."}
    - {name: alerta_subida, type: int, description: "1 si pred_proba_up >= 0.5. Umbral de decisión 0.5 fijo en el código (inference.py::_compute_test_metrics y evaluate_on_last_weeks); predict_from_csv solo devuelve la probabilidad -- el plugin añade la etiqueta con ese mismo umbral, documentado como comportamiento añadido."}

training:
  supported: true
  # [CORREGIDO 2026-10-08] Alineado con el contrato común de reentrenamiento al integrar main en la
  # rama de auditoría: mlflow_run_id obligatorio (422 si falta o va vacío); el modelo reentrenado se
  # guarda SOLO en MLflow (antes también en artifacts/ con nombres user_*); un fallo de subida es 502
  # (antes 200 con upload_warning); /predict con un run sin modelo cargable responde 422 (antes 200
  # con el modelo base). Re-verificado con mapa_wine_prices_raw.csv: hold-out AUC 0.8438, F1 0.5926,
  # P 0.4211, R 1.0, Acc 0.5417 (idéntico al verification_report); predicción base sin cambios (0.4621).
  source: codigo_entrenamiento   # modules/ML_models/training.py (train_with_walk_forward + train_final_models) + modules/common/config.py
  input_schema: "Mismo CSV crudo que inferencia (campaign+week o bulletin, + price_red). El target NO viene en el CSV: se calcula internamente."
  target_column: target   # DERIVADA internamente (features.py::generate_technical_features):
                          # target = 1 si mean(price[t+1..t+4]) > price_t * (1 + 0.025)
  required_columns: [campaign, week, price_red]   # o [bulletin, price_red]
  hyperparams:
    return_threshold: 0.025
    target_window: 4
    test_size: 24          # últimas 24 semanas, hold-out
    n_folds: 5             # walk-forward adaptativo (get_adaptive_walk_forward_splits)
    gap: 4
    random_seed: 42
    model_selection: "Smart Score = 0.5*AUC_mean + 0.3*F1_mean + 0.2*(1 - min(auc_std/0.15, 1)); candidatos logreg vs xgboost"
    logreg: {C: 1.0, penalty: l2, class_weight: balanced, max_iter: 1000}
    xgboost: {n_estimators: 100, max_depth: 3, learning_rate: 0.1, scale_pos_weight: "n_neg/n_pos dinámico sobre trainval"}
    scaler: "StandardScaler ajustado sobre train+val completo"
    decision_threshold: 0.5
  metrics_returned: [auc, accuracy, f1, precision, recall]   # hold-out (últimas 24 semanas) + medias CV + best_model_type
  note: >
    El entrenamiento original es "desde cero" (no fine-tuning incremental): reajusta scaler y modelo
    sobre train+val y re-selecciona entre logreg/xgboost. El plugin reproduce ese procedimiento
    exacto sin mutar el artefacto servido (ver plugin-integration).

constraints:
  historial_minimo:
    rule: "len(serie semanal limpia) >= 20"
    source: "config.py::MIN_INFERENCE_WEEKS; memoria sec. 'Entradas y Salidas' y 'Mecanismo de Inferencia'"
    domain_exception: InsufficientDataError   # ya existe en app/domain/services/exceptions.py ("wine price"), sin usos previos -> 422
  # No hay restricciones de negocio tipo umbral físico. La política "human-in-the-loop" para cambiar
  # return_threshold (memoria sec. Objetivos) es proceso externo, no validación de input.

success_criteria_memoria:   # sec. 7.1 "Criterios de Éxito"
  auc_roc_min: 0.70
  f1_min: 0.50
  recall_min: 0.65

metrics_reported:
  modelo: LogisticRegression
  test_holdout:   # Tabla 6 "Métricas Test" -- 24 semanas (2025-05-19 .. 2025-10-27), 8 positivos
    AUC: 0.8438
    F1: 0.593
    Precision: 0.421
    Recall: 1.000
    Accuracy: 0.542
    smart_score: 0.7997   # Tabla 4
    implied_confusion_matrix: {TP: 8, FP: 11, TN: 5, FN: 0}   # deducida de Tabla 6 + 8 positivos (cuadra exactamente)
  cv_walk_forward:   # Tabla 5 (+ Tabla 4 para AUC std y Score)
    AUC_mean: 0.6564
    AUC_std: 0.2704
    Accuracy: 0.659
    F1: 0.171
    Precision: 0.321   # citado en el texto, no en la tabla
    Recall: 0.290
    smart_score: 0.3796
  xgboost_alternativo: {AUC_val: 0.4328, AUC_std: 0.0685, AUC_test: 0.4688, Score_val: 0.3251, Score_test: 0.5267}
  tolerance_derivation: >
    Clasificador: no hay MAE/RMSE. Las métricas agregadas de test (Tabla 6) se publican a 3-4
    decimales -> tolerancia = medio paso del último decimal publicado (atol 0.0005) al recalcular
    sobre los 24 golden cases. Por caso, la etiqueta se compara de forma exacta contra el target
    real; los fallos de etiqueta son errores del propio modelo ya declarados en la Tabla 6
    (11 falsos positivos esperados, 0 falsos negativos), no se silencian.
  source: "memoria v1.10, Tablas 4, 5 y 6; sec. 7.1"

