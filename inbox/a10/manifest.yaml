# [RENOMBRADO 2026-10-06] Nomenclatura alineada con el estándar mlNN_<sector>_<desc>:
#   modelo10_lacteo / modelo10-lacteo  ->  ml10_dairy_disease_vector_detection / ml10-dairy-disease-vector-detection
#   Artefactos (local y S3): artifacts/modelo10_lacteo/ -> artifacts/ml10_dairy_disease_vector_detection/
#   Las menciones al nombre antiguo en comentarios/known_issues son históricas.
# ============================================================================
# HISTORIAL DE CICLOS DE EXTRACCIÓN (no se borra, se añade)
# ============================================================================
# Ciclo 1 (2026-10-02): manifest inicial + verification_report.md. inbox/a10/codigo/
#   tenía 219 ficheros — solo artefactos ya entrenados + 1 imagen real de ejemplo
#   (data/test.jpg + data/predictions/test_results.json). Los 3 datasets públicos
#   (Roboflow insects, Kaggle fly_mos, Roboflow ticks) solo existían como instrucciones
#   de descarga en el README, no como datos. golden_cases: 1 caso real (caso_001_test_jpg).
#   3 bugs encontrados/corregidos: preprocesado sin CenterCrop, detector YOLO sin
#   device= explícito (500 real), hiperparams de train() inventados.
# Ciclo 2 (fecha no registrada en este fichero): fix de _safe_device() — el self-test de
#   CUDA no movía el módulo Conv2d a .cuda(), forzando CPU silenciosamente incluso con
#   GPU funcional. Corregido en app/plugins/ml10_dairy_disease_vector_detection/model_loader.py.
# Ciclo 3 (2026-10-05, ESTE CICLO): re-auditoría COMPLETA desde cero. inbox/a10/codigo/
#   creció a 49.695 ficheros — el usuario añadió los 3 datasets reales completos
#   (data/detection/raw/insects, data/classification/raw/fly_mos,
#   data/classification/raw/ticks), antes solo referenciados en el README. Se
#   reprodujo el split real 70/15/15 (seed=42) que usa create_detection_splits/
#   create_classification_splits (src/training/utils_train.py) sobre
#   data/*/processed (ya presente en el entregable) y se construyeron 25 golden_cases
#   reales (antes 1), con `expected` obtenido ejecutando predict_inline() del plugin
#   YA INTEGRADO contra el checkpoint real vendorizado (no inventado, no hand-typed).
#   Confirmado con hash MD5: los 3 artefactos en artifacts/ml10_dairy_disease_vector_detection/ son
#   BIT-A-BIT IDÉNTICOS a los de inbox/a10/codigo/.../models/*/artifacts/.
#   Los 3 bugs del ciclo 1 y el bug del ciclo 2 se reconfirmaron CORREGIDOS contra
#   datos reales (no solo releídos en el código). No se encontró ningún bug NUEVO de
#   wiring/preprocesado/device/mlflow_run_id. Hallazgo nuevo (no un bug, una métrica
#   real antes invisible): el pipeline COMPLETO (detector+crop+clasificador) mide
#   accuracy=94.94% (394/415) sobre el split de test real reproducido — notablemente
#   por debajo del accuracy=0.981 oficial de la memoria (que solo evalúa el
#   clasificador aislado sobre crops ya recortados, nunca el pipeline completo) y
#   especialmente débil en 'mos' (86.73%, con 6/98 imágenes sin ninguna detección
#   por encima de det_conf_thresh=0.2). Ver `known_issues` para el detalle completo
#   y las salvedades de reproducibilidad del split. golden_cases: 25/25 casos
#   correctos (ver tabla en outputs/a10/verification_report.md).
# ============================================================================
model_id: ml10-dairy-disease-vector-detection
sector: lacteo
nombre: "Modelo para la detección de vectores de enfermedades de ganado vacuno"
task_type: object_detection+image_classification   # pipeline de 2 etapas: YOLOv8n (detección) + MobileNetV3 (clasificación de especie)
framework:
  - torch==2.5.1+cu121
  - torchvision==0.20.1+cu121
  - ultralytics==8.4.17
  - opencv-python==4.13.0.92
  - pillow==12.0.0

# Fuente: inbox/a10/codigo/.../src/predict/predictor.py, src/training/trainer.py,
# config/config.yaml, memoria (sección "Arquitectura y Algoritmos",
# "Artefactos de producción utilizados").
artifacts:
  folder: models/
  files:
    - detection/artifacts/detector/weights/best.pt    # YOLOv8n, 1 sola clase ("Vector")
    - classification/artifacts/best_classifier.pth     # MobileNetV3-Large, head reemplazada (3 clases)
    - classification/artifacts/class_names.json         # ["fly", "mos", "tick"], orden = índice de salida

inputs:
  fixed:
    - name: image
      type: file(base64|path)
      description: >
        Imagen RGB de piel/pelaje de ganado vacuno (jpg/jpeg/png/bmp/tif). Entrada única del
        pipeline — no hay features tabulares; "no existe un proceso de ingeniería de
        características como tal" (memoria, sección "Variables e Ingeniería de Características").
    - name: det_conf_thresh
      type: float
      default: 0.2
      description: "Umbral mínimo de confianza de detección (YOLOv8n) para no descartar una caja."
    - name: cls_conf_thresh
      type: float
      default: 0.5
      description: "Umbral mínimo de confianza de clasificación (MobileNetV3) para aceptar una detección."
  control: null        # no hay optimizador/GA en este modelo
  derived_if_missing: {}  # ninguno — det_conf_thresh/cls_conf_thresh tienen default fijo, no se derivan de otros campos

outputs:
  predict_inline:
    - name: prediction
      type: str
      description: "Especie dominante (mayor cls_conf) entre las detecciones aceptadas: fly | mos | tick | no_vectors."
    - name: confidence
      type: float
      description: "cls_conf de la detección dominante."
    - name: vectors_count
      type: int
      description: "Número de detecciones que superaron ambos umbrales."
    - name: detections
      type: list[dict]
      description: "Por detección: species, det_conf, cls_conf, bbox {x1,y1,x2,y2} (coords en la imagen original)."
    - name: species_summary
      type: dict
      description: "Conteo de detecciones por especie."
    - name: annotated_image
      type: str(base64 jpeg)
      description: "Imagen con bounding boxes dibujadas (no está en el código original — añadido por el equipo de integración para el front/XAI; no afecta a la predicción)."
    - name: heatmap_crops
      type: list[dict]
      description: "Añadido por integración para el panel de explicabilidad (no está en el código original delivered): hasta 5 crops recortados con su species/cls_conf, usados por el servicio SHAP/Grad-CAM. No forma parte del pipeline de predicción original."

training:
  supported: true   # SOLO el clasificador MobileNetV3 — ver known_issues
  duracion_estimada: "No medida con el dataset completo; hasta 100 épocas con early stopping (paciencia 15) sobre MobileNetV3 con backbone congelado"   # [AÑADIDO 2026-10-08]
  target_column: null  # no aplica: clasificación de imágenes vía ImageFolder (carpeta = clase), no CSV con columna objetivo
  required_columns: null  # no aplica (ver required_structure)
  required_structure: >
    ZIP con estructura {fly|mos|tick}/*.jpg (plano, se autodivide 70/15/15) o ya pre-dividido
    {train|val}/{fly|mos|tick}/*.jpg — mismas 3 clases que class_names.json, mismo orden no
    relevante (se reconstruye desde ImageFolder.classes en cada retrain).
  hyperparams:
    # == src/training/trainer.py::train_classifier + config/config.yaml (classifier:), NO elegidos por el agente ==
    model: mobilenet_v3_large
    pretrained_weights: IMAGENET1K_V1
    frozen_backbone: true   # solo se entrena classifier[-1] (Linear reemplazada) + el resto de capas de `model.classifier`, que quedan congeladas por el freeze previo
    optimizer: Adam
    lr: 0.007980063451685896
    weight_decay: 0.0003438715138565418
    batch_size: 64
    imgsz: 224
    max_epochs: 100
    patience: 15               # early stopping sobre val_loss
    scheduler: "StepLR(step_size=10, gamma=0.1)"
    best_model_criterion: val_accuracy   # se guarda el mejor state_dict por val_acc, no por val_loss
    augmentation_train: "RandomHorizontalFlip + RandomRotation(15)"
    split_ratios: {train: 0.7, val: 0.15, test: 0.15}  # splits.p_train/p_val/p_test en config.yaml
  # [CORREGIDO 2026-10-08] El split de test (15 %) se calculaba y nunca se evaluaba; ahora se
  # evalúa con las fórmulas de src/predict/predictor.py (accuracy + P/R/F1 por clase). El split
  # automático aplica el tope splits.max_ticks=1400 del original y es reproducible (ficheros
  # ordenados + Random(42) local; el original baraja os.listdir bajo set_seed(42) global).
  metrics_returned: [train_samples, val_samples, test_samples, classes, epochs_run, best_val_acc, test_accuracy, test_per_class, time_min]
  source: codigo_entrenamiento  # src/training/trainer.py, config/config.yaml
  # Re-confirmado en el ciclo 3 (2026-10-05): split real reproducido ejecutando
  # set_seed(42) + create_detection_splits + create_classification_splits
  # (src/training/utils_train.py) tal cual sobre data/*/processed ya presente en el
  # entregable → detección: train=3044/val=652/test=653 imágenes; clasificación:
  # train=979/val=210/test=211 (tick, tope max_ticks=1400 aplicado sobre 4430
  # disponibles), train=489/val=104/test=106 (fly), train=452/val=96/test=98 (mos).
  # train() del plugin verificado end-to-end en este ciclo con datos REALES (no
  # sintéticos como en el ciclo 1): ZIP de 75 imágenes reales (25/clase) del split
  # train reproducido más arriba, mlflow_run_id real con BaseMLflowTracker
  # monkeypatcheado a un stub no-op (ver known_issues sobre por qué: el tracker real
  # cuelga en este sandbox sin red hacia MLflow) → entrenó 16 épocas (early stopping
  # por patience=15), best_val_acc=88.9%, upload_artifacts del stub recibió
  # class_names.json + best_classifier.pth correctamente. Confirma que la lógica de
  # entrenamiento del plugin (split, hiperparams, loop, early stopping, guardado,
  # llamadas a MLflow) funciona de extremo a extremo con datos reales — el único
  # bloqueo es de infraestructura compartida (MLflow no accesible), no del plugin.

constraints: {}   # ninguna restricción dura de negocio documentada (no hay análogo a "PU >= 13")

# Memoria, Tabla "Ranking de modelos de detección en el conjunto de test" (YOLOv8n) y
# "Ranking de modelos de clasificación en el conjunto de test" (MobileNetV3) — ver known_issues
# sobre la discrepancia con los JSON de métricas incluidos en el código entregado.
metrics_reported:
  fuente: memoria_tabla_ranking_deteccion_y_clasificacion
  deteccion:
    modelo: YOLOv8n
    mAP50: 0.790
    mAP50_95: 0.466
    precision: 0.824
    recall: 0.710
  clasificacion:
    modelo: MobileNetV3
    accuracy: 0.981
    precision: 0.979
    recall: 0.974
    f1: 0.976
  kpi_objetivo_memoria:
    mAP50_min: 0.7
    recall_deteccion_min: 0.65
    accuracy_clasificacion_min: 0.8
  veredicto_memoria: APTO   # "cumplen holgadamente con los objetivos especificados" (memoria, sección "Métricas y Rendimiento")
  # ── Medición empírica NUEVA del ciclo 3 (2026-10-05), ahora que existen datos reales ──
  # Fuente: ejecución real de predict_inline() del plugin integrado (checkpoint vendorizado,
  # idéntico MD5 al entregado) sobre el split de test real reproducido (seed=42, ver
  # `training` más arriba). Scripts usados, no incluidos en el repo (solo para esta auditoría):
  # pipeline completo detector+crop+clasificador sobre las 415 imágenes de
  # data/classification/splits/test/{fly,mos,tick}.
  pipeline_completo_medido_ciclo3:
    total: 415
    correctos: 394
    accuracy: 0.9494
    sin_deteccion: 10   # vectors_count=0 pese a existir el vector (recall perdido en la etapa YOLO)
    por_clase:
      fly: {n: 106, correctos: 101, accuracy: 0.9528, sin_deteccion: 2}
      mos: {n: 98, correctos: 85, accuracy: 0.8673, sin_deteccion: 6}
      tick: {n: 211, correctos: 208, accuracy: 0.9858, sin_deteccion: 2}
    deteccion_mAP50_medido: 0.9327   # model.val() de ultralytics sobre el split de detección reproducido (653 img, seed=42)
    deteccion_precision_medida: 0.9465
    deteccion_recall_medida: 0.8598
    caveat_reproducibilidad_split: >
      El split reproducido en este ciclo usa el MISMO código (create_detection_splits/
      create_classification_splits, seed=42) y los MISMOS data/*/processed ya presentes en
      el entregable, pero random.shuffle(os.listdir(...)) depende del orden de listado del
      filesystem, que no está garantizado idéntico al que tuvo el equipo de IA cuando generó
      los artefactos vendorizados (best.pt/best_classifier.pth) — no hay forma de probar que
      este test set reproducido es EXACTAMENTE el mismo conjunto de imágenes que ellos
      reservaron como test en su momento. Esto significa que no puede garantizarse ausencia
      de leakage train/test entre este test set reproducido y el entrenamiento real de los
      artefactos servidos: estos números de accuracy/mAP agregados deben leerse como
      indicativos de correctitud de WIRING (el pipeline hace lo que dice que hace sobre datos
      reales con groundtruth real) y no como una medición no-sesgada de generalización. La
      comparación cualitativa (clasificador aislado ~0.981-0.990 oficial vs. pipeline completo
      0.9494, con 'mos' notablemente peor en 0.8673) es la parte robusta del hallazgo: un
      eventual leakage favorable haría que el accuracy REAL en producción fuera igual o PEOR,
      nunca mejor, que lo medido aquí — así que la brecha frente al 0.981 oficial es, si acaso,
      una cota optimista, no pesimista.

# ============================================================================
# GOLDEN CASES — ciclo 3 (2026-10-05): 25 casos reales (antes 1), ahora que los 3
# datasets reales están presentes en inbox/a10/codigo/.../data/*/raw/.
#
# Metodología (nunca inventada):
#   1. Split real reproducido con el CÓDIGO ORIGINAL (set_seed(42) +
#      create_detection_splits + create_classification_splits de
#      src/training/utils_train.py) sobre data/*/processed, ya presente en el
#      entregable. Ver `training` arriba para los conteos resultantes.
#   2. crop_{fly,mos,tick}_NN (18 casos): 6 imágenes por clase muestreadas
#      aleatoriamente (seed=123, script de auditoría) del split TEST real recién
#      reproducido. Ground truth = carpeta ImageFolder (fly/mos/tick), real, no
#      inventado. `expected` = salida real de predict_inline() del plugin YA
#      INTEGRADO, ejecutada contra el checkpoint vendorizado (idéntico MD5 al
#      entregado) — no hand-typed. Las 18 coincidieron con el ground truth de
#      carpeta (18/18).
#   3. fullraw_{fly,mos,tick}_NN (6 casos): para 2 imágenes de test por clase, se
#      recuperó la imagen RAW ORIGINAL (sin recortar) de la que salió ese crop
#      (nombre de fichero `{base}_c{i}.jpg` → `{base}.jpg/.jpeg` en
#      data/*/raw/fly_mos o data/*/raw/ticks/test/images) y se corrió el pipeline
#      COMPLETO (detector YOLO sobre la imagen entera, no solo el clasificador
#      sobre un crop ya hecho) — ejercita la etapa de detección+crop real, no solo
#      clasificación. Las 6 coincidieron con el ground truth (6/6).
#   4. caso_001_test_jpg: el único caso del ciclo 1, re-verificado en este ciclo
#      contra el mismo checkpoint (sigue dando match exacto).
#   5. NO se incluye ningún caso real de la rama "no_vectors": las 653 imágenes del
#      split de detección test reproducido tienen todas al menos una anotación de
#      vector (0 candidatas con label vacío/ausente) — documentado como gap real en
#      known_issues, no simulado con una imagen sintética.
#
# Resultado: 25/25 casos con prediction == ground truth (ver
# outputs/a10/verification_report.md para la tabla completa con det_conf/cls_conf/bbox).
