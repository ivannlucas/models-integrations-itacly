known_issues:
  - "requirements.txt del código entregado está en UTF-16LE con CRLF — normalizar a UTF-8/LF
     antes de usarlo para pip install/pip-audit."
  - "DISCREPANCIA DE PREPROCESADO ENTRE EL PROPIO CÓDIGO ORIGINAL (ya corregida en el plugin
     integrado, ver app/plugins/ml10_dairy_disease_vector_detection/preprocessing.py): src/predict/predictor.py
     (predict_full_pipeline) y notebooks/evaluation/pipeline.ipynb recortan la detección del
     YOLO y aplican Resize(256)+CenterCrop(224) antes de clasificar. Pero
     src/training/trainer.py (train_classifier/_get_classification_transforms) y
     src/predict/predictor.py (predict_classifier, la función que generó el accuracy=0.981
     oficialmente reportado) entrenan/evalúan el clasificador con un Resize((224,224)) plano,
     SIN CenterCrop, sobre imágenes que data_processing/preprocess.py ya había recortado con
     10% de padding y reescalado a 224x224. La memoria (sección 'Mecanismo de Inferencia')
     dice que la inferencia usa 'el mismo preprocesado... utilizado en el entrenamiento', lo
     cual técnicamente describe la rama SIN CenterCrop — pero el único ejemplo end-to-end
     realmente entregado (test.jpg/test_results.json) fue generado con la rama CON CenterCrop,
     y el accuracy=0.981 oficial NUNCA evaluó el pipeline completo (detección+recorte+
     clasificación) — solo el clasificador en aislado sobre imágenes ya preprocesadas (memoria,
     sección 'Evidencias de Resultados': '...no se ha podido hacer una evaluación exhaustiva
     del [pipeline completo] debido a la falta de datos'). El plugin integrado replica
     Resize(256)+CenterCrop(224) para predict_inline/predict_batch (matchea el único golden
     case real disponible) y mantiene el Resize plano SOLO para medir val_accuracy durante su
     propio train() (replicando train_classifier), documentando ambas decisiones en el código.
     Riesgo residual: el accuracy=0.981 reportado en la memoria no es representativo de lo que
     el pipeline completo (con CenterCrop) realmente entrega en producción.
     ACTUALIZACIÓN CICLO 3 (2026-10-05): con los 3 datasets reales ya presentes, esa brecha
     dejó de ser una sospecha sin cuantificar — se midió directamente (ver
     metrics_reported.pipeline_completo_medido_ciclo3): el pipeline completo (detector+crop+
     clasificador, exactamente la ruta de predict_inline/predict_batch) obtiene accuracy=0.9494
     (394/415) sobre el split de test real reproducido, claramente por debajo del 0.981/0.990
     reportados para el clasificador aislado — y con una caída mucho más marcada en 'mos'
     (0.8673, 6/98 sin ninguna detección del YOLO por encima de det_conf_thresh=0.2 default).
     Esto confirma, con datos reales, que el riesgo documentado en el ciclo 1 era real y no
     solo teórico — ver el caveat de reproducibilidad del split en metrics_reported sobre por
     qué esta cifra debe leerse como medición de wiring/correctitud, no como benchmark de
     generalización estricto."
  - "Los JSON de métricas incluidos en el código entregado (models/detection/metrics/
     detection_metrics.json: mAP50=0.885, recall=0.818; models/classification/metrics/
     classification_metrics.json: accuracy=0.990) NO coinciden con los valores reportados en la
     memoria (mAP50=0.790, recall=0.710, accuracy=0.981) — probablemente artefactos de un
     reentrenamiento posterior a la redacción de la memoria v2.0. Se usa la tabla de la memoria
     como metrics_reported (fuente auditada), pero el golden_case real (test.jpg) se compara
     contra el comportamiento real de los artefactos vendorizados, que corresponden a los JSON
     en disco, no a la tabla de la memoria."
  - "SUPERADO EN EL CICLO 3 (2026-10-05): en los ciclos 1-2, el entrenamiento end-to-end
     (detector + clasificador) requería 3 datasets públicos externos (Roboflow x2, Kaggle x1,
     con registro) que NO venían incluidos en el ZIP entregado — solo los artefactos ya
