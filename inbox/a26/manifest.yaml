model_id: ml26_wine_sulfite_gru_pso_forecast
sector: vitivinicola
nombre: "Desarrollo de un modelo basado en DL y PSO para la optimización de costes operativos y producción"
# Título de la portada de la memoria. El nombre del fichero .docx dice "basado en algoritmos PSO"
# (sin "DL y"); se toma el de la portada/tabla de identificación. Acrónimo: PSODL-OP.
acronimo: PSODL-OP
task_type: timeseries_regression_multitask  # GRU bidireccional multitarea: 2 salidas continuas a 72 h sobre ventanas de 24 pasos x 22 features
task_type_note: >
  A pesar del título ("optimización de costes"), el modelo NO es prescriptivo: no hay optimizador
  de dosis ni de costes en inferencia. PSO se usa exclusivamente en ENTRENAMIENTO para buscar
  hiperparámetros de la GRU (src/training/models/train_sequence_pso.py). El README y MODEL_CARD
  lo dicen explícitamente: "el coste operativo se trata como contexto del caso de uso, no como una
  salida directa del modelo". [C] README.md, [M] §1, §2.
endpoint_id: ml26-wine-sulfite-gru-pso-forecast

framework:
  # [C] inbox/a26/codigo/requirements.txt — ASCII/LF (encoding correcto, sin BOM), versiones fijadas (==)
  - torch==2.9.1
  - numpy==2.3.5
  - pandas==2.3.3
  - scikit-learn==1.8.0
  - scipy==1.16.3
  - joblib==1.5.2
  - PyYAML==6.0.3
  - pydantic==2.12.0
  # matplotlib/cycler/kiwisolver/nbformat/nbclient solo se usan en EDA — no son dependencias de inferencia.
  # Entorno de desarrollo del equipo de IA: Python 3.12.3 [M] §4.3 (pyproject exige >=3.11).

artifacts:
  folder: models/artifacts/
  files:
    - gru_pso.pkl        # SequenceBundle pickled (dataclass de src.training.models.train_sequence): model_state (state_dict torch),
                         # feature_names (22), target_names (2), mean/std shape (1,22) (z-score por feature sobre train),
                         # y_mean/y_std (2), config (hiperparámetros finales). Se deserializa con un Unpickler que remapea
                         # torch.storage._load_from_bytes a map_location (src/training/models/inference.py::_TorchDeviceUnpickler).
    - best_model.json    # registro de selección: best_model_name=gru_pso, feature_columns, target_columns, scores de validación
  not_served:
    # Artefactos de la comparativa (sección 5 de la memoria); no se sirven en el plugin.
    - gradient_boosting.pkl
    - gru.pkl
    - linear_regression.pkl
    - lstm.pkl
    - lstm_pso.pkl
    - mlp_pso.pkl
    - mlp_wide.pkl
    - random_forest.pkl
  pickle_dependency: >
    gru_pso.pkl es un pickle de la dataclass SequenceBundle definida en el módulo
    src.training.models.train_sequence del equipo de IA. Para deserializarlo el plugin necesita
    que el nombre de clase resuelva → hay que vendorizar la definición (o remapear el módulo en
    un Unpickler propio, como ya hace el original con torch.storage). No es un .pt/state_dict puro.
  model_config:  # [A] models/metrics/gru_pso.json::model_config == [M] v2.5 Tabla 13 (v2.3: Tabla 7)
    architecture: GRUMultiTaskRegressor  # GRU → AttentionPooling → LayerNorm → Linear → ReLU → Dropout → Linear(2)
    input_dim: 22
    hidden_dim: 96
    num_layers: 2
    bidirectional: true
    dropout: 0.08727378740381384
    head_dropout: 0.1056194063836242
    output_dim: 2

inputs:
  # Modo operativo [M] §4.2 / §8.2, [C] src/predict/raw_inputs.py: dos tablas crudas.
  lot:  # "lote.csv" — una fila por depósito. Todas obligatorias ([C] LOT_COLUMNS)
    - {name: lot_id, type: string, description: "Identificador del lote/depósito"}
    - {name: wine_type, type: categorical, values: [red, rose, white], description: "Tipo de vino"}
    - {name: volume_l, type: float, unit: L, description: "Volumen del depósito", train_range: [2512.37, 14982.62]}
    - {name: ambient_temp_c, type: float, unit: "°C", description: "Temperatura ambiente de la bodega", train_range: [10.01, 27.98]}
  readings:  # "lecturas.csv" — serie temporal @2h por lote
    required:  # [C] READING_COLUMNS (+ timestamp, que la memoria §4.2 lista como obligatoria aunque el código la trata como opcional)
      - {name: lot_id, type: string}
      - {name: timestamp, type: datetime, description: "Marca temporal de la lectura; paso nominal de 2 h"}
      - {name: stage, type: categorical, values: [must, fermentation, stabilization, storage, pre_bottling]}
      - {name: temperature_c, type: float, unit: "°C", train_range: [10.61, 28.44]}
      - {name: dissolved_oxygen_mg_l, type: float, unit: "mg/L", train_range: [0.05, 7.0]}
      - {name: density_g_ml, type: float, unit: "g/mL", train_range: [0.9943, 1.1131]}
      - {name: co2_g_l, type: float, unit: "g/L", train_range: [0.0, 2.3525]}
      - name: stage_progress
        type: float
        range: [0, 1]
        mandatory_by_decision: true   # decisión del usuario 2026-09-29 (KI-01)
        description: >
          Avance de la etapa de la lectura (0 = inicio, 1 = fin). No figura como obligatoria en README ni en memoria
          §4.2, pero el modelo auditado se entrenó con ella y el fallback del código entregado para cuando falta
          triplica el error. Se exige en todas las lecturas; con ella el preprocesado original del equipo de IA
          (sin cambios) reproduce exactamente las ventanas de entrenamiento.
    optional:  # [C] OPTIONAL_READING_COLUMNS
      - {name: timestamp_index, type: int, description: "Índice del paso; si falta se calcula por orden de timestamp dentro del lote"}
      - {name: ph_lab, type: float, unit: pH, train_range: [3.0017, 3.7942], description: "Solo en filas con analítica; vacío entre muestras (se arrastra el último valor)"}
      - {name: free_sulfite_lab, type: float, unit: "mg/L", train_range: [2.34, 55.01]}
      - {name: total_sulfite_lab, type: float, unit: "mg/L", train_range: [9.76, 143.98]}
      - {name: dose_mg_l, type: float, unit: "mg/L", train_range: [0.0, 10.53], description: "Dosis de SO2 añadida en ese paso (alias actual_dose_mg_l)"}
  constraints:
    stage_progress_required_on_every_reading: true   # KI-01
    min_readings_per_lot: 24   # [C] _latest_sequence_windows; [M] §4.2 "mínimo de 24 filas consecutivas" (48 h)
    lot_id_must_exist_in_lot_table: true  # [C] load_raw_inference_frame lanza ValueError
  derived_if_missing:  # [C] feature_engineering.py — el usuario NO las aporta
    stage_progress: "NO se deriva: es obligatoria (KI-01). El fallback original cumcount/(count-1) no se usa."
    hours_since_last_lab: "(timestamp_index - índice de la última fila con analítica) * 2.0"
    lab_sample: "1 si la fila trae alguna de ph_lab/free_sulfite_lab/total_sulfite_lab"
    last_so2_addition_mg_l: "última dosis > 0 anterior a la fila (desplazada 1 paso), ffill; 0 si no hay"
    hours_since_last_addition: "(timestamp_index - índice de la última dosis) * 2.0; si no hubo dosis = timestamp_index*2"
    lab_values: "ffill + bfill por lote de ph_lab/free_sulfite_lab/total_sulfite_lab; mediana del frame si todo el lote viene vacío"
    one_hot: "wine_type_{red,rose,white}, stage_{fermentation,must,pre_bottling,stabilization,storage} con niveles fijos de config.yaml"
  model_features:  # [A] best_model.json::feature_columns — orden exacto del tensor (24, 22)
    - volume_l
    - ambient_temp_c
    - stage_progress
    - hours_since_last_lab
    - last_so2_addition_mg_l
    - hours_since_last_addition
    - temperature_c
    - dissolved_oxygen_mg_l
    - density_g_ml
    - co2_g_l
    - ph_lab
    - free_sulfite_lab
    - total_sulfite_lab
    - lab_sample
    - wine_type_red
    - wine_type_rose
    - wine_type_white
    - stage_fermentation
    - stage_must
    - stage_pre_bottling
    - stage_stabilization
    - stage_storage
  window:
    length: 24          # pasos (48 h) [C] config.yaml preprocessing.sequential_window
    step_hours: 2
    selection: "últimas 24 filas del lote tras el feature engineering (una predicción por lote)"
  reproducibility_mode: >
    [M] §4.2: además se aceptan ventanas ya procesadas (n, 24, 22) (data/splits/test_seq_X.npy) SOLO para
    evaluación técnica. El plugin lo expone como entrada alternativa `feature_window` para poder
    verificar el modelo aislado del feature engineering.

outputs:
  predict_inline:  # una fila por lote
    - {name: lot_id, type: string}
    - {name: timestamp, type: string, description: "timestamp de la última lectura usada (instante de predicción)"}
    - {name: timestamp_index, type: int}
    - {name: future_free_sulfite_72h, type: float, unit: "mg/L", description: "SO2 libre esperado dentro de 72 h"}
    - {name: underprotection_risk_72h, type: float, range: [0, 1], description: "Score de riesgo de infraprotección a 72 h (no es probabilidad calibrada)"}
  postprocess:
    - "underprotection_risk_72h se recorta a [0, 1] (clip) [C] src/utils/target_constraints.py; [M] §2"
    - "redondeo a 6 decimales [C] src/predict/postprocess.py::format_output"
  derived_for_platform:
    risk_band:
      source: "[M] v2.5 §7.1 (párrafo antes de Tabla 15) == [C] notebooks/EDA/eda.ipynb::risk_band (no está en src/)"
      rule: "bajo si < 0.33; medio si < 0.66; alto en otro caso"

training:
  supported: true
  # [C] scripts/train.py → src/training/trainer.py::train → train_sequence_pso (búsqueda) → train_sequence_with_config (final)
  target_column: free_sulfite_mg_l
  target_note: >
    Los dos targets NO vienen en el CSV: se DERIVAN en build_feature_frame(include_targets=True):
    future_free_sulfite_72h = free_sulfite_mg_l desplazado 36 pasos por lote;
    underprotection_risk_72h = estimate_underprotection_risk(...) sobre el estado futuro (src/utils/enology.py).
    free_sulfite_mg_l es el SO2 libre "real" continuo del simulador (no la analítica free_sulfite_lab).
    En datos reales de bodega este valor continuo no existe — ver known_issues.
  targets_derived: [future_free_sulfite_72h, underprotection_risk_72h]
  required_columns:
    hard_required: [lot_id, timestamp_index, wine_type, volume_l, ambient_temp_c, stage, temperature_c,
                    dissolved_oxygen_mg_l, density_g_ml, co2_g_l, free_sulfite_mg_l, stage_progress]
    recommended: [ph_lab, free_sulfite_lab, total_sulfite_lab, actual_dose_mg_l, hours_since_last_lab,
                  lab_sample, target_only, timestamp]
    source: codigo_entrenamiento  # [C] feature_engineering.py::_ensure_required_columns + _add_prediction_targets
    note: "Formato = data/raw/sequential.csv.gz (filas target_only=True se usan solo para construir targets)"
  split:
    strategy: hold-out por lot_id  # [C] splitters.py; [M] §6.3
    train: 0.70
    val: 0.15
    test: 0.15
    seed: 42   # experiment.seed
  hyperparams:
    # [C] config/config.yaml models.gru_pso + [A] models/metrics/gru_pso.json::model_config + [M] v2.5 Tablas 13/14 (coinciden)
    final_model:
      hidden_dim: 96
      num_layers: 2
      bidirectional: true
      dropout: 0.08727378740381384
      head_dropout: 0.1056194063836242
      batch_size: 128
      learning_rate: 0.0005201905904619833
      weight_decay: 0.0004632265626210997
      epochs: 40
      patience: 8
      lr_patience: 2
      lr_decay_factor: 0.5
      gradient_clip: 1.0
      optimizer: AdamW
      loss: SmoothL1Loss
      scheduler: ReduceLROnPlateau(mode=min, sobre val_rmse)
      normalization: "z-score de X por feature (media/std sobre train, eje (0,1)) y z-score de y"
      seed: 7    # training.seed
    window: 24
    stride: 2
    horizon_hours: 72
    pso_search:  # [M] v2.5 Tabla 14; [C] config.yaml models.gru_pso
      particles: 4
      iterations: 3
      search_repeats: 2
      inertia: 0.72
      cognitive: 1.4
      social: 1.4
      velocity_clip: 0.22
      search_epochs: 14
      search_patience: 4
      objective: overall_rmse de validación
      search_space:
        hidden_dim: {min: 64, max: 160, step: 32}
        num_layers: {min: 1, max: 3}
        dropout: {min: 0.05, max: 0.25}
        head_dropout: {min: 0.05, max: 0.25}
        learning_rate: {min: 0.0003, max: 0.002, scale: log}
        weight_decay: {min: 0.00001, max: 0.001, scale: log}
        batch_size_choices: [64, 128]
        bidirectional: [false, true]
  metrics_returned: [val_rmse_future_free_sulfite_72h, val_mae_future_free_sulfite_72h,
                     val_rmse_underprotection_risk_72h, val_mae_underprotection_risk_72h, val_overall_rmse, val_overall_mae]
  source: codigo_entrenamiento

constraints: {}
  # No hay restricciones duras de negocio tipo "PU >= 13". La única regla de salida es el clip del
  # riesgo a [0,1], que es postproceso, no restricción. Las reglas de entrada (>=24 lecturas por lote,
  # lot_id presente en la tabla de lotes) son validación de datos → excepción de dominio de historial
  # insuficiente, no restricción de negocio.

metrics_reported:
  dataset: test_hold_out   # 90 lotes sintéticos, 3096 ventanas
  split: 70/15/15 por lot_id
  random_seed: 42
  n_samples_test: 3096
  source: "[A] models/metrics/gru_pso.json::test == [M] v2.5 Tabla 17 (v2.3: Tabla 11)"
  future_free_sulfite_72h: {rmse: 1.9765176202795756, mae: 1.5082366133845129, mape: 0.06731495206479939}
  underprotection_risk_72h: {rmse: 0.06424548422487465, mae: 0.042862378850155716, mape: 0.10698414475909705}
  overall_rmse: 1.3983471288487184
  overall_mae: 0.7755494961173343
  validation:  # [M] v2.5 Tabla 16
    future_free_sulfite_72h: {rmse: 2.2117815520515447, mae: 1.6083012676848902}
    underprotection_risk_72h: {rmse: 0.06908080743786876, mae: 0.04565301889102895}
    overall_rmse: 1.564728377698793
  operational_test:  # [M] v2.5 Tabla 18 / [A] notebooks/EDA/tables/risk_priority_kpi.csv
    so2_within_2mg_l: 0.716
    so2_within_3mg_l: 0.876
    risk_within_0_15: 0.955
    risk_within_0_20: 0.983
    recall_riesgo_alto: 0.9247842170160296
    precision_riesgo_alto: 0.9386733416770964
    acierto_banda_exacta: 0.8746770025839793
    misma_o_banda_contigua: 0.9996770025839793   # la memoria lo redondea a "100,0 %"
    kpi_objetivo_recall_riesgo_alto: 0.85
  success_criteria:  # [M] v2.5 Tabla 15 (== v2.3 Tabla 9; umbrales en controles de contenido w:sdt — ver KI-06)
    nivel_1_recall_riesgo_alto_min: 0.85
    nivel_2_precision_riesgo_alto_min: 0.85
    nivel_3_so2_within_3mg_l_min: 0.85
    nivel_4_risk_rmse_max: 0.10
    nivel_4_risk_mae_max: 0.06
    nivel_5: "RMSE validación < linear_regression"
    nivel_6: "RMSE validación < random_forest"
    nivel_7: "RMSE gru_pso < RMSE gru"
  synthetic_data: true  # TODAS las métricas son sobre datos sintéticos del simulador — validación con datos reales pendiente
  drift_alerts_recommended:  # [M] §10
    future_free_sulfite_72h: {rmse_max: 2.5, mae_max: 2.0}
    underprotection_risk_72h: {rmse_max: 0.10, mae_max: 0.06}
    recall_riesgo_alto_min: 0.85
    psi_max: 0.2
    psi_features: [free_sulfite_lab, total_sulfite_lab, dissolved_oxygen_mg_l, temperature_c, hours_since_last_lab]

tolerance_policy:
  # Dos niveles de comprobación por golden case:
  model_window:
    description: >
      Modo reproducibilidad: el plugin recibe la ventana procesada (24x22) de data/splits/test_seq_X.npy
      [sample_index] y debe reproducir la predicción del pipeline ORIGINAL (data/predictions/gru_pso_test_predictions.csv).
      Mide el modelo aislado (carga del artefacto + normalización + forward + desnormalización + clip).
    future_free_sulfite_72h_atol: 0.01     # mg/L — tolerancia numérica (float32, CPU vs versión de torch distinta)
    underprotection_risk_72h_atol: 0.001
  raw_pipeline:
    description: >
      Modo operativo: el plugin recibe lote + lecturas crudas (historial del lote hasta el instante t) y debe
      quedar a menos de 2 x MAE de test de la predicción de referencia. Tolerancia derivada de metrics_reported.
    future_free_sulfite_72h_atol: 3.0165   # 2 x 1.50824 mg/L
    underprotection_risk_72h_atol: 0.0857  # 2 x 0.042862

golden_cases:
  # 18 ventanas del split de TEST (data/splits/test_seq_X.npy, 90 lotes nunca vistos en train/PSO).
  # Selección determinista (numpy default_rng(42)): 1 ventana por (etapa final x banda de riesgo real)
  # + 5 ventanas aleatorias de lotes no cubiertos. No hay ventanas que terminen en 'must' (la etapa dura
  # 13-15 pasos < 24 de ventana). Cobertura: storage 5, stabilization 5, fermentation 4, pre_bottling 4;
  # red 7, rose 7, white 4; banda real alto 7, medio 6, bajo 5.
  # Mapeo sample_index -> (lot_id, timestamp_index) reconstruido desde data/splits/test.csv.gz con el mismo
  # algoritmo de dataset_builder._windows_for_split (window=24, stride=2): coincidencia exacta (diff 0.0) con test_seq_X.npy.
  #
  # expected.future_free_sulfite_72h / underprotection_risk_72h = predicción del pipeline ORIGINAL sobre la ventana
  #   procesada, tomada de data/predictions/gru_pso_test_predictions.csv (re-ejecutada con torch 2.9.1 CPU: diff <= 3e-6).
  # expected.orig_raw_no_stage_progress_* = salida del camino operativo ORIGINAL (src/predict/raw_inputs.py) con el
  #   historial del lote truncado en timestamp_index y SIN stage_progress (como lo aportaría una bodega). Informativo:
  #   documenta el sesgo train/serve del código original (ver known_issues) — permite distinguir wiring de modelo.
  # expected.y_true_* = target real de test_seq_y.npy (informativo, no se compara).
  #
  # input.readings_source: filas de data/raw/sequential.csv.gz con lot_id, target_only=False y
  #   timestamp_index <= window_end_timestamp_index, transformadas a 'modo bodega': ph_lab/free_sulfite_lab/
  #   total_sulfite_lab solo en filas lab_sample==1 (NaN en el resto), dose_mg_l = actual_dose_mg_l si > 0.
  #   Con stage_progress del simulador (obligatorio en el contrato). Sin él, la petición debe rechazarse (HTTP 422).
  - id: caso_001
    source: dataset_test_split
    input:
      sample_index: 151            # fila de data/splits/test_seq_X.npy (modo feature_window)
      lot_id: LOT-00013
      window_end_timestamp_index: 89
      window_end_timestamp: "2025-01-21 10:00:00+00:00"
      n_readings: 90               # historial completo del lote hasta el instante de predicción
      readings_source: data/raw/sequential.csv.gz
      lot: {wine_type: red, volume_l: 3228.784271, ambient_temp_c: 15.064910}
      raw_snapshot_ultima_fila: {stage: storage, stage_progress_simulador: 0.280000, temperature_c: 20.474645, dissolved_oxygen_mg_l: 1.370988, density_g_ml: 1.052152, co2_g_l: 0.050494, ph_lab: 3.512409, free_sulfite_lab: 20.741034}
    expected:
      future_free_sulfite_72h: 34.195343
      underprotection_risk_72h: 0.327868
      orig_raw_no_stage_progress_future_free_sulfite_72h: 17.275892
      orig_raw_no_stage_progress_underprotection_risk_72h: 0.899738
      y_true_future_free_sulfite_72h: 33.321178
      y_true_underprotection_risk_72h: 0.316666
      risk_band_real: bajo
    tolerance: {ref: tolerance_policy}

  - id: caso_002
    source: dataset_test_split
    input:
      sample_index: 272            # fila de data/splits/test_seq_X.npy (modo feature_window)
      lot_id: LOT-00042
      window_end_timestamp_index: 67
      window_end_timestamp: "2025-02-17 14:00:00+00:00"
      n_readings: 68               # historial completo del lote hasta el instante de predicción
      readings_source: data/raw/sequential.csv.gz
      lot: {wine_type: rose, volume_l: 14162.790270, ambient_temp_c: 24.478496}
      raw_snapshot_ultima_fila: {stage: storage, stage_progress_simulador: 0.578947, temperature_c: 18.095533, dissolved_oxygen_mg_l: 0.050000, density_g_ml: 1.052807, co2_g_l: 0.169478, ph_lab: 3.359196, free_sulfite_lab: 25.750583}
    expected:
      future_free_sulfite_72h: 21.993731
      underprotection_risk_72h: 0.755099
      orig_raw_no_stage_progress_future_free_sulfite_72h: 17.027012
      orig_raw_no_stage_progress_underprotection_risk_72h: 0.937553
      y_true_future_free_sulfite_72h: 20.047108
      y_true_underprotection_risk_72h: 0.834992
      risk_band_real: alto
    tolerance: {ref: tolerance_policy}

  - id: caso_003
    source: dataset_test_split
    input:
      sample_index: 290            # fila de data/splits/test_seq_X.npy (modo feature_window)
      lot_id: LOT-00049
      window_end_timestamp_index: 41
      window_end_timestamp: "2025-02-22 10:00:00+00:00"
      n_readings: 42               # historial completo del lote hasta el instante de predicción
      readings_source: data/raw/sequential.csv.gz
      lot: {wine_type: red, volume_l: 3167.274158, ambient_temp_c: 20.640589}
      raw_snapshot_ultima_fila: {stage: fermentation, stage_progress_simulador: 0.736842, temperature_c: 25.208238, dissolved_oxygen_mg_l: 0.267702, density_g_ml: 1.027576, co2_g_l: 1.023682, ph_lab: 3.480835, free_sulfite_lab: 12.370102}
    expected:
      future_free_sulfite_72h: 28.697739
      underprotection_risk_72h: 0.240347
      orig_raw_no_stage_progress_future_free_sulfite_72h: 28.997534
      orig_raw_no_stage_progress_underprotection_risk_72h: 0.282911
      y_true_future_free_sulfite_72h: 26.771704
      y_true_underprotection_risk_72h: 0.234985
      risk_band_real: bajo
    tolerance: {ref: tolerance_policy}

  - id: caso_004
    source: dataset_test_split
    input:
      sample_index: 406            # fila de data/splits/test_seq_X.npy (modo feature_window)
      lot_id: LOT-00065
