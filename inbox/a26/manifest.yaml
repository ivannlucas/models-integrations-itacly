operational_mode_impact:
  # [V] Por qué stage_progress es obligatorio. Medido por el agente re-ejecutando el código ORIGINAL (torch 2.9.1 CPU)
  # sobre las 3096 ventanas de test con el historial truncado en t (outputs/a26/evidence/a26_operational_impact.py).
  criterio_memoria_tabla15: {recall_alto_min: 0.85, precision_alto_min: 0.85, so2_within_3_min: 0.85, risk_rmse_max: 0.10, risk_mae_max: 0.06}
  con_stage_progress: "idéntico a metrics_reported (ventanas con diff 0.0); cumple los 4 criterios"
  sin_stage_progress_fallback_original:   # hoy se RECHAZA con 422; cifras solo como justificación
    future_free_sulfite_72h: {rmse: 6.9454, mae: 4.8172}
    underprotection_risk_72h: {rmse: 0.1703, mae: 0.1117}
    so2_within_3mg_l: 0.4855
    recall_riesgo_alto: 0.9815
    precision_riesgo_alto: 0.6952
    cumple_tabla15: {recall: true, precision: false, so2_within_3: false, risk: false}
  propuesta_aparcada: >
    Resolución de stage_progress en 3 niveles (aportado / duración prevista / duración típica) sin reentrenar el
    modelo: nivel 3 con MAE SO2 2.23 mg/L. No integrada porque cambia el preprocesado del modelo auditado; guardada en
    outputs/a26/propuesta_stage_progress_3_niveles/ para proponerla más adelante.

known_issues:
  - id: KI-01
    severity: media
    text: >
      stage_progress OBLIGATORIO (decisión del usuario 2026-09-29). El modelo auditado se entrenó con el stage_progress
      del simulador, que conoce la duración total de cada etapa. El fallback del código entregado para cuando falta
      (cumcount/(count-1) sobre el historial observado) deja la etapa en curso siempre en 1.0: MAE SO2 4.82 mg/L frente
      a 1.51 y precisión en riesgo alto 69.5 % frente a 93.9 % (incumple 3 de los 4 criterios de la Tabla 15). El modelo
      está aceptado por los auditores y no se reentrena, y el preprocesado original se mantiene SIN cambios; por eso el
      plugin exige stage_progress en todas las lecturas (inline, batch y /train) y rechaza con 422 si falta o está fuera
      de [0, 1]. Con él, el resultado es idéntico al auditado (18/18 golden cases, diff <= 4e-6). Consecuencia
      operativa: la bodega debe informar el avance de cada etapa. Propuesta alternativa aparcada en
      outputs/a26/propuesta_stage_progress_3_niveles/.
  - id: KI-02
    severity: alta
    text: >
      DATOS SINTÉTICOS — JUSTIFICADO. No existe ningún dataset público con este tipo de datos (lecturas de proceso,
      analítica y adiciones de SO2 por depósito son datos propios de cada bodega), por lo que el uso del simulador
      está justificado. Aun así, dataset, targets y métricas proceden del simulador (600 lotes) y no hay validación
      con históricos reales; underprotection_risk_72h es un score derivado de reglas del simulador, no una
      probabilidad calibrada. Toda cifra de negocio conserva la advertencia de validación con datos reales.
  - id: KI-03
    severity: media
    text: >
      REENTRENAMIENTO CON DATOS REALES — NO VIABLE, LIMITACIÓN ACEPTADA (decisión del usuario 2026-09-29). /train se
      mantiene con el formato de entrada actual (data/raw/sequential.csv.gz: lecturas + stage_progress +
      free_sulfite_mg_l) y genera un modelo de usuario aparte (desde 2026-10-08 solo en MLflow), no auditado; el modelo
      aceptado nunca se modifica. El target se deriva de free_sulfite_mg_l (SO2 libre continuo), que una bodega real no
      mide (solo analíticas puntuales), por lo que /train solo es aplicable a datos con ese formato (como los del
      simulador), no a históricos reales de bodega tal cual.
      [CORREGIDO 2026-10-08] Al integrar main en la rama de auditoría, ml26 se alinea con el contrato común de
      reentrenamiento: mlflow_run_id obligatorio (422 si falta o va vacío), el modelo reentrenado se guarda SOLO en
      MLflow (ya no en artifacts/.../user_trained/; TrainResponse devuelve mlflow_run_id en lugar de
      local_artifact_dir), un fallo de subida es 502 en vez de un aviso, y predict/stats con un run sin modelo cargable
      responden 422 en lugar de 500 (download_user_model_from_mlflow con @require_user_model y limpieza del temporal).
  - id: KI-04
    severity: media
    text: >
      train() del plugin reentrena la configuración FINAL de gru_pso (v2.5 Tabla 13) con train_sequence_with_config,
      pero NO repite la búsqueda PSO (4 partículas x 3 iteraciones x 2 repeticiones = hasta 24 entrenamientos
