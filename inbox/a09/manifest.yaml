# =============================================================================
# manifest.yaml — modelo a09
# Generado por el skill manifest-extraction el 2026-08-04.
#
# Fuentes de evidencia (toda afirmación de este fichero sale de una de ellas):
#   [C] inbox/a09/codigo/a09-del-cereals-el-clasificacion-objetos-anomalos/  (código entregado)
#   [A] .../models/artifacts/model_bundle_metadata.json + models/metrics/metrics_summary.json
#   [D] .../data/raw/dataset_infestacion_cereales_sintetico.csv + data/splits/model_test.csv
#   [M] inbox/a09/entregable/"9 - Desarrollo de un modelo de Ensemble learning ... v3.docx"
#   [R] ejecución local de referencia del pipeline entregado sobre el split de test (2026-08-04)
# Cualquier campo sin evidencia queda en null con el motivo en known_issues.
# =============================================================================

model_id: ml9_cereals_infestation_sequence_classifier
sector: cerealista
nombre: "Desarrollo de un modelo de Ensemble learning para la clasificación de objetos anómalos o infestaciones"
acronimo: INF-CER          # [M] Tabla 1
lote: 2                    # [M] Tabla 1
version_memoria: "3.0"     # [M] Tabla 1, fecha versión 13/07/2026

task_type: timeseries_classification
# Clasificación multiclase (3 clases) sobre ventanas deslizantes de 48 pasos horarios.
# OJO: el título administrativo dice "Ensemble learning", pero lo implementado y validado NO es un
# ensemble: se entrenan dos arquitecturas recurrentes candidatas (LSTM y GRU) y se sirve UNA sola,
# la ganadora por f1_macro de validación (GRU). La propia memoria lo reconoce ([M] §1, párrafo 5).
# Ver known_issues.discrepancia_titulo_vs_implementacion.

framework:
  # [C] requirements.txt — sin pin exacto, solo cotas inferiores (ver known_issues)
  - numpy>=1.26
  - pandas>=2.2
  - scikit-learn>=1.5
  - matplotlib>=3.8
  - PyYAML>=6.0
  - torch>=2.2
python_version: "3.12"   # [M] §9.1 y [C] README.md

# -----------------------------------------------------------------------------
# Artefactos
# -----------------------------------------------------------------------------
artifacts:
  folder: models/artifacts/
  files:
    - final_winner.pt              # checkpoint SERVIDO en inferencia (copia de gru_best.pt). 188 KB
    - gru_best.pt                  # mejor GRU de la búsqueda (hidden_size=96, dropout=0.1, wd=0.0)
    - lstm_best.pt                 # mejor LSTM (hidden_size=64, dropout=0.1, wd=1e-4). Trazabilidad, no se sirve
    - sequence_scaler.pkl          # StandardScaler ajustado SOLO con ventanas de train, aplicado plano (n*T, n_features)
    - model_bundle_metadata.json   # contrato: features (65, en orden), window_size/stride/label_mode,
                                   # sample_id de cada partición, ganador, snapshot de config
  metrics_entregadas:
    - models/metrics/metrics_summary.json   # métricas hold-out reales + chequeo de aceptación
    - models/metrics/reporte_modelo.md      # lectura legible de las mismas métricas
  checkpoint_contenido:
    # [C] src/training/sequential.py::train_sequence_model — lo que hay dentro del .pt
    model_type: gru
    model_config: {input_size: 65, hidden_size: 96, num_layers: 1, dropout: 0.1, bidirectional: false, num_classes: 3}
    training_params: {batch_size: 64, learning_rate: 0.001, weight_decay: 0.0, max_epochs: 15, patience: 4,
                     min_delta: 0.0001, grad_clip: 1.0}
  no_entregados:
    # Referenciados en [C] README.md §"Métricas"/§"Predicciones" y en [M] §9.4 pero AUSENTES del entregable.
    # Son regenerables ejecutando train.py/evaluate.py; no bloquean la integración (ver known_issues).
    - models/metrics/{lstm,gru}_class_report.csv
    - models/metrics/{lstm,gru}_search_summary.csv
    - models/metrics/{lstm,gru}_training_history.csv
    - models/metrics/model_comparison.csv
    - models/metrics/figures/*.png
    - data/predictions/*.csv
    - data/processed/*.csv

# -----------------------------------------------------------------------------
# Entradas
# -----------------------------------------------------------------------------
inputs:
  # [C] src/data_processing/preprocess.py::validate_and_normalize_input_frame + [M] §4.2.
  # La entrada NO es una fila aislada: es una serie temporal horaria por sample_id.
  fixed:
    - name: sample_id
      type: string
      description: "Identificador de la serie temporal (silo/lote monitorizado). Agrupa las observaciones; nunca se mezclan ventanas de sample_id distintos."
    - name: timestamp
      type: datetime
      description: "Marca temporal de la observación, frecuencia horaria. Debe parsear y no contener nulos."
    - name: co2_ppm
      type: float
      unit: ppm
      rango_observado_dataset: [350.0, 2542.9]   # [D] 144.000 filas del dataset sintético
      description: "Concentración de CO2 en el aire intersticial del grano almacenado."
    - name: temp_c
      type: float
      unit: "°C"
      rango_observado_dataset: [7.81, 37.22]
      description: "Temperatura del grano/ambiente de almacenamiento."
    - name: ambient_rh_pct
      type: float
      unit: "%"
      rango_observado_dataset: [24.58, 89.39]
      description: "Humedad relativa ambiental."
    - name: humidity_grain_pct
      type: float
      unit: "%"
      rango_observado_dataset: [11.27, 17.19]
      description: "Humedad del grano."

  solo_entrenamiento_y_evaluacion:
    - name: target
      type: int
      values: [0, 1, 2]
      description: "Etiqueta temporal POR OBSERVACIÓN (0=sano, 1=insectos, 2=moho_critico). Obligatoria en train/evaluate; en inferencia es opcional (si viene, se devuelve como y_true para comparación)."
    - name: target_global
      type: int
      values: [0, 1, 2]
      description: "Clase global con la que se generó la serie. Se usa SOLO para estratificar la partición por sample_id ([C] split_sample_ids_stratified); si falta, se cae a target."

  derived_if_missing: {}
  # No hay ningún campo que el pipeline calcule por defecto si falta: las 6 columnas de `fixed` son
  # obligatorias de facto y su ausencia produce ValueError explícito ("Faltan columnas requeridas en entrada").

  ignored_leakage_columns:
    # [C] config.yaml data.leakage_columns + metadatos del generador sintético. Nunca entran como feature;
    # si llegan en el CSV se ignoran (no rompen), pero no deben exigirse en producción.
    - step_idx
    - lag_hours
    - dataset_version
    - config_hash
    - phase_name
    - healthy_until_step
    - transition_to_insect_end_step
    - transition_to_moho_end_step

  window:
    # [C] config.yaml sequence.* + [A] model_bundle_metadata.json (el bundle manda sobre config en inferencia,
    # vía merge_runtime_config_with_bundle).
    window_size: 48            # 48 observaciones horarias = 48 h de histórico reciente
    stride: 12                 # 12 h entre ventanas consecutivas
    label_mode: last           # la etiqueta de la ventana es la del ÚLTIMO paso
    pad_short_sequences: false # una serie con < 48 filas NO genera ninguna ventana (no se rellena con ceros)
    min_filas_por_sample_id: 48
    ventanas_por_serie_de_480_filas: 37    # range(0, 480-48+1, 12) → 37 ventanas
    note: >
      El input funcional mínimo es un historial continuo de 48 observaciones horarias del mismo
      sample_id. No existe en el código entregado ningún modo de predicción "de una sola fila".
    historial_recomendado_note: >
      IMPORTANTE (verificado empíricamente [R]): las features derivadas (diff_1/3/6/24, slope_24h/48h,
      roll_mean_3/6/12/24, roll_std_6/24) se calculan con groupby().diff()/rolling() sobre TODAS las filas
      aportadas y solo después se recortan las ventanas. Por eso una misma ventana puede predecir distinto
      según si se alimenta la serie completa o solo sus 48 filas: al alimentar 48 filas sueltas, las
      primeras posiciones ven diffs/rollings truncados (rellenos a 0.0 / min_periods=1) y el efecto de borde
      se propaga. En un muestreo de 16 ventanas de test, 15/16 coincidieron y 1/16 cambió de clase
      (S_1_0046 ventana 22: insectos con serie completa → sano con ventana aislada). Para máxima fidelidad,
      el adaptador debe alimentar el mayor histórico disponible del sample_id, no solo las 48 filas mínimas.
      Ambos modos están cubiertos en golden_cases (input_mode: serie_completa | ventana_aislada_48_filas).

# -----------------------------------------------------------------------------
# Salidas
# -----------------------------------------------------------------------------
outputs:
  predict_inline:
    # Una fila de salida POR VENTANA válida ([C] src/predict/predictor.py::predict_with_bundle).
    - name: sample_id
      type: string
    - name: window_index
      type: int
      description: "Índice de la ventana dentro de la serie (0-based, en orden temporal)."
    - name: timestamp_start
      type: datetime
      description: "Timestamp de la primera observación de la ventana."
    - name: timestamp_end
      type: datetime
      description: "Timestamp de la última observación de la ventana (instante al que se refiere la clase)."
    - name: pred_class
      type: int
      values: [0, 1, 2]
      description: "Clase predicha para la ventana (argmax de las probabilidades)."
    - name: pred_label
      type: string
      values: [sano, insectos, moho_critico]
      description: "Nombre legible de la clase. [C] src/training/sequential.py::LABEL_NAMES."
    - name: proba_sano
      type: float
      description: "Probabilidad softmax de la clase 0 (columna proba_0 en el CSV original)."
    - name: proba_insectos
      type: float
      description: "Probabilidad softmax de la clase 1 (proba_1)."
    - name: proba_moho_critico
      type: float
      description: "Probabilidad softmax de la clase 2 (proba_2)."
    - name: y_true
      type: int
      nullable: true
      description: "Etiqueta real de la ventana; solo se emite si la entrada trae la columna target."
  metadatos_ventana_disponibles:
    # [C] build_sliding_windows() genera además estos campos de trazabilidad en window_meta
    [start_pos, end_pos, window_size, stride, label_mode, window_label]
  postproceso_negocio: null
  # No existe ninguna capa de reglas de negocio sobre la salida del modelo. El código de postproceso
  # ([C] src/predict/postprocess.py::format_output) solo reordena y ordena columnas. Los umbrales de
  # config.yaml sequence.acceptance_thresholds son criterios de aceptación de EVALUACIÓN, no reglas
  # de inferencia ([M] §7.1).

# -----------------------------------------------------------------------------
# Entrenamiento / reentrenamiento por usuario
# -----------------------------------------------------------------------------
training:
  supported: true
  # Evidencia: [C] scripts/train.py → src/main.py::train → src/training/trainer.py::train_pipeline.
  # El entregable incluye pipeline de entrenamiento completo y reproducible sobre un CSV de serie temporal.
  target_column: target        # [C] config.yaml data.target_column; exigido por validate_and_normalize_input_frame(require_target=True)
  split_target_column: target_global   # [C] config.yaml data.split_target_column — estratifica la partición por sample_id
  required_columns:
    hard_required: [sample_id, timestamp, co2_ppm, temp_c, ambient_rh_pct, humidity_grain_pct, target]
    recommended: [target_global]   # sin ella, la estratificación de la partición cae a `target` (etiqueta temporal)
    source: codigo_entrenamiento   # [C] src/data_processing/preprocess.py::validate_and_normalize_input_frame
  hyperparams:
    # [C] config/config.yaml (idéntico al config_snapshot persistido en [A] model_bundle_metadata.json)
    random_state: 42
    device: cuda
    fallback_to_cpu: true
    holdout_frac: 0.2
    validation_frac: 0.15
    window_size: 48
    stride: 12
    label_mode: last
    selection_metric: f1_macro
    max_epochs: 15
    patience: 4
    min_delta: 0.0001
    grad_clip: 1.0
    eval_batch_size: 128
    quick_search_trials: 1        # solo aplica en modo quick
    optimizer: AdamW              # [C] src/training/sequential.py::train_sequence_model
    loss: CrossEntropyLoss        # con class_weights balanceados por frecuencia de clase en train
    search_grid:
      # Idéntico para LSTM y GRU → 8 combinaciones por arquitectura, 16 entrenamientos por ejecución completa
      hidden_size: [64, 96]
      num_layers: [1]
      dropout: [0.1, 0.25]
      bidirectional: [false]
      batch_size: [64]
      learning_rate: [0.001]
      weight_decay: [0.0, 0.0001]
    mejores_encontrados:
      lstm: {hidden_size: 64, dropout: 0.1, num_layers: 1, batch_size: 64, learning_rate: 0.001, weight_decay: 0.0001}
      gru:  {hidden_size: 96, dropout: 0.1, num_layers: 1, batch_size: 64, learning_rate: 0.001, weight_decay: 0.0}
      source: memoria_seccion_6_2   # [M] §6.2, coherente con [A] validation_scores
  metrics_returned:
    - accuracy
    - balanced_accuracy
    - f1_macro
    - precision_macro
    - recall_macro
    - log_loss
  tipo: reentrenamiento_completo
  note: >
    train() reentrena DESDE CERO ambas arquitecturas sobre el CSV aportado: reconstruye features y
    ventanas, reparticiona por sample_id (estratificado por target_global, seed 42), reajusta el
    StandardScaler con las ventanas de train, ejecuta la búsqueda de 8+8 combinaciones y reselecciona
    el ganador por f1_macro de validación. NO es fine-tuning incremental sobre final_winner.pt: los
    pesos previos no se reutilizan. Coste: 16 entrenamientos de hasta 15 épocas (con early stopping).
  requisitos_datos_minimos:
    - "≥ 3 sample_id por clase de split_target_column, o ValueError explícito ([C] split_sample_ids_stratified)."
    - "≥ 48 filas por sample_id para que la serie genere alguna ventana."
    - "Las tres particiones deben acabar con al menos una ventana, o ValueError ([C] train_pipeline)."

# -----------------------------------------------------------------------------
# Restricciones duras
# -----------------------------------------------------------------------------
constraints:
  historial_minimo:
    regla: "Todo sample_id debe aportar ≥ 48 observaciones horarias consecutivas; con menos no se genera ninguna ventana (pad_short_sequences=false)."
    fuente: "[C] build_sliding_windows() + [M] §4.2, §8.2"
    implicacion_integracion: >
      Si NINGÚN sample_id de la petición alcanza 48 filas, el pipeline devuelve 0 predicciones en
      silencio. Eso debe convertirse en un error de dominio explícito en el plugin, no en una
      respuesta vacía. Es la única restricción dura propia de este modelo.
  alineacion_de_features:
    regla: "Las 65 features derivadas deben coincidir exactamente, en nombre y orden, con feature_columns del bundle."
    fuente: "[C] src/utils/model_bundle.py::align_feature_columns (ValueError si falta o sobra alguna)"
  sin_restriccion_de_negocio_tipo_umbral: true
  # A diferencia de a35 (PU>=13) o a34 (seguridad térmica), este modelo NO tiene ninguna restricción de
  # negocio que invalide una predicción. No procede una excepción de dominio por ese motivo.

# -----------------------------------------------------------------------------
# Métricas declaradas — hold-out del modelo servido (GRU)
# -----------------------------------------------------------------------------
metrics_reported:
  fuente_primaria: "[A] models/metrics/metrics_summary.json"
  coincide_con_memoria: true     # [M] §5.1, §7.2 y [C] reporte_modelo.md dan exactamente las mismas cifras
  reproducido_localmente: true   # [R] ejecución de referencia 2026-08-04: coincidencia exacta (log_loss dif 1.0e-8)
  modelo_servido: gru
  dataset: holdout_test_split
  n_windows_test: 2220
  n_series_test: 60              # de 300 series totales (20%), 20 por clase global
  window:
    accuracy: 0.9414414414414415
    balanced_accuracy: 0.9452017539713365
    f1_macro: 0.9435867107634568
    precision_macro: 0.9422346311104768
    recall_macro: 0.9452017539713365
    log_loss: 0.18301969799876203
  por_clase:                     # [M] §7.2, confirmado en [R]
    sano:         {precision: 0.9476, recall: 0.9360, f1: 0.9418, support: 812}
    insectos:     {precision: 0.9250, recall: 0.9111, f1: 0.9180, support: 799}
    moho_critico: {precision: 0.9540, recall: 0.9885, f1: 0.9710, support: 609}
  alternativa_no_servida_lstm:
    accuracy: 0.9301801801801802
    balanced_accuracy: 0.9346119225386413
    f1_macro: 0.93276291939956
    precision_macro: 0.9312766043202916
    recall_macro: 0.9346119225386413
    log_loss: 0.20966702054827122
  validacion_interna:            # [A] validation_scores — base de la selección del ganador
    lstm_f1_macro: 0.9466489297916768
    gru_f1_macro: 0.9542940099898926
  acceptance_thresholds:         # [C] config.yaml sequence.acceptance_thresholds — cumplidos todos
    f1_macro_min: 0.9
    recall_macro_min: 0.9
    accuracy_min: 0.9
    log_loss_max: 0.2
    class_recall_min: {moho_critico: 0.95}
    overall_passed: true
  advertencia_datos_sinteticos: >
    Todas estas cifras proceden de un hold-out del dataset SINTÉTICO generado internamente
    ([M] §3.2, §10). Acreditan la consistencia del pipeline en un escenario controlado; NO acreditan
    rendimiento sobre cereal real. Cualquier cifra de negocio derivada de ellas queda pendiente de
    validación con datos reales de operación.
  tolerancia_derivada_para_verificacion:
    # Los golden_cases verifican reproducibilidad numérica del checkpoint (no acierto del modelo, que
    # ya está medido arriba). Por eso la tolerancia es de aritmética float32, no de métrica.
    float_rtol: 1.0e-4
    class_exact: true
    justificacion: >
      Inferencia determinista en CPU (model.eval(), sin dropout activo, sin muestreo). En la ejecución
      de referencia [R] la desviación observada frente a las métricas declaradas fue ≤ 1.0e-8. Un rtol
      de 1e-4 absorbe diferencias de versión de BLAS/torch sin ocultar un error real de portado.

# -----------------------------------------------------------------------------
# Dataset (contexto para verificación y fichas)
# -----------------------------------------------------------------------------
dataset:
  nombre: dataset_infestacion_cereales_sintetico
  naturaleza: sintetico
  version: synth_v_9858f137e755        # [D] columna dataset_version
  n_filas: 144000
  n_series: 300                        # 100 por clase global
  filas_por_serie: 480                 # 20 días × frecuencia horaria
  frecuencia: 1h
  inicio: "2026-01-01"
  seed_generacion: 42
  distribucion_target_temporal: {sano: 59947, insectos: 47983, moho_critico: 36070}
  distribucion_target_global: {sano: 48000, insectos: 48000, moho_critico: 48000}
  particion:
    tipo: por_sample_id_estratificada_sin_fuga
    train_series: 195
    validation_series: 45
    test_series: 60
    ficheros: [data/splits/model_train.csv, data/splits/model_validation.csv, data/splits/model_test.csv]
  nota_etiquetado: >
    Las series de clase global insectos/moho_critico incorporan una fase inicial SANA y una transición
    progresiva, por lo que contienen ventanas con target=0 ([M] §3.1). En el split de test: 62 ventanas
    con y_true=0 pertenecen a series de clase global 1, y 10 a series de clase global 2. La unidad de
    decisión es la ventana, no la serie.

# =============================================================================
# known_issues
# =============================================================================
known_issues:
  - id: discrepancia_titulo_vs_implementacion
    severidad: media
    descripcion: >
      El título del entregable habla de "Ensemble learning", pero el sistema implementado y validado
      no combina modelos: entrena LSTM y GRU por separado y sirve solo el ganador por f1_macro de
      validación (GRU). No hay voting, stacking, blending ni promediado de probabilidades en ningún
      punto del código.
    evidencia: "[C] src/training/trainer.py (selección por comparación + shutil.copy2 del ganador a final_winner.pt)"
    resuelto: >
      No es un conflicto memoria-vs-código oculto: la propia memoria lo declara explícitamente en §1
      ("aunque se mantiene la denominación formal del entregable por continuidad administrativa, la
      solución implementada y validada en esta versión es un pipeline secuencial de clasificación por
      ventanas temporales"). Se integra lo que hace el código. Las fichas deben reflejar el título
      administrativo pero describir la arquitectura real.
    requiere_decision_humana: false

  - id: validacion_solo_sobre_datos_sinteticos
    severidad: alta
    descripcion: >
      El 100% de la evidencia de rendimiento procede de un dataset sintético generado internamente por
      el propio equipo, con las mismas reglas que producen las etiquetas y las señales. La separación
      entre clases es previsiblemente más regular que en una instalación real.
    evidencia: "[M] §3.2, §10; [C] src/data_processing/synthetic_dataset.py"
    implicacion: >
      Toda cifra de rendimiento o de negocio (f1_macro=0.9436, recall moho_critico=0.9885, ahorros
      esperados, etc.) debe publicarse con la advertencia de validación pendiente con datos reales.
    requiere_decision_humana: false

  - id: sensibilidad_al_historial_aportado
    severidad: media
    descripcion: >
      La predicción de una ventana concreta depende de cuántas filas se aporten alrededor, porque las
      features derivadas se calculan sobre todo el frame recibido antes de recortar ventanas. Alimentar
      solo las 48 filas mínimas produce features truncadas en las primeras posiciones.
    evidencia: >
      [R] muestreo de 16 ventanas de test: 15/16 predicen igual con serie completa y con ventana
      aislada; 1/16 cambia de clase (S_1_0046 ventana 22, insectos → sano).
    implicacion: >
      El plugin debe aceptar y aprovechar todo el histórico que llegue en la petición, y la ficha
      técnica debe documentar que 48 filas es el mínimo operativo, no el óptimo. Cubierto por los
      golden_cases caso_iso_00X.
    requiere_decision_humana: false

  - id: scaler_pickled_con_sklearn_superior
    severidad: baja
    descripcion: >
      sequence_scaler.pkl fue serializado con scikit-learn 1.8.0. Al cargarlo con 1.7.0 (entorno local)
      sklearn emite InconsistentVersionWarning. Las predicciones se reprodujeron exactas de todas formas
      ([R] métricas idénticas a las declaradas), pero es un riesgo de reproducibilidad a futuro.
    implicacion: "Fijar el rango de scikit-learn del plugin y no regenerar el .pkl sin reentrenar."
    requiere_decision_humana: false

  - id: requirements_sin_pin_exacto
    severidad: baja
    descripcion: >
      requirements.txt solo declara cotas inferiores (torch>=2.2, scikit-learn>=1.5, ...), sin versiones
      exactas ni lockfile, lo que impide reproducir bit a bit el entorno de entrenamiento.
      Encoding comprobado: ASCII/LF correcto (NO viene en UTF-16LE, al contrario que otros modelos del lote).
      README.md sí lleva BOM UTF-8, sin impacto funcional.
    requiere_decision_humana: false

  - id: artefactos_de_metricas_ausentes
    severidad: baja
    descripcion: >
      El README ([C]) y la memoria ([M] §9.4) inventarian ficheros de evidencia que no vienen en el
      entregable: los class_report/search_summary/training_history por arquitectura, model_comparison.csv,
      las 6 figuras PNG, data/predictions/*.csv y data/processed/*.csv. La memoria misma advierte
      ([M] §9.4, §224) que "deben versionarse antes de la entrega".
    implicacion: >
      Las cifras por clase de la ficha técnica no se pueden leer de un CSV entregado; se han reproducido
      localmente [R] y coinciden con [M] §7.2 al cuarto decimal. Los desglosados por trial
      (search_summary) no son verificables: se aceptan los de [M] §6.2 como declarados.
    requiere_decision_humana: false

  - id: mojibake_en_cadenas_de_error_del_codigo_entregado
    severidad: baja
    descripcion: >
      Dos mensajes de error del código entregado tienen la codificación corrupta:
      "Entrada de inferencia invaÂ´lida" ([C] src/predict/predictor.py, validate_inference_input_columns)
      y "contiene valores no vÃ¡lidos" ([C] src/data_processing/preprocess.py, rama split_target_column).
    implicacion: "En el plugin se reescriben en UTF-8 correcto; no se replica el mojibake."
    requiere_decision_humana: false

  - id: dos_metricas_llamadas_best_model_metric
    severidad: baja
    descripcion: >
      model_bundle_metadata.json declara best_model_metric=0.95429 (f1_macro de VALIDACIÓN) y
      metrics_summary.json declara best_model_metric=0.94359 (f1_macro de HOLD-OUT). Mismo nombre de
      campo, dos conjuntos distintos. No es una inconsistencia real, pero se documenta para que la ficha
      no mezcle ambas: la cifra publicable de rendimiento es la de hold-out (0.9436).
    requiere_decision_humana: false

  - id: sin_soporte_mlflow_en_el_codigo_original
    severidad: baja
    descripcion: >
      El entregable no usa MLflow ni ningún registro de experimentos; la trazabilidad se apoya en
      model_bundle_metadata.json y en los CSV de métricas.
    implicacion: "mlflow_utils.py del plugin se construye desde cero siguiendo el patrón del repo (obligatorio por CLAUDE.md)."
    requiere_decision_humana: false

  - id: estructura_de_memoria
    severidad: nula
    descripcion: >
      La memoria SÍ sigue la estructura de secciones esperada por el skill: §3 Dataset y pipeline (ETL),
      §4.1 Arquitectura, §4.2 Entradas y salidas, §5.1 Resultados comparativos, §6.2 Hiperparámetros,
      §7.2 Resultados en conjunto de test (hold-out), §9 Reproducibilidad, §10 Limitaciones. No se
      requiere confirmación humana por este motivo. No contiene tabla de escenarios de negocio tipo
      "Tabla 6", por lo que los golden_cases salen del split de test real ([D]/[R]), no de la memoria.
    requiere_decision_humana: false

# =============================================================================
# golden_cases — 20 casos
#
# Origen: split de test REAL del dataset entregado (60 sample_id reservados en
# model_bundle_metadata.json.split_sample_ids.test_sample_ids), pasados por el pipeline de inferencia
# ENTREGADO tal cual ([R], 2026-08-04). Ninguno es inventado ni sintetizado por el agente.
#
# `expected` es la salida del checkpoint servido (final_winner.pt = GRU), NO la etiqueta correcta:
# se verifica reproducibilidad numérica del portado, no acierto del modelo (eso ya está en
# metrics_reported). `y_true` se incluye aparte para lectura humana. 4 de los 20 casos son ventanas
# que el modelo CLASIFICA MAL a propósito — un golden set que solo contuviera aciertos no detectaría
# un portado que "arregla" predicciones.
#
# Cobertura: 12 casos correctos cruzando clase global (0/1/2) × etiqueta temporal (0/1/2) × tramo de la
# serie (inicial/medio/final), 4 casos de error del modelo (uno por cada par y_true→pred observado en
# test), y 4 casos en modo ventana aislada de 48 filas (incluido el que diverge respecto a serie completa).
#
# CÓMO VERIFICAR:
#   - input_mode: serie_completa → alimentar las 480 filas del sample_id
#     (data/raw/dataset_infestacion_cereales_sintetico.csv filtrado por sample_id, columnas
#     sample_id/timestamp/co2_ppm/temp_c/ambient_rh_pct/humidity_grain_pct) y comparar la ventana
#     window_index.
#   - input_mode: ventana_aislada_48_filas → alimentar SOLO las filas [start_pos..end_pos] y comparar
#     la única ventana resultante.
# =============================================================================
