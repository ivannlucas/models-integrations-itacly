known_issues:
- 'requirements.txt es ASCII/LF (no UTF-16) pero es un pip freeze de entorno completo (jupyter, matplotlib, statsmodels...) con torch via --extra-index-url
  CPU: el plugin debe usar un subconjunto mínimo (torch, scikit-learn, joblib, numpy, pandas, deap).'
- 'El código entregado carga artefactos con rutas relativas a config.yaml y reentrena automáticamente si faltan (auto_train_if_missing=True) —
  NO replicar en el plugin: si faltan artefactos debe fallar con excepción de dominio.'
- scaler_X.pkl/scaler_Y.pkl están serializados con numpy 2.x (numpy._core); no cargan con numpy 1.x. El entorno de verificación debe usar numpy>=2
  y scikit-learn==1.8.0.
- 'Hay copias duplicadas en models/artifacts/nb_experiments/ y MLP_Baseline.pt: solo se usan los artefactos de la raíz de models/artifacts/ (config.yaml:
  training_model1.final_model.weights_filename).'
- realtime_decisions.csv incluye policy_source con ruta absoluta de Windows del equipo de IA (C:\Users\PC\...); no usar ese campo.
- El orden de salida del MLP es [T_out, CO2_emissions]; scaler_Y es MinMaxScaler (no StandardScaler).
- 'Constantes hardcoded en el cálculo de features: 72.5 (t_out_reference) y 853.6279 (Thermal_Intensity); deben ir a constants.py.'
- 'Inconsistencias en la memoria: (a) un objetivo cita umbral ''mínimo 72 °C'' pero código/config/tablas usan 72.5 °C; (b) Tabla 10 etiqueta 15.5859
  kg como CO2 ''de variables actuales'' cuando en realtime_decisions.csv es recommended_CO2_pred (el actual es 18.1437) y cita ''14.10%'' de ahorro
  cuando 0.0181/15.604 = 0.12%; (c) la memoria describe enable_economic_objective/price_co2_per_kg en config.yaml pero esos parámetros NO existen
  en config.yaml ni en src/ — modo económico no implementado; (d) la memoria cita la salida T_out_violation pero realtime_decisions.csv no la
  contiene; (e) KPI memoria 122.240,37 kg optimizado / 33.826,98 ahorro vs kpi_summary.csv 122.231,46 / 33.835,89 (se usan los de kpi_summary.csv).
  Requiere confirmación humana.'
- 'config.yaml y defaults de ga_model_pipeline.py difieren (per_row n_gen 20 vs 17; bounds por defecto más amplios): rigen los valores de config.yaml
  (los de este manifest).'
- El dataset es 100% sintético (simulador PHE); la memoria lo reconoce ('Ajuste Sim2Real'). Las métricas no son extrapolables a planta real.
- 'R2 de CO2_emissions (0.895) es muy inferior al de T_out (0.9995): la tolerancia de golden cases para CO2 debe basarse en MAE=0.31 kg, no en
  la de T_out (MAE=0.019 °C).'
- 'Golden cases optimize: expected_static_policy y expected_current son deterministas; expected_adaptive_reference tambien se reproduce exactamente fijando la semilla 43 + val_row_index (verificado 4/4, diferencia <= 5e-5). No asumir que el CO2 recomendado es <= al de la politica: en 6869 de 7755 filas de realtime_decisions.csv es mayor, porque la politica global incumple T_out >= 72.5 en 21 filas y el GA prioriza la factibilidad.'
- 'inbox/a36 se entregó como .zip (descomprimido a inbox/a36/codigo/). La memoria no trae sección explícita de ''Resultados en Conjunto de Test''
  con ese nombre: se usó Tabla 11 (verificada contra final_test_metrics.json).'
- 'Nota: pandoc no está instalado en este entorno; la memoria se extrajo con un parser XML propio (sin pérdida de texto relevante, pero las tablas
  pierden formato).'
- 'Hallazgo en el código original: en realtime_decision_pipeline._run_adaptive_ga_for_row los individuos semilla (política + operación actual) se añaden a la población y justo después se trunca a pop_size, descartándolos. En la práctica "hybrid" == "adaptive". El plugin lo replica fielmente para reproducir los resultados del equipo de IA; confirmar con ellos si es intencionado.'
- 'Versiones: los .pkl de scalers vienen de scikit-learn 1.8.0 / numpy 2.x pero el requirements.txt del repo fija scikit-learn==1.5.2 y numpy>=1.24 (y deap==1.4.4 vs 1.4.3). Hay que comprobar la carga de scaler_X/scaler_Y en el entorno real (verification).'
