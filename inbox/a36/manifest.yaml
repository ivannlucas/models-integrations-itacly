# manifest ml36 — generado por skill manifest-extraction; golden_cases extraídos de datasets reales del equipo de IA (no inventados)
model_id: ml36_dairy_dnl_co2_emissions_optimizer
sector: lacteo
nombre: Modelo basado en algoritmos genéticos para la reducción del impacto ambiental en los procesos de transformación de la leche
task_type: regression_prescriptive
framework:
- torch>=2.6,<3 (CPU)
- scikit-learn==1.8.0
- deap==1.4.3
- joblib==1.5.3
- numpy==2.4.2
- pandas==3.0.1
- PyYAML==6.0.3
artifacts:
  folder: models/artifacts/
  files:
  - MLP_Final_Best_From_Search.pt
  - scaler_X.pkl
  - scaler_Y.pkl
  - ga_policy_global.json
  - ../metrics/final_model_config.json
  notes:
    MLP_Final_Best_From_Search.pt: 'state_dict DynamicMLP: 11 -> [Linear64+BatchNorm+ReLU+Dropout0.1] x1 -> 2 (orden salida [T_out, CO2_emissions])'
    scaler_X.pkl: StandardScaler sobre las 11 features (orden feature_order)
    scaler_Y.pkl: MinMaxScaler sobre [T_out, CO2_emissions]; NO StandardScaler
    ga_policy_global.json: politica global GA (best_individual=[T_serv,Delta_P,Regeneration_perc]); la usan los modos static/hybrid
    final_model_config.json: vive en models/metrics/, no en artifacts/; define input_size/num_layers/neurons/activation/dropout
inputs:
  feature_order:
  - T_serv
  - F_milk
  - T_in
  - Fat_perc
  - Viscosity
  - Regeneration_perc
  - Delta_P
  - t_ciclo
  - Hydraulic_Resistance
  - T_serv_margin
  - Thermal_Intensity
  fixed_context:
  - name: F_milk
    unit: L/h
    description: Caudal volumétrico de leche
    train_range:
    - 4469.84
    - 5856.05
  - name: T_in
    unit: °C
    description: Temperatura de entrada de la leche
    train_range:
    - 3.36
    - 7.66
  - name: Fat_perc
    unit: '%'
    description: '% de grasa del lote'
    train_range:
    - 3.2
    - 4.19
  - name: Viscosity
    unit: mPa·s
    description: Viscosidad dinámica de la leche (unidad no confirmada en la memoria)
    train_range:
    - 1.89
    - 2.26
  - name: t_ciclo
    unit: min
    description: Tiempo desde el inicio del ciclo de producción (muestreo cada 5)
    train_range:
    - 5.0
    - 610.0
  control:
  - name: T_serv
    unit: °C
    description: Temperatura del líquido de calentamiento
    ga_range:
    - 73.4
    - 84.31
    train_range:
    - 75.32
    - 84.31
  - name: Delta_P
    unit: bar
    description: Presión de impulsión de las bombas (unidad no confirmada en la memoria)
    ga_range:
    - 0.6
    - 1.6
    train_range:
    - 0.603
    - 1.603
  - name: Regeneration_perc
    unit: '%'
    description: Eficiencia de regeneración térmica
    ga_range:
    - 86.9
    - 93.4
    train_range:
    - 86.93
    - 93.48
  derived_always:
    Hydraulic_Resistance: Delta_P / F_milk**2  (0 si F_milk==0)
    T_serv_margin: T_serv - 72.5
    Thermal_Intensity: ((72.5 - T_in) * (1 - Regeneration_perc/100)) / 853.6279
  notes: En predict el cliente aporta las 8 variables base (contexto + control) y el plugin deriva las 3 restantes (fórmulas verificadas contra
    test_raw fila 0). En optimize solo se aporta contexto.
outputs:
  predict_inline:
  - name: T_out
    unit: °C
    description: Temperatura de salida de la leche predicha
  - name: CO2_emissions
    unit: kg
    description: Emisiones de CO2 por registro predichas
  optimize:
  - name: recommended_T_serv
    unit: °C
  - name: recommended_Delta_P
    unit: bar
  - name: recommended_Regeneration_perc
    unit: '%'
  - name: recommended_CO2_pred
    unit: kg
  - name: recommended_T_out_pred
    unit: °C
  - name: policy_*
    description: setpoints/CO2/T_out de la política global estática
  - name: co2_saving_vs_policy
    unit: kg
  - name: co2_saving_vs_current
    unit: kg
    description: solo si se aportan los setpoints actuales
  - name: decision_mode
    description: static | adaptive | hybrid (default hybrid)
training:
  supported: true
  source: 'codigo_entrenamiento (src/training/trainer.py, config/config.yaml: training_model1; memoria §Arquitectura y Algoritmos)'
  target_column: null
  target_columns:
  - T_out
  - CO2_emissions
  target_column_comment: modelo multi-salida; el orden [T_out, CO2_emissions] es contractual (scaler_Y). No hay una única target_column; plugin-integration
    debe decidir cómo mapearlo al contrato TrainRequest.
  required_columns:
  - T_serv
  - F_milk
  - T_in
  - Fat_perc
  - Viscosity
  - Regeneration_perc
  - Delta_P
  - t_ciclo
  - Hydraulic_Resistance
  - T_serv_margin
  - Thermal_Intensity
  - T_out
  - CO2_emissions
  - cycle_id
  required_columns_comment: cycle_id solo para el split por ciclos; si falta el código lo reconstruye desde t_ciclo (reinicio = nuevo ciclo).
    Las 3 derivadas pueden calcularse en el plugin si faltan.
  split:
    strategy: por ciclo, estratificado por estación, seed 42
    approx: 70/15/15
  hyperparams:
    optimizer: Adam
    loss: MSELoss
    lr: 0.0001
    epochs: 400
    early_stopping_patience: 30
    batch_size: 128
    num_layers: 1
    neurons: 64
    activation: ReLU
    dropout_rate: 0.1
    batch_norm: true
    seed: 1
    x_scaler: StandardScaler
    y_scaler: MinMaxScaler
  metrics_returned:
  - mae_t_out
  - r2_t_out
  - mse_t_out
  - mae_co2
  - r2_co2
  - mse_co2
constraints:
  t_out_min_celsius: 72.5
  penalty_factor: 50.0
  gene_bounds:
    T_serv:
    - 73.4
    - 84.31
    Delta_P:
    - 0.6
    - 1.6
    Regeneration_perc:
    - 86.9
    - 93.4
  descripcion: Restricción térmica de pasteurización T_out >= 72.5 °C. En el GA original es BLANDA (penalización 50*(72.5-T_out) sumada al fitness),
    no un rechazo duro; la política global viola 0.34% de contextos (177/51389). El plugin debe exponer un flag de factibilidad (T_out_violation)
    y decidir en plugin-integration si lanza excepción de dominio — requiere confirmación humana.
ga_config:
  library: deap==1.4.3
  seed: 42
  dataset_ga:
    pop_size: 120
    n_gen: 100
    cxpb: 0.9
    mutpb: 0.35
    elite_size: 5
    mutation_eta: 10.0
    mutation_indpb: 0.6
    tournament_size: 3
    cx_alpha: 0.3
  adaptive_ga:
    pop_size: 16
    n_gen: 14
    cxpb: 0.85
    mutpb: 0.3
    elite_size: 2
    mutation_eta: 10.0
    mutation_indpb: 0.6
    tournament_size: 3
    cx_alpha: 0.3
    seed: 42
    row_seed: seed + i (i desde 1)
  modes:
    static: aplica ga_policy_global.json
    adaptive: GA por fila
    hybrid: GA por fila sembrado con la política (y setpoints actuales si se aportan) — modo por defecto
metrics_reported:
  dataset: test_hold_out
  n_samples_test: 7704
  source: memoria Tabla 11 / models/metrics/final_test_metrics.json
  T_out:
    mae: 0.019092
    mse: 0.000592
    r2: 0.999492
  CO2_emissions:
    mae: 0.307587
    mse: 0.147651
    r2: 0.895145
  ga_validation:
    n_instances: 7755
    co2_original_kg: 156067.35
    co2_optimized_kg: 122231.46
    mejora_pct: 21.68
    source: models/metrics/ga/kpi_summary.csv
