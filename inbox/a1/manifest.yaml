known_issues:
  - "[CRÍTICO -- ENTREGA] El ZIP de código original NO incluye la carpeta data/ (imágenes,
     SENSORES.csv, MANIFEST_MULTIMODAL.csv, data/splits/) ni los .joblib de los RF. Se pidió al
     equipo de IA un segundo paquete (\"modelo 1.zip\") con los .joblib, las métricas auditadas
     reales y 20 muestras etiquetadas (datos_plataforma/) — ya fusionado en inbox/a1/codigo/.
     Pendiente: el equipo de IA aún no ha confirmado si puede dar el corpus completo de 9.794
     imágenes + SENSORES.csv para un reentrenamiento real del bloque CNN (fuera de alcance de
     este plugin de todas formas, ver training.scope_note)."
  - "[RESUELTO -- VERIFICADO CONTRA EL PLUGIN REAL] El bloqueo inicial (TensorFlow sin wheel
     para la versión de Python de este entorno) se resolvió instalando keras 3 con
     backend=torch + ultralytics directamente (backend=torch no necesita tensorflow en
     absoluto). Se cargaron los 3 backbones reales (.weights.h5) en la arquitectura reconstruida
     por app/plugins/ml1_wine_pest_disease_detection/model_loader.py::build_hybrid_model sin
     ningún error de carga de pesos, y se ejecutó predict_inline() del plugin real contra las 20
     imágenes+sensores de datos_plataforma/. Resultado: 19/20 (95%) de clasificación exacta,
     consistente con el 94.69% auditado — ver golden_cases.cases (predicho_* junto a
     esperado_*). El plugin reproduce fielmente el pipeline entregado."
  - "[MODELO -- CASO_17 INVESTIGADO] El único golden case fuera de acierto (caso_17,
     grapevine_powdery_mildew_leaf_29.jpg): esperado OIDIO, predicho OIDIO_RACIMO, confianza
     0.312 (la más baja de los 20 casos). Es una confusión entre dos clases visualmente
     emparentadas (oidio en hoja vs. oidio en racimo — ambas presentan el mismo velo
     blanquecino característico, memoria sección 'Leaf or Grape Roszc'), con baja confianza del
     propio modelo, no un fallo de integración: el plugin reproduce exactamente la arquitectura
     y los pesos entregados. report_ensemble_final_no_gases_desacoplado.csv confirma que
     OIDIO_RACIMO es, de las 15 clases, la de peor F1 (0.593) y recall (0.615) del modelo real
     — este fallo es consistente con esa debilidad ya documentada, no un caso aislado."
  - "[MODELO -- REGRESIÓN DE RIESGO MÁS RUIDOSA DE LO QUE SUGIERE EL MAE AGREGADO] Sobre los 20
     casos reales verificados, el error absoluto por caso en el índice de riesgo varía mucho
     más que el MAE agregado (0.189): p. ej. caso_11 (LOBESIA) real=0.227 vs. predicho=0.793
     (error 0.566), caso_06 (ESCA_HOJA) real=0.373 vs. predicho=0.062 (error 0.311). El MAE
     agregado sobre 1470 filas de test oculta esta varianza caso a caso — a tener en cuenta en
     la ficha funcional (el índice de riesgo es menos fiable individualmente que la
     clasificación de patología, aunque el agregado parezca sólido)."
  - "[HALLAZGO -- SCRIPT DE REFERENCIA ENGAÑOSO] datos_plataforma/ejemplo_inferencia.py y su
     resultado_inferencia_batch.csv NO deben usarse como referencia de corrección: ese script
     solo carga y usa el Random Forest tabular (rf_clase_expert.joblib, SIEMPRE la variante CON
     gases, sin mirar exclude_gases) -- nunca carga ni ejecuta los backbones CNN, aunque marca el
     campo metodo_ejecutado como \"HIBRIDO_ENSAMBLE\" cuando hay imagen. Resultado: solo 9/20
     aciertos (45%) en las muestras de datos_plataforma, frente al 94.69% real del Deep Ensemble
     (report_ensemble_final_no_gases_desacoplado.csv). Confirmado con metricas auditadas: el RF
     de clasificación solo (sin gases) tiene 11.6% de accuracy en su propio test de 100.000 filas
     (report_rf_tabular_no_gases.csv) -- prácticamente al azar (baseline 15 clases = 6.7%). Esto
     también explica, con evidencia numérica, por qué predictor.py en modo desacoplado NO usa el
     RF para clasificar cuando falta la imagen (ver siguiente known_issue): el equipo de IA
     probablemente descartó esa vía por su bajo rendimiento, aunque la memoria no lo actualizó."
  - "[MEMORIA vs CÓDIGO] La memoria dice 3 veces (secciones 4.3, 7.4 y 8.2) que si falta la
     imagen el sistema usa el RF para clasificar. El código real
     (predictor.py::run_inference_tabular_only) solo hace eso si use_fusion_layer=True; en modo
     desacoplado (el de producción, config.yaml por defecto) devuelve enfermedad=
     'IMAGEN_NO_DISPONIBLE' con confianza 0.0, y el riesgo sí sale del RF regresor. A la luz del
     hallazgo anterior (RF clasificador al 11.6% de accuracy), esto parece una decisión de
     ingeniería correcta no reflejada en la memoria, no un bug -- el plugin replica el código,
     no la memoria. Pendiente de que el equipo de IA lo confirme explícitamente."
  - "[CÓDIGO ORIGINAL] yolo_crop_alignment (preprocess.py) toma resultados[0].boxes.data[0] --
     la PRIMERA caja que devuelve YOLO con conf>=0.3, no un argmax explícito de confianza. En la
     práctica coincide con la de mayor confianza porque Ultralytics ordena así su salida tras
     NMS, pero no es una garantía explícita del código. El script de referencia
     datos_plataforma/ejemplo_inferencia.py sí hace `max(boxes, key=lambda b: float(b.conf[0]))`
     explícito -- dos implementaciones del equipo de IA con comportamiento distinto ante
     múltiples detecciones. El plugin replica preprocess.py (el que usa predictor.py en
     producción), no el script de ejemplo."
  - "[CÓDIGO ORIGINAL] scripts/detection/YOLO/training_YOLO.py referencia
     data/processed/YOLO_IMAGES/archivo.yaml (fichero de clases para el entrenamiento de
     Ultralytics) que no viene en ninguna de las dos entregas -- solo afecta a un reentrenamiento
     de YOLO desde cero (fuera de alcance del plugin: se usa el best.pt ya entrenado)."
  - "[MODELO] Varias clases minoritarias no alcanzan el KPI individual de recall>=0.85 de la
     memoria (6.1) aunque el macro-recall global sí: EMPOASCA (0.588, 17 filas de test), LOBESIA
     (0.60, 15 filas), OIDIO_RACIMO (0.615, 13 filas). Afecta a la ficha funcional (limitaciones)."
  - "[DATOS] El índice de riesgo es 100% sintético: generado por reglas biológicas
     (scripts/data/create_dataset.py::generar_dataset_maestro_total, con citas a modelos
     epidemiológicos de la literatura -- Broome, Rossi, Caffi) sobre clima simulado, no sobre
     mediciones de campo reales. Debe constar explícitamente en la ficha funcional."
  - "[CÓDIGO ORIGINAL] src/evaluate/evaluate.py regenera un split 70/15/15 estratificado en
     memoria en cada ejecución (no lee un test set persistido) para la evaluación de la CNN; solo
     la evaluación del RF tabular (evaluate_rf) usa un test_rf.csv persistido. Con random_state=42
     fijo y el dataset completo disponible sería reproducible, pero no lo hemos podido regenerar
     nosotros (no tenemos MANIFEST_MULTIMODAL.csv). Los CSV de métricas entregados en
     models/metrics/classification/ son, por tanto, de una única ejecución de referencia del
     equipo de IA, no algo que este agente haya podido reproducir de forma independiente."
  - "[ENTORNO] requirements.txt fija --index-url https://download.pytorch.org/whl/cu121 (rueda
     CUDA 12.1 de PyTorch) como primer índice de paquetes -- un pip install -r requirements.txt
     normal en una máquina sin esa URL accesible, o en CPU/otra versión de CUDA, puede fallar o
     instalar una build incorrecta de torch si no se ajusta antes."
  - "[ENTORNO] Solo torch/torchvision tienen versión EXACTA fijada en requirements.txt;
     tensorflow-cpu/tensorflow, keras, scikit-learn, ultralytics y pandas solo tienen un mínimo
     (>=), y numpy un rango. El plugin debe fijar versiones exactas propias para reproducir
     fielmente la inferencia (mismo riesgo de incompatibilidad de pickle/arquitectura visto en
     otros modelos de este repo, p. ej. ml19 con scikit-learn)."
  - "[ENTORNO] La memoria dice Python 3.12.7 (compatible 3.10+); EJECUCION_MODELO_1.md (más
     reciente) dice Python 3.10+. Verificar la versión real usada para generar los .weights.h5 si
     aparecen problemas de carga."
