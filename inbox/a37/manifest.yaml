known_issues:
  - "[ORIGEN DEL DATASET] NO es un dataset vitivinícola real: es el UCI \"Condition Monitoring
     of Hydraulic Systems\" (Helwig et al. 2015, DOI 10.24432/C5CW21), banco de pruebas de
     laboratorio con estados de condición configurados por los experimentadores. La memoria lo
     declara explícitamente como proxy técnico (componentes hidráulicos/electromecánicos
     comparables a prensas/bombeo/filtración/embotellado), nunca como datos reales de bodega.
     Debe quedar igual de explícito en la ficha funcional/técnica -- no reformular como si fuera
     telemetría real de una instalación vitivinícola."
  - "[RIESGO != RIESGO FÍSICO] risk_<target> es incertidumbre predictiva (1 - max(softmax)), NO
     un indicador de salud física del componente -- lo dice el propio docstring del código
     original. No confundir con la severidad de las alertas neurosimbólicas (INFO/WARNING/
     CRITICAL/EMERGENCY), que es un concepto distinto y no derivado linealmente de risk_*."
  - "[RENDIMIENTO MUY DESIGUAL POR HEAD] cooler es excelente (balanced_accuracy 0.967), pero
     valve (0.280), accumulator (0.545) y pump (0.568) son sustancialmente más débiles --
     confirmado tanto en la memoria como en la reproducción independiente de esta extracción
     sobre las 331 filas reales de test. No presentar una cifra agregada única sin desglosar
     por head."
  - "[LA CAPA NEUROSIMBÓLICA NO DEMUESTRA APORTACIÓN DEL MODELO EN 3 DE 4 COMPONENTES] Según la
     propia memoria y el README: con la política de fusión vigente, la salida 'combined'
     coincide con 'rules_only' en valve, pump y accumulator -- solo cooler es la excepción
     donde el modelo aporta algo verificable sobre las reglas físicas solas. El bloque ML tiene
     señal aprendida independiente (MODEL_RAW), pero MODEL_TRUST + el filtro de probabilidad
     0.50 la suprimen o degradan antes de llegar a la salida desplegada en la mayoría de los
     casos. Esto es un hallazgo documentado por el propio equipo de IA, no un fallo de
     integración -- no silenciarlo ni maquillarlo en las fichas."
  - "[KPI DE NEGOCIO NO MEDIDO] El 20% de reducción de downtime es un objetivo declarado, NO
     demostrado: el dataset UCI no contiene registros de downtime/intervenciones/paradas reales.
     La ficha funcional debe dejarlo como objetivo pendiente de validación en planta, nunca como
     resultado ya alcanzado."
  - "[CONTRATO schema_v1: 40 slots, solo 14 activos en producción] El tensor de entrada tiene
     forma (600,40) pero en la configuración de referencia (no_virtual) solo 14 slots llevan
     datos reales (los sensores físicos); CE/CP/SE (slots 14-16) se fuerzan a 0 y los 23 slots
     RESERVED_* (17-39) siempre son 0. scaler.json y class_mappings.json tienen longitud 40, no
     14 -- el preprocesado del plugin debe construir el tensor completo de 40, nunca pasar
     directamente un array de 14 columnas al scaler/modelo."
  - "[SOLO LA VARIANTE no_virtual + rand_scool TIENE ARTEFACTOS COMO CONFIGURACIÓN DE
     REFERENCIA] Existen 4 combinaciones entrenadas (with_virtual/no_virtual x
     rand_scool/temp701515) pero el equipo de IA elige no_virtual_v1__rand_scool como la única
     configuración de producción recomendada (memoria, sección 'Selección de la configuración
     de referencia'). Este plugin sirve exclusivamente esa combinación; las otras 3 quedan fuera
     de alcance salvo que se pida explícitamente lo contrario."
  - "[RESUELTO -- VERIFICADO CONTRA EL ARTEFACTO REAL] Python 3.14 de este sandbox no tiene
     wheel de tensorflow==2.19.0 (solo 2.22.0rc0), mismo bloqueo que tuvo a1. Resuelto igual que
     a1: best_model.keras carga sin ningún error con Keras 3 standalone + backend=torch, sin
     TensorFlow en absoluto (el formato .keras de Keras 3 es el mismo que usa tf.keras desde
     TF 2.16+). Arquitectura cargada verificada: Masking(0.0) -> LSTM(64) -> Dense(64,relu) -> 4
     heads softmax (cooler=3, valve=4, pump=3, accumulator=4 clases), 31.950 parámetros, igual
     que trainer.py::build_multitask_lstm. Se ejecutó predict() real sobre los 20 golden_cases
     (tensor real X_schema_v1.npy + scaler.json + class_mappings.json reales) y los 20/20
     reproducen EXACTAS las clases predichas y el riesgo a 4 decimales ya registrados arriba --
     el plugin puede construirse sobre Keras 3 standalone sin depender de TensorFlow."
  - "[requirements.txt SOLO FIJA tensorflow EXACTO] numpy/pandas/scikit-learn/pyarrow son rangos
     (>=X,<Y), no versiones exactas -- a diferencia de a19 (scikit-learn), aquí no hay pin
     exacto de sklearn que pueda romper por versión al cargar nada (StandardScaler se
     reconstruye desde JSON plano, no se deserializa un objeto sklearn con pickle/joblib, así
     que el riesgo de incompatibilidad binaria entre versiones de sklearn es mucho menor que en
     otros modelos de este repo)."
  - "[splits.json EN DISCO LE FALTA UNA CLAVE QUE EL CÓDIGO ACTUAL SÍ ESCRIBE] El fichero
     data/splits/no_virtual_v1__rand_scool/splits.json entregado no tiene la clave
     missing_classes_by_target que trainer.py (línea ~609) sí construye -- posible artefacto de
     una versión anterior del código. No afecta a la verificación (los índices train/val/test y
     las distribuciones sí están completos y consistentes), pero se documenta como discrepancia
     de procedencia sin resolver silenciosamente."
  - "[QUIRK REAL DEL MOTOR DE REGLAS: accumulator PUEDE PERDER UNA ALERTA MÁS GRAVE EN LA VISTA
     LEGACY] symbolic_engine.py::check_rule_evidence evalúa accumulator con DOS bloques `if`
     independientes (no elif): PS1_mean bajo (WARNING/CRITICAL) y PS1_std alto (WARNING) pueden
     dispararse ambos en el mismo ciclo. check_rules()/la vista 'legacy' que alimenta
     alerts_all.parquet colapsa por componente con un dict comprehension
     ({a['component']: a for a in rule_alerts}) que se queda con la ÚLTIMA entrada en orden de
     evaluación (ps1_std, evaluado después) -- si PS1_mean disparó CRITICAL y PS1_std solo
     WARNING, la vista legacy pierde silenciosamente el CRITICAL y deja un WARNING. El propio
     equipo de IA es consciente de esto: build_rule_evidence_detail calcula explícitamente un
     campo would_be_overwritten_in_legacy para auditarlo en la salida auxiliar
     alerts_rule_evidence_detail.parquet. Esto NO se corrige en el plugin -- se replica
     fielmente (es el comportamiento real desplegado), documentado aquí y en known_issues de la
     ficha técnica, y se expone también el detalle completo (todas las reglas, no solo la
     'legacy') para que quien consuma la API pueda ver la alerta perdida si la necesita."
  - "[a39 DEPENDE DE ESTE MODELO] El ticket DATAPLAT-525 (a39, capa XAI) está ligado a a37:
     reutiliza su especificación y dataset, y hay que comprobar que las explicaciones se
     muestran junto a la predicción de a37 en el front. No empezar a39 hasta que este plugin
     esté verificado."
  - "[FUSIÓN a39 — RESUELTO EL ACOPLAMIENTO DE PRODUCTO] Con dos plugins, el front tenía que
     llamar a ml37 y a ml39 con el mismo payload para mostrar la explicación junto a la
     predicción, y nada garantizaba que fueran el mismo ciclo ni el mismo modelo (ml39 ignoraba
     mlflow_run_id: con un modelo reentrenado explicaba siempre la base). Ahora una sola
     llamada devuelve predicción + explicación calculadas con el MISMO bundle (base o MLflow)."
  - "[FUSIÓN a39 — SHAP ROTO EN EL PLUGIN ml39, ARREGLADO] main.py importa app.registry entero
     antes de aplicar el filtro MODEL, y los model_loader de ml1/ml37 fijan KERAS_BACKEND=torch al
     importarse: en el pod el backend de Keras es SIEMPRE torch (verificado con
     MODEL=ml39-... el 2026-11-24). El SHAP de ml39 solo admitía TensorFlow, así que
     include_shap=true devolvía 500 siempre en producción (su verification_report lo daba por
     'esperado'). xai.py usa shap.GradientExplainer sobre el modelo Keras-torch (es un
     torch.nn.Module; shap usa su ruta PyTorch, que consume np.random con la misma secuencia que
     la de TF). Integrated Gradients calcula el gradiente con torch.autograd o tf.GradientTape
     según el backend activo; el resto de la fórmula es común."
  - "[FUSIÓN a39 — FONDO SHAP SIN ESCALAR] shap_background.npy guarda (80, 600, 14) sin escalar
     y se escala al cargar con el scaler del bundle. Así vale para la base y para un reentreno
     (train() genera el suyo desde su split de train y lo sube al run de MLflow). Un fichero
     escalado (n, 600, 40), como el que preveía ml39, se rechaza al cargar."
  - "[FUSIÓN a39 — COSTE, MEDIDO EN CPU EN UN CGROUP (CUDA_VISIBLE_DEVICES=, como los pods)]
     Ciclo 33: sin XAI 0,5 s; con IG 2,2-2,8 s (un forward compartido por las 4 cabezas: mismas
     atribuciones que una pasada por cabeza, a mitad de coste); con SHAP ≈65 s (nsamples=200, el
     valor del original). Memoria del proceso: 0,61 GiB cargado, 0,80 GiB tras IG, pico 1,41 GiB
     con SHAP: cabe en el límite de 2 GiB del pod, pero dos peticiones SHAP simultáneas
     probablemente no. include_xai=true por defecto en inline y en batch (decisión del
     usuario, 2026-11-24: la explicación se muestra también en los resultados de batch; en
     batch suma ≈3 s por ciclo, p. ej. ≈15 min para los 331 ciclos de test, así que el front
     debe llamar al batch con /predict?wait=false). SHAP es opt-in y en batch se limita a los
     primeros n_samples ciclos (5)."

xai_a39:
  origen: "inbox/a39/codigo/src/xai/xai_analysis.py (perfil 'full' de config.yaml: ig_steps=50, shap_n_bg=80, seed=42). El resto del código de a39 es el de a37 con cambios solo de formato de rutas (diff verificado: trainer/predictor/neurosymbolic/build_schema sin cambios de comportamiento)."
  en_vivo:
    integrated_gradients: "por ciclo y por head, baseline 0, steps=50, target_class_idx=None (máximo sobre clases reevaluado en cada paso), |IG| medio sobre los 600 pasos por sensor físico"
    shap: "shap.GradientExplainer por head, fondo de 80 ciclos de train, nsamples=200, rseed=42 por petición (misma entrada -> misma explicación)"
  offline: "t-SNE/silhouette, calibración (Brier), concordancia IG-SHAP sobre todo el test y concordancia neurosimbólica agregada: análisis de auditoría del original (python src/main.py xai), no explicaciones de un ciclo. Sus cifras publicadas están en constants.METRICS_REPORTED['xai']."
  inputs: {include_xai: "bool, true por defecto (inline y batch)", include_shap: "bool, requiere include_xai", n_samples: "solo batch, ciclos máximos con SHAP (5)"}
  outputs: {ig_importance: "head -> sensor -> float", shap_importance: "head -> sensor -> float | null", xai_error: "str | null (la predicción sigue siendo válida)"}
  artefacto_nuevo:
    shap_background.npy: "(80, 600, 14) float32 SIN escalar. Ciclos train_idx[pos] de data/splits/no_virtual_v1__rand_scool/splits.json, con pos = la secuencia de np.random.default_rng(42) del original (primero rng.choice(331, 150) para la muestra de IG, luego rng.choice(1543, 80)) -> es EXACTAMENTE el fondo del perfil full. Generar con xai.build_shap_background (receta en su docstring). md5 local 89f4838a69e2f940b0beef18a20f1a2f. Hay que subirlo a s3://<STORAGE_BUCKET>/artifacts/fixed/ml37_wine_press_predictive_maintenance/ junto al resto (acción del responsable)."
  golden_cases: "los 20 de inbox/a39/manifest.yaml (top-3 |IG| por head, tolerancia relativa 1%)"
  verificacion_shap: "Reproducido el barrido full del original con xai.py (150 ciclos IG, fondo 80, 30 ciclos SHAP, np.random.seed(42)): r Spearman IG-SHAP cooler 0.9165, valve 0.6484, pump 0.6044, accumulator 0.7978 = xai_metrics.csv a 4 decimales (2026-11-24, ver outputs/a37/verification_report.md)."

