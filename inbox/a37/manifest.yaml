# [FUSIÓN a39 — 2026-11-24] Este plugin absorbe el entregable a39 ("Implementación del modelo
# XAI para la visualización de los ciclos de reparación o mantenimiento de la maquinaria"). a39
# no es otro modelo: explica ESTE LSTM (best_model.keras MD5-idéntico, mismo run_id
# no_virtual_v1__rand_scool, mismo dataset y split). El plugin separado
# ml39-wine-predictive-maintenance-xai se ha eliminado; su parte en vivo (Integrated Gradients y
# SHAP por ciclo) vive ahora en app/plugins/ml37_wine_press_predictive_maintenance/xai.py y se
# pide con include_xai / include_shap en /predict de ml37. Detalle en la sección `xai_a39` y en
# los known_issues marcados [FUSIÓN a39] al final. El texto histórico de debajo no se reescribe.

model_id: ml37-wine-press-predictive-maintenance
sector: vitivinicola
nombre: "Modelo predictivo para anticipar fallos en prensas y equipos de embotellado"
task_type: classification_multitask_sequence + neurosymbolic_rule_fusion
framework: [tensorflow==2.19.0 (Keras 3 bundled), scikit-learn (StandardScaler, train_test_split, métricas), numpy, pandas, pyarrow]

# ── Procedencia real del dataset (NUNCA inventado, ver known_issues) ──────────────────────────
# El dataset NO es de una bodega real: es el dataset público "Condition Monitoring of Hydraulic
# Systems" del UCI Machine Learning Repository (Helwig et al., 2015; DOI 10.24432/C5CW21),
# https://archive.ics.uci.edu/dataset/447/condition+monitoring+of+hydraulic+systems. La memoria
# (sección "Datos de partida") lo declara explícitamente como proxy técnico: componentes
# hidráulicos/electromecánicos (bomba, válvula, acumulador, refrigeración) funcionalmente
# comparables a prensas/bombeo/filtración/embotellado vitivinícola, pero NO equivalencia
# sectorial completa. 2205 ciclos de banco de pruebas de laboratorio, con estados de condición
# configurados por los experimentadores (etiquetado controlado, no fallos emergentes reales).

artifacts:
  folder: models/artifacts/no_virtual_v1__rand_scool/
  # Configuración de referencia elegida por el equipo de IA (memoria sección "Selección de la
  # configuración de referencia"): run_tag=no_virtual (CE/CP/SE forzadas a cero, 14 sensores
  # físicos activos de 40 slots), split_policy=random_stratified_cooler.
  files:
    - best_model.keras      # 434943 bytes, Keras 3 (.keras format), LSTM multitarea
    - scaler.json            # StandardScaler, mean/scale de longitud 40 (incluye slots RESERVED_*)
    - class_mappings.json    # feature_order_final (40 slots), class_order_by_target, mappings idx<->valor real UCI
    - train_config.json      # seed=42, epochs_max=50, batch_size=256, early_patience=10, lr=0.001, split_policy, run_tag

inputs:
  fixed:
    # Un "ciclo" = ventana temporal de 600 pasos (resampleados a 10Hz, ~60s) x 14 sensores
    # físicos. Orden vinculante (constants.py debe fijarlo igual): PS1,PS2,PS3,PS4,PS5,PS6,
    # EPS1,FS1,FS2,TS1,TS2,TS3,TS4,VS1. Unidades: PS*=bar, EPS1=W, FS*=l/min, TS*=°C, VS1=mm/s.
    - {nombre: sensores_ciclo, tipo: "array (600, 14) float", descripcion: "Serie temporal de los 14 sensores físicos de un ciclo completo, en el orden fijo PS1..VS1"}
    - {nombre: mlflow_run_id, tipo: string, descripcion: "Run de MLflow con el modelo reentrenado por el usuario (opcional)"}
  derived_if_missing:
    CE_CP_SE: "forzadas a 0.0 (modo no_virtual, producción) — nunca se piden al cliente"
    slots_RESERVED_01_a_23: "siempre 0.0, relleno técnico del contrato schema_v1 (40 slots), nunca datos reales"

outputs:
  predict_inline:
    - {nombre: "pred_<target>", descripcion: "Código de condición real UCI predicho por cada head (cooler: 3/20/100; valve: 73/80/90/100; pump: 0/1/2; accumulator: 90/100/115/130)"}
    - {nombre: "risk_<target>", descripcion: "Incertidumbre predictiva = 1 - max(prob_softmax). NO es riesgo físico del componente — ver known_issues, el propio código lo advierte en el docstring"}
    - {nombre: "sem_<target>", descripcion: "Semáforo de incertidumbre: green (riesgo<=0.10), yellow (0.10-0.25], red (>0.25) — tampoco es severidad física"}
    - {nombre: "p_<target>_<clase>", descripcion: "Probabilidad softmax de cada clase real del head"}
  neurosymbolic_alerts:
    # Capa de fusión reglas físicas + modelo (opcional, requiere stats agregadas del ciclo:
    # TS1_mean, PS1_mean, PS1_std, PS3_mean, PS4_mean, FS1_mean, EPS1_mean — todas calculables
    # directamente de la serie temporal de entrada, sin fichero auxiliar).
    - {nombre: component, descripcion: "cooler | valve | pump | accumulator"}
    - {nombre: source, descripcion: "rule (solo regla física) | model (solo modelo, filtrado por MODEL_TRUST) | combined (ambos coinciden)"}
    - {nombre: severity, descripcion: "INFO | WARNING | CRITICAL | EMERGENCY"}
    - {nombre: message, descripcion: "Texto descriptivo de la regla y/o predicción que disparó la alerta"}

constraints:
  model_trust_por_componente: "cooler=0.97, valve=0.27, pump=0.64, accumulator=0.59 — umbral de confianza TRUST_THRESHOLD=0.70. Por debajo del umbral, las alertas del modelo se degradan un nivel de severidad y se suprimen por completo si la probabilidad de la clase predicha < 0.50. Solo cooler supera el umbral sin degradación."
  fusion_combined: "Cuando regla Y modelo disparan para el mismo componente, la severidad combinada NO es el máximo simple: es min(max(rank_regla, rank_modelo) + 1, EMERGENCY) — el acuerdo entre ambas fuentes escala la severidad un nivel por encima de la más grave de las dos."

metrics_reported:
  # TODAS las cifras de esta sección son de models/metrics/no_virtual_v1__rand_scool/metrics_test.json
  # (test oficial, 331 ciclos) Y han sido REPRODUCIDAS de forma independiente en esta extracción
  # ejecutando directamente models/artifacts/.../predictions_test.parquet + data/processed/tensors/y.npy
  # con sklearn.metrics (ver golden_cases.verificacion_metricas_agregadas) -- coinciden EXACTAS.
  cooler: {accuracy: 0.9668, balanced_accuracy: 0.9667, f1_macro: 0.9666, support: 331}
  valve: {accuracy: 0.4683, balanced_accuracy: 0.2804, f1_macro: 0.2499, support: 331}
  pump: {accuracy: 0.6495, balanced_accuracy: 0.5677, f1_macro: 0.5624, support: 331}
  accumulator: {accuracy: 0.5498, balanced_accuracy: 0.5452, f1_macro: 0.5299, support: 331}
  criterio_exito_memoria: >
    balanced_accuracy Y f1_macro deben superar SIMULTÁNEAMENTE a un clasificador trivial de
    clase mayoritaria, por cada head, de forma independiente (un head bueno no compensa a otro
    malo). Cooler lo cumple con holgura; valve/pump/accumulator lo cumplen con margen mucho más
    estrecho (ver known_issues) -- la propia memoria lo documenta como criterio formalizado
    retrospectivamente, no un umbral preregistrado.
  kpi_negocio: >
    Reducción del 20% del tiempo de inactividad no planificado. La propia memoria declara
    explícitamente que este KPI NO está medido ni demostrado con este dataset (el UCI no trae
    registros de downtime/intervenciones reales) -- "permanece como objetivo pendiente de
    validación operacional".

training:
  supported: true
  source: codigo_entrenamiento  # src/training/trainer.py::train_model + build_multitask_lstm
  target_column: "cooler, valve, pump, accumulator (códigos reales UCI); stable (0/1) se usa solo como sample_weight, no es un head del modelo"
  required_columns: "Formato long (una fila por timestep): cycle_id, t, PS1, PS2, PS3, PS4, PS5, PS6, EPS1, FS1, FS2, TS1, TS2, TS3, TS4, VS1, y_cooler, y_valve, y_pump, y_accumulator[, y_stable opcional] -- mismo contrato que src/data_processing/adapt_external_tabular.py del entregable, reutilizable casi literal"
  hyperparams:
    arquitectura: "Masking(mask_value=0.0) -> LSTM(64, dropout=0.2) -> Dense(64, relu) -> 4 heads independientes Dense(n_clases, softmax), uno por target, todos colgando directamente del mismo Dense(64) compartido"
    optimizer: "Adam(learning_rate=0.001)"
    loss: "CategoricalCrossentropy (from_logits=False) por cada head, pesos de loss iguales (sin loss_weights explícito)"
    batch_size: 256
    epochs_max: 50
    early_stopping: "custom MultiMetricEarlyStopping: monitoriza val_valve_loss+val_pump_loss+val_accumulator_loss (pesos 1.0 cada uno, cooler EXCLUIDO del monitor), patience=10, min_delta=1e-3, restore_best_weights=true"
    lr_scheduler: "ReduceLROnPlateau sobre el mismo monitor compuesto, factor=0.5, patience=3, min_delta=1e-3, min_lr=1e-5"
    sample_weight: "0.5 si stable==1 (condiciones estacionarias alcanzadas), 1.0 si stable==0 o no hay columna stable -- mismo vector de pesos para los 4 heads, nunca class_weight"
    seed: 42
    split_policy_referencia: "random_stratified_cooler: 70/15/15, train_test_split(test_size=0.30, stratify=y_cooler, random_state=42) y luego 50/50 del remanente (stratify=y_cooler del remanente) -- estratifica SOLO en cooler, no en los otros 3 targets"
    split_policy_stress_test: "temporal_ordered_70_15_15: slicing puro por orden de fila (sin shuffle ni stratify) -- la propia memoria documenta que degrada severamente el rendimiento de cooler, se usa solo como stress test, nunca como configuración de referencia"
  metrics_returned: [accuracy, balanced_accuracy, f1_macro, n_train, n_val, n_test]
  source_note: >
    El procedimiento completo (incl. el tensor schema_v1 de 600x40, el escalado StandardScaler
    sobre las 40 columnas, y el guardrail de clases ausentes por split) está íntegro en
    src/training/trainer.py (935 líneas) -- portar esto fielmente es el grueso del trabajo de
    plugin-integration.
  duracion_estimada: >
    [VERIFICADO CON EJECUCIÓN REAL en plugin-integration] 60 ciclos reales (20 por clase cooler,
    36.000 filas de sensor) -> 305s de principio a fin (build + fit con early stopping + eval +
    guardado), CPU vía Keras 3 backend=torch, sin GPU -- igual que el entorno del propio equipo
    de IA (memoria: CPU, sin GPU, Intel Core i7-13620H). NO es tan ligero como se estimó
    inicialmente (se esperaban "minutos, no horas" sin verificar): escalar a los 1543 ciclos
    reales del split de referencia completo tomaría considerablemente más (el early stopping
    con un dataset de 60 ciclos converge mucho antes que con 1543, así que la extrapolación
    lineal del tiempo por ciclo subestima el total). Se recomienda exponer /train únicamente vía
    /train?wait=false (infraestructura genérica ya disponible en el repo desde la PR de
    entrenamiento asíncrono) para el dataset completo, no como llamada síncrona por defecto.

golden_cases:
  source_note: >
    Los 20 casos de abajo NO son inventados: son filas reales de
    data/predictions/no_virtual_v1__rand_scool/predictions_test.parquet (predicciones reales del
    modelo entregado, generadas por el equipo de IA con su propio código) cruzadas con el ground
    truth real de data/processed/tensors/y.npy (índice cycle_id-1, confirmado contra
    data/splits/no_virtual_v1__rand_scool/splits.json::test_idx) y con las alertas reales de
    data/predictions/no_virtual_v1__rand_scool/alerts_all.parquet. Selección deliberadamente
    diversa: 5 casos con los 4 heads correctos, 5 con 3 correctos, 5 con 2 correctos y 5 con 1
    correcto (no existen casos con 0/4 correctos en los 331 de test).
  verificacion_metricas_agregadas: >
    accuracy/balanced_accuracy/f1_macro por head, recalculadas de forma independiente con
    sklearn.metrics sobre las 331 filas completas de test (no solo los 20 casos de muestra),
    reproducen EXACTAS las 4 decimales de models/metrics/no_virtual_v1__rand_scool/metrics_test.json
    citadas en metrics_reported arriba. Confirma que predictions_test.parquet y metrics_test.json
    son consistentes entre sí -- no hay discrepancia de versión entre ambos artefactos.
  tolerancia: "coincidencia exacta de clase por head (son códigos discretos, no hay tolerancia numérica aplicable); risk_* se compara con tolerancia absoluta 0.01 (debe reproducirse bit a bit, es determinista: 1-max(softmax))"
