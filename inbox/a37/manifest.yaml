    Los 20 casos de abajo NO son inventados: son filas reales de
    data/predictions/no_virtual_v1__rand_scool/predictions_test.parquet (predicciones reales del
    modelo entregado, generadas por el equipo de IA con su propio código) cruzadas con el ground
    truth real de data/processed/tensors/y.npy (índice cycle_id-1, confirmado contra
    data/splits/no_virtual_v1__rand_scool/splits.json::test_idx) y con las alertas reales de
    data/predictions/no_virtual_v1__rand_scool/alerts_all.parquet. Selección deliberadamente
    diversa: 5 casos con los 4 heads correctos, 5 con 3 correctos, 5 con 2 correctos y 5 con 1
    correcto (no existen casos con 0/4 correctos en los 331 de test).
  verificacion_metricas_agregadas: >
    accuracy/balanced_accuracy/f1_macro por head, recalculadas de forma independiente con
    sklearn.metrics sobre las 331 filas completas de test (no solo los 20 casos de muestra),
    reproducen EXACTAS las 4 decimales de models/metrics/no_virtual_v1__rand_scool/metrics_test.json
    citadas en metrics_reported arriba. Confirma que predictions_test.parquet y metrics_test.json
    son consistentes entre sí -- no hay discrepancia de versión entre ambos artefactos.
  tolerancia: "coincidencia exacta de clase por head (son códigos discretos, no hay tolerancia numérica aplicable); risk_* se compara con tolerancia absoluta 0.01 (debe reproducirse bit a bit, es determinista: 1-max(softmax))"
