project:
  name: "DatagIA"
  seed: 42
  deterministic_strict: true
  deterministic_warn_only: false

paths:
  raw_data: "data/raw/oven_full_dataset.csv"
  input_data: "data/input/"
  processed_data: "data/processed/"
  splits: "data/splits/"
  predictions: "data/predictions/"
  model_artifacts: "models/artifacts/"
  model_metrics: "models/metrics/"
  model_checkpoint_dir: "models/artifacts/"
  model_filename: "best_dnf_model.pt"
  scaler_filename: "scaler.pkl"
  results_filename: "results.json"
  args_filename: "args.yaml"

data_generation:
  sampling_interval_sec: 60
  cycle_duration_hours: 10
  n_cycles_train: 2000
  n_cycles_val: 400
  n_cycles_test: 600
  split_ratios:
    train: {normal_ratio: 0.55, fault_ratio: 0.45}
    val:   {normal_ratio: 0.80, fault_ratio: 0.20}
    test:  {normal_ratio: 0.80, fault_ratio: 0.20}
  fault_start:
    min_pct: 0.10
    max_pct: 0.80
  fault_duration:
    min_pct: 0.10
    max_pct: 0.50
  severity:
    min: 0.2
    max: 0.7
  oven:
    temp_setpoint: 180
    temp_ambient_range: [-10, 50]
    humidity_range: [0, 100]
  sensors:
    - {name: "temp_zona1", unit: "C", range: [20, 250], noise_std: 1.2}
    - {name: "temp_zona2", unit: "C", range: [20, 250], noise_std: 1.2}
    - {name: "temp_zona3", unit: "C", range: [20, 250], noise_std: 1.2}
    - {name: "temp_salida_gases", unit: "C", range: [20, 300], noise_std: 1.5}
    - {name: "presion_camara", unit: "mbar", range: [-5, 10], noise_std: 0.5}
    - {name: "presion_ventilacion", unit: "mbar", range: [0, 50], noise_std: 0.5}
    - {name: "potencia_kw", unit: "kW", range: [0, 150], noise_std: 1.0}
    - {name: "flujo_gas", unit: "m3/h", range: [0, 30], noise_std: 0.2}
    - {name: "humedad_relativa", unit: "%", range: [0, 100], noise_std: 1.0}
    - {name: "temp_ambiente", unit: "C", range: [-10, 50], noise_std: 0.5}
    - {name: "setpoint_temp", unit: "C", range: [20, 250], noise_std: 0.0}
    - {name: "posicion_valvula", unit: "%", range: [0, 100], noise_std: 0.5}
    - {name: "velocidad_ventilador", unit: "RPM", range: [0, 2000], noise_std: 4.0}
  fault_types:
    - {name: "NORMAL", label: 0, description: "Operacion normal sin fallas"}
    - {name: "AISLAMIENTO_DEGRADADO", label: 1, description: "Deterioro del aislamiento termico"}
    - {name: "RESISTENCIA_DEGRADADA", label: 2, description: "Perdida de eficiencia en resistencias electricas"}
    - {name: "REFRACTARIO_EROSIONADO", label: 3, description: "Erosion de elementos refractarios"}
    - {name: "SENSOR_DESCALIBRADO", label: 4, description: "Sensor con lecturas erroneas"}
    - {name: "VALVULA_OBSTRUIDA", label: 5, description: "Valvula con flujo reducido"}
    - {name: "VENTILADOR_DEFECTUOSO", label: 6, description: "Ventilador con reduccion de extraccion"}

data_processing:
  target_column: "fault_name"
  id_column: "cycle_id"
  timestamp_column: "timestamp"
  normal_tokens:
    - "0"
    - "normal"
    - "none"
    - "ok"
    - "healthy"
    - "no failure"
    - "no fallo"
    - "sin falla"
    - "sin fallo"
    - "nofailure"
    - "nofallo"
    - "normal operation"
  sequence_length: 180
  solapamiento_beta: 0.5
  partial_null_max_ratio: 0.10
  fuzzy_processing:
    stats_creation: ["mean", "std", "slope", "max", "min"]
  external_data_split:
    train_pct: 66.7
    val_pct: 13.3
    test_pct: 20.0

model:
  lstm:
    hidden_size: 32
    num_layers: 2
    dropout: 0.30
    bidirectional: true
    embedding_dim: 32
  fuzzy:
    n_mf: 5
    n_rules: 24
    train_membership_params: true
    train_rule_params: true
    temperature: 0.8
    t_norm: "product"
    normalize_rules: true
    init_alpha: "sparse"
    use_log_bias: false
    lambda_anomaly: 0.7

training:
  shuffle_train: false
  batch_size: 256
  lr_rate: 0.00175
  warmup_epochs: 20
  weight_decay: 0.00001
  num_epochs: 200
  patience: 30
  grad_clip: 1.0
  scheduler:
    type: "cosine"
    factor: 0.6
    patience: 3
    min_lr: 0.00005
    T_max: 200
    T_mult: 2
    eta_min: 0.000009
  monitor_metric: "0.65*val_anomaly_f1 + 0.25*fuzzy_f1 - 0.05*dead_rules_ratio - 0.05*alpha_entropy_mean - 0.05*rule_corr"
  dnf_loss:
    anomaly_weight: 2.0
    aux_anom_dl_weight: 0.4
    aux_anom_fuzzy_weight: 0.95
    diversity_weight: 0.005
    alpha_entropy_weight: 0.01
    rule_structure_div_weight: 0.02
    rule_usage_balance_weight: 0.04
    reduction: "mean"
    eps: 0.00000001

inference:
  batch_size: 512
  solapamiento_beta: 0.5


xai:
  n_background: 64
  top_rules: 5
  top_variables: 8
  top_blocks: 3
  dataset_generation:
    interpretability_val:
      seed: 32
      n_cycles: 1500
      fault_ratio: 0.5
    actions_system_eval:
      seed: 40
      n_cycles: 500
      fault_ratio: 0.2
    xai_background:
      seed: 52
      n_cycles: 25
      fault_ratio: 0.5
  corrective_actions:
    strong_margin: 0.25
    weak_margin: 0.15
    branch_gap_threshold: 0.25
    support_ratio_min: 0.75  
  action_config:
    combustion_control_flujo:
      variables: ["flujo_gas", "posicion_valvula", "potencia_kw"] 
      actions:
        - "Verificar alimentación de gas y respuesta de la válvula de control."
        - "Comprobar restricciones en línea o desviaciones del lazo de control de caudal."
    termico:
      variables: ["temp_zona1", "temp_zona2", "temp_zona3", "temp_salida_gases"] 
      actions:
        - "Revisar estabilidad térmica del horno y la respuesta del sistema de aporte energético."
        - "Comprobar coherencia entre potencia aplicada y evolución de temperaturas."
    ventilacion_presion: 
      variables: ["presion_camara", "presion_ventilacion", "velocidad_ventilador"]
      actions:
        - "Inspeccionar ventilación y estado del actuador o ventilador."
        - "Comprobar si existen oscilaciones de control o respuesta lenta del sistema de aire."


