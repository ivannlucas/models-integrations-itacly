model_id: ml46_dairy_fouling_clog_detection
sector: lacteo
nombre: "Diseño y entrenamiento de un modelo DNSL para detectar incrustaciones y atascos en la maquinaria del procesado de la leche"
task_type: timeseries_multitask  # TCN causal multisalida: regresión (severidad, TTE/TTU) + clasificación (stage, 3 binarias) sobre ventanas de 120 pasos
task_type_note: >
  ACTUALIZACIÓN 2026-09-03 sobre el manifest anterior: el código entregado en inbox/a46/codigo/
  ha cambiado de forma sustancial desde la última extracción. Arquitectura, contrato de
  features (82 full / 76 no_clock) y escenario servido (no_clock) NO han cambiado -- lo que
  cambió es la escala real del dataset de entrenamiento, el split, los hiperparámetros
  persistidos y, en consecuencia, las métricas y TODOS los golden_cases (ver known_issues para
  el detalle exacto de cada cambio confirmado).
framework:
  - numpy>=1.23
  - pandas>=1.5
  - matplotlib>=3.6
  - scikit-learn>=1.1
  - torch>=2.0
  - PyYAML>=6.0
  # requirements.txt sigue sin fijar versiones exactas (>=) -- sin cambios respecto a la
  # extracción anterior.

artifacts:
  folder: models/artifacts/
  files:
    - selected_model.pt          # copia del checkpoint del escenario seleccionado (no_clock) -- HASH CAMBIADO, ver known_issues
    - model_manifest.json        # AHORA ~1MB (antes mucho más pequeño): incorpora inline feature_artifacts,
                                  # full/no_clock_feature_names, summary, artifact_contract e
                                  # inference_input_contract -- ya no hace falta reconstruir el contrato de
                                  # entrada leyendo código, el propio JSON lo declara (ver inputs de abajo)
    - artifact_contract.json     # NUEVO respecto al manifest anterior (antes "referenciado pero no entregado"):
                                  # ficha ligera (17 KB) con hashes de checkpoint/training_config/feature_artifacts
                                  # por escenario -- para verificar integridad sin cargar model_manifest.json completo
    - inference_input_contract.json  # NUEVO (antes "referenciado pero no entregado"), contract_version 1.3:
                                      # contrato formal de columnas requeridas/recomendadas/opcionales/prohibidas
                                      # por escenario, generado por el propio equipo de IA -- fuente de verdad
                                      # preferente sobre inputs.fixed/recommended/optional de abajo
    - inference_input_contract.csv   # NUEVO, misma información que el .json en tabla plana
    - feature_artifacts.json     # medianas/IQR/baselines por activo, pesos de clase, listas de features (full=82, no_clock=76) -- SIN cambios de forma, valores recalculados sobre el dataset nuevo
    - training_config.json       # TrainConfig persistida -- VALORES CAMBIADOS (batch_size/epochs), ver known_issues
    - scenarios/no_clock/best_model.pt   # checkpoint real usado en inferencia (selected_scenario = no_clock) -- RETRAINED, hash distinto
    - scenarios/full/best_model.pt       # alternativa conservadora (no seleccionada, no se sirve por defecto) -- RETRAINED, hash distinto
  extra_files_metrics:
    - models/metrics/no_clock_policy_thresholds.json  # necesario para reproducir la política de alertas; si falta, predictor.py cae a default_policy(train_cfg)
    - models/metrics/kpi_design_definition.json        # NUEVO (antes "referenciado pero no entregado") -- documenta la justificación/pesos del KPI compuesto de selección de escenario, puramente informativo para docs-generation

inputs:
  # Fuente de verdad ahora: models/artifacts/inference_input_contract.json (contract_version 1.3),
  # entregado formalmente por el equipo de IA -- ya no es necesario reconstruirlo leyendo
  # src/predict/predictor.py/src/training/data.py a mano (aunque se ha cross-verificado contra
  # ese código y coincide). El input funcional sigue sin ser una fila aislada: ver "window" abajo.
  fixed:
    # = inference_input_contract.json::required_raw_columns (= technical_minimum_required_raw_columns,
    # idénticas para full y no_clock) -- sin cambios respecto al manifest anterior.
    - {name: timestamp, type: datetime, description: "Marca temporal de cada muestra, ordenable y consistente por activo."}
    - {name: asset_id, type: string, description: "Identificador estable del activo/intercambiador."}
    - {name: flow_kg_s, type: float, unit: "kg/s"}
    - {name: pressure_in_kPa, type: float, unit: kPa}
    - {name: pressure_out_kPa, type: float, unit: kPa}
    - {name: dP_kPa, type: float, unit: kPa, description: "Pérdida de carga; debe ser coherente con pressure_in/out."}
    - {name: Th_in_C, type: float, unit: "°C"}
    - {name: Tc_in_C, type: float, unit: "°C"}
    - {name: Th_out_C, type: float, unit: "°C"}
    - {name: Tc_out_C, type: float, unit: "°C"}
    - {name: Twall_C, type: float, unit: "°C"}
    - {name: vibration_mm_s, type: float, unit: "mm/s"}
    - {name: flow_sp_kg_s, type: float, unit: "kg/s", description: "Consigna de caudal."}
    - {name: Th_sp_C, type: float, unit: "°C"}
    - {name: Tc_sp_C, type: float, unit: "°C"}
    - {name: protein_g_L_nominal, type: float, unit: "g/L"}
    - {name: fat_g_L_nominal, type: float, unit: "g/L"}
    - {name: solids_g_L_nominal, type: float, unit: "g/L"}
    - {name: Ca_mM_nominal, type: float, unit: mM}
    - {name: PO4_mM_nominal, type: float, unit: mM}
    - {name: pH_nominal, type: float, unit: pH}

  recommended:
    # = inference_input_contract.json::scenario_requirements.no_clock.recommended_operational_context
    - {name: phase, type: categorical, values: [production, CIP_alkaline, CIP_acid, idle, maintenance], description: "Delimita producción, CIP, idle y mantenimiento. Sin ella se asume production por defecto (ensure_columns)."}
    - {name: maintenance_active, type: boolean, description: "Indicador de mantenimiento activo; sin ella se asume 0."}

  optional:
    # = inference_input_contract.json::scenario_requirements.no_clock.optional_context (sin cambios de contenido)
    - asset_family      # standard_phe | robust_phe | compact_phe | unknown -- default "unknown"
    - milk_type          # whole | semi_skim | skim | high_solids | none -- default "none"
    - maintenance_type    # default "none"
    - ambient_T_C
    - ambient_RH_pct
    - batch_thermal_history_factor
    - last_maintenance_type
      # none | scheduled_CIP | CIP_extra | unclog | mechanical_clean | other -- default "none".
      # SIGUE SIN aparecer en el contrato OFICIAL nuevo (inference_input_contract.json v1.3) --
      # ni en required_raw_columns, ni en optional_context, ni en scenario_requirements.no_clock.
      # Solo aparece en metadata.dataset_fingerprint.telemetry.columns (fingerprint informativo del
      # dataset de origen, no una declaración de contrato de entrada). Sigue siendo una de las 76
      # features no_clock (one-hot lastmaint_*) que SÍ afecta materialmente a la predicción -- ver
      # known_issues, omisión ya reportada en la extracción anterior y AÚN NO corregida por el
      # equipo de IA pese a haber entregado un contrato de entrada formal nuevo.

  full_scenario_only:
    # = inference_input_contract.json::scenario_requirements.full.required_context_for_validated_performance
    # (scenario_requirements.no_clock.required_context_for_validated_performance = [] -- confirmado
    # que no_clock nunca los necesita, es la razón de ser del escenario ablacionado)
    - batch_elapsed_min
    - time_since_last_cip_min
    - time_since_last_maintenance_min

  prohibited:
    # = inference_input_contract.json::forbidden_production_input_columns -- ahora declarado
    # formalmente por el equipo de IA (antes se derivaba solo del código); lista idéntica a la de
    # la extracción anterior.
    - Rf_m2K_W
    - deposit_mass_kg
    - m_total_kg_m2
    - m_org_kg_m2
    - m_min_kg_m2
    - Rf_org_m2K_W
    - Rf_min_m2K_W
    - UA_W_K
    - Q_W
    - fouling_stage
    - fouling_stage_physical
    - fouling_stage_name
    - fouling_onset_event
    - clog_event
    - clog_onset_event
    - foul_score
    - fouling_onset_within_30min
    - clog_onset_within_15min
    - unplanned_event_within_60min
    - unplanned_fouling_within_120min
    - time_to_fouling_onset_min
    - time_to_clog_onset_min
    - time_to_unplanned_fouling_min
    - ttm_to_unplanned_event_min
    - ttm_to_planned_cip_min
    - fault_type
    - planned_event_type
    - maintenance_planned
    - rf_stage_thr_incipient
    - rf_stage_thr_advanced

  window:
    seq_len: 120
    stride: 5
    receptive_field_steps: 125
    note: >
      Sin cambios respecto a la extracción anterior: predict() batch construye las ventanas
      internamente a partir de un CSV de telemetría ordenado por asset_id/timestamp
      (src/predict/predictor.py::_prepare_sequences + make_sequences). No existe modo de
      predicción de "una sola fila"; el mínimo operativo real sigue siendo un historial continuo
      de al menos 120 minutos por activo.
    baseline_history_note: >
      Sin cambios de mecanismo respecto a la extracción anterior (estimate_prefix_baseline(),
      baseline_prefix_hours=8h) -- pero el conjunto de activos "vistos en entrenamiento" ha
      cambiado por completo: ahora hay baselines fijos (train_asset_baselines en
      feature_artifacts.json) para los 61 activos de train, no solo 6. Los 20 activos de test
      actuales (ver golden_cases) siguen siendo NO vistos en entrenamiento, así que sigue
      aplicando estimate_prefix_baseline() para todos ellos -- no se ha re-verificado
      empíricamente la magnitud de la desviación sobre el dataset nuevo (la cifra "~8%" de la
      extracción anterior corresponde al dataset de 10 activos ya obsoleto).

outputs:
  # Sin cambios respecto a la extracción anterior -- mismos 8 heads del TCN, misma arquitectura.
  predict_inline:
    - {name: pred_severity, type: float, description: "Severidad física de ensuciamiento actual, desescalada a Rf_m2K_W."}
    - {name: pred_stage, type: int, values: [0, 1, 2], description: "Estado físico: 0=stable, 1=incipient, 2=advanced."}
    - {name: pred_stage_name, type: string, values: [stable, incipient, advanced]}
    - {name: p_stage0, type: float}
    - {name: p_stage1, type: float}
    - {name: p_stage2, type: float}
    - {name: p_foul_h, type: float, alias: p_watch_fouling, description: "Probabilidad de inicio de ensuciamiento en 30 min."}
    - {name: p_actionable_foul_h, type: float, alias: p_actionable_fouling, description: "Probabilidad de ensuciamiento no planificado en 120 min."}
    - {name: p_clog_h, type: float, description: "Probabilidad de inicio de obstrucción en 15 min."}
    - {name: pred_tte_foul_min, type: float, description: "Tiempo estimado hasta inicio de ensuciamiento (cap 240 min)."}
    - {name: pred_tte_clog_min, type: float, description: "Tiempo estimado hasta inicio de obstrucción (cap 120 min)."}
    - {name: pred_ttu_min, type: float, description: "Tiempo estimado hasta próxima intervención no planificada (cap 360 min)."}

  alerts:
    - alert_episode_id
    - is_alert_episode
    - n_signals
    - predicates: [HighDP, LowFlow, HighVib, ThermalDrop, DPRising, VibSpike]
      description: "Predicados explicativos legibles combinados con probabilidades/severidad/tiempos."

training:
  supported: true
  target_column: Rf_m2K_W
  required_columns:
    hard_required: [timestamp, asset_id, Rf_m2K_W]
    recommended: [flow_kg_s, pressure_in_kPa, pressure_out_kPa, dP_kPa, Th_in_C, Tc_in_C, Th_out_C, Tc_out_C,
                  Twall_C, vibration_mm_s, flow_sp_kg_s, Th_sp_C, Tc_sp_C, protein_g_L_nominal, fat_g_L_nominal,
                  solids_g_L_nominal, Ca_mM_nominal, PO4_mM_nominal, pH_nominal, phase, maintenance_active]
    source: codigo_entrenamiento
  hyperparams:
    # CAMBIADOS respecto a la extracción anterior (batch_size=64/epochs=8) -- valores REALES
    # persistidos ahora en models/artifacts/training_config.json. AHORA SÍ coinciden con la
    # Tabla 14/15 de la memoria (batch_size=128, epochs=4) -- ver known_issues, la discrepancia
    # memoria-vs-código de la extracción anterior queda resuelta en esta entrega.
    batch_size: 128
    epochs: 4
    lr: 0.001
    weight_decay: 0.00001
    seed: 7
    channels: 64
    dilations: [1, 2, 4, 8, 16]
    dropout: 0.15
    seq_len: 120
    stride: 5
    fouling_horizon_min: 30
    clog_horizon_min: 15
    unplanned_fouling_horizon_min: 120
    tte_fouling_cap_min: 240
    tte_clog_cap_min: 120
    ttu_cap_min: 360
    baseline_prefix_hours: 8.0
    match_window_min: 240
    split_trials: 500  # CAMBIADO (antes 3000) -- asset_split_report.json::trials real
    ablate_clocks: true
    source: codigo_entrenamiento  # models/artifacts/training_config.json (persistido por train_pipeline)
  metrics_returned:
    - severity_rmse
    - severity_mae
    - stage_accuracy
    - stage_macro_f1
    - stage_balanced_accuracy
    - watch_foul_auc
    - watch_foul_ap
    - watch_foul_f1
    - actionable_foul_auc
    - actionable_foul_ap
    - actionable_foul_f1
    - clog_h_auc
    - clog_h_ap
    - clog_h_f1
    - tte_foul_mae_min
    - tte_clog_mae_min
    - ttu_mae_min
  note: >
    Sin cambios de mecanismo: train() (src/main.py::train -> src/training/pipeline.py::train_pipeline)
    reentrena AMBOS escenarios (full y no_clock) desde cero sobre el CSV de telemetría de entrada.
    No es fine-tuning incremental sobre el checkpoint existente.

constraints:
  scenario_selected: no_clock  # sin cambios; checkpoint servido = scenarios/no_clock/best_model.pt
  prohibited_input_columns: true
  descripcion: >
    Sin cambios respecto a la extracción anterior: no hay restricción de negocio tipo "rechazar
    predicción si X". La única restricción dura es de integridad de datos (inputs.prohibited).

# Métricas REALES del model_manifest.json entregado (escenario no_clock, split test = 20 de 100
# activos, 2.288.800 filas totales de telemetría). CAMBIO MAYOR respecto a la extracción anterior:
# estas cifras SÍ coinciden ahora con las de la memoria (p.ej. tte_foul_mae_min=32.6,
# ttu_mae_min=45.0) -- ver known_issues.
