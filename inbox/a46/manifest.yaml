  - >
    RESUELTO respecto a la extracción anterior: la discrepancia mayor "memoria vs. artefactos
    entregados" (dataset de 10 activos/198.615 filas en vez de los 100 activos/2.288.800 filas
    que describe la memoria) YA NO EXISTE. El código entregado ahora en inbox/a46/codigo/
    contiene el dataset completo de 100 activos (confirmado: data/processed/telemetry_processed.csv
    tiene 2.288.800 filas de datos) con split 61 train / 21 val (incluye fila de cabecera
    duplicada en el conteo de asset_split_report.json, revisar) / 20 test -- coincide con la
    Tabla 2 de la memoria (60/20/20). Las métricas de test reales también coinciden ahora con las
    de la memoria (tte_foul_mae_min=32.6 min, ttu_mae_min=45.0 min -- idénticas a los valores que
    la extracción anterior señalaba como "solo en la memoria, no reproducibles").
  - >
    RESUELTO respecto a la extracción anterior: los hiperparámetros persistidos en
    training_config.json ahora son batch_size=128/epochs=4, coincidiendo con la Tabla 14/15 de
    la memoria (antes: 64/8, discrepante).
  - >
    RESUELTO PARCIALMENTE: los ficheros que la memoria anterior referenciaba sin que existieran
    en el paquete (inference_input_contract.json, artifact_contract.json,
    kpi_design_definition.json, models/metrics/stats/qc/sequence_diversity_qc.json) SÍ existen
    ahora en el paquete entregado. inference_input_contract.json (contract_version 1.3) es
    especialmente valioso: formaliza el contrato de entrada que antes había que reconstruir leyendo
    código, y coincide con lo ya documentado en la extracción anterior salvo por la omisión de
    last_maintenance_type (ver abajo, sigue sin resolverse).
  - >
    NO RESUELTO: last_maintenance_type sigue sin aparecer en ninguna lista de columnas
    requeridas/recomendadas/opcionales del contrato de entrada OFICIAL nuevo
    (inference_input_contract.json v1.3) -- solo aparece en metadata.dataset_fingerprint (huella
    informativa del dataset de origen, no una declaración de contrato). Sigue siendo una de las 76
    features no_clock (one-hot lastmaint_*) que afecta materialmente a la predicción según lo
    verificado en la extracción anterior. El equipo de IA ha tenido oportunidad de corregir esto
    al entregar el contrato formal nuevo y no lo ha hecho -- recomendado insistir explícitamente
    en la próxima ronda de reconciliación con el equipo de IA.
  - >
    CAMBIO DE CÓDIGO (no solo de datos) detectado en src/training/features.py::apply_feature_artifacts
    del código entregado: ahora incluye validate_feature_artifacts() + comprobaciones explícitas de
    columnas numéricas faltantes, medianas/IQR faltantes e IQR inválido (<=0 o no finito), que lanzan
    ValueError con mensaje explícito en vez de fallar silenciosamente o más adelante con un error
    críptico. El _vendor/features.py del plugin (app/plugins/ml46_dairy_fouling_clog_detection/_vendor/)
    NO tiene estas comprobaciones todavía -- pendiente de sincronizar en el skill plugin-integration.
    src/training/data.py también difiere sustancialmente (277 líneas vendorizadas vs. 402 líneas
    en el original actual) -- requiere revisión línea a línea en plugin-integration antes de dar
    por buena la sincronización (fuera del alcance de esta actualización de manifest, que se limita
    a datos/contrato/golden_cases).
  - >
    NUEVO hallazgo en metrics_reported.event.per_type: sobre el split de test nuevo, el modelo NO
    detecta ningún evento de "fouling" a nivel de episodio consolidado (recall=0.0, 0 de 41 eventos),
    pese a que watch_foul_auc=0.986 a nivel de ventana es alto. La degradación ocurre en
    evaluation.py::consolidate_alerts (política de alertas), no en el TCN. No investigado a fondo
    en esta actualización -- recomendado como línea de trabajo antes de considerar el modelo listo
    para producción, especialmente dado que "fouling" es uno de los dos modos de fallo que el
    modelo dice detectar.
  - >
    Reproducibilidad numérica RE-VERIFICADA con el dataset/split nuevo: se ejecutó
    `python scripts/predict.py --input data/splits/test_rows.csv --scenario no_clock --device cpu`
    (código original sin modificar, artefactos reales tal cual entregados, CUDA_VISIBLE_DEVICES=""
    para forzar CPU en un entorno con GPU incompatible) sobre las 470.692 filas del split de test
    completo (20 activos) -- 78.337 ventanas puntuadas. Los 14 golden_cases de arriba son una
    muestra de esa ejecución real (5 stage=0, 5 stage=1, 4 stage=2, reales de fault_type distintos).
    Pendiente (fuera de alcance de manifest-extraction): re-ejecutar la comparación bit-a-bit
    plugin vendorizado vs. código original que sí se hizo en la extracción anterior para caso_001 --
    debe rehacerse en el skill verification dado que _vendor/data.py y _vendor/features.py del
    plugin están desincronizados del código actual (ver known_issue de arriba).
  - >
    Dataset 100% sintético (sin cambios): generado por src/data_processing/synthetic_generator.py,
