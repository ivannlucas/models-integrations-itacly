known_issues:
  - "[RESUELTO 2026-10-02] /predict (inline Y batch) devolvía 500 en TODA llamada real, sin
    excepción: predict_inline/predict_batch construían y devolvían un dict Python plano en vez
    de una instancia de PredictInlineResponse/PredictBatchResponse (predict_dto.py). El use
    case genérico (predict_model_use_case.py:84) hace `type(result).model_validate(...)` sobre
    el valor devuelto por el plugin — con un dict, `type(result)` es la clase builtin `dict`,
    que no tiene `.model_validate`, y la petición caía con 500
    ('type object 'dict' has no attribute 'model_validate''). Nunca detectado porque los tests
    de conftest.py usan FakePlugin con factories que sí devuelven las respuestas tipadas
    correctas — nunca ejercitan el return real del plugin. Confirmado end-to-end contra el
    servidor real (MODEL=ml21-cereals-price-spatial python main.py): antes de la corrección,
    /predict devolvía 500 para inline Y batch con cualquier input válido; tras envolver los
    returns en PredictInlineResponse(...)/PredictBatchResponse(...), ambos devuelven 200."
  - "[RESUELTO 2026-10-02] GAP ARQUITECTÓNICO CRÍTICO en predict_inline: el caller solo aporta
    provincia/cereal_predominante/date (inputs.fixed). El código original (run_single() en
    src/predict/predict_v1.py) resuelve las ~90 columnas de ingeniería restantes (lat_centroide,
    month_sin/cos, fase_siembra/crecimiento/cosecha, lags de precios, clima, índices MAPA...)
    buscando la fila correspondiente en dataset_entrenamiento_final.csv. La integración inicial
    del plugin NO implementaba este lookup — reindexaba a 0 cualquier columna esperada que
    faltara, corrompiendo silenciosamente toda predicción hecha con el contrato documentado.
    Corregido en preprocessing.py::lookup_panel_row + plugin.py::predict_inline, añadiendo el
    dataset como artefacto obligatorio (ver artifacts.files)."
  - "[RESUELTO 2026-10-02] causal_drivers era un string fijo ('No hay importancias disponibles').
    El original calcula feature_importance real desde los modelos entrenados y rankea los top-3
    por z-score * importancia (_extract_feature_importance + _top_causal_drivers). Corregido en
    explain.py, calculado en load() (metadata no trae feature_importance de fábrica) y persistido
    de nuevo en cada train()."
  - "[RESUELTO 2026-10-02] app/registry.py no conectaba train_request_type/train_response_type
    para este modelo pese a tener train() implementado de verdad (GridSearchCV) — el endpoint
    /train caía en el DTO genérico, exigiendo mlflow_run_id (422 en toda llamada sin ese campo) y
    descartando silenciosamente las métricas mae_h*/pearson_h*/da_h*/auc_h*/n_train/n_test de la
    respuesta real. Los tests en conftest.py ya conectaban el TEST_REGISTRY correctamente, lo que
    enmascaraba el bug (pytest en verde probando un registro distinto del de producción)."
  - "SIN SPLITS EXPLÍCITOS: el código no genera splits train/test exportados. Los golden cases
    se generaron extrayendo filas del dataset base (dataset_entrenamiento_final.csv) con
    date >= CUT_DATE (2021-01-01), ejecutando el plugin corregido end-to-end (ver golden_cases)."
  - "BLACKLIST CRÍTICO: las columnas precio_provincial_lag_1/2/3 y precio_nacional_base_*
    contienen información del target y DEBEN excluirse de features (prepare_data.BLACKLIST).
    El plugin replica este filtrado exacto (preprocessing.BLACKLIST)."
  - "FEATURE ENCODING: el código usa pd.get_dummies() con drop_first=False sobre columnas
    object/category, y reindexa alfabéticamente. Esto genera columnas one-hot como
    'provincia_Burgos', 'cereal_predominante_trigo', etc. El plugin replica este
    encoding exacto para alinear con expected_columns del metadata."
  - "MODELOS POR HORIZONTE: H1/H2 usan ExtraTrees (regresión) + LogisticRegression (clasificación).
    H3 usa XGBoost (regresión) + LogisticRegression (clasificación). El plugin debe cargar los
    6 modelos y usar el correcto por horizonte."
  - "ENTRENAMIENTO REQUIERE DATASET COMPLETO: training.required_columns incluye todas las
    columnas del dataset base. El dataset (dataset_entrenamiento_final.csv) ahora SÍ se incluye
    en artifacts — debe estar en data/processed/ para poder reentrenar."
  - "REENTRENAMIENTO IMPLEMENTADO: train() ejecuta GridSearchCV sobre los mismos modelos del
    repo original (ExtraTrees para H1/H2 reg, XGBoost para H3 reg, LogisticRegression para clf).
    Sube artefactos a MLflow. El CSV de entrada debe ser el dataset_entrenamiento_final.csv con
    las columnas target incluidas."
  - "FEATURES CON ESPACIOS: prepag1_urea 46, prepag2_paja cereales, prepag2_torta de girasol
    contienen espacios. El encoding one-hot genera columnas con estos espacios — el plugin
    debe preservarlos exactamente."
