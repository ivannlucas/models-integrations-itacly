# Configuración para DATAGIA-21
# Google Earth Engine project ID para descargas de datos climáticos
gee_project_id: "tu-proyecto-gee"

# Configuración de market data ingestion
markets:
  tickers:
    - "ZC=F"  # CBOT Corn
    - "ZW=F"  # CBOT Wheat
    - "W.PA"  # MATIF Wheat (puede estar delisted)

# Rango de fechas para la ingesta de clima (GEE). Ajustar start_date al mes
# siguiente al último dato ya presente en climate_monthly_provinces.csv para
# no volver a descargar histórico ya procesado. end_date es opcional: si se
# omite, ingest_weather_gee.py usa la fecha de hoy por defecto.
weather:
  start_date: "2026-08-01"

# Configuración general
data:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  
models:
  artifacts_dir: "models/artifacts"
  metrics_dir: "models/metrics"
