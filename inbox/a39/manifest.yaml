model_id: ml39-wine-predictive-maintenance-xai
sector: vitivinicola
nombre: "Implementación del modelo XAI para la visualización de los ciclos de reparación o mantenimiento de la maquinaria"
task_type: explainability_layer (Integrated Gradients + SHAP, sobre un clasificador multitarea de secuencias ya entrenado)
framework: [tensorflow==2.19.0 (import directo, no vía Keras 3 standalone), shap>=0.45,<1, scikit-learn (t-SNE/calibración, no usado en vivo), numpy, pandas, scipy, matplotlib/seaborn (solo reportes offline)]

# ── Relación con a37 (OBLIGATORIO leer antes de tocar plugin-integration) ──────────────────────
# a39 NO es un modelo nuevo de dominio: es la capa de explicabilidad (XAI) del Entregable 37
# (ml37-wine-press-predictive-maintenance). Opera sobre el MISMO dataset, la MISMA arquitectura
# LSTM multitarea y el MISMO run_id de referencia (no_virtual_v1__rand_scool) que a37 -- no
# entrena nada propio. Confirmado con evidencia real (ver known_issues):
#   - best_model.keras de a39 es BIT A BIT IDÉNTICO al de a37 (md5 c9852308aee35d871bd5a10f2d277b5b)
#   - scaler.json / class_mappings.json / train_config.json de a39 tienen contenido numérico
#     idéntico a los de a37 (solo difiere el formato/whitespace del JSON, no los valores)
# Precedente ya resuelto en este mismo repo para esta misma relación (modelo base + modelo XAI
# companion): ml47_dairy_dnsl_pasteurization_fault_detection (base) +
# ml48_dairy_dnsl_critical_point_detection (XAI companion, con su propia copia de los pesos de
# ml47 bajo su propio ARTIFACT_FOLDER_NAME, y predict_inline/predict_batch con include_shap/
# include_cam). a39 debe seguir exactamente ese mismo patrón, no inventar uno nuevo.

# ── Decisión de alcance: qué de la capa XAI entregada se sirve EN VIVO vs. qué queda OFFLINE ──
# El entregable de a39 (src/xai/xai_analysis.py, run_xai_analysis) implementa 4 técnicas:
# Integrated Gradients, SHAP GradientExplainer, t-SNE del embedding latente, y calibración
# (Brier Score / reliability diagram) + concordancia neurosimbólica. El comando `xai` del CLI
# original es un barrido batch de AUDITORÍA sobre TODO el split de test de un run_id (genera
# PNGs/CSV/manifest), y el propio README dice explícitamente que NO admite --input-package
# (no se puede pedir una explicación de un ciclo nuevo bajo demanda con el CLI tal cual).
#
# Sin embargo, verificado con el código real (ver golden_cases): tanto `_integrated_gradients`
# (línea 143 de xai_analysis.py) como `shap.GradientExplainer(...).shap_values(...)` son
# funciones genuinamente aplicables a UN SOLO ciclo nuevo (no dependen de iterar el test set
# completo, solo de tener un tensor de entrada y el modelo cargado) -- técnicamente SÍ se puede
# construir un endpoint predict_inline/predict_batch que explique un ciclo bajo demanda,
# reutilizando esas mismas funciones tal cual, igual que ml48 ya hace con Grad-CAM/SHAP.
#
# DECISIÓN (para que el ticket DATAPLAT-525 cumpla su objetivo real: "mostrar la explicación
# junto a la predicción de a37 en el front"):
#   - EN VIVO (predict_inline/predict_batch del plugin ml39): Integrated Gradients por ciclo y
#     por head, siempre: importancia por sensor (|IG| medio sobre los 600 timesteps) para la
#     clase predicha. SHAP por ciclo y por head como opción (include_shap, análogo a ml48),
#     con un `shap_background.npy` persistido como artefacto propio (muestras fijas de train,
#     mismo rol que en ml48) -- más costoso en CPU, igual que advierte la memoria de ml48.
#   - OFFLINE / fuera del contrato del plugin: t-SNE del embedding latente, calibración
#     (Brier Score, reliability diagram), concordancia IG-SHAP a nivel de todo el test set, y
#     concordancia neurosimbólica agregada. Son análisis de AUDITORÍA sobre el conjunto de test
#     completo (no una explicación de un ciclo concreto) y así los trata el propio entregable;
#     seguirán ejecutándose como el script CLI original (`python src/main.py xai`), no como
#     parte de la API. Esto NO es una omisión silenciada: queda documentado aquí y debe quedar
#     documentado también en la ficha técnica/funcional de a39.

artifacts:
  folder: models/artifacts/no_virtual_v1__rand_scool/
  files:
    - best_model.keras      # idéntico al de a37, ver nota de relación arriba
    - scaler.json
    - class_mappings.json
    - train_config.json
  # Artefacto NUEVO que plugin-integration debe generar (no viene en el entregable tal cual,
  # el entregable muestrea el background de SHAP en caliente dentro de run_xai_analysis):
  nuevo_artefacto_a_persistir:
    shap_background.npy: "muestra fija de shap_n_bg ciclos de train (ver xai.profiles.*.shap_n_bg
      en config.yaml: 24 en audit, 80 en full), tomada con rng=np.random.default_rng(42) sobre
      train_idx del split oficial de a37 -- debe fijarse una vez y persistirse, no re-muestrearse
      en cada predict_inline (mismo patrón que ml48/shap_background.npy)."

inputs:
  fixed:
    # Idéntico al contrato de inputs de a37 -- mismo ciclo, mismos 14 sensores físicos, mismo
    # orden. No se derivan inputs nuevos propios de a39.
    - {nombre: sensores_ciclo, tipo: "array (600, 14) float", descripcion: "Serie temporal de los 14 sensores físicos de un ciclo completo, en el orden fijo PS1..VS1 -- igual que a37"}
    - {nombre: mlflow_run_id, tipo: string, descripcion: "No aplica a reentrenamiento (a39 no entrena); reservado por consistencia de contrato con el resto de plugins del repo"}
    - {nombre: include_shap, tipo: bool, descripcion: "Si true, añade importancia SHAP por sensor y por head (coste alto en CPU, ~pocos segundos por ciclo); por defecto false. Mismo patrón que ml48."}

outputs:
  predict_inline:
    - {nombre: "ig_importance_<target>", descripcion: "dict sensor->float: |IG| medio sobre los 600 timesteps para la clase predicha de ese head (cooler/valve/pump/accumulator), calculado con target_class_idx=None (clase de máxima confianza) -- igual semántica que xai_analysis.py"}
    - {nombre: "shap_importance_<target>", descripcion: "dict sensor->float, solo si include_shap=true: |SHAP| medio sobre los 600 timesteps y las clases, usando shap_background.npy persistido como contexto fijo"}
  neurosymbolic_concordance_note:
    - "NO expuesto en el endpoint en vivo -- ver 'Decisión de alcance' arriba. Queda como análisis offline (script CLI heredado)."

constraints:
  reutilizacion_estricta_de_artefactos: "a39 nunca reajusta ni reentrena scaler/mappings/modelo
    con datos propios -- los consume tal cual de a37 (principio de diseño explícito de la
    memoria, sección 4.3: 'Reutilización estricta de artefactos operativos')."
  shap_opcional_por_coste: "shap.GradientExplainer tarda varios segundos por ciclo en CPU
    (confirmado con una ejecución real en este entorno) -- debe ser opt-in (include_shap),
    nunca el comportamiento por defecto de predict_inline/predict_batch, mismo patrón que
    ml48 (include_shap=false por defecto, n_samples limitado en batch)."

metrics_reported:
  # TODAS las cifras de esta sección son IDÉNTICAS a las de a37 (mismo modelo, mismo test set) --
  # confirmado también en la Tabla 5 de la memoria de a39 (coincide dígito a dígito con
  # metrics_test.json de a37). Se citan aquí solo como contexto para los criterios de "robustez
  # explicativa" de abajo, NO como una métrica nueva de a39.
  cooler: {accuracy: 0.9668, balanced_accuracy: 0.9667, f1_macro: 0.9666, support: 331}
  valve: {accuracy: 0.4683, balanced_accuracy: 0.2804, f1_macro: 0.2499, support: 331}
  pump: {accuracy: 0.6495, balanced_accuracy: 0.5677, f1_macro: 0.5624, support: 331}
  accumulator: {accuracy: 0.5498, balanced_accuracy: 0.5452, f1_macro: 0.5299, support: 331}

  # Métricas PROPIAS de la capa XAI (memoria, Tablas 4/5/6 y texto) -- referencia de tolerancia
  # para la verificación posterior del perfil `full`, no caso verificable 1:1 porque dependen
  # de muestreo aleatorio (SHAP/t-SNE), aunque son reproducibles con seed=42 fijo:
  separabilidad_latente_silhouette: {cooler: 0.5196, valve: -0.0448, pump: 0.0232, accumulator: 0.0011}
  brier_score: {cooler: 0.0177, valve: 0.1512, pump: 0.1427, accumulator: 0.1377}
  concordancia_ig_shap_spearman_r_perfil_full: {cooler: 0.9165, valve: 0.6484, pump: 0.6044, accumulator: 0.7978}
  concordancia_ig_shap_spearman_r_perfil_audit: {cooler: 0.9253, valve: 0.8681, pump: 0.5824, accumulator: 0.6264}
  umbral_robustez_explicativa_memoria: "r de Spearman IG-SHAP > 0.70 por head. Con perfil full
    (el que reporta la memoria): cooler y accumulator lo superan, valve y pump NO. Con perfil
    audit (el que se ejecutaría por defecto sin --profile): el dictamen de valve y accumulator
    se INVIERTE respecto al de full -- ver known_issues, es una discrepancia real y citada
    explícitamente en el propio README del entregable, no un hallazgo nuevo de esta extracción."
  tasa_confirmacion_neurosimbolica: {cooler: 0.990, valve: 0.014, pump: 0.158, accumulator: 0.244}
  kpi_negocio: >
    Reducción del 20% del tiempo de inactividad no planificado (heredado de a37). La propia
    memoria de a39 lo marca expresamente como NOT_DEMONSTRATED -- ningún análisis XAI mide ni
    puede medir este KPI, porque el dataset UCI no registra downtime/intervenciones reales.

training:
  supported: false
  target_column: null
  required_columns: null
  hyperparams: null
  metrics_returned: null
  source: codigo_entrenamiento
  source_note: >
    Verificado explícitamente en el código (no asumido por el texto): el único comando `train`
    del CLI de a39 (src/main.py, delegando en src/training/trainer.py) es una copia literal del
    entrenamiento de a37 -- no es un entrenamiento propio de la capa XAI. El paquete src/xai/ no
    define ninguna función de entrenamiento; Integrated Gradients y SHAP son deterministas dado
    un modelo ya entrenado y una semilla fija (seed=42), no tienen parámetros que ajustar. Por
    tanto training.supported=false es correcto para el ALCANCE de este plugin (la capa XAI), no
    porque "falte" código de entrenamiento -- ese código existe pero pertenece a a37 y ya está
    cubierto por su propio plugin (ml37-wine-press-predictive-maintenance). No se re-expone
    aquí para no duplicar la superficie de reentrenamiento de dos plugins sobre el mismo modelo.

golden_cases:
  source_note: >
    Los 20 casos de abajo son los MISMOS 20 cycle_id reales que inbox/a37/manifest.yaml (mismo
    dataset, mismo test split, mismo run_id no_virtual_v1__rand_scool) -- elegidos así a
    propósito para que la verificación de a39 pueda cruzarse directamente con la de a37 (misma
    predicción base, explicación nueva). Los valores de ig_top3_por_head de abajo son REALES:
    calculados en esta extracción ejecutando _integrated_gradients tal cual está en
    inbox/a39/codigo/src/xai/xai_analysis.py (steps=50, target_class_idx=None, es decir sobre
    la clase de máxima confianza -- perfil `full`), cargando el artefacto real
    artifacts/ml37_wine_press_predictive_maintenance/best_model.keras con TensorFlow real
    (ver known_issues sobre el entorno) y el tensor real X.npy de
    inbox/a37/codigo/data/processed/tensors/. NO son cifras inventadas ni extrapoladas.
  verificacion_cualitativa: >
    El hallazgo cualitativo de la memoria se reproduce de forma independiente: para `cooler`,
    el sensor dominante en varios ciclos es PS6 (presión) o PS4, NO un sensor térmico (TS*) como
    cabría esperar físicamente -- coincide exactamente con lo que describe la memoria ("el
    sensor con mayor |IG| es PS6, no un sensor térmico"). Esto confirma que la ejecución real
    de esta extracción reproduce el comportamiento documentado, no un artefacto de mi propio
    script.
  tolerancia: "Para plugin-integration: coincidencia exacta de ranking (top-3 sensores, mismo
    orden) y valores |IG| con tolerancia relativa 1% (determinista dado el modelo, el tensor de
    entrada y steps=50 fijos -- no hay aleatoriedad en Integrated Gradients, a diferencia de
    SHAP/t-SNE). Para SHAP, ver known_issues sobre reproducibilidad antes de fijar una
    tolerancia -- probablemente haga falta fijar literalmente la misma secuencia de
    np.random.default_rng(42) y los mismos índices de background para que el golden case sea
    determinista bit a bit."
