known_issues:
  - "[a39 NO ES UN MODELO NUEVO -- ES LA CAPA XAI DE a37] Confirmado con evidencia real: los
     pesos (best_model.keras) de a39 son MD5-idénticos a los de a37 (c9852308aee35d871bd5a10f2d277b5b).
     scaler.json/class_mappings.json/train_config.json tienen contenido numérico idéntico (solo
     cambia el formato JSON). Ver sección 'Relación con a37' al principio de este manifest."
  - "[ORIGEN DEL DATASET] Heredado de a37: NO es un dataset vitivinícola real, es el UCI
     'Condition Monitoring of Hydraulic Systems' (banco de pruebas de laboratorio). Debe quedar
     igual de explícito en la documentación de a39 -- no se diluye por ser 'solo explicabilidad'."
  - "[ALCANCE EN VIVO vs OFFLINE, decisión explícita] El entregable completo incluye 4 técnicas
     XAI (IG, SHAP, t-SNE, calibración) + concordancia neurosimbólica. Solo IG (siempre) y SHAP
     (opcional, include_shap) se sirven en vivo por ciclo en el plugin; t-SNE/calibración/
     concordancia-agregada quedan como análisis offline de auditoría (el script CLI original
     sobre el run completo), no se reimplementan como endpoint. Ver razonamiento completo arriba."
  - "[DISCREPANCIA audit vs full en el criterio de robustez explicativa] Con perfil full (el que
     reporta la memoria), el criterio r-Spearman-IG-SHAP>0.70 lo cumplen cooler y accumulator,
     no valve ni pump. Con perfil audit (el que correría el CLI por defecto sin --profile), el
     dictamen de valve y accumulator SE INVIERTE. Esto es textual del propio README del
     entregable, no un hallazgo nuevo -- pero es crítico para cualquier verificación que se haga
     del plugin: si se verifica con parámetros tipo 'audit' (steps/n_samples reducidos para que
     el smoke test sea barato), los resultados de concordancia NO son comparables a los
     publicados en la memoria (que usan full). El golden_cases de este manifest usa steps=50
     (equivalente a ig_steps del perfil full) precisamente para evitar esta trampa."
  - "[REPRODUCIBILIDAD DE SHAP] El código fija semilla (np.random.default_rng(42),
     tf.keras.utils.set_random_seed(42), tf.config.experimental.enable_op_determinism()) --  en
     teoría determinista. Verificado que SHAP corre en este entorno (shap.GradientExplainer
     sobre el modelo real, forma de salida correcta por head), pero NO se ha verificado aún que
     dé exactamente los mismos valores que el entregable original (requeriría replicar
     exactamente la misma secuencia de llamadas al rng para el muestreo de background/explicación
     -- pendiente para plugin-integration/verification, no bloqueante para el manifest)."
  - "[ENTORNO: TensorFlow SÍ funciona en este sandbox para a39, a diferencia de lo que cabría
     esperar por la experiencia de a37] a37 tuvo que evitar TensorFlow por completo (sin wheel
     para Python 3.14 en ese momento) y cargar el modelo vía Keras 3 standalone con
     backend=torch. a39 SÍ necesita TensorFlow real (tf.GradientTape, tf.keras.utils.set_random_seed,
     tf.config.experimental.enable_op_determinism) porque xai_analysis.py importa tensorflow
     directamente, no vía el paquete keras standalone. Verificado en esta extracción: pip install
     tensorflow instala 2.22.0-rc1 (release candidate, NO la versión exacta 2.19.0 del
     requirements.txt) para este Python 3.14, y con ella: (a) best_model.keras carga
     correctamente con tf.keras.models.load_model, arquitectura y nº de parámetros idénticos a
     la carga vía Keras 3 standalone que ya verificó a37 (31.950 parámetros entrenables); (b)
     _integrated_gradients corre y reproduce el hallazgo cualitativo de la memoria (PS6/PS4
     dominan en cooler, no los sensores térmicos esperados); (c) shap.GradientExplainer corre
     sin errores. Pendiente para plugin-integration: decidir si fijar tensorflow==2.19.0 exacto
     (puede no tener wheel en el entorno de despliegue real) o relajar el pin como hace a37 con
     sus otras dependencias, documentando el riesgo de usar un release candidate (2.22.0-rc1) si
     no hay alternativa estable para la versión de Python del entorno de producción."
  - "[DESCUBIERTO EN plugin-integration — CONTAMINACIÓN REAL DE PROCESO, NO SOLO DE TESTS]
     importar app.registry (lo que hace main.py SIEMPRE, con o sin MODEL) importa
     incondicionalmente el módulo de TODOS los plugins, incluido
     ml1_wine_pest_disease_detection/model_loader.py (y, cuando se mergee, el de a37), que
     ejecuta os.environ.setdefault('KERAS_BACKEND', 'torch') a nivel de módulo. Keras 3 fija su
     backend en el primer import del proceso, así que esto hace que tf.keras quede respaldado
     por el paquete keras standalone con backend=torch, NO por TensorFlow real, para el resto
     del proceso — rompe tf.GradientTape (no puede diferenciar un tensor de torch:
     'RuntimeError: Can't call numpy() on Tensor that requires grad'). Esto ocurre incluso con
     MODEL=ml39-wine-predictive-maintenance-xai en solitario, porque el import de app.registry
     no es condicional al filtro MODEL. Verificado reproduciendo el fallo real contra el
     servidor (curl a /predict devolvía 500 con ese mensaje) antes del arreglo.
     SOLUCIÓN APLICADA en el plugin (inference.py): Integrated Gradients detecta el backend
     real de Keras 3 en tiempo de ejecución (keras.config.backend()) y usa tf.GradientTape o
     torch.autograd según corresponda — misma fórmula matemática, mecanismo de autodiff
     distinto. Verificado end-to-end contra el servidor real con el proceso contaminado
     (backend=torch): los 20 golden cases se siguen reproduciendo exactos. SHAP NO tiene vía
     nativa de torch en este plugin: con backend=torch, include_shap=true falla con un 500
     explícito y diagnosticable (no un error críptico, no un resultado silenciosamente
     incorrecto) en vez de intentar seguir. En producción cada modelo vive en su propio pod
     (MODEL=<id> por Kubernetes), así que esta contaminación entre plugins del MISMO proceso no
     debería darse salvo en el servidor de desarrollo multi-modelo o en la suite de tests — ahí
     sí ocurre siempre, por eso test_ml39_inference.py corre en un subproceso con
     KERAS_BACKEND limpiado explícitamente del entorno heredado."
  - "[a39 NO TIENE ENTRENAMIENTO PROPIO] Verificado en código (no asumido): el comando train del
     CLI de a39 es una copia literal del de a37 (mismo src/training/trainer.py). El paquete
     src/xai/ no define ninguna función de entrenamiento. training.supported=false es correcto
     para el plugin de la capa XAI; el reentrenamiento del modelo base sigue siendo competencia
     exclusiva del plugin ml37."
  - "[QUIRK HEREDADO DE a37, no corregido ni debe corregirse aquí] accumulator puede perder una
     alerta de regla más grave en la vista 'legacy' de alertas (ver inbox/a37/manifest.yaml). No
     afecta directamente a la capa XAI de a39 (que no toca alerts_all.parquet en su contrato en
     vivo), pero si en el futuro se expone la 'concordancia neurosimbólica' como endpoint, habrá
     que tener en cuenta esta misma limitación de a37."
  - "[CONTRATO DE SENSORES: SIN DISCREPANCIA, verificado] HEAD_SENSORS en xai_analysis.py
     (cooler: TS1-TS4; valve: FS1/FS2; pump: PS1/PS2/PS4/EPS1; accumulator: PS3/PS4/PS5/PS6) y
     ACTIVE_SENSORS (los 14 sensores físicos, mismo orden PS1..VS1) coinciden con el contrato de
     a37 (PHYSICAL_SENSORS y el agrupamiento de sensores de las reglas físicas de rules.py). No
     hay que reconciliar nada -- confirmado, no asumido."

a39_vs_a37_wiring_note: >
  Para el front (objetivo real del ticket DATAPLAT-525): la explicación de a39 debe mostrarse
  junto a la predicción de a37 para el MISMO ciclo. Esto implica que el front, o una capa de
  orquestación, llame a ambos plugins con el mismo payload de 'readings' (idéntico contrato de
  entrada) -- no hay acoplamiento de código entre los dos plugins del backend, cada uno resuelve
  su propio artefacto de forma independiente (ver constraints arriba), pero sí hay un
  acoplamiento de PRODUCTO: pedir una predicción de a37 y una explicación de a39 sobre datos
  distintos del mismo equipo no tiene sentido de negocio, aunque el sistema no lo impida
  técnicamente. Documentar esto en la ficha funcional de a39 cuando llegue docs-generation.
