neuroevolution:
  enabled: true
  model_family: neuroevolution
  algorithm: evolutionary_mlp_regression_v1
  integration_status: experimental_offline_v1
  target_column: synthetic_procurement_need
  target_variant: pressure
  feature_set_name: ablation_reduced_context
  random_seed: 42
  population_size: 36
  generations: 24
  elite_size: 4
  tournament_size: 3
  hidden_layer_options:
    - 4
    - 8
    - 12
  mutation_rate: 0.18
  mutation_scale: 0.18
  crossover_rate: 0.75
  architecture_mutation_rate: 0.10
  train_fitness_weight: 0.70
  validation_fitness_weight: 0.30
  complexity_penalty_weight: 0.01
  input_clip_sigma: 4.0
  stagnation_patience: 8
  log_every_generations: 4
  baseline_reference:
    model_family: linear_regression
    feature_set_name: ablation_reduced_context
    target_column: synthetic_procurement_need
  comparison_summary_csv_name: neuroevolution_comparison_latest.csv
  comparison_summary_json_name: neuroevolution_comparison_latest.json
  notes:
    - First offline neuroevolution route for the controlled synthetic training environment.
    - Evolves a small tabular MLP with one hidden layer, including weights and hidden-unit count.
    - Uses the same target, split and official feature set as the baseline reference.
    - Experimental component for comparison; not a production optimizer and not an online method.

policy_simulation:
  enabled: true
  comparison_name: policy_simulation
  input_dataset_path: data/processed/baseline/feature_engineering_modeling.csv
  evaluation_split: test
  history_weeks: 12
  target_column: synthetic_procurement_need
  validated_base_horizon_weeks: 1
  validated_base_horizon_label: W+1
  official_feature_set: ablation_reduced_context
  baseline_policy_name: operational_simple
  summary_json_name: policy_simulation_latest.json
  summary_csv_name: policy_simulation_latest.csv
  reference_runs:
    baseline_summary_json: models/metrics/summary/baseline_comparison_latest.json
    neuro_summary_json: models/metrics/summary/neuroevolution_comparison_latest.json
    baseline_run_key: baseline_reference_run
    neuro_run_key: best_neuroevolution_run
    baseline_model_family: linear_regression
    neuro_model_family: neuroevolution
  kpi_definition:
    name: kpi_excess_reduction_pct
    description: Reduction percentage of accumulated end-of-period raw material inventory above target coverage, measured against the operational baseline inside the simulator with a bounded stockout tolerance.
    target_coverage_days: 11.0
    minimum_excess_reduction_pct: 20.0
    require_non_worse_stockouts: true
    allowed_stockout_increase_pct: 5.0
  policy_definitions:
    - policy_name: operational_simple
      policy_type: operational_simple
      policy_group: operational_baseline
      decision_strategy: operational_simple
      policy_variant: operational_simple
      model_source: null
      enabled: true
    - policy_name: classical_baseline_model
      policy_type: classical_baseline_model
      policy_group: classical_model
      decision_strategy: model_based_original
      policy_variant: model_based_original
      model_source: baseline
      enabled: true
    - policy_name: classical_baseline_model_calibrated
      policy_type: classical_baseline_model
      policy_group: classical_model
      decision_strategy: model_based_calibrated
      policy_variant: classical_calibrated
      model_source: baseline
      enabled: true
    - policy_name: neuroevolution_model
      policy_type: neuroevolution_model
      policy_group: neuroevolution_model
      decision_strategy: model_based_original
      policy_variant: model_based_original
      model_source: neuro
      enabled: true
    - policy_name: neuroevolution_model_calibrated
      policy_type: neuroevolution_model
      policy_group: neuroevolution_model
      decision_strategy: model_based_calibrated
      policy_variant: neuro_calibrated
      model_source: neuro
      enabled: true
  decision_policy:
    target_coverage_days: 11.0
    need_multiplier: 1.0
    excess_penalty_weight: 0.30
    fixed_order_buffer_tons: 0.0
    min_order_tons: 0.0
    max_order_tons: 2600.0
    order_lot_rounding_tons: 5.0
    lead_time_weeks_floor: 1
    lead_time_weeks_cap: 4
    anchor_need_multiplier: 1.0
  decision_policy_variants:
    operational_simple:
      target_coverage_days: 11.0
      anchor_need_multiplier: 1.0
      excess_penalty_weight: 0.30
      fixed_order_buffer_tons: 0.0
      min_order_tons: 0.0
      max_order_tons: 2600.0
      order_lot_rounding_tons: 5.0
      lead_time_weeks_floor: 1
      lead_time_weeks_cap: 4
    model_based_original:
      target_coverage_days: 11.0
      need_multiplier: 1.0
      anchor_need_multiplier: 1.0
      excess_penalty_weight: 0.30
      fixed_order_buffer_tons: 0.0
      min_order_tons: 0.0
      max_order_tons: 2600.0
      order_lot_rounding_tons: 5.0
      lead_time_weeks_floor: 1
      lead_time_weeks_cap: 4
    classical_calibrated:
      target_coverage_days: 11.0
      anchor_need_multiplier: 1.0
      excess_penalty_weight: 0.30
      fixed_order_buffer_tons: 0.0
      min_order_tons: 0.0
      max_order_tons: 2600.0
      order_lot_rounding_tons: 5.0
      lead_time_weeks_floor: 1
      lead_time_weeks_cap: 4
      prediction_shrink_ratio: 0.10
      reorder_deadband_tons: 8.0
      positive_delta_weight: 0.015
      negative_delta_weight: 0.95
