project:
  name: meat-procurement-baseline
  seed: 42
  reference_date: "2026-05-18"

manufacturing_profiles:
  registry_path: config/manufacturing_profiles.yaml
  selection_key: recipe_profile
  profile_name_key: profile_name
  default_recipe_profile: high_throughput_standard

paths:
  logs_dir: logs
  input_data_path: data/processed/external/context/context_weekly_for_simulation.csv
  processed_dataset_path: data/processed/baseline/modeling_weekly.csv
  processed_metadata_path: data/processed/baseline/modeling_metadata.json
  splits_dir: data/splits/baseline/default
  predictions_dir: data/predictions
  model_artifacts_dir: models/artifacts
  official_artifacts_dir: models/artifacts/official
  model_metrics_dir: models/metrics
  stats_dir: models/metrics/summary

context_proxy:
  weekly_context_path: data/processed/external/context/context_weekly_for_simulation.csv
  wide_weekly_path: data/processed/external/context/external_wide_weekly.csv
  wide_monthly_path: data/processed/external/context/external_wide_monthly.csv
  metadata_path: data/processed/external/context/context_proxy_metadata.csv
  diagnostics_path: data/processed/external/context/context_proxy_diagnostics.csv
  limitations_path: data/processed/external/context/context_proxy_limitations.json

synthetic_data:
  enabled: true
  environment_name: procurement_training_environment
  environment_role: controlled_weekly_training_validation_and_policy_evaluation_environment_for_procurement_modeling
  input_dataset_path: data/processed/external/context/context_weekly_for_simulation.csv
  output_dataset_path: data/processed/synthetic/plant/context_with_synthetic_plant_weekly.csv
  column_lineage_path: data/processed/synthetic/plant/context_with_synthetic_plant_column_lineage.csv
  simulation_parameters_path: data/processed/synthetic/plant/synthetic_plant_assumptions.json
  environment_summary_path: data/processed/synthetic/plant/synthetic_plant_environment_summary.json
  simulation_seed: 42
  time_granularity: weekly
  validated_base_horizon_weeks: 1
  validated_base_horizon_label: W+1
  target_projection_window_weeks: 4
  intended_use:
    - train weekly procurement-pressure models under controlled conditions
    - evaluate decision policies derived from weekly procurement need
    - compare canonical and refined procurement targets under equal rules
    - support future neuroevolution on the same controlled environment
  non_goals:
    - not a substitute for plant ERP, MES or purchase order history
    - not a production optimizer
    - not evidence that the business KPI has already been achieved
  target_roles:
    canonical_target_column: synthetic_procurement_need
    canonical_variant: pressure
    canonical_target_role: operational_procurement_pressure_metric
    canonical_target_semantics: weekly procurement pressure diagnosis
    target_legacy_column: synthetic_procurement_need
    target_refined_column: synthetic_procurement_need_refined
    refined_variant: hybrid
    refined_target_role: comparison_only_candidate
    target_requirement_column: synthetic_raw_material_requirement
    requirement_target_role: upstream_requirement_signal
    decision_output_column: order_quantity_tons
    decision_role: downstream_policy_layer
    optimal_quantity_role: downstream_decision_or_optimization_stage
  synthetic_columns:
    - synthetic_plant_production_volume
    - synthetic_plant_capacity_utilization
    - synthetic_yield_rate
    - synthetic_waste_rate
    - synthetic_raw_material_requirement
    - synthetic_inventory_coverage_days
    - synthetic_inventory_level
    - synthetic_lead_time_days
    - synthetic_procurement_need_pressure
    - synthetic_procurement_need_coverage_gap
    - synthetic_procurement_need_hybrid
    - synthetic_procurement_need_refined
    - synthetic_procurement_need
    - synthetic_planned_orders
  manufacturing_context_columns:
    - manufacturing_context_profile
    - product_family
    - process_type
    - recipe_profile
    - formulation_class
    - expected_yield
    - expected_waste
    - process_lead_time_days
    - shelf_life_class
    - priority_level
    - cost_sensitivity
  candidate_target_columns:
    - synthetic_procurement_need
    - synthetic_procurement_need_refined
    - synthetic_raw_material_requirement
    - synthetic_procurement_need_pressure
    - synthetic_procurement_need_hybrid
    - synthetic_procurement_need_coverage_gap
  simulation_parameters:
    base_weekly_output_tons: 1200.0
    min_weekly_output_tons: 750.0
    nominal_capacity_tons: 1600.0
    demand_weight: 0.75
    supply_weight: 0.25
    seasonality_amplitude: 0.04
    production_noise_std: 0.03
    preferred_capacity_utilization: 0.82
    min_capacity_utilization: 0.45
    max_capacity_utilization: 0.98
    base_yield_rate: 0.84
    min_yield_rate: 0.78
    max_yield_rate: 0.92
    yield_penalty_per_utilization_point: 0.18
    yield_noise_std: 0.004
    base_waste_rate: 0.025
    min_waste_rate: 0.01
    max_waste_rate: 0.06
    waste_penalty_per_utilization_point: 0.05
    waste_noise_std: 0.002
    base_inventory_coverage_days: 11.0
    min_inventory_coverage_days: 6.0
    max_inventory_coverage_days: 18.0
    inventory_supply_bonus_days: 4.0
    inventory_demand_penalty_days: 3.0
    inventory_coverage_noise_std: 0.6
    base_lead_time_days: 5.0
    min_lead_time_days: 2.0
    max_lead_time_days: 9.0
    lead_time_supply_penalty_days: 3.0
    lead_time_noise_std: 0.5
    safety_stock_days: 6.0
    planned_orders_buffer_ratio: 0.05
    manufacturing_context:
      registry_path: config/manufacturing_profiles.yaml
      context_window_weeks: 6
      assignment_noise_std: 0.02
      persistence_bonus: 0.12
    procurement_target_parameters:
      canonical_variant: pressure
      forward_requirement_weights:
        - 0.4
        - 0.3
        - 0.2
        - 0.1
      available_coverage_current_weight: 0.62
      available_coverage_trailing_weight: 0.38
      pressure_buffer_base_days: 5.0
      pressure_lead_time_weight: 0.85
      pressure_supply_stress_weight: 1.2
      pressure_growth_weight: 2.4
      pressure_ratio_offset: 0.50
      pressure_scaling_divisor: 3.2
      pressure_context_days_weight: 0.80
      pressure_context_multiplier_weight: 0.80
      pressure_snapshot_blend_weight: 0.08
      pressure_coverage_gap_blend_weight: 0.06
      coverage_gap_buffer_base_days: 6.0
      coverage_gap_lead_time_weight: 0.95
      coverage_gap_supply_stress_weight: 1.8
      coverage_gap_growth_weight: 2.6
      coverage_gap_future_requirement_weight: 0.55
      coverage_gap_trailing_requirement_weight: 0.45
      hybrid_buffer_base_days: 5.0
      hybrid_lead_time_weight: 0.95
      hybrid_supply_stress_weight: 1.2
      hybrid_growth_weight: 2.4
      hybrid_ratio_offset: 0.6
      hybrid_scaling_divisor: 3.2
      hybrid_growth_softplus_scale_tons: 45.0
      hybrid_growth_boost_scale: 18.0
      hybrid_growth_boost_weight: 0.12
      hybrid_snapshot_penalty_weight: 0.12

procurement_problem_definition:
  target_column: synthetic_procurement_need
  target_variant: pressure
  target_role: operational_procurement_pressure_metric
  target_business_semantics: quantitative weekly procurement-pressure metric
  validated_time_granularity: weekly
  validated_base_horizon_weeks: 1
  validated_base_horizon_label: W+1
  target_projection_window_weeks: 4
  refined_target_column: synthetic_procurement_need_refined
  refined_target_variant: hybrid
  refined_target_role: comparison_only_candidate
  requirement_signal_column: synthetic_raw_material_requirement
  requirement_signal_role: upstream_requirement_signal
  decision_output_column: order_quantity_tons
  decision_layer_role: downstream_policy_layer
  optimal_quantity_role: downstream_decision_or_optimization_stage
  manufacturing_context_role: manufacturing_context_conditioning_layer
  manufacturing_context_columns:
    - manufacturing_context_profile
    - product_family
    - process_type
    - recipe_profile
    - formulation_class
    - expected_yield
    - expected_waste
    - process_lead_time_days
    - shelf_life_class
    - priority_level
    - cost_sensitivity
  manufacturing_context_statement: Procurement pressure and downstream policy are conditioned by manufacturing context inside the simulator; the system no longer models all processed meats as one generic production mode.
  synthetic_environment_role: controlled_training_validation_and_policy_evaluation
  synthetic_environment_statement: Synthetic plant data are used as a controlled environment for training and validating the model and decision policies; they do not replace the final solution.

data_processing:
  io:
    input_file_type: csv
  source_refresh:
    run_ine_ingestion: false
    run_external_context_pipeline: false
    force_download: false
    start_date: "2004-01-01"
    end_date: "2026-05-18"
  dataset:
    datetime_column: date
    sort_columns:
      - date
    feature_columns:
      - supply_index
      - purchase_price_index
      - demand_index
    target_column: demand_index
    target_horizon: 4
    target_horizon_role: upstream_proxy_reference_only
    target_output_column: demand_index_t_plus_4
    drop_columns: []
  preprocessing:
    drop_duplicates: true
    remove_rows_missing_datetime: true
    remove_rows_missing_target: true
    numeric_null_strategy: ffill
    categorical_null_strategy: most_frequent
    drop_rows_with_missing_features: true
    outlier_filters:
      supply_index:
        min: 0.0
      purchase_price_index:
        min: 0.0
      demand_index:
        min: 0.0
  feature_engineering:
    lag_features:
      enabled: true
      columns:
        - supply_index
        - purchase_price_index
        - demand_index
      lags:
        - 1
        - 2
        - 4
        - 8
    rolling_features:
      enabled: true
      columns:
        - supply_index
        - purchase_price_index
        - demand_index
      windows:
        - 4
        - 12
      statistics:
        - mean
    date_features:
      enabled: true
      add_year: true
      add_month: true
      add_quarter: true
      add_week_of_year: true
    interaction_features:
      enabled: true
      definitions:
        - name: demand_supply_gap
          operation: difference
          left: demand_index
          right: supply_index
        - name: demand_supply_ratio
          operation: ratio
          numerator: demand_index
          denominator: supply_index
  split:
    strategy: chronological
    train_size: 0.70
    valid_size: 0.15
    test_size: 0.15

training:
  comparison_name: synthetic_first_baseline
  model_name: synthetic_first_baseline
  model_families:
    - dummy
    - linear_regression
    - random_forest
    - gradient_boosting
  target_columns:
    - from_feature_selection
  feature_sets:
    - ablation_no_context
    - ablation_all_context
    - ablation_product_process_context
    - ablation_operational_context
    - ablation_reduced_context
  target_default: from_feature_selection
  target_override: null
  target_alternatives: []
  random_seed: 42
  dummy_strategy: mean
  primary_metric: validation_rmse
  comparison_summary_csv_name: baseline_comparison_latest.csv
  comparison_summary_json_name: baseline_comparison_latest.json
  metrics:
    - mae
    - rmse
    - r2
    - mape
  hyperparameters:
    dummy:
      strategy: mean
    random_forest:
      n_estimators: 300
      max_depth: 10
      min_samples_split: 4
      min_samples_leaf: 2
      n_jobs: -1
    gradient_boosting:
      n_estimators: 400
      learning_rate: 0.03
      max_depth: 3
      subsample: 0.85
      min_samples_leaf: 2
    xgboost: {}
    lightgbm: {}

purchase_trigger:
  acceptance:
    max_false_negative_rate: 0.05
    min_accuracy: 0.85

prediction:
  input_path: data/processed/baseline/feature_engineering_modeling.csv
  artifact_path: null
  artifact_selection: official_baseline_latest
  output_filename: predictions_latest.csv
  include_actual_target: true

official_release:
  scope: mixed_context
  reference_date: "2026-05-18"
