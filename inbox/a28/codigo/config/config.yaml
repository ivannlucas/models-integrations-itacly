      max_order_growth_ratio: 0.005
      max_order_reduction_ratio: 0.16
      positive_adjustment_coverage_gate_days: 9.5
      allow_positive_adjustment_above_gate: false
    neuro_calibrated:
      target_coverage_days: 11.0
      anchor_need_multiplier: 1.0
      excess_penalty_weight: 0.30
      fixed_order_buffer_tons: 0.0
      min_order_tons: 0.0
      max_order_tons: 2600.0
      order_lot_rounding_tons: 5.0
      lead_time_weeks_floor: 1
      lead_time_weeks_cap: 4
      prediction_shrink_ratio: 0.06
