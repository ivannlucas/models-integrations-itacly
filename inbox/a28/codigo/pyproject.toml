[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cu28-neurocarn-opt"
version = "0.1.0"
description = "Reproducible mixed_context model repository for CU28 / NEUROCARN-OPT."
readme = "README.md"
requires-python = ">=3.12,<3.13"

[tool.setuptools.packages.find]
include = ["src*"]
