model_id: ml33_cereals_reuse_strategy_optimizer
sector: cerealista
# No hay memoria .docx entregada para este modelo (ver known_issues) — título tomado
# literalmente del README.md del código entregado, único documento de negocio disponible.
nombre: "DATAGIA - CO2 Reuse-Strategy Optimization: optimización exacta (MILP) de la
  estrategia de reutilización de subproductos cerealistas por lote, bajo restricciones
  de capacidad de planta, para minimizar emisiones de CO2 simuladas"
task_type: optimization  # asignación combinatoria exacta (MILP); no hay red predictiva desplegada
framework:
  - scipy==1.15.3     # scipy.optimize.milp (HiGHS) — motor desplegado
  - numpy==2.2.6
  - pandas==2.3.3
  - neat-python==2.0.0  # SOLO para el benchmark NEAT retenido (ver known_issues); no se usa en el motor desplegado

# Sin artefactos serializados: el motor desplegado (ExactEmissionsOptimizer,
# src/predict/exact_optimizer.py) es un solver MILP autocontenido — no carga pesos,
# scaler ni genoma. Ver known_issues sobre el genoma NEAT (models/artifacts/winner_genome.pkl),
# que pertenece al benchmark, no al modelo productivo.
artifacts:
  folder: null
  files: []
  note: >
    No hay pesos que cargar. El "modelo" es la función determinista strategy_emissions()
    + el solver MILP (scipy.optimize.milp, backend HiGHS) sobre bloques de
    lots_per_day lotes. Misma entrada -> mismo resultado siempre (sin semilla aleatoria).

inputs:
  # Una fila = un lote de subproducto a asignar. El motor procesa lotes en bloques de
  # `lots_per_day` (capacidades se resetean al empezar cada bloque).
  fixed:
    - name: generated_volume_tons
      type: float
      unit: t
      description: "Volumen del lote de subproducto generado"
      train_range: [0.1, 61.75]  # min/max observados en data/split/*_test_raw.csv
    - name: moisture_pct
      type: float
      unit: "%"
      description: "Porcentaje de humedad del lote"
      train_range: [0.1, 37.53]
    - name: subproduct_type
      type: categorical
      categories: [Husk, Straw, "Silo dust", Bran]
      description: "Categoría del subproducto cerealista"
    - name: season
      type: categorical
      categories: [Dry, Rainy]
      description: >
        Estación. Validada como columna requerida por infer_dataframe() pero NO
        interviene en la fórmula strategy_emissions() del motor desplegado (solo
        subproduct_type/moisture_pct/generated_volume_tons la usan) — ver known_issues.
    - name: process_temperature_c
      type: float
      optional: true
      description: >
        Campo opcional aceptado por el esquema de entrada de NEAT (InferenceInput) pero
        NUNCA usado como entrada de decisión por el motor desplegado: la temperatura se
        deriva determinísticamente de la estrategia elegida (STRATEGY_TEMPERATURE_C), no
        al revés. Se ignora si se envía.

  # Parámetros de ejecución del optimizador — no son atributos del lote sino configuración
  # de la ejecución/bloque; llegan con valores por defecto de config/pipeline_config.json.
  control:
    - name: lots_per_day
      type: int
      default: 15
      description: "Nº de lotes antes de resetear las capacidades (bloque operativo/día simulado)"
    - name: animal_feed_capacity
      type: float
      default: 90.0
      unit: t
      description: "Capacidad diaria de la estrategia 'Animal feed'"
    - name: composting_capacity
      type: float
      default: 140.0
      unit: t
      description: "Capacidad diaria de la estrategia 'Composting'"
    - name: biochar_capacity
      type: float
      default: 45.0
      unit: t
      description: "Capacidad diaria de la estrategia 'Biochar'"
    - name: biomass_combustion_capacity
      type: float
      default: 10000.0
      unit: t
      description: "Capacidad diaria de 'Biomass combustion' (deliberadamente muy alta: garantiza factibilidad de bloque, ver exact_optimizer.py)"
    - name: fallback_strategy
      type: categorical
      default: "Biomass combustion"
      description: "Estrategia aplicada a un lote que el MILP no puede colocar (guarda defensiva; el bloque siempre es factible con la capacidad por defecto)"

  derived_if_missing: {}  # no hay derivación automática; todas las columnas fixed son obligatorias

outputs:
  predict_inline:
    - name: ai_assigned_strategy
      type: str
      description: "Estrategia de reutilización asignada al lote (una de las 4 STRATEGY_ORDER)"
    - name: ai_assignment_source
      type: str
      description: "exact_min_emissions (solución MILP óptima) | capacity_fallback (guarda defensiva si el MILP es infactible)"
    - name: ai_is_fallback
      type: bool
      description: "True si ai_assignment_source == capacity_fallback"
    - name: estimated_emissions_kg
      type: float
      description: "Emisión de CO2 estimada del lote bajo la estrategia asignada (strategy_emissions())"
    - name: candidates
      type: list[dict]
      description: >
        AÑADIDO tras la integración inicial (explainability-integration, 2026-08-27): emisión
        estimada de las 4 estrategias candidatas para el lote (no solo la elegida), con
        feasible=volume_tons<=capacidad de esa estrategia EN AISLADO (no contempla contención
        con otros lotes del mismo bloque — ver ai_assignment_source para el resultado conjunto
        real). Exacto (misma fórmula que minimiza el MILP), no una aproximación SHAP. Sustituye
        a un registro en el servicio de explicabilidad estándar: al no haber pesos entrenados,
        no aplica SHAP (mismo motivo por el que ml31/ml28/ml45 tampoco están registrados allí;
        decisión explícita del usuario). Solo se devuelve para la fila 0 en modo batch (mismo
        criterio que ml31._compute_sensitivity, para no multiplicar el tamaño de la respuesta
        en CSVs grandes).

  # Agregados devueltos junto a la lista de asignaciones (predict_inline con >1 lote, y predict_batch)
  batch_summary:
    - name: distribution
      type: dict
      description: "Conteo y % por estrategia asignada (summarize_strategy_distribution)"
    - name: capacity_fallback_count
      type: int
      description: "Nº de lotes resueltos por guarda defensiva en vez de por el MILP"
    - name: total_estimated_emissions_kg
      type: float
      description: "Suma de estimated_emissions_kg de todos los lotes procesados"

constraints:
  descripcion: >
    Restricciones duras del problema de asignación, no violables por diseño del MILP
    (no son excepciones de negocio como en a35/PU>=13): cada lote se asigna a EXACTAMENTE
    una estrategia (sum_s x[i,s] = 1), y el volumen total asignado a cada estrategia dentro
    de un bloque no puede superar su capacidad diaria restante (sum_i vol_i*x[i,s] <= cap_s).
    Si el MILP resulta infactible/no resuelto (mensaje HiGHS != success), el motor NO lanza
    excepción: degrada a una guarda greedy por lote (_greedy_block) y, si tampoco encuentra
    hueco, usa fallback_strategy. Con las capacidades por defecto esto no ocurre nunca
    (biomass_combustion_capacity=10000 garantiza factibilidad). No se ha identificado
    necesidad de una excepción de dominio nueva — la trazabilidad va en
    ai_assignment_source/ai_is_fallback, no en un error 422.

training:
  supported: false  # el motor desplegado es un solver MILP exacto, no hay pesos que aprender ni target que ajustar
  target_column: null
  required_columns: null
  hyperparams: null
  metrics_returned: null
  source: >
    src/predict/exact_optimizer.py (docstring del módulo) + README.md ("Neuroevolution (NEAT)
    is retained as a learned-policy benchmark and is bounded above by the exact optimum").
    El repo SÍ trae código de entrenamiento NEAT (src/training/evolution.py,
    scripts/run_optimization.py) y un genoma serializado (models/artifacts/winner_genome.pkl),
    pero son del benchmark retenido, no del modelo desplegado — ver known_issues.

metrics_reported:
  # models/metrics/inference_evaluation_report.json — comparación motor desplegado (exact) vs
  # baseline sintético, sobre el split de test completo (10000 filas), capacidades por defecto.
  protocolo: "Determinista: exact_optimum resuelve cada bloque de 15 lotes a optimalidad probada (MILP). Comparación vs baseline sintético (reuse_strategy) del propio dataset generado."
  n_rows_test: 10000
  ai_estimated_total_emissions_kg: 30893908.4
  baseline_total_emissions_kg: 42691705.58
  total_emissions_reduction_pct: 27.63
  distribution_ai_pct_normalized:
    composting: 37.18
    animal_feed: 27.27
    biomass_combustion: 17.86
    biochar: 17.69
  # Monte Carlo (models/metrics/inference_evaluation_report.json, stochastic_runs=200, seed=42)
  stochastic_total_reduction_pct_p05: 27.27
  stochastic_total_reduction_pct_p50: 27.66
  stochastic_total_reduction_pct_p95: 28.04
  # Escalera de comparación completa (models/metrics/baseline_comparison.json) — referencia,
  # no verificable 1:1 vía API (son ejecuciones de scripts/run_baselines.py, no del plugin):
  ladder_reference:
    exact_optimum_reduction_pct: 27.63    # = motor desplegado
    oracle_greedy_reduction_pct: 12.19    # cota inferior codiciosa por lote
    neat_reduction_pct: 11.31             # benchmark aprendido, NO desplegado
    linear_fitness_reduction_pct: 9.64
    logistic_reg_reduction_pct: -12.78
    random_reduction_pct: -20.39

# =============================================================================================
# GOLDEN CASES — extraídos literalmente de data/predictions/inference_with_constraints.csv
# (salida real y ya auditada de scripts/run_inference.py --selector exact sobre
# data/split/dataset_optimization_cereal_co2_test_raw.csv, capacidades/lots_per_day por
# defecto de config/pipeline_config.json). Ningún caso ha sido inventado ni recalculado por
# el agente. La asignación depende del BLOQUE completo (capacidad compartida entre los 15
# lotes de cada bloque) — por eso cada golden case es un bloque de 15 lotes consecutivos
# íntegro, no filas sueltas: verificar fila a fila fuera de su bloque no es reproducible.
# =============================================================================================
golden_cases:
