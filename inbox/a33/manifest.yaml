known_issues:
  - "SIN REGISTRO EN retech-lote2-xai-explicabilidad (decisión explícita, 2026-08-27): igual que
     ml31/ml28/ml45 en este mismo repo, ml33 no tiene pesos entrenados ni artefacto que cargar,
     así que SHAP no aplica (el servicio de explicabilidad asume una función predict_fn(numpy)
     sobre un modelo cargado desde S3). En su lugar, plugin.py expone un campo `candidates` con
     la emisión exacta de las 4 estrategias candidatas por lote (ver outputs.predict_inline más
     abajo) — la misma fórmula que minimiza el MILP, no una aproximación. front-integration debe
     tratar ml33 igual que cereal_residue_optimizer (modelo-31): sin xaiModelId real, con
     short-circuit propio en el front en vez de llamar a /explanations."
  - "SIN MEMORIA .DOCX: a diferencia de otros modelos de este repo, no se entregó memoria/entregable
     en inbox/a33-.../entregable/. El README.md de este delivery es exhaustivo y de código real
     (fórmulas exactas, defaults reproducibles, reportes JSON auditados), así que este manifest se
     construyó enteramente desde código + README + JSON de métricas, sin ningún dato de la memoria.
     Revisión humana recomendada antes de docs-generation por si existe una memoria oficial fuera
     de este repo que deba prevalecer sobre el README como fuente de la ficha funcional."
  - "LINAJE DEL PROYECTO: el nombre de carpeta tal como se entregó
     ('a33-cnp-cereals-neuroevolutivo-reduccion-ambiental-residuos', renombrada a inbox/a33 por
     convención del repo — ver README.md original conservado en inbox/a33/README.md)
     y el dominio de negocio (cereales, reducción de residuos, técnicas neuroevolutivas) coinciden
     con el linaje de a31 (hoy app/plugins/ml31_cereals_residue_optimizer), cuyo propio manifest
     documenta que YA es una v2.0 que sustituyó una v1.x ANN+GA bajo el mismo nombre de carpeta.
     El código de a33 es, sin embargo, técnicamente distinto de a31 (asignación de lotes a
     estrategia de reuso vía MILP vs. reasignación de superficie de cultivo vía LP) — mismo
     dataset/columnas no comparables. Por decisión explícita del usuario (2026-08-27), a33 se
     integra como plugin NUEVO e independiente (ml33_cereals_reuse_strategy_optimizer), sin tocar
     ml31_cereals_residue_optimizer. Si en el futuro se determina que ambos deben unificarse,
     tratarlo como una migración explícita, no como un descubrimiento de este manifest."
  - "NEAT RETENIDO SOLO COMO BENCHMARK: el repo entregado trae entrenamiento NEAT completo
     (src/training/evolution.py, config/config-feedforward*.txt, models/artifacts/winner_genome.pkl)
     y un selector --selector neat en scripts/run_inference.py, pero el propio README califica
     el motor MILP como 'the deployed decision engine' y a NEAT como 'learned-policy benchmark,
     bounded above by the exact optimum' (ver models/metrics/baseline_comparison.json: NEAT
     reduce 11.31% vs 27.63% del MILP exacto). Este plugin implementa ÚNICAMENTE el motor MILP
     desplegado — no se expone el selector NEAT ni se carga winner_genome.pkl."
  - "COLUMNA 'season' NO USADA POR LA FÓRMULA DE EMISIONES: infer_dataframe() la exige como
     columna requerida (ValueError si falta) pero strategy_emissions() nunca la lee — es
     vestigial del esquema de entrada de NEAT (InferenceInput / POLICY_INPUT_COLUMNS). Se
     mantiene como campo obligatorio en el contrato del plugin por fidelidad al código fuente
     (para no romper la validación de columnas si en el futuro se reintroduce), pero no
     afecta al resultado numérico ni de asignación."
  - "SINTÉTICO, NO OPERACIONAL: el propio README (sección 'Methodological Scope') advierte que
     todo el dataset es sintético (CTGAN + reglas causales configurables), y que 'AI-vs-baseline
     results reflect improvement against an artificial reference' — el 27.63% de reducción no es
     una medición de planta real. Documentar esto tal cual en la ficha funcional, no como un
     resultado operacional verificado."
  - "requirements.txt de este delivery está en UTF-8/ASCII estándar (verificado), a diferencia de
     otros modelos del repo con requirements.txt en UTF-16LE — no requiere normalización."
