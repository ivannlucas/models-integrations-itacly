# Fuentes y notación de trazabilidad:
#   [C] inbox/a38/codigo/ (repo del equipo de IA, HEAD bfb3e13 "Add changes v1.6 in readme", 2026-09-30)
#   [M] memoria "38 - Modelo predictivo basado en DNLS para la detección de fallas en maquinaria
#       vitivinícola - v1.6.docx" (versión 1.6, 29/09/2026)
#   [A] artefactos/métricas entregados en codigo/models/ y codigo/data/
#   [V] comprobado por el agente ejecutando el código/artefactos entregados (no es dato del equipo de IA)
model_id: ml38_wine_machinery_fault_detection
endpoint_id: ml38-wine-machinery-fault-detection
sector: vitivinicola
nombre: "Modelo predictivo basado en DNLS para la detección de fallas en maquinaria vitivinícola"
acronimo: DNLS-VINO
organismo: Air-Institute
lote: 2
version_memoria: "1.6"
task_type: hierarchical_classification
task_type_note: >
  Pipeline jerárquico tabular de dos niveles [M] §5.1, [C] src/predict/predictor.py::run_inference:
  (1) RandomForest multiclase → familia de fallo (7 clases); (2) si la familia predicha no es
  "healthy" y existe modelo para ella, un MLP Keras binario específico de esa familia → severidad
  (0 = leve = nivel 1; 1 = significativo = niveles > 1). El componente "DNLS"/neurosimbólico se
  reduce a un término físico en la pérdida de entrenamiento de los MLP de severidad
  (L = BCE + λphys·mean(relu(vib_band_low_norm − σ(z)))); la propia memoria aclara que NO es un
  sistema neurosimbólico completo [M] §1, §5.1, §10. En inferencia no interviene ninguna regla
  simbólica: es RF + MLP.

framework:
  # [C] codigo/requirements.txt — ASCII, LF, sin BOM, versiones fijadas (==). 139 líneas, incluye
  # Jupyter/ipykernel/etc. de análisis. Núcleo de inferencia/entrenamiento:
  - scikit-learn==1.7.2     # RandomForestClassifier + StandardScaler (artefactos pickled con 1.7.2)
  - tensorflow==2.20.0      # entrenamiento original con tf.GradientTape
  - keras==3.12.1           # MLP de severidad (Keras 3 Functional, pickled dentro de severity_models.pkl)
  - numpy==2.2.6
  - pandas==2.3.3
  - scipy==1.15.3           # kurtosis/skew/rfft de la extracción de features (modo raw)
  - pyarrow==23.0.1         # lectura del parquet procesado
  - joblib==1.5.3
  - PyYAML                  # config/config.yaml
  # Entorno de referencia del equipo: Python 3.10 [M] §5.3; traza E2E con Python 3.10.20 (conda "m38")
  # [C] traceability/e2e_summary.txt.

artifacts:
  folder: models/artifacts/
  files:
    - name: family_rf.pkl
      md5: a093b090c65488d5987de2dc34c6100b   # [V] md5sum sobre la entrega
      content: "RandomForestClassifier(n_estimators=800, min_samples_leaf=2, class_weight='balanced', random_state=42), entrenado con las 877 muestras"
      classes: [alignment, bearing, cavitation, electrical, healthy, mechanical_other, unbalance]
    - name: family_scaler.pkl
      md5: 748030baf3e5722df584c37ea5395a5e
      content: "StandardScaler ajustado sobre las 24 features (numpy, sin feature_names_in_: el ORDEN de columnas es el contrato)"
    - name: severity_models.pkl
      md5: f9c73cb78a8bfffa4bca13acd93b84c1
      content: "dict familia → keras.Model Functional 24→Dense(64,relu)→Dropout(0.3)→Dense(32,relu)→Dense(1) (logit). Familias: alignment, bearing, cavitation, electrical, mechanical_other, unbalance (no healthy)"
    - name: severity_scalers.pkl
      md5: f207a9cf68f0988c0aeaf074a5f62d98
      content: "dict familia → StandardScaler ajustado sobre las muestras de esa familia con severidad > 0"
  serving_note: >
    Los cuatro .pkl son los que sirve el plugin, bit a bit (md5 arriba). Los MLP de severidad son
    objetos Keras 3 serializados con pickle bajo backend TensorFlow; en el servidor del repo el
    backend de Keras es torch (ml1 fija KERAS_BACKEND=torch al importarse desde registry.py).
    [V] Con sklearn 1.5.2 + keras 3.15.1 (entorno del repo) y AMBOS backends (torch y tensorflow)
    se reproduce data/predictions/predictions.csv: 877/877 familias idénticas y
    severity_confidence con |Δ| máx. 3.6e-7 (torch) / 1.2e-7 (tensorflow).

data:
  processed: data/processed/feature_dataset.parquet   # 877 filas × 27 columnas (24 features + family, severity, group_id) [C][M] §3.2
  manifest: data/processed/input_manifest.csv           # trazabilidad muestra → ficheros raw NLN-EMP
  splits: data/splits/fold_assignments.csv              # asignación OOF (GroupKFold por group_id, 5 folds: 176/176/175/175/175)
  raw_source: "NLN-EMP — Motor Current and Vibration Monitoring Dataset (4TU.ResearchData, v4, CC0), DOI 10.4121/2b61183e-c14f-4131-829b-cc4822c369d0.v4. No incluido en la entrega (solo un extracto recortado en data/examples/raw/)."
  n_groups: 114          # [V] group_id = (motor, velocidad, fallo); 2-36 ventanas por grupo
  channels_used: "[V] Las 877 muestras usan SOLO vibración ch1 (rodamiento lado no accionado del motor, horizontal, g) y eléctrico ch1 (corriente fase 1, A): input_manifest.csv"
  window_length_samples: {vibration: 240000, electrical: 300000}  # [V] estimado por Parseval desde vib/ele_spectral_energy y *_rms (12 s y 15 s a FS=20 kHz, [M] §8.2)
  operating_configurations: {"Motor-2": [50, 75, 100], "Motor-4": [70]}   # [V] input_manifest.csv; coincide con [M] Tabla 2

inputs:
  # Modo principal ("inline"/"batch"): el vector tabular de 24 features, EN ESTE ORDEN
  # ([C] src/data_processing/build_dataset.py::FEATURE_NAMES; mismo orden que las columnas del
  # parquet, que es el que ven los scalers). Rangos = min/max del dataset de entrenamiento [V].
  features:
    - {name: vib_mean, unit: g, train_range: [-0.0151034, 0.00484116]}
    - {name: vib_std, unit: g, train_range: [0.208694, 0.823231]}
    - {name: vib_max, unit: g, train_range: [0.694251, 38.7701]}
    - {name: vib_min, unit: g, train_range: [-42.4954, -0.701982]}
    - {name: vib_rms, unit: g, train_range: [0.208701, 0.823233]}
    - {name: vib_kurtosis, unit: "-", train_range: [-0.645034, 700.051]}   # scipy kurtosis(bias=False), exceso (Fisher)
    - {name: vib_skewness, unit: "-", train_range: [-2.31264, 2.13623]}
    - {name: vib_spectral_energy, unit: "g²·(N)", train_range: [1.25449e+09, 1.95182e+10]}   # sum(|rfft|²): depende de N
    - {name: vib_spectral_centroid, unit: "bin FFT", train_range: [46611.7, 86067.7]}       # en índice de bin, no en Hz: depende de N
    - {name: vib_band_low, unit: "fracción", train_range: [0.000226163, 0.388016]}         # energía 0-200 Hz / total
    - {name: vib_band_mid, unit: "fracción", train_range: [0.0017853, 0.317117]}           # 200-1000 Hz
    - {name: vib_band_high, unit: "fracción", train_range: [0.00100156, 0.289181]}         # 1000-5000 Hz
    - {name: vib_amp_1x, unit: "|rfft|", train_range: [6.60796, 30397.4]}                  # pico ±2 Hz en rpm/60: depende de N y de motor/velocidad
    - {name: vib_amp_2x, unit: "|rfft|", train_range: [8.57082, 36714.6]}
    - {name: vib_ratio_2x_1x, unit: "-", train_range: [0.368723, 24.6922]}
    - {name: ele_mean, unit: A, train_range: [0.0691556, 0.205233]}
    - {name: ele_std, unit: A, train_range: [8.28312, 22.4329]}
    - {name: ele_max, unit: A, train_range: [12.585, 34.1997]}
    - {name: ele_min, unit: A, train_range: [-34.1933, -12.1153]}
    - {name: ele_rms, unit: A, train_range: [8.28533, 22.4331]}
    - {name: ele_kurtosis, unit: "-", train_range: [-1.53249, -1.30359]}
    - {name: ele_skewness, unit: "-", train_range: [-0.0103557, 0.00794825]}
    - {name: ele_spectral_energy, unit: "A²·(N)", train_range: [3.09074e+12, 2.26462e+13]}
    - {name: ele_spectral_centroid, unit: "bin FFT", train_range: [6213.07, 32944.8]}
  # Modo secundario ("raw"): réplica de scripts/predict_raw.py [C][M] §8.2 — el servicio calcula
  # las 24 features desde una pareja de CSV raw (time + columnas de señal).
  raw:
    vibration_csv: {type: path, description: "CSV raw de vibración; columna 0 = time, siguientes = segmentos de señal (g)"}
    current_csv: {type: path, description: "CSV raw eléctrico del mismo ensayo/condición (A)"}
    motor: {type: str, allowed: ["Motor-2", "Motor-4"]}
    speed: {type: int, allowed: {"Motor-2": [50, 75, 100], "Motor-4": [70]}}
    window_index: {type: int, default: 0, description: "columna de señal posterior a time (0 = primera); si sólo hay una columna se usa esa"}
  derived_if_missing: {}   # ninguna feature se rellena: las 24 son obligatorias en modo tabular

outputs:
  predict_inline:
    - {name: family, type: str, description: "Familia de fallo predicha (RF.predict)"}
    - {name: severity, type: "int|null", description: "0 = leve (nivel 1), 1 = significativo (nivel > 1); null si family=healthy o sin modelo de severidad"}
    - {name: severity_label, type: str, values: ["sin fallo", "leve", "significativo", "modelo no disponible"]}
    - {name: severity_confidence, type: "float|null", description: "σ(logit) del MLP de severidad = P(severidad significativa). La salida 'confidence' del original; null cuando no hay severidad"}
    - {name: family_probabilities, type: "dict[str,float]", description: "AÑADIDO por la integración: RF.predict_proba por clase. No cambia la predicción (RF.predict = argmax de predict_proba). El original no lo devuelve."}
  predict_batch: "Una fila por muestra con las mismas claves que predict_inline (+ row). Entrada: CSV o parquet con las 24 columnas; family/severity/group_id se ignoran si vienen. [C] run_inference_pipeline"
  raw: "Mismas claves que predict_inline + features calculadas (xai_feature_values) + avisos de dominio"
  original_format_note: "El original escribe predictions.csv (sample_id, true_*, pred_family, pred_severity, severity_confidence) [M] §8.3; el plugin devuelve JSON con la misma información."

training:
  supported: true
  evidence: >
    [C] scripts/train.py → src/main.py::train → src/training/train_models.py::train_family_model
    (GroupKFold CV + RF final con todo el dataset) y src/training/train_severity_models.py::
    train_severity_models (GroupKFold CV + MLP final por familia). Entrena EXACTAMENTE los cuatro
    artefactos servidos (save_family_model / save_severity_models). La traza E2E del equipo
    ([C] traceability/e2e_summary.txt, train_exit=0) los regeneró así.
  target_column: family          # nivel 1 (multiclase)
  secondary_target: severity     # nivel 2: entero, -1 = no disponible; binarizado 1→0, >1→1 por familia
  required_columns:
    features: [vib_mean, vib_std, vib_max, vib_min, vib_rms, vib_kurtosis, vib_skewness,
               vib_spectral_energy, vib_spectral_centroid, vib_band_low, vib_band_mid,
               vib_band_high, vib_amp_1x, vib_amp_2x, vib_ratio_2x_1x, ele_mean, ele_std,
               ele_max, ele_min, ele_rms, ele_kurtosis, ele_skewness, ele_spectral_energy,
               ele_spectral_centroid]
    labels: [family, severity, group_id]
    source: codigo_entrenamiento   # [C] src/main.py::train (X = df.drop(family, severity, group_id))
    format: "Mismo esquema que data/processed/feature_dataset.parquet (CSV o parquet)"
  split:
    strategy: "GroupKFold(n_splits=min(5, nº grupos)) por group_id — determinista, sin barajar [C][M] §6.3"
    final_model: "RF y MLP finales reentrenados con TODO el dataset tras la CV [C]"
    no_fixed_test: "No hay partición hold-out fija; la memoria usa CV/OOF como evidencia [M] §6.3"
  hyperparams:
    # [C] config/config.yaml (consumido por el código vía config.get con los mismos valores por defecto)
    # = [M] §6.2 "Hiperparámetros Clave"
    random_state: 42
    n_splits: 5
    family_model:
      algorithm: RandomForestClassifier
      n_estimators: 800
      min_samples_leaf: 2
      max_depth: null
      class_weight: balanced
      scaler: StandardScaler
    severity_model:
      architecture: "Dense(64, relu) → Dropout(0.3) → Dense(32, relu) → Dense(1) logit"
      hidden_layers: [64, 32]
      dropout: 0.3            # solo tras la primera capa oculta [C] _build_severity_model
      activation: relu
      optimizer: Adam
      learning_rate: 0.001
      batch_size: 32
      epochs: 40              # fijo, sin early stopping [M] §6.4
      shuffle_buffer: 1000
      loss: "BCE(from_logits) + lambda_phys · mean(relu(vib_band_low_norm − sigmoid(logit)))"
      lambda_phys: 0.3
      low_band_index: 9       # vib_band_low en FEATURE_NAMES; normalizado min-max con los datos de entrenamiento
      binarization: "severity == 1 → 0; severity > 1 → 1; severity <= 0 excluida"
      skip_rules: "familia healthy excluida; familia con < 2 niveles de severidad o < 2 grupos → sin modelo"
      scaler: "StandardScaler por familia"
  metrics_returned:
    - family_cv_accuracy_mean
    - family_cv_accuracy_std
    - family_cv_macro_f1_mean
    - family_cv_macro_f1_std
    - severity_cv (por familia: accuracy_mean/std, macro_f1_mean/std)
    - n_samples
    - n_groups
    - training_time_s
  not_ported: >
    scripts.predict_oof (OOF completo, 255 s [M] Tabla 7) no se repite en /train: es evaluación,
    no produce el modelo servido. /train reproduce scripts.train (CV por folds + refit final).
  duracion_estimada: "72 s en Intel i7-9700 CPU [M] Tabla 7; [V] /train real sobre las 877 filas: 23 s de entrenamiento, 26 s la petición completa (WSL, CPU, backend Keras torch)"
  determinism: >
    RF y GroupKFold deterministas (random_state=42). Los MLP de severidad NO son bit-reproducibles
    (inicialización, barajado y oneDNN) — lo declara la propia memoria [M] §6.3.
  source: codigo_entrenamiento

constraints:
  severidad_condicionada: "La severidad solo se estima si la familia predicha no es healthy y existe modelo para ella [C][M] §5.1, §8.2"
  configuraciones_operativas_raw:
    allowed: {"Motor-2": [50, 75, 100], "Motor-4": [70]}
    descripcion: >
      [M] §3.1 Tabla 2, §8.2 y §10: --motor/--speed deben corresponder a una configuración
      documentada del banco NLN-EMP y no deben elegirse de forma arbitraria (condicionan la
      frecuencia de giro de las features 1X/2X). El plugin rechaza (422, excepción de dominio)
      una combinación motor/velocidad fuera de esta lista en el modo raw.
  rpm_por_configuracion: "[C] preprocess.get_rpm: Motor-2 → 1470·speed/100; cualquier otro motor → 2950·speed/100"

