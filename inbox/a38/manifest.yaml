# Comprobación adicional del modo raw. NO es un golden case: la salida esperada no viene de un
# split de test ni de una tabla auditada de la memoria, sino del JSON de ejemplo que deja el
# equipo en la entrega. Sirve para comprobar que el plugin replica scripts.predict_raw, no para
# medir acierto (la familia real del ejemplo es alignment y el modelo dice mechanical_other).
reference_checks:
  - id: raw_example_entrega
    source: "data/predictions/raw_example_prediction.json + data/examples/raw/{vibration,current}_example.csv [C]; comando en [M] §8.2"
    input: {vibration_csv: data/examples/raw/vibration_example.csv, current_csv: data/examples/raw/current_example.csv, motor: Motor-4, speed: 70, window_index: 0}
    expected: {family: mechanical_other, severity: 0, severity_label: leve, severity_confidence: 0.015418630093336105}
    true_condition: "align angular 3 (familia alignment, severidad 3) [C] example_metadata.json"
    caveat: "Extracto recortado a 4096 filas; las ventanas de entrenamiento tienen 240000/300000 muestras → features fuera de escala (ver known_issues)"

known_issues:
  - id: KI-01
    tipo: encoding
    detalle: >
      requirements.txt está bien (ASCII, LF, sin BOM, 139 dependencias fijadas con ==; incluye
      Jupyter y utilidades de análisis que no son de inferencia). Los ficheros de traceability/
      (artifact_summary.json, train.log, predict_oof.log, get_stats.log) están en UTF-16LE con BOM
      y CRLF; no son funcionales, pero hay que abrirlos con esa codificación.
  - id: KI-02
    tipo: golden_cases
    detalle: >
      No existe split de test hold-out: data/splits/ solo contiene fold_assignments.csv (asignación
      OOF). Los golden cases salen de ese fichero + el parquet real, y su expected es la salida del
      modelo final entregado (predictions.csv). Ese modelo final se entrenó con las 877 filas, así
      que los casos validan la fidelidad de la integración (mismo preprocesado y misma salida que
      el original), no la capacidad de generalización. La única evidencia de generalización es la
      OOF del equipo (macro-F1 familia 0,5914).
  - id: KI-03
    tipo: entorno
    detalle: >
      Los .pkl se generaron con scikit-learn 1.7.2 y el repo fija scikit-learn==1.5.2 (pin por el
      servicio de explicabilidad). Al cargar se emite InconsistentVersionWarning. [V] Con 1.5.2 la
      predicción coincide 877/877 con predictions.csv. Riesgo residual: sklearn no garantiza
      compatibilidad de pickles entre versiones; si cambia el pin hay que repetir la comprobación.
  - id: KI-04
    tipo: entorno
    detalle: >
      Los MLP de severidad son objetos Keras 3 dentro de un pickle, guardados con backend
      TensorFlow. En el servidor del repo Keras corre con backend torch (ml1 fija
      KERAS_BACKEND=torch al importarse desde registry.py). [V] Cargados con backend torch dan las
      mismas probabilidades (|Δ| ≤ 3.6e-7). El plugin usa solo keras.ops (independiente del
      backend) y no importa TensorFlow. El entrenamiento original usa tf.GradientTape, que no
      funciona con backend torch: el plugin porta el mismo procedimiento con model.fit y una
      pérdida keras.ops matemáticamente idéntica (ver docstring de training.py).
  - id: KI-05
    tipo: modo_raw_longitud
    detalle: >
      [V] Las ventanas de entrenamiento tienen 240000 muestras de vibración (12 s) y 300000 de
      corriente (15 s) a 20 kHz. vib/ele_spectral_energy, *_spectral_centroid (en bins) y
      vib_amp_1x/2x dependen de la longitud de la señal. Los CSV de ejemplo de la entrega están
      recortados a 4096 filas, así que sus features quedan fuera de la escala de entrenamiento
      ([V] vib_spectral_energy 1,6e6 frente a un mínimo de entrenamiento de 1,25e9;
      vib_spectral_centroid 1483 frente a un mínimo de 46612; ele_spectral_energy 3,9e9 frente a
      3,1e12). Por eso el ejemplo oficial ("align angular 3",
      familia real alignment) sale como mechanical_other. Ni el código ni la memoria validan la
      longitud. El plugin devuelve la predicción con un aviso explícito (input_warnings) cuando
      la longitud no coincide; no la rechaza. DECISIÓN PENDIENTE: avisar o rechazar (422).
  - id: KI-06
    tipo: modo_raw_canal
    detalle: >
      [V] Las 877 muestras de entrenamiento usan solo el canal 1 de vibración (rodamiento lado no
      accionado del motor, horizontal) y el canal 1 eléctrico (corriente fase 1). La memoria (§8.2,
      Tablas 15-16) presenta predict_raw como aplicable a cualquier canal chN, incluidos los de
      tensión (ch4-6, en V), que el modelo nunca ha visto. El plugin no puede saber el canal a
      partir de un CSV sin nombre normalizado; se documenta en /stats y en el DTO.
  - id: KI-07
    tipo: modo_raw_rpm
    detalle: >
      get_rpm usa 1470 rpm (Motor-2) y 2950 rpm (resto) nominales × velocidad/100. La memoria
      (Tabla 2) documenta 740/1110/1480 rpm (Motor-2) y 2070-2085 rpm (Motor-4 al 70 %), y el
      código da 735/1102,5/1470 y 2065. Diferencia pequeña (<1 %), pero no es la que dice la
      memoria. El plugin replica el código, que es con lo que se entrenó.
  - id: KI-08
    tipo: rendimiento
    detalle: >
      Familia electrical muy débil en OOF (F1 0,1667) y su modelo de severidad tiene CV
      accuracy = macro-F1 = 0,0 ([A] training_severity_metrics.json, dato que no aparece en la
      memoria). La clase de severidad 0 (nivel 1) también es débil (F1 OOF 0,2148). Las salidas de
      severidad para electrical no deberían usarse para decidir.
  - id: KI-09
    tipo: etiquetado
    detalle: >
      extract_severity toma el último número del nombre del fallo: "healthy 1/2/3" acaba con
      severidad 1/2/3 aunque son repeticiones de la condición sana, no severidades, y "coupling 2D"
      queda en -1. No afecta al modelo servido (healthy no tiene modelo de severidad), pero sí al
      CSV que se pase a /train si se construye con la misma regla.
  - id: KI-10
    tipo: dominio
    detalle: >
      El dataset es un banco de ensayo motor-bomba centrífuga (NLN-EMP), no maquinaria de bodega.
      No hay validación sobre maquinaria vitivinícola real [M] §1, §10. El KPI CU02 (+15 % de vida
      útil) no está demostrado: requiere validación con datos reales antes de desplegar.
  - id: KI-11
    tipo: memoria
    detalle: >
      La memoria sigue la estructura estándar de la plantilla, con estas diferencias: la sección de
      arquitectura se llama "Arquitectura general" (no "Arquitectura y Algoritmos"); no hay tabla de
      métricas de test hold-out (la evaluación es CV/OOF); no hay tabla de escenarios de negocio.
      §6.2 dice que algunos parámetros de config.yaml no se consumen dinámicamente, pero en el
      código v1.6 sí se leen (config.get con los mismos valores por defecto). §5.2 describe la
      salida como CSV con "probabilidades asociadas"; el original solo da severity_confidence.
  - id: KI-12
    tipo: reproducibilidad
    detalle: >
      La traza E2E del equipo registra un primer intento fallido al leer el parquet ("OSError
      Repetition level histogram size mismatch", Python por defecto) y otro correcto con el
      entorno conda m38. [V] pyarrow 25 (entorno del repo) lee el parquet sin error.
  - id: KI-14
    tipo: reentrenamiento_version_sklearn
    detalle: >
      [V] /train sobre las 877 filas da CV de familia macro-F1 0,6064 ± 0,1105 y accuracy 0,6168
      ± 0,1117, frente a los 0,6070 / 0,6180 declarados (Tabla 9). Diagnóstico
      (outputs/a38/evidence/family_cv_parity.py): en el mismo entorno, el port del plugin y el
      train_family_model original dan resultados idénticos (diferencia < 1e-12), y los folds
      GroupKFold coinciden con fold_assignments.csv. Con scikit-learn 1.7.2 (la del equipo), el
      original reproduce exactamente 0,607003. La diferencia sale solo del pin
      scikit-learn==1.5.2 del repo, que hace crecer el RandomForest de forma ligeramente
      distinta. No afecta al modelo servido (sus .pkl se predicen 877/877 igual), solo a los
      reentrenos. Las métricas CV de severidad varían entre ejecuciones (MLP no determinista,
      [M] §6.3).
  - id: KI-15
    tipo: dependencias
    detalle: >
      El plugin no añade dependencias. Leer parquet en /predict batch y /train requiere pyarrow,
      que no está en requirements.txt: llega como dependencia transitiva de mlflow. Los CSV no lo
      necesitan.
  - id: KI-13
    tipo: entregable
    detalle: >
      En el repo de integración la memoria v1.2 estaba versionada y el working tree la sustituye
      por la v1.6 (sin commitear, cambio previo a esta integración). Este manifest usa la v1.6.
