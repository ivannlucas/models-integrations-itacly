    family_accuracy: 1.0
    severity_accuracy: 0.9578
  kpi_objetivo:
    tecnico: "Accuracy y Macro-F1 en torno a 0,60 (referencia, no umbral rígido) [M] §2, §7.1"
    negocio: "CU02: +15 % de vida útil de la maquinaria — NO demostrado; requiere validación operacional en planta [M] §2, §9.4"
  exploratorio_no_usar: "[M] Tabla 8 (RF ~0,90 accuracy, etc.) es exploratoria y la propia memoria dice que no es evidencia"

tolerance_policy:
  family: "coincidencia exacta de la etiqueta (RF determinista)"
  severity: "coincidencia exacta (0/1/null) y misma severity_label"
  severity_confidence: >
    |obtenido − esperado| ≤ 0.05 (5 % de la escala de probabilidad). Valor POR DEFECTO del skill
    verification: metrics_reported solo contiene métricas de clasificación (accuracy/F1), no un
    error de regresión del que derivar una tolerancia sobre la probabilidad. Se señala como
    default en el verification_report.
  note: "Los golden cases verifican fidelidad de la integración frente al modelo entregado, no generalización (ver known_issues)."

