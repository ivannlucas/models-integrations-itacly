     para su propio caso) pasaba la validación de validate_and_align_sensors (el float() de
     Python lo acepta sin lanzar excepción) y llegaba a RandomForestRegressor.predict(), que
     rechaza entradas no finitas con un ValueError sin capturar -- mismo patrón que el bug #1 de
