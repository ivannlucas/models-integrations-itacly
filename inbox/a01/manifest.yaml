  verificacion_a_gran_escala_28_10_2026: >
    Tras recibir el corpus completo (ver known_issues), se re-verifico el plugin real contra los
    datos reales completos, no solo contra las 20 muestras de arriba:
    (1) RandomForestClassifier/Regressor: train_tabular_experts() ejecutado contra
    data/raw/TABULAR/SENSORES.csv completo (500.000 filas reales), reproduciendo su propio split
    80/20 con random_state=42 (identico al que genero data/splits/train_rf.csv|test_rf.csv en el
    codigo original). Resultado EXACTO frente a models/metrics/classification/report_rf_tabular_no_gases.csv:
    accuracy=0.11593 (vs 0.11593 auditado), f1_macro=0.11804 (vs 0.11804), f1_weighted=0.11755
    (vs 0.11755) -- coincidencia perfecta, confirma que training.py es un port fiel bit a bit.
    (2) Deep Ensemble CNN: predict_inline() del plugin real ejecutado contra las 1470 imagenes
    reales de data/splits/test_split.csv (el split de test oficial, support=1470 igual que el
    informe auditado), recortando cada imagen con nuestro propio pipeline YOLO desde la imagen
    en bruto (no desde la cache ya recortada que trae Cached_Path). Resultado: 1391/1470 (94.63%)
    exacto frente al 94.69% auditado (report_ensemble_final_no_gases_desacoplado.csv);
    f1_macro=0.8897 frente a 0.8807 auditado, f1_weighted=0.9459 frente a 0.9463. Las clases mas
    debiles coinciden exactamente con las ya documentadas: LOBESIA (f1=0.6923, recall=0.60),
    OIDIO_RACIMO (f1=0.6897, recall=0.77), EMPOASCA (f1=0.8276, recall=0.71) -- ninguna sorpresa,
    confirma las debilidades de clases minoritarias ya conocidas, no un fallo de integracion.
    Script y resultados completos (79 fallos, uno por fila) disponibles bajo demanda.
    CORRECCIÓN (revisión posterior del mismo 28/10/2026, rama fix/a01-ml1-review-fixes): el punto (1)
    sigue en pie. El punto (2) se midió con EfficientNetB0 mal reconstruido (ver known_issues): ese
    plugin roto, con imagen en bruto, da exactamente 0.9463, pero el modelo del equipo con imagen en
    bruto da 0.9401 -- la cercanía al 0.9469 auditado era casual (el backbone roto 'mejora' el
    ensemble). Con la corrección, el plugin da 0.9469 / 0.8807 / 0.9463 exactos sobre los recortes
    cacheados, 0.9483 sobre la imagen 224 y 0.9401 sobre la imagen en bruto. Las cifras por clase de
    (2) (OIDIO_RACIMO f1 0.69 / recall 0.77, EMPOASCA f1 0.83 / recall 0.71) tampoco son del modelo
    real: las auditadas (y reproducidas) son OIDIO_RACIMO 0.593 / 0.615, EMPOASCA 0.741 / 0.588,
    LOBESIA 0.667 / 0.60.
