  - "[CORREGIDO TRAS REVISIÓN EXTERNA, PR #24] Un compañero probó la rama desplegada y reportó
     tres fallos reales, confirmados contra el código y corregidos:
     1) Un sensor no numérico en predict_batch escapaba como ValueError sin capturar (el except
        por fila solo cubría DataContractError/InvalidImageError), abortando el lote entero y
        descartando también las filas ya procesadas correctamente. Corregido en
        preprocessing.py::validate_and_align_sensors: el fallo de conversión numérica ahora
        lanza DataContractError, así que predict_batch lo reporta como error de esa fila sin
        afectar al resto.
     2) predict_batch elegía un único directorio de búsqueda de imágenes (la raíz del ZIP, o la
        subcarpeta images/ si existía, nunca ambos), pese a que predict_dto.py ya documentaba
        que se buscan en ambos sitios por nombre de fichero. Una foto válida en la raíz se
        ignoraba silenciosamente (IMAGEN_NO_DISPONIBLE, fila contada como correcta) en cuanto el
        ZIP también traía una subcarpeta images/ para otras filas. Corregido:
        resolve_image_path_for_batch ahora acepta una lista de directorios y los prueba en
        orden (images/ primero si existe, luego la raíz)."
  - "[CORREGIDO TRAS REVISIÓN EXTERNA, PR #24] training.metrics_returned exige f1_weighted, pero
