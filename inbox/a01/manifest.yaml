     contra las funciones reales y contra un lote real de 2 filas (una con GDD_Acumulado=1e100,
     otra válida) vía HTTP: 200, fila mala con error descriptivo, fila válida intacta."
  - "[CORREGIDO 2026-10-28 -- FIDELIDAD] EfficientNetB0 se reconstruía con weights=None; el
