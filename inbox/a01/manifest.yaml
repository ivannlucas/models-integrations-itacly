model_id: ml1-wine-pest-disease-detection
sector: vitivinicola
nombre: "Desarrollo de un modelo de análisis de imágenes para detección de plagas derivadas de insectos (VID-Deep_Ensemble)"
# Título y acrónimo literales de la memoria v5.0 (21/09/2026). Nombre interno del equipo de IA:
# "Sistema Fitopatológico de Vid" / "Modelo 1" (metadata.txt, EJECUCION_MODELO_1.md). Lote 2.
task_type: classification_regression_multimodal
# Panel híbrido imagen+tabular: clasificación de 15 patologías (CNN ensemble) + regresión de un
# índice de riesgo 0-1 (cabecera tabular MLP, modo desacoplado), con un detector de objetos YOLOv8
# como etapa de preprocesado y dos modelos Random Forest tabulares de contingencia.
framework:
  - torch==2.5.1          # exacto en requirements.txt (backend de Keras 3 para entrenamiento; KERAS_BACKEND=torch obligatorio)
  - torchvision==0.20.1   # exacto
  - "tensorflow-cpu>=2.15.0 (Linux/Windows) / tensorflow>=2.15.0 (macOS)"  # solo suelo minimo, NO exacto
  - "keras>=3.0.0"        # solo suelo minimo, NO exacto -- multi-backend, produccion usa backend torch
  - "scikit-learn>=1.2.0" # solo suelo minimo -- RandomForestClassifier/Regressor
  - "ultralytics>=8.0.0"  # YOLOv8, solo suelo minimo
  - "pandas>=2.0.0, numpy>=1.23.5,<2.0.0"  # solo suelo minimo
  - joblib  # sin pin explicito en requirements.txt
# NOTA: solo torch/torchvision tienen version exacta fijada en requirements.txt. El resto son
# minimos (">="), verificado byte a byte (ASCII, LF, sin BOM) -- no copiar estos como si fueran
# pines exactos al redactar requirements.txt del plugin.

# ============================================================================
# FUENTES Y ESTADO DE ACEPTACION -- dos entregas distintas, fusionadas en inbox/a01/codigo/
# ============================================================================
# 1. ZIP original (código): src/, scripts/, config/, requirements.txt, models/artifacts/ (solo
#    pesos CNN + YOLO + class_mapping, SIN los .joblib de RF) y un data/processed/to_predict/
#    input.csv de 3 filas sin etiqueta. La carpeta data/ (9.794 imagenes, SENSORES.csv de 500.000
#    filas, MANIFEST_MULTIMODAL.csv, data/splits/) NO viene en este ZIP -- la memoria avisa de que
#    vive en un contenedor externo de gran tamaño, fuera del alcance de esta entrega de código.
# 2. ZIP "modelo 1.zip" (pedido aparte tras la primera revisión): completa models/artifacts/ con
#    los 4 .joblib de RF (clase/riesgo x con/sin gases) + ssd_vgg16_expert.pth; completa
#    models/metrics/ con los CSV/PNG REALES de evaluación (classification_report, regression,
#    training history, YOLO results.csv, SSD metrics.json) para las 4 variantes de arquitectura;
#    y añade datos_plataforma/ -- un paquete de integración ya preparado por el equipo de IA con
#    20 muestras reales etiquetadas (imagen + sensores + patologia real + riesgo real), extraidas
#    de su propio test_split.csv, mas un script de referencia y contratos JSON de ejemplo.
# No hay "Ficha de Valoración del Estado Técnico" en ninguna de las dos entregas.

artifacts:
  folder: models/artifacts/   # ruta dentro del codigo entregado -- variante de produccion: sufijo _no_gases_desacoplado
  files:
    - best.pt                                              # YOLOv8, detector hoja(0)/racimo(1)
    - class_mapping_no_gases.json                          # {0..14: nombre_clase}, idéntico a class_mapping.json
    - ensemble_member_mobilenet_no_gases_desacoplado.weights.h5
    - ensemble_member_efficientnet_no_gases_desacoplado.weights.h5
    - ensemble_member_densenet_no_gases_desacoplado.weights.h5
    - final_ensemble_complete_no_gases_desacoplado.h5      # promedio (layers.Average) de los 3 anteriores -- no usado directamente por predictor.py, que reconstruye y promedia en runtime
    - rf_clase_expert_no_gases.joblib                      # NO usado en inferencia de produccion (modo desacoplado) -- el plugin no lo carga ni lo publica en S3
    - rf_riesgo_expert_no_gases.joblib                     # fallback de riesgo cuando no hay imagen -- el entregado (sklearn 1.8.0) se re-serializo con 1.5.2, ver known_issues
  no_pickle_for_cnn: "Los backbones son pesos Keras (.weights.h5), no pickle -- se reconstruye la arquitectura con build_hybrid_model() y se cargan los pesos (load_weights)."
  keras_backend_requisito: "KERAS_BACKEND=torch debe fijarse como variable de entorno ANTES de importar keras/tensorflow, igual que exige el entrenamiento (EJECUCION_MODELO_1.md, sec. 2.1) -- confirmar si aplica tambien a inferencia o solo a entrenamiento (predictor.py no lo fija explícitamente, solo hace `import tensorflow as tf`)."

inputs:
  fixed:
    - name: image
      type: "bytes/path (JPG/PNG), opcional"
      description: >
        Foto de campo de una hoja o racimo de vid. Si se aporta, el sistema recorta
        automaticamente con YOLOv8 (conf=0.3, se usa boxes.data[0] -- la primera caja que
        devuelve YOLO, no un argmax explicito de confianza) y reescala a 224x224. Si se omite,
        es None, o la ruta no es localizable, el sistema entra en modo de contingencia tabular.
    - name: sensors
      type: "dict[str, float]"
      description: >
        Telemetria IIoT de los ultimos 5 dias. En la configuracion de produccion
        (exclude_gases=true) son 9 campos obligatorios: Mes, Temp_Max_Media_5d_C,
        Temp_Min_Media_5d_C, Hum_Rel_Max_5d_Pct, Hum_Rel_Min_5d_Pct, Hum_Suelo_Pct,
        Lluvia_Acum_5d_mm, Horas_Humedad_Foliar, GDD_Acumulado. CO2_ppm y VOC_ppb se ignoran si
        se envian (no son error, pero tampoco se usan) -- ver predictor.py::_validate_sensor_dimensions.
  control: []
  derived_if_missing:
    note: >
      Nada se deriva: todos los sensores son obligatorios tal cual (validate_sensor_dimensions
      exige coincidencia EXACTA de nombres, sin tolerancia a columnas de más o de menos salvo
      CO2/VOC en modo exclude_gases). La imagen es el unico campo verdaderamente opcional.
  plugin_contract:
    predict_inline: "una muestra: {image (opcional), sensors (9 campos)}"
    predict_batch: "CSV largo igual al --input original: Path_Imagen + 9 columnas de sensores (N/A o ruta invalida => modo tabular por fila). Como predictor.py:317, cualquier otra columna (ID, Etiqueta, Cached_Path...) se ignora"

outputs:
  predict_inline:
    - name: enfermedad
      type: string
      description: >
        Una de las 15 clases (ALTICA, BLACK_ROT, BOTRYTIS, EMPOASCA, ERINOSIS, ESCA_HOJA,
        ESCA_RACIMO, HEALTHY_HOJA, HEALTHY_RACIMO, ISARIOPSIS, LOBESIA, MILDIU, OIDIO,
        OIDIO_RACIMO, RED_MITE), o "IMAGEN_NO_DISPONIBLE" si no hay imagen (modo desacoplado,
        el de produccion -- ver known_issues sobre la discrepancia con la memoria).
    - name: confianza
      type: float
      description: "Probabilidad softmax de la clase ganadora, promedio de los 3 backbones (soft voting). 0.0 si enfermedad=IMAGEN_NO_DISPONIBLE."
    - name: riesgo
      type: float
      description: >
        Indice de riesgo epidemiologico 0.0-1.0 (regresion). Con imagen: salida de la cabecera
        tabular del ensemble (promedio de los 3 modelos), clip a [0,1], y si enfermedad es
        HEALTHY_* con confianza > 0.80 se multiplica x0.6 (regla de negocio en predictor.py).
        Sin imagen: salida directa del RF regresor (rf_riesgo_expert_no_gases.joblib).
    - name: metodo
      type: string
      description: "HIBRIDO_ENSAMBLE (con imagen) | RIESGO_TABULAR_EXPERT (sin imagen, modo desacoplado de produccion)."
  predict_batch: "mismo contrato que predict_inline, una fila de salida por fila de entrada (Path_Imagen N/A o inexistente -> RIESGO_TABULAR_EXPERT para esa fila; si ademas faltan los RF, la fila se descarta con log, ver known_issues)"

constraints: {}  # no hay restricciones duras de negocio sobre el valor predicho; las validaciones son de contrato de entrada (ver exceptions en plugin-integration)

training:
  supported: true
  scope_note: >
    Soporte PARCIAL, con dos procedimientos completamente distintos en el codigo original
    (src.main train, train_manager() segun pipeline_mode):
      - tabular_expert (run_tabular_training -> src/training/train_tabular.py): rapido (<2 min
        con tuning, <5s sin tuning), 100% CPU, reentrena los 2 RandomForest con un CSV tabular
        (sensores + Etiqueta + Indice_Riesgo_Cientifico). ESTE es el que tiene sentido exponer
        como train() del plugin: es ligero, no necesita imagenes, y el cliente puede aportar un
        CSV de ese tamaño razonablemente.
      - hybrid (run_training -> src/training/train.py): re-entrena los 3 backbones CNN desde
        cero (o, siguiendo la regla del repo, desde el checkpoint servido -- nunca desde
        ImageNet ni desde un reentreno anterior), GPU recomendada, ~4h20min en CPU (memoria,
        Tabla 2) para los 3 backbones x 50 epocas. El corpus completo (10.526 imagenes) SI
        esta disponible ya (ver known_issues, entrega 28/10/2026) y el repo ya soporta
        `/train?wait=false` (entrenamiento asincrono, generico para cualquier plugin cuyo
        reentreno viva solo en MLflow -- es el caso de ml1), asi que el argumento original de
        "no puede ser sincrono" ya no aplica. Sigue fuera de alcance de este cambio concreto
        por una razon distinta: portar fielmente el pipeline de entrenamiento completo
        (tf.data, CLAHE + aumentado, ReduceLROnPlateau, EarlyStopping paciencia 20, ruido
        gaussiano tabular, fine-tuning parcial de las ultimas `train_base_layers` capas) es un
        trabajo grande con riesgo real de fidelidad -- exactamente el tipo de pieza donde este
        repo ya ha tenido bugs serios (ml8, 6 divergencias) -- y no se puede verificar de
        extremo a extremo en un entorno sin GPU (4h+ de CPU). Recomendacion: abordarlo como
        tarea propia, dedicada, con verificacion por piezas (split, scheduler, transforms) via
        smoke tests de segundos antes de confiar en una ejecucion completa."
  target_column: "Etiqueta (clasificacion, 15 clases) + Indice_Riesgo_Cientifico (regresion, 0-1)"
  required_columns: [Mes, Temp_Max_Media_5d_C, Temp_Min_Media_5d_C, Hum_Rel_Max_5d_Pct, Hum_Rel_Min_5d_Pct, Hum_Suelo_Pct, Lluvia_Acum_5d_mm, Horas_Humedad_Foliar, GDD_Acumulado, Etiqueta, Indice_Riesgo_Cientifico]
  # CO2_ppm/VOC_ppb opcionales -- se ignoran en modo exclude_gases=true (produccion)
  hyperparams:
    rf_clasificador: {n_estimators: 200, max_depth: 15, min_samples_leaf: 20, max_features: "log2", bootstrap: true, random_state: 42}
    rf_regresor_riesgo: {n_estimators: 200, max_depth: 30, min_samples_leaf: 10, max_features: "log2", bootstrap: true, random_state: 42}
    nota_tuning: >
      src/training/tuning.py (RandomizedSearchCV, 3-fold, n_iter=10) existe y SI se ejecuto
      (metadata.txt lo registra) pero sus mejores hiperparametros NO se escriben de vuelta en
      train_tabular.py -- los hiperparametros arriba son los que de verdad usa el codigo de
      produccion (hardcoded), no necesariamente los que tuning_RF encontro como optimos.
      Comprobado contra get_params() de los .joblib entregados: identicos (min_samples_split=2
      por defecto -- una version anterior de este manifest declaraba 10/5 por error).
  metrics_returned: [accuracy, f1_macro, f1_weighted, mae_riesgo, n_train, n_test]
  source: codigo_entrenamiento  # src/training/train_tabular.py, confirmado por sub-agente de exploracion
  duracion_estimada: "< 2 min con tuning previo, < 5 s sin tuning (memoria Tabla 2, Intel i9-14900K)"

constraints_entrenamiento: "El CSV de entrenamiento debe traer las 15 clases representadas (RandomForestClassifier con stratify implicito via el propio reparto 80/20); no hay minimo de filas documentado por el equipo de IA."

metrics_reported:
  # TODAS las cifras de esta seccion son de ficheros CSV auditables reales de
  # models/metrics/classification/ y models/metrics/detection/YOLO/results.csv (segunda entrega,
  # "modelo 1.zip"), NO solo de las tablas de texto de la memoria -- cruzadas y consistentes con
  # memoria Tablas 4, 6, 7 (diferencias de redondeo del 0.1-0.3%).
  clasificacion_deep_ensemble_produccion:
    # report_ensemble_final_no_gases_desacoplado.csv (support total 1470, holdout test)
    accuracy: 0.9469
    f1_macro: 0.8807
    f1_weighted: 0.9463
    peor_clase: {nombre: OIDIO_RACIMO, f1: 0.593, recall: 0.615, support: 13}
    mejor_clase: {nombre: ALTICA, f1: 0.992, recall: 1.0, support: 59}
    nota_clases_minoritarias: "EMPOASCA (f1=0.741, recall=0.588) y LOBESIA (f1=0.667, recall=0.60) tambien quedan muy por debajo de la media -- support bajo (17 y 15 filas de test respectivamente)."
  clasificacion_rf_tabular_sin_gases:
    # report_rf_tabular_no_gases.csv (support total 100.000, holdout 20% real)
    accuracy: 0.11593
    f1_macro: 0.1180
    nota: >
      Confirma por que el codigo de produccion (modo desacoplado) NO usa este RF para
      clasificar cuando falta la imagen: 11.6% de accuracy en 15 clases es casi aleatorio
      (baseline=6.7%). Ver known_issues.
  regresion_riesgo_deep_ensemble_desacoplado_sin_gases:
    mae: 0.189          # memoria Tabla 7 -- no hay CSV propio, solo graficas PNG en models/metrics/regression/ (sin cifra exacta re-extraible de un PNG)
    mae_con_10pct_ruido_sensores: 0.188
    fuente: memoria_tabla_7  # a diferencia de clasificacion, esta cifra NO tiene CSV auditado -- solo PNG + memoria
  deteccion_yolo:
    # models/metrics/detection/YOLO/results.csv, epoca final (50/50)
    precision: 0.995
    recall: 1.0
    map50: 0.995
    map50_95: 0.868
    clases: ["hoja (id 0)", "racimo (id 1)"]
  kpi_contractual:
    accuracy_minimo: 0.80   # memoria 6.1 -- CUMPLE (0.9469)
    f1_macro_minimo: 0.85   # memoria 6.1 -- NO CUMPLE en sentido estricto (0.8807 > 0.85 realmente SI cumple, verificar: 0.8807 >= 0.85 -> CUMPLE por escaso margen)
    recall_minimo: 0.85     # memoria 6.1 -- varias clases minoritarias (EMPOASCA 0.588, LOBESIA 0.60, OIDIO_RACIMO 0.615) NO cumplen individualmente aunque el macro recall si
    precision_minima: 0.85  # memoria 6.1

golden_cases:
  # 20 muestras reales con imagen + sensores + ETIQUETA REAL + RIESGO REAL, extraidas por el
  # propio equipo de IA de su test_split.csv (datos_plataforma/muestras_con_etiqueta_real.csv +
  # datos_plataforma/imagenes/). NO son inventadas. Revision 2026-10-28, con la carpeta data/
  # completa del equipo: los 20 casos se localizan en data/splits/test_split.csv (nombre de
  # fichero + 9 sensores), con etiqueta y riesgo identicos; las imagenes son las de
  # data/processed/IMAGENES_RESIZED224/.
  #
  # predicho_* = salida del plugin real por HTTP (main.py + artefactos reales, sin parches) DESPUES
  # de corregir la reconstruccion de EfficientNetB0 (ver known_issues). Los predicho_* anteriores
  # (19/20) se midieron con EfficientNet roto y no correspondian al modelo del equipo.
  source_note: "dataset_test_split (data/splits/test_split.csv del equipo de IA; antes via datos_plataforma/muestras_con_etiqueta_real.csv)"
  tolerance_clasificacion: "coincidencia exacta de clase (no hay tolerancia relativa aplicable a una etiqueta categorica)"
  tolerance_riesgo: "2 x MAE reportado (0.189) = 0.378 absoluto sobre el riesgo real, igual que el patron de tolerancia de otros modelos de este repo"
  resultado_verificado: >
    Clasificacion: 18/20 exacta -- fallan caso_13 (OIDIO -> HEALTHY_HOJA, conf 0.416) y caso_17
    (OIDIO -> OIDIO_RACIMO, conf 0.311), ambos errores del propio modelo (el pipeline original con
    los mismos pesos da la misma clase). Consistente con el test completo: el plugin reproduce
    exactamente accuracy 0.9469 / F1 macro 0.8807 / F1 weighted 0.9463 sobre las 1470 filas.
    Riesgo: 19/20 dentro de 2xMAE (unico fuera caso_11, LOBESIA, 0.793 vs 0.227) -- pero ver
    known_issues: esa tolerancia deja pasar practicamente cualquier prediccion, el riesgo no
    tiene capacidad predictiva real. Nada se ha silenciado ni se ha ajustado la tolerancia.
