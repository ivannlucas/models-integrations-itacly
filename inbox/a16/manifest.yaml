known_issues:
  - >
    DISCREPANCIA MEMORIA vs ARTEFACTOS ENTREGADOS: la memoria v1.5 (Tabla 9, sec. "Métricas y
    Rendimiento") reporta para target_animales umbral=0.46 y test {Accuracy=0.750, Precision=0.714,
    Recall=0.833, F1=0.769, AUC=0.944}; para target_insumos test {Accuracy=0.583, Precision=0.375,
    Recall=1.000, F1=0.545, AUC=0.889}. Los artefactos REALMENTE entregados
    (models/metrics/hibrido_xgb_logreg_resumen.json + train_config.json) usan umbral
    target_animales=0.48 y reportan test {Accuracy=0.833, Precision=0.833, Recall=0.833, F1=0.833,
    AUC=0.917} para animales y {Accuracy=0.667, Precision=0.429, Recall=1.0, F1=0.6, AUC=0.741}
    para insumos. Recall/F1/AUC de insumos también difieren (memoria: Recall=1.0 F1=0.545 AUC=0.889;
    artefacto: Recall=1.0 F1=0.6 AUC=0.741). Se ha verificado que el artefacto entregado es
    internamente consistente (las probabilidades de predicciones_test.csv reproducen exactamente
    estas métricas al recalcularlas, y son las mismas que reproduce scripts/predict.py ejecutado
    de cero) -- probablemente el modelo se reentrenó tras cerrar la redacción de la memoria v1.5 sin
    actualizar la Tabla 9. Se usan las cifras del artefacto real como metrics_reported, siguiendo el
    principio de autoridad de artefactos que el propio README del modelo declara explícitamente.
  - >
    DESPLAZAMIENTO DE FECHA ENTRE ENTRENAMIENTO E INFERENCIA: trainer.py::run_training() etiqueta
    data/predictions/predicciones_test.csv con la fecha t de la FILA DE ENTRADA (el mes que se
    observa, no el mes que se predice). predictor.py::prepare_input(), en cambio, calcula
    'fechas' como t + horizon(4) meses -- la fecha del mes OBJETIVO de la predicción. Ambas
    convenciones son coherentes con su propósito (evaluación vs. producción) pero un consumidor
    del plugin (front, ODD) podría interpretar mal a qué mes corresponde una fila si no se
    documenta explícitamente esta diferencia. El plugin debe exponer con claridad si la fecha
    devuelta es "mes observado" o "mes predicho" -- se recomienda usar la convención de
    predictor.py (mes predicho) por ser la que ve producción, y documentarla en la respuesta.
  - >
    'wash_days' Y 'precip_max' forman parte del esquema de columnas obligatorio de
    dataset_clasificacion_base.csv y del CSV de entrada esperado por prepare_input() (aparecen en
    README, sec. "Formato de entrada para inferencia" y "Variables climáticas agregadas"), pero
    NINGUNA de las dos aparece en input_cols_per_target de train_config.json ni en
    features.input_cols/exog_cols de config.yaml -- no son features reales del modelo, solo forman
    parte del esquema base heredado del merge de clima (de las 4 variables climáticas mencionadas
    en la memoria como "fundamentales para evaluar el estrés de los cultivos de cereal", solo
    precip_total y wet_days llegan realmente al modelo). El plugin debe seguir aceptándolas en el
    input (para no romper la paridad de esquema con dataset_clasificacion_base.csv) aunque no
    influyan en la predicción.
  - >
    'month' es una columna de entrada FUNCIONALMENTE NECESARIA (create_endogenous_features() la
    lee directamente para month_sin/month_cos) que el código original NUNCA deriva de 'fecha' --
    debe venir informada en el CSV/filas de entrada tal cual lo hace dataset_clasificacion_base.csv.
    Si el plugin decide derivarla automáticamente de 'fecha' como conveniencia para el caller (fecha
    es siempre día 1 del mes, por lo que el resultado numérico es idéntico), es una adición del
    plugin, no un comportamiento heredado del código entregado -- debe documentarse como tal y no
    presentarse como parte del contrato original.
  - >
    trainer.py::run_training() valida `if len(target_cols) != 2: raise ValueError(...)` -- el
    pipeline de entrenamiento canónico (h=4) está codificado explícitamente para exactamente dos
    targets (target_animales vía XGBoost, target_insumos vía LogReg) y no generaliza sin refactor
    del código fuente. Si en el futuro se quisiera reentrenar con más/menos targets, no basta con
    cambiar config.yaml.
  - >
    predictor.py::prepare_input() NO valida que el histórico de entrada no tenga huecos mensuales
    (fechas no consecutivas) -- solo valida el número total de filas (>= min_rows_required). Un CSV
    con fechas discontinuas pero con >= 10 filas pasaría la validación y generaría rolling/lag
    features incorrectas silenciosamente (p.ej. precip_total_lag6 podría estar tomando un valor de
    hace 8 meses reales si hay huecos). Debe documentarse como responsabilidad del caller o
    añadirse validación explícita en el plugin.
  - >
    Los artefactos de bagging (bagging_target_*.joblib, 12 variantes bootstrap cada uno) son
    opcionales en tiempo de inferencia (predictor.py::load_model() los carga con try/except y cae a
    lista vacía si faltan o fallan al cargar) -- si faltan, proba_low/proba_high colapsan a ser
    iguales a proba (sin rango de incertidumbre real), pero el pipeline no falla. El plugin debe
    reproducir esta degradación elegante, no tratarla como error.
  - >
    Al deserializar los .joblib con versiones de scikit-learn/xgboost más recientes que las usadas
    para entrenar (sklearn 1.6.1 -> 1.9.0, xgboost 2.1.4 -> más reciente) aparecen
    InconsistentVersionWarning y un warning de xgboost sobre formato de serialización antiguo.
    Confirmado que NO afectan al resultado numérico (reproducción exacta a 4 decimales, ver
    golden_cases) pero deben capturarse/silenciarse explícitamente en el plugin para no ensuciar
    logs de producción, y considerar re-serializar los modelos con Booster.save_model()/formato
    nativo en un futuro reentrenamiento.
  - >
    El pipeline multi-horizonte (Fase 3: scripts/train_multi_horizon.py, horizontes h=1 y h=2,
    dataset_clasificacion_multi_horizonte.csv, modelos model_target_*_h{1,2,4}.joblib) es ADITIVO,
