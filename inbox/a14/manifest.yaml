known_issues:
  - "[NUEVO 2026-10-08] El early stopping y la restauración de los mejores pesos de
     compare_models.py::train_rnn se deciden con la pérdida sobre las secuencias de TEST (no hay
     partición de validación). Las métricas de test de model_comparison.json (y las que devuelve
     /train, que reproduce el procedimiento tal cual) son por tanto optimistas. Se mantiene igual para
     que el modelo reentrenado sea comparable con el entregado; corregirlo cambiaría el procedimiento
     del equipo de IA. Es coherente con el split único 80/20 sin validación ya documentado en
     metrics_reported."
  - "[NUEVO 2026-10-08] El código entregado incluye reports/interpolation/ con una evaluación mensual
     anclada a la serie MAPA original (sin interpolar a semanas): GRU RMSE 2,550 / MAE 1,791 frente a
     Drift 2,720 / 2,084 en 49 meses (2021-10 a 2025-10). La GRU sigue mejorando al Drift sin la
     interpolación semanal. reports/error_analysis/ añade que los errores de GRU y Drift están muy
     correlados (0,88) y que comparten el 59 % del top-10 % de errores: la mejora no elimina el riesgo
     en cambios bruscos. No es la carpeta reports/audit/ de la copia no oficial."
  - "[NUEVO 2026-10-08] s3://<STORAGE_BUCKET>/artifacts/fixed/ml14_wine_phyto_price_forecast/ no existe
     (listado de solo lectura). Hay que subir inbox/a14/codigo/models/artifacts/gru_model.pt y
     data/processed/final_dataset_for_modeling.csv (el plugin reajusta los scalers desde él). Acción
     humana."
  - "CORREGIDO (hallazgo post-integración, detectado por QA): si el cliente incluía un campo
     extra no documentado (p. ej. 'comment', una nota de texto) en ALGUNAS filas del histórico
     pero no en todas, ese campo se colaba como columna más en el DataFrame interno y el
     dropna() final de feature_engineering.py la trataba como una feature cualquiera --
     descartando silenciosamente cualquier fila donde ese campo extra viniera vacío. Según qué
     filas tuvieran el campo relleno, esto producía o bien un 422 por historial insuficiente
     (si sobrevivían muy pocas filas) o bien una predicción silenciosamente desplazada a una
     fecha anterior a la última fila realmente enviada (si sobrevivía un subconjunto arbitrario
     de filas). Arreglado seleccionando explícitamente solo las columnas del contrato (date +
     las 6 columnas base) nada más construir el DataFrame, antes de cualquier validación o
     derivación -- cualquier campo extra que el cliente incluya ahora se ignora por completo,
     esté presente en todas las filas, en ninguna, o en una mezcla. Test de regresión:
     tests/unit/test_ml14_preprocessing.py::test_run_inference_ignores_sparse_extra_fields_like_comment."
  - "CORREGIDO (hallazgo post-integración, detectado por QA): un valor numérico finito pero muy
     grande (p. ej. 1e250) en cualquier columna del histórico pasaba la validación de finitud de
     feature_engineering.py (hecha en float64) pero desbordaba silenciosamente a +/-inf al
     convertirse a float32 en preprocessing.py::run_inference (numpy no lanza excepción en ese
     cast, solo un RuntimeWarning). El resultado llegaba al modelo y producía una predicción no
     finita que Pydantic serializaba como 'predicted_price': null con HTTP 200, en vez de un
     error explícito -- un cliente podía no darse cuenta de que la predicción había fallado.
     Arreglado con dos comprobaciones de finitud en run_inference: una justo tras el escalado a
     float32 (antes de entrar al modelo) y otra sobre el resultado final, ambas lanzando
     InsufficientDataError (422) con un mensaje explícito. Test de regresión:
     tests/unit/test_ml14_preprocessing.py::test_run_inference_rejects_float32_overflow_instead_of_returning_null."
  - "DOS ENTREGAS DISTINTAS DEL MISMO CÓDIGO (trazabilidad del proceso de integración, no un
     defecto del modelo): se recibió primero, por error, una copia local con una carpeta docs/ y
     reports/audit/ adicionales que documentaban una auditoría interna -- esa auditoría detectó
     que una evaluación anterior de este mismo modelo usaba el mismo periodo de test para
     comparar arquitecturas y para la evaluación final (fuga de datos), y que, corrigiendo el
     split a uno cronológico train/validation/test, el modelo entonces reentrenado (un LSTM) no
     superaba al baseline de Drift. El cliente confirmó (Slack, 2026-09-28) que la entrega
