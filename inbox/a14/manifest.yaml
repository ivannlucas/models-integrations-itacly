      inconsistencia). Los scalers congelados son la fuente de verdad usada aquí: son
      deterministas, versionados con su propio sha256 y no dependen de que nadie bundlee
      correctamente el dataset de entrenamiento completo. Adicionalmente, con --model auto (el
      flag por defecto del CLI original) este mismo input selecciona GRU, no LSTM -- ver
