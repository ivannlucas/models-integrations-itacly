model_id: ml14-wine-phyto-price-forecast
sector: vitivinicola
nombre: "Desarrollo de un modelo de análisis de precios de mercado de productos fitosanitarios"
# Título tomado literalmente del entregable: "14 - Desarrollo de un modelo de análisis de precios
# de mercado de productos fitosanitarios v1.3.docx". La carpeta de código se llama
# "a14-rnn-vitivinicola-precios-mercado-fitosanitarios".
task_type: regression  # serie temporal univariante, horizonte directo fijo (t+16 semanas), sobre residual de un baseline de drift lineal
framework:
  # Cargadas realmente por src/predict/predictor.py para el modelo seleccionado (GRU):
  - torch==2.10.0
  - pandas==3.0.1
  - numpy==2.4.3
  - scikit-learn==1.8.0
  - scipy==1.17.1
  # Cargada por predictor.py SOLO si --model XGBoost (arquitectura de comparación, no
  # seleccionada; ver model_status). No se usa para servir el GRU. No se bundlea el artefacto.
  # comparison_only: [xgboost==3.2.0]
  # SOLO usada por scripts (no entregados en esta versión) para regenerar el dataset desde los
  # .xlsx crudos de MAPA -- no interviene en la ruta de inferencia.
  # dataset_build_only: [openpyxl>=3.1]

# ============================================================================
# ESTADO DE ACEPTACIÓN DEL MODELO -- leer antes de cualquier otra sección.
# ============================================================================
# IMPORTANTE (trazabilidad del propio proceso de integración, no del modelo en sí): existen DOS
# entregas distintas de este mismo código, recibidas en momentos distintos:
#
#   1. Una copia local (usada por error en una primera pasada de esta integración) que incluía,
#      además de todo lo de abajo, una carpeta docs/ y reports/audit/ con una auditoría interna
#      que retiraba el resultado de esta sección por fuga de datos (el mismo periodo de test se
#      usaba para comparar arquitecturas Y para la evaluación final) y, tras corregir el split a
#      uno cronológico train/validation/test sin solapamiento, concluía que un LSTM (reentrenado
#      con esa metodología corregida) NO superaba al baseline de Drift.
#   2. La entrega confirmada por el cliente como la oficialmente aprobada (Slack, 2026-09-28):
#      sin esa carpeta docs/ ni reports/audit/, con una evaluación de test única (split temporal
#      80/20, sin partición de validation separada) en la que SÍ hay un modelo que bate a Drift.
#
# El código de inferencia/entrenamiento (predictor.py, feature_engineering.py,
# compare_models.py) y los TRES artefactos de modelo (lstm_model.pt, gru_model.pt,
# xgboost_model.json) son EXACTAMENTE los mismos, byte a byte (sha256 idéntico), en ambas
# entregas -- no son dos modelos entrenados de forma distinta, es el mismo código y los mismos
# pesos con un metrics-report / capa de auditoría diferente encima. Este manifest documenta y
# usa EXCLUSIVAMENTE la entrega 2 (la confirmada como aprobada) como fuente de verdad. La
# auditoría de la entrega 1 no se descarta como falsa -- su hallazgo de fuga de datos es
# metodológicamente real y reproducible -- pero, al no formar parte de la entrega aprobada, no
# determina el estado de aceptación de este manifest. Si el equipo de IA confirma en el futuro
# que esa auditoría sí aplica, este manifest debe revisarse.
model_status:
  accepted_for_production: true
  selected_model: GRU   # por RMSE de test entre GRU/LSTM/XGBoost (src/predict/predictor.py::_pick_best_model)
  criterion: "menor RMSE de test entre GRU/LSTM/XGBoost, y ese RMSE por debajo del baseline de Drift"
  test_rmse_gru: 2.2873
  test_rmse_lstm: 2.2983
  test_rmse_xgboost: 3.3076
  test_rmse_drift: 2.5406
  test_rmse_naive: 3.8856
  result: "ACEPTADO — GRU bate tanto a LSTM/XGBoost como al baseline de Drift en el test reportado"
  source:
    - "models/metrics/model_comparison.json de la entrega aprobada (split temporal único 80/20, 211 observaciones de test)"
    - "README.md y memoria del entregable (v1.3) — coinciden con estas cifras"
  evaluation_protocol_note: >
    A diferencia de la entrega no aprobada (ver arriba), esta entrega evalúa con un ÚNICO split
    temporal 80/20 (train/test), sin una partición de validation separada usada para elegir
    arquitectura antes de tocar el test. Esto es lo que el propio código de esta entrega hace y
    lo que sus métricas reportan -- se documenta tal cual, sin inventar una partición adicional
    que esta entrega no tiene.

artifacts:
  folder: models/artifacts/
  files:
    - gru_model.pt          # PyTorch state_dict. nn.GRU(input_size=39, hidden_size=64, num_layers=2,
                             # dropout=0.3, batch_first=True) + Dropout(0.3) + Linear(64,1) sobre el
                             # último timestep. 45185 parámetros (confirmado inspeccionando el
                             # state_dict). sha256 f5f1343f77244e548bf73c41187ab413c9e762b7c71deb6ae67af64374bb4c42
  extra_bundled_data_required_at_inference:
    # Esta entrega NO trae ningún scaler serializado (no hay preprocessing.json ni
    # features.json). src/predict/predictor.py::_build_scalers_and_features() SIEMPRE reajusta
    # (fit) los scalers de entrada/objetivo desde este mismo CSV en cada predicción -- es el
    # comportamiento real del código aprobado, no un atajo de este plugin. Para replicarlo fielmente
    # sin depender de que el cliente reenvíe el dataset de entrenamiento en cada llamada, se
    # bundlea aquí como dato de referencia.
    - data/processed/final_dataset_for_modeling.csv   # sha256 1bdf629f95f94b9682c41352069ee3bfb2b62de630683db4b13a5a80f37a71a9, 1075 filas

inputs:
  # Contrato real de src/data_processing/feature_engineering.py::build_modeling_features_from_raw,
  # invocado por predictor.py cuando la entrada es un CSV "raw" (el único modo de entrada
  # soportado por el plugin).
  history:
    description: >
      Serie histórica semanal (frecuencia W-SUN, domingos, consecutiva, sin huecos ni fechas
      duplicadas) de al menos 24 filas. El cliente aporta SIEMPRE su propio histórico -- el
      modelo no reconstruye nada desde una fecha sola ni consulta ninguna serie interna del
      lado del cliente (sí usa, internamente, el dataset de entrenamiento bundled para reajustar
      los scalers -- ver artifacts.extra_bundled_data_required_at_inference).
    minimum_rows: 24
    minimum_rows_formula: "feature_lookback + seq_len = max(max(lags)=12, max(ma_windows)-1=7, diff_period=4) + seq_len=12 = 12 + 12 = 24"
    row_fields:
      - name: date
        type: date (YYYY-MM-DD)
        description: "Fecha semanal, debe caer en domingo (weekday=6) y ser consecutiva (+7 días exactos respecto a la fila anterior)."
      - name: PROTECCION_FITO
        type: float
        unit: index_base_2020_100
        description: "Índice MAPA de precios de protección fitosanitaria, base 2020=100. Es a la vez la serie objetivo (se predice su valor a t+16 semanas) y un input (sus propios lags/MA/diff alimentan el modelo)."
      - name: CARBURANTES
        type: float
        unit: index_base_2020_100
        description: "Índice MAPA de precios pagados por carburantes agrarios, base 2020=100."
      - name: COPPER_EUR_TON
        type: float
        unit: EUR_per_metric_ton
        description: "Precio mundial del cobre (FRED/IMF), convertido de USD a EUR vía DEXUSEU."
      - name: GAS_EUR_MMBTU
        type: float
        unit: EUR_per_MMBtu
        description: "Precio del gas natural UE (FRED/IMF), convertido de USD a EUR vía DEXUSEU."
      - name: COIL_EUR_BARRIL
        type: float
        unit: EUR_per_barrel
        description: "Precio Brent Europa (FRED/EIA), convertido de USD a EUR vía DEXUSEU."
      - name: DEXUSEU
        type: float
        unit: USD_per_EUR
        description: "Tipo de cambio USD/EUR (FRED, Board of Governors)."
    validation_on_ingest:
      - "Fechas parseables (YYYY-MM-DD), sin duplicados, ordenadas, weekday==domingo, consecutivas cada 7 días exactos -- cualquier incumplimiento se rechaza con el detalle exacto de las fechas problemáticas."
      - "Las 6 columnas numéricas no admiten nulos ni valores no finitos (NaN/inf)."
      - "Si hay menos de 24 filas tras la validación anterior, se rechaza con un mensaje que detalla registros_recibidos vs. registros_minimos_requeridos (ver golden_cases: caso de rechazo controlado)."

  control: []   # no hay optimizador ni variables de decisión

  derived_if_missing:
    # Las 33 features restantes del contrato de 39 -- SIEMPRE se calculan automáticamente a
    # partir de las 6 columnas base + fecha; el cliente nunca las aporta.
    MONTH: "date.month"
    MONTH_SIN: "sin(2*pi*MONTH/12)"
    MONTH_COS: "cos(2*pi*MONTH/12)"
    "{COPPER_EUR_TON,GAS_EUR_MMBTU,DEXUSEU,CARBURANTES,PROTECCION_FITO}_LAG_{4,8,12}": "shift(lag) causal, pandas .shift()"
    "{COPPER_EUR_TON,GAS_EUR_MMBTU,DEXUSEU,CARBURANTES,PROTECCION_FITO}_MA_{4,8}": "media móvil trailing INCLUYENDO la fila actual, pandas .rolling(window).mean()"
    "{COPPER_EUR_TON,GAS_EUR_MMBTU,DEXUSEU,CARBURANTES,PROTECCION_FITO}_DIFF_MONTH": "diferencia a 4 semanas, pandas .diff(4)"
    # Tras generar estas columnas se hace dropna() (las primeras 12 filas del histórico quedan
    # sin lag_12/ma completos y se descartan) -- por eso el mínimo operativo es 24 filas crudas
    # para terminar con >= seq_len(12) filas modelables completas.

outputs:
  predict_inline:
    - name: predicted_price
      type: float
      unit: index_base_2020_100
      description: "PROTECCION_FITO predicho a horizonte t+16 semanas. Reconstrucción: drift_baseline + inverse_transform(target_scaler, residual_predicho_por_GRU)."
    - name: current_price
      type: float
      unit: index_base_2020_100
      description: "PROTECCION_FITO de la última fila del histórico aportado (ancla)."
    - name: drift_baseline
      type: float
      unit: index_base_2020_100
      description: "Baseline lineal de drift: current_price + PROTECCION_FITO_DIFF_MONTH(última fila) * (horizon_weeks/4.0). Es también el modelo de referencia frente al que el GRU sí mejora en el test reportado -- ver model_status."
    - name: horizon_weeks
      type: int
      description: "Siempre 16 en la configuración productiva vigente (config/config.py::DEFAULT_FORECAST_HORIZON_WEEKS)."
    - name: last_observed_date
      type: date
      description: "Fecha de la última fila del histórico aportado."
    - name: prediction_date
      type: date
      description: "last_observed_date + 16 semanas."
    - name: model_used
      type: str
      description: "Siempre 'GRU' en el plugin -- es el modelo que src/predict/predictor.py::_pick_best_model() selecciona por RMSE de test en esta entrega."
    - name: gap_warning
      type: str | null
      description: "Aviso textual si la fecha de ejecución está muy por delante de last_observed_date (el histórico aportado por el cliente puede estar desactualizado); null si no aplica."

constraints: {}
# No hay restricciones duras de negocio (tipo "PU >= 13") ni en el código ni en la memoria. La
# única condición dura de entrada es estructural (frecuencia semanal, mínimo 24 filas, sin
# huecos/duplicados/nulos) y ya está cubierta en inputs.history.validation_on_ingest -- debe
# implementarse como excepción de dominio (rechazo 4xx), no como un resultado más.

training:
  supported: true
  # [CORREGIDO 2026-10-08] Antes supported=false porque compare_models.py::main() lee una ruta fija.
  # Con el criterio de plugin-integration eso no lo impide: el motor servido es una GRU con pesos
  # aprendidos y el procedimiento es portable a un CSV del cliente (como ml23 y ml18). Port en
  # app/plugins/ml14_wine_phyto_price_forecast/training.py (solo la GRU seleccionada; XGBoost y LSTM
  # eran la comparativa). Verificado con el dataset entregado, en CPU:
  #   - el original re-ejecutado y el plugin reproducen model_comparison.json a 4 decimales
  #     (GRU RMSE 2,2873 ± 0,0268, MAE 1,699, R² 0,7108, skill 0,6435; Drift 2,5406);
  #   - el modelo de la semilla 42 del plugin es idéntico al del original re-ejecutado (diferencia 0)
  #     y difiere del gru_model.pt entregado en 2e-7; predice 121,394124 en caso_001, igual que el base.
  # El texto anterior (supported=false) argumentaba que no había forma de aportar datos nuevos.
  source: codigo_entrenamiento   # src/training/compare_models.py (prepare_horizon_dataset, split_temporal, train_rnn, train_rnn_multi_seed) + config/config.py
  input_schema: >
    CSV semanal (domingos) en el formato de data/processed/final_dataset_for_modeling.csv (FECHA + 39
    features) o las series en bruto de /predict (date + PROTECCION_FITO, CARBURANTES, COPPER_EUR_TON,
    GAS_EUR_MMBTU, COIL_EUR_BARRIL, DEXUSEU). En bruto pasa por el mismo feature engineering de la
    inferencia, que descarta las 12 primeras semanas (calentamiento de lags) que el dataset entregado sí
    conserva.
  target_column: PROTECCION_FITO   # objetivo derivado: residuo a 16 semanas sobre el baseline Drift
  hyperparams:   # config/config.py + compare_models.py::train_rnn
    horizon_weeks: 16
    seq_len: 12
    test_ratio: 0.2
    hidden_size: 64
    num_layers: 2
    dropout: 0.3
    epochs: 150
    batch_size: 32
    optimizer: {name: Adam, lr: 0.001, weight_decay: 0.00001}
    scheduler: {name: ReduceLROnPlateau, factor: 0.5, patience: 10}
    early_stopping_patience: 20
    grad_clip: 1.0
    seeds: [42, 43, 44]   # el modelo guardado es siempre el de la semilla 42
  metrics_returned: [mae, rmse, mape_pct, r2 (media ± std de 3 semillas), direction_acc_pct, skill_score, drift_rmse, naive_rmse, beats_drift, n_train, n_test]
  duracion_estimada: "~15 s en CPU con el dataset completo (3 semillas)"
  persistencia: "Solo MLflow (artifact_path=model: gru_model.pt + scalers.json). El modelo base nunca se sustituye."

metrics_reported:
  dataset: test_holdout (split temporal único 80/20, sin partición de validation separada)
  split_method: chronological_single_split
  n_test_observations: 211
  seeds: [42, 43, 44]
  n_seeds: 3
  test_metrics:
    naive: {rmse: 3.8856, mae: 2.5053, mape_pct: 2.08, r2: 0.1654}
    drift: {rmse: 2.5406, mae: 1.9403, mape_pct: 1.58, r2: 0.6432, direction_acc_pct: 72.0, skill_score: 0.5725}
    xgboost: {rmse: 3.3076, mae: 2.8964, mape_pct: 2.37, r2: 0.3953, direction_acc_pct: 60.2, skill_score: 0.2754}
    lstm: {rmse: 2.2983, mae: 1.6855, mape_pct: 1.3767, r2: 0.7079, direction_acc_pct: null, skill_score: null}
    gru: {rmse: 2.2873, mae: 1.699, mape_pct: 1.3933, r2: 0.7108, direction_acc_pct: 77.7, skill_score: 0.6435}
  veredicto: "ACEPTADO -- GRU (seleccionado por RMSE) bate al baseline de Drift y a los demás candidatos en el test reportado. Ver model_status."

# 4 casos golden + 1 caso de rechazo controlado. Todos ejecutados por mí, en este proceso de
# extracción, en un venv aislado (torch==2.10.0+cpu, resto de deps == requirements.txt) contra
# el artefacto REAL de esta entrega aprobada (models/artifacts/gru_model.pt), reproduciendo
# `_build_scalers_and_features()` (reajuste de scalers desde el dataset bundled) exactamente
# como lo hace src/predict/predictor.py. Los históricos de cada caso son ventanas reales de 24
# filas consecutivas de data/processed/final_dataset_for_modeling.csv. El caso_001 se verificó
# además contra la salida literal de `python -m src.main predict --input
# data/raw/prediction_input.csv` (modo --model auto, que en esta entrega selecciona GRU
# correctamente) -- coincide exacto: predicted_price=121.394124. Reproducibilidad verificada
# ejecutando cada caso dos veces con dos instancias del plugin cargadas por separado: salida
# idéntica a precisión completa. tolerance_pct=1.0 es margen de reproducibilidad numérica entre
# entornos/versiones de PyTorch.
