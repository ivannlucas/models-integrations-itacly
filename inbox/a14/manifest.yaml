model_id: ml14-wine-phyto-price-forecast
sector: vitivinicola
nombre: "Desarrollo de un modelo de análisis de precios de mercado de productos fitosanitarios"
# Título tomado literalmente del entregable: "14 - Desarrollo de un modelo de análisis de precios
# de mercado de productos fitosanitarios v1.3.docx". La carpeta de código se llama
# "a14-rnn-vitivinicola-precios-mercado-fitosanitarios" -- el "rnn" del nombre SÍ se corresponde
# con el modelo productivo aquí (a diferencia de a15, donde el nombre "rnn" era heredado y
# engañoso). Ver model_status y known_issues sobre CUÁL red recurrente es la seleccionada.
task_type: regression  # serie temporal univariante, horizonte directo fijo (t+16 semanas), sobre residual de un baseline de drift lineal
framework:
  # Cargadas realmente por src/predict/predictor.py para el modelo seleccionado (LSTM):
  - torch==2.10.0
  - pandas==3.0.1
  - numpy==2.4.3
  - scikit-learn==1.8.0
  - scipy==1.17.1
  # Cargada por predictor.py SOLO si --model XGBoost (arquitectura de comparación, no
  # seleccionada; ver model_status). No se usa para servir el LSTM. No se bundlea el artefacto.
  # comparison_only: [xgboost==3.2.0]
  # SOLO usada por scripts/build_dataset.py para leer los .xlsx crudos de MAPA -- no interviene
  # en absoluto en la ruta de inferencia (raw CSV -> features -> LSTM -> precio).
  # dataset_build_only: [openpyxl>=3.1]

# ============================================================================
# ESTADO DE ACEPTACIÓN DEL MODELO -- leer antes de cualquier otra sección.
# ============================================================================
# El entregable (memoria v1.3, README.md del código) describe una versión ANTERIOR y ya
# RETRACTADA del proyecto: un GRU seleccionado por un protocolo de validación con fuga de datos
# (el propio conjunto de test se usaba para comparar arquitecturas/horizontes), que en esa
# versión "batía" al baseline de Drift. Esa versión SIGUE siendo el contenido literal de la
# memoria y del README -- no se han actualizado tras la auditoría.
#
# El propio código trae una auditoría interna posterior y más reciente (docs/MODEL_CARD.md,
# docs/AUDIT_REPORT.md, docs/CHANGELOG.md, docs/AUDIT_CHECKLIST.md, reports/README.md,
# reports/audit/reproducibility_report.json -- todos fechados 2026-08-03, versión de modelo
# 2.0.0) que RETIRA explícitamente ese resultado, corrige el protocolo (split cronológico por
# fecha de target, sin solapamiento train/validation/test) y selecciona un LSTM (no un GRU) por
# RMSE de validación -- pero ese LSTM, evaluado una única vez en el test final ya correcto, NO
# supera al baseline de Drift. La propia auditoría lo documenta como observación abierta, no
# oculta: docs/AUDIT_REPORT.md dice literalmente "Dictamen documental: PARCIALMENTE RESUELTO —
# observaciones abiertas identificadas y no ocultadas".
model_status:
  accepted_for_production: false
  selected_model: LSTM   # por RMSE medio de validación (3 semillas: 42, 43, 44; artefacto canónico = semilla 42)
  criterion: "accepted iff RMSE_selected_final_test < RMSE_Drift_final_test"
  test_final_rmse_lstm: 3.0168249184
  test_final_rmse_drift: 2.5405822285
  relative_improvement_pct: -18.7454   # negativo = empeora respecto al baseline, no lo mejora
  result: "NO ACEPTADO"
  source:
    - "docs/MODEL_CARD.md (versión documental 1.0.0, versión de modelo 2.0.0, fecha 2026-08-03)"
    - docs/AUDIT_REPORT.md
    - "reports/audit/reproducibility_report.json (comando ejecutable: scripts/train.py; resultado reproducido tal cual en este proceso de extracción -- ver known_issues sobre reproducción)"
  memoria_y_readme_desactualizados: >
    La memoria .docx (v1.3) y README.md describen la versión anterior (GRU, split 80/20,
    "acepta" frente a Drift) como si fuera el estado vigente. docs/CHANGELOG.md y
    reports/README.md confirman explícitamente que ese resultado se retiró por contaminación
    del test y se conserva solo como histórico ("legacy_results" /
    "conservan como históricos contaminados"). No se ha usado ninguna cifra de esa versión
    retractada en este manifest -- todas las cifras de metrics_reported y golden_cases vienen
    del LSTM 2.0.0 auditado.
  decision_de_integracion: >
    Se integra igualmente el LSTM 2.0.0 (el modelo real y auditado, no el GRU retractado) para
    dejar el plugin listo en la rama feature/model-14-integration, a petición explícita del
    responsable del proyecto. La decisión de negocio de exponer este modelo en producción -- o
    de no hacerlo hasta reentrenar con un resultado que sí bata a Drift -- queda pendiente de
    revisión humana antes de abrir la PR. Este estado NO se silencia en ningún documento interno
    (manifest, verification_report): es precisamente la información que permite esa revisión.

artifacts:
  folder: models/artifacts/
  files:
    - lstm_model.pt        # PyTorch state_dict. nn.LSTM(input_size=39, hidden_size=64, num_layers=2,
                            # dropout=0.3, batch_first=True) + Dropout(0.3) + Linear(64,1) sobre el
                            # último timestep. 60225 parámetros (confirmado recalculando a mano: coincide
                            # exacto con artifact_manifest.json). sha256 REAL del fichero (sha256sum
                            # ejecutado en este proceso de extracción): 4cb0ae009f84f146ad821b870e4414cb33d72e45762af873e19395d136f898e0.
                            # NO coincide con el sha256 declarado para este mismo fichero (mismo tamaño,
                            # 245045 bytes) en artifact_manifest.json y docs/MODEL_CARD.md
                            # (b72fcc645183e0c3b24cc1ca8081782d98f473f2eef96f8fe09c73da78607db4) -- ver
                            # known_issues, cuarta inconsistencia de hashes encontrada en el código
                            # entregado. El fichero SÍ es el artefacto real y funcional: es exactamente
                            # el que se cargó y ejecutó para producir todos los golden_cases de este
                            # manifest (60225 parámetros, arquitectura y predicciones deterministas
                            # verificadas) -- el hash mal declarado es un problema de los DOCUMENTOS de
                            # auditoría, no del artefacto en sí.
    - preprocessing.json    # scalers (StandardScaler input 39 features + StandardScaler target 1,
                             # ambos fit_only train, 637 muestras), feature_engineering (lags [4,8,12],
                             # MA [4,8], diff_period=4, rolling trailing-incluyendo-fila-actual),
                             # raw_required_columns, target.mode=drift_residual_h. sha256 03f76684c127de47afe81a9e71c3eb406eaac821eabed1b9009048e023246c07
    - lstm_features.json     # contrato de 39 features en orden binding (order_is_binding=true).
                              # sha256 4b23baabd7a2f2958b29f0814ed0019d8651d36078a40c45d098480ea36f7c03
  # NO se bundlean gru_model.pt / xgboost_model.json / gru_features.json / xgboost_features.json:
  # el plugin sirve únicamente el modelo seleccionado (LSTM). Ver model_status y known_issues
  # sobre por qué NO se replica la lógica de auto-selección `--model auto` del CLI original.
  extra_bundled_data_required_at_inference: []
  # A diferencia de a15 (que necesitaba series históricas bundled para derivar features desde
  # solo una fecha), aquí el cliente SIEMPRE aporta su propio histórico crudo (mínimo 24 filas
  # semanales consecutivas) -- no hay dependencia de ningún CSV de referencia interno del
  # equipo de IA para poder predecir.

inputs:
  # Contrato real de src/data_processing/feature_engineering.py::build_modeling_features_from_raw,
  # invocado por predictor.py cuando la entrada es un CSV "raw" (el único modo de entrada
  # soportado por el plugin -- ver known_issues sobre el modo "processed dataset").
  history:
    description: >
      Serie histórica semanal (frecuencia W-SUN, domingos, consecutiva, sin huecos ni fechas
      duplicadas) de al menos 24 filas. El cliente aporta SIEMPRE su propio histórico -- el
      modelo no reconstruye nada desde una fecha sola ni consulta ninguna serie interna.
    minimum_rows: 24
    minimum_rows_formula: "feature_lookback + seq_len = max(max(lags)=12, max(ma_windows)-1=7, diff_period=4) + seq_len=12 = 12 + 12 = 24"
    row_fields:
      - name: date
        type: date (YYYY-MM-DD)
        description: "Fecha semanal, debe caer en domingo (weekday=6) y ser consecutiva (+7 días exactos respecto a la fila anterior)."
      - name: PROTECCION_FITO
        type: float
        unit: index_base_2020_100
        description: "Índice MAPA de precios de protección fitosanitaria, base 2020=100. Es a la vez la serie objetivo (se predice su valor a t+16 semanas) y un input (sus propios lags/MA/diff alimentan el modelo)."
      - name: CARBURANTES
        type: float
        unit: index_base_2020_100
        description: "Índice MAPA de precios pagados por carburantes agrarios, base 2020=100."
      - name: COPPER_EUR_TON
        type: float
        unit: EUR_per_metric_ton
        description: "Precio mundial del cobre (FRED/IMF), convertido de USD a EUR vía DEXUSEU."
      - name: GAS_EUR_MMBTU
        type: float
        unit: EUR_per_MMBtu
        description: "Precio del gas natural UE (FRED/IMF), convertido de USD a EUR vía DEXUSEU."
      - name: COIL_EUR_BARRIL
        type: float
        unit: EUR_per_barrel
        description: "Precio Brent Europa (FRED/EIA), convertido de USD a EUR vía DEXUSEU."
      - name: DEXUSEU
        type: float
        unit: USD_per_EUR
        description: "Tipo de cambio USD/EUR (FRED, Board of Governors)."
    validation_on_ingest:
      - "Fechas parseables (YYYY-MM-DD), sin duplicados, ordenadas, weekday==domingo, consecutivas cada 7 días exactos -- cualquier incumplimiento se rechaza con el detalle exacto de las fechas problemáticas."
      - "Las 6 columnas numéricas no admiten nulos ni valores no finitos (NaN/inf)."
      - "Si hay menos de 24 filas tras la validación anterior, se rechaza con un mensaje que detalla registros_recibidos vs. registros_minimos_requeridos (ver golden_cases: caso de rechazo controlado)."

  control: []   # no hay optimizador ni variables de decisión

  derived_if_missing:
    # Las 33 features restantes del contrato de 39 (lstm_features.json) -- SIEMPRE se calculan
    # automáticamente a partir de las 6 columnas base + fecha; el cliente nunca las aporta.
    MONTH: "date.month"
    MONTH_SIN: "sin(2*pi*MONTH/12)"
    MONTH_COS: "cos(2*pi*MONTH/12)"
    "{COPPER_EUR_TON,GAS_EUR_MMBTU,DEXUSEU,CARBURANTES,PROTECCION_FITO}_LAG_{4,8,12}": "shift(lag) causal, pandas .shift()"
    "{COPPER_EUR_TON,GAS_EUR_MMBTU,DEXUSEU,CARBURANTES,PROTECCION_FITO}_MA_{4,8}": "media móvil trailing INCLUYENDO la fila actual, pandas .rolling(window).mean()"
    "{COPPER_EUR_TON,GAS_EUR_MMBTU,DEXUSEU,CARBURANTES,PROTECCION_FITO}_DIFF_MONTH": "diferencia a 4 semanas, pandas .diff(4)"
    # Tras generar estas columnas se hace dropna() (las primeras 12 filas del histórico quedan
    # sin lag_12/ma completos y se descartan) -- por eso el mínimo operativo es 24 filas crudas
    # para terminar con >= seq_len(12) filas modelables completas.

outputs:
  predict_inline:
    - name: predicted_price
      type: float
      unit: index_base_2020_100
      description: "PROTECCION_FITO predicho a horizonte t+16 semanas. Reconstrucción: drift_baseline + inverse_transform(target_scaler, residual_predicho_por_LSTM)."
    - name: current_price
      type: float
      unit: index_base_2020_100
      description: "PROTECCION_FITO de la última fila del histórico aportado (ancla)."
    - name: drift_baseline
      type: float
      unit: index_base_2020_100
      description: "Baseline lineal de drift: current_price + PROTECCION_FITO_DIFF_MONTH(última fila) * (horizon_weeks/4.0). Es también el modelo de referencia frente al que el LSTM NO consigue mejorar en test final -- ver model_status."
    - name: horizon_weeks
      type: int
      description: "Siempre 16 en la configuración productiva vigente (config/config.py::DEFAULT_FORECAST_HORIZON_WEEKS)."
    - name: last_observed_date
      type: date
      description: "Fecha de la última fila del histórico aportado."
    - name: prediction_date
      type: date
      description: "last_observed_date + 16 semanas."
    - name: model_used
      type: str
      description: "Siempre 'LSTM' en el plugin (no se replica la selección automática `--model auto` del CLI original -- ver known_issues)."
    - name: gap_warning
      type: str | null
      description: "Aviso textual si la fecha de ejecución está muy por delante de last_observed_date (el histórico aportado por el cliente puede estar desactualizado); null si no aplica."

constraints: {}
# No hay restricciones duras de negocio (tipo "PU >= 13") ni en el código ni en la memoria. La
# única condición dura de entrada es estructural (frecuencia semanal, mínimo 24 filas, sin
# huecos/duplicados/nulos) y ya está cubierta en inputs.history.validation_on_ingest -- debe
# implementarse como excepción de dominio (rechazo 4xx), no como un resultado más.

training:
  supported: false
  # scripts/train.py (== src/training/compare_models.py::main()) NO acepta ningún CSV/ruta de
  # datos de entrada -- su argparse solo expone hiperparámetros (--horizon, --epochs, --seq_len,
  # --test_ratio, --hidden_size, --batch_size). Internamente siempre relee la ruta fija
  # data/processed/final_dataset_for_modeling.csv (preprocessing.json::training_config.dataset).
  # Es decir: no existe ninguna forma de reentrenar con datos nuevos aportados por un cliente --
  # solo se puede re-ejecutar la MISMA comparación de arquitecturas (XGBoost/LSTM/GRU, 3 semillas,
  # hasta 150 épocas) sobre el MISMO histórico ya bundled, con otros hiperparámetros. Exponer esto
  # como "reentrenamiento por usuario" en un endpoint train() sería engañoso: no incorporaría
  # ningún dato nuevo del cliente y tardaría varios minutos en ejecutarse (3 arquitecturas x 3
  # semillas). Por eso training.supported=false, siguiendo la regla del skill de no inventar un
  # procedimiento de fine-tuning que el equipo de IA no definió. mlflow_utils.py se implementa
  # igualmente sin excepción (regla del proyecto), como stub sin reentrenamiento real disponible.
  target_column: null
  required_columns: null
  hyperparams: null
  metrics_returned: null
  source: codigo_entrenamiento (ausencia de contrato de datos de entrada confirmada leyendo src/training/compare_models.py::main())

# ----------------------------------------------------------------------------------------------
# Todas las cifras de aquí abajo son del LSTM 2.0.0 AUDITADO (docs/MODEL_CARD.md), no de la
# memoria/README retractados. TRAINING_AND_EVALUATION.md aclara que tanto validation como test
# están en escala de precio ORIGINAL (después de invertir el scaler y reconstruir con Drift) --
# la diferencia grande entre RMSE de validation (0.9641) y de test (3.0168) es un resultado real
# de sobreajuste/cambio de régimen, no un artefacto de escalas distintas.
# ----------------------------------------------------------------------------------------------
metrics_reported:
  dataset: test_holdout_final
  split_method: chronological_by_target_date  # train/validation/test sin solapamiento de target_date
  split_dates:
    train: {rows: 637, target_date_start: "2005-07-17", target_date_end: "2017-09-24"}
    validation: {rows: 211, target_date_start: "2017-10-01", target_date_end: "2021-10-10"}
    test: {rows: 211, target_date_start: "2021-10-17", target_date_end: "2025-10-26"}
  seeds: [42, 43, 44]
  canonical_seed: 42
  validation_used_for_selection:
    lstm: {rmse: 0.9641, mae: 0.6673, mape_pct: 0.6651, r2: 0.5656, direction_acc_pct: 66.53}
    gru: {rmse: 1.1117, mae: 0.7670, mape_pct: 0.7652, r2: 0.4246, direction_acc_pct: 51.83}
    xgboost: {rmse: 1.1802, mae: 0.8749, mape_pct: 0.8720, r2: 0.3521, direction_acc_pct: 27.0}
  train_canonical_artifact:
    lstm: {sequences: 626, rmse: 0.4865, mae: 0.3548, mape_pct: 0.3826, r2: 0.9895, direction_acc_pct: 77.0}
  test_final_single_evaluation:
    # Única evaluación del modelo ya seleccionado (LSTM) -- el test NUNCA se usó para elegir arquitectura.
    lstm: {rmse: 3.0168249184, mae: 2.2583, mape_pct: 1.8608, r2: 0.4969, direction_acc_pct: 69.7}
    drift: {rmse: 2.5405822285, mae: 1.9403, mape_pct: 1.5794, r2: 0.6432, direction_acc_pct: 72.0}
    naive: {rmse: 3.8856, mae: 2.5053, mape_pct: 2.0770, r2: 0.1654, direction_acc_pct: null}
  veredicto: "NO ACEPTADO -- ver model_status"

# 4 casos golden + 1 caso de rechazo controlado. Todos ejecutados por mí, en este proceso de
# extracción, en un venv aislado (torch==2.10.0+cpu, resto de deps == requirements.txt) contra
# el artefacto REAL entregado (models/artifacts/lstm_model.pt + preprocessing.json +
# lstm_features.json), invocando `python -m src.main predict --input <csv> --model LSTM`.
# No se ha inventado ningún input ni output: los históricos de cada caso son ventanas reales de
# 24 filas consecutivas extraídas de data/processed/final_dataset_for_modeling.csv (mismo
# dataset con el que se entrenaron los scalers/el modelo -- confirmado que las columnas base
