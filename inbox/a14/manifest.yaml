known_issues:
  - "ESTADO DE ACEPTACIÓN: ver model_status arriba. La memoria (.docx v1.3) y el README.md
     entregados describen una versión anterior y RETRACTADA (GRU, split 80/20 con fuga de datos
     entre arquitectura y test, resultado favorable frente a Drift). El propio código trae una
     auditoría posterior (2026-08-03, versión de modelo 2.0.0) que retira ese resultado, corrige
     el protocolo y documenta que el modelo corregido (LSTM) NO supera al baseline de Drift en el
     test final ya bien construido. Este manifest usa exclusivamente las cifras del LSTM 2.0.0
     auditado -- ninguna cifra de la memoria/README retractados aparece aquí. La decisión de
     exponer o no este modelo en producción queda pendiente de revisión humana antes de la PR."
  - "CUARTA INCONSISTENCIA DE HASHES: el sha256 real de models/artifacts/lstm_model.pt (calculado
     con sha256sum sobre el fichero tal cual entregado: 4cb0ae009f84f146ad821b870e4414cb33d72e45762af873e19395d136f898e0)
