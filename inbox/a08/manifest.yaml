# [RENOMBRADO 2026-10-06] Nomenclatura alineada con el estándar mlNN_<sector>_<desc>:
#   (carpeta de artefactos) modelo8_cereales  ->  ml8_cereals_img_anomaly_detector (model_id sin cambios: ml8-cereals-img-anomaly-detector)
#   Artefactos (local y S3): artifacts/modelo8_cereales/ -> artifacts/ml8_cereals_img_anomaly_detector/
#   Las menciones al nombre antiguo en comentarios/known_issues son históricas.
model_id: ml8_cereals_img_anomaly_detector
sector: cerealista
nombre: "Diseño y entrenamiento de un modelo de análisis de imágenes para detección y clasificación de objetos anómalos en granos"
task_type: classification  # multi-tarea: 2 cabezas de clasificación (categoria sanitaria + tipo de cereal) sobre el mismo backbone
framework:
  - torch==2.5.1
  - torchvision==0.20.1
  - Pillow==12.2.0
  - numpy==2.4.4
  - pandas==3.0.2
  - scikit-learn==1.8.0

artifacts:
  folder: models/                         # ruta dentro del código entregado (= ARTIFACT_FOLDER_NAME "ml8_cereals_img_anomaly_detector" en el plugin)
  files:
    - mobilenet_v3_large_cereales_multitask.pth   # modelo de producción (seleccionado en memoria 5.3)
    - efficientnet_b0_cereales_multitask.pth      # alternativa evaluada, no servida por defecto
    - resnet18_cereales_multitask.pth             # alternativa evaluada, no servida por defecto

inputs:
  fixed:
    - name: image
      type: file
      format: [jpg, jpeg, png, bmp, tif, tiff]
      description: >
        Imagen RGB de un grano/lote de cereal. inline recibe base64 (image_base64);
        batch recibe un ZIP de imágenes dentro del contenedor.
      preprocessing:
        resize: [224, 224]
        normalize_mean: [0.485, 0.456, 0.406]
        normalize_std: [0.229, 0.224, 0.225]
        color_space: RGB
      source: memoria_seccion_4.2 + src/predict/inference.py (transform Compose)
  control: null       # no hay variables de control/decisión — es un clasificador puro de imagen
  derived_if_missing: null

outputs:
  predict_inline:
    - name: categoria
      type: str
      description: "Categoría sanitaria predicha (sano | hongos | insectos | otros)"
    - name: cereal
      type: str
      description: "Tipo de cereal predicho (trigo | maiz | arroz | sorgo)"
    - name: confianza_categoria
      type: float
      description: "Softmax de la clase ganadora de categoría, [0,1]"
    - name: confianza_cereal
      type: float
      description: "Softmax de la clase ganadora de cereal, [0,1]"
    - name: probabilidades_categoria
      type: dict
      description: "Softmax completo por categoría"
    - name: probabilidades_cereal
      type: dict
      description: "Softmax completo por cereal"
  predict_batch:
    - name: predictions
      type: list
      description: "Lista de resultados por imagen del ZIP (mismos campos que inline + filename/annotated_image, o error)"

# El orden alfabético de class_to_idx/cereal_to_idx (ImageFolder-style) coincide con el
# checkpoint real: {0: hongos, 1: insectos, 2: otros, 3: sano} / {0: arroz, 1: maiz, 2: sorgo, 3: trigo}
# (verificado leyendo artifacts/ml8_cereals_img_anomaly_detector/mobilenet_v3_large_cereales_multitask.pth)
class_mapping:
  categoria: [hongos, insectos, otros, sano]
  cereal: [arroz, maiz, sorgo, trigo]

constraints: null   # no hay restricción de negocio explícita (no es un caso tipo PU>=13 de a35)

training:
  supported: true
  target_column: null   # no aplica (clasificación de imagen por estructura de carpetas, no CSV con target_column)
  required_columns: null
  # El dataset de entrenamiento se entrega como ZIP con estructura:
  #   {cereal}/{train|validation}/{categoria}/*.{jpg,jpeg,png,bmp,tif,tiff}
  # donde {cereal} in [trigo, maiz, arroz, sorgo] y {categoria} in [sano, hongos, insectos, otros]
  required_structure: "{cereal}/{split}/{categoria}/*.ext"
  hyperparams:
    # Bloque "mobilenet_v3" de config/config.yaml — modelo de producción (memoria 6.2 "Hiperparámetros Clave")
    model_name: mobilenet_v3_large
    backbone_weights: IMAGENET1K_V1    # confirmado en src/training/model.py:_load_backbone y notebook 04 celda 13 — NO IMAGENET1K_V2
    batch_size: 16
    learning_rate_fase1: 0.001
    learning_rate_fase2: 0.00001
    num_epochs_fase1: 10
    num_epochs_fase2: 5
    patience: 3
    image_size: 224
    optimizer: Adam
    accumulation_steps: 2              # gradient accumulation — src/training/train.py:train_one_epoch
    seed: 42
    augmentation_train: {horizontal_flip: true, rotation: 10}
    augmentation_val: {horizontal_flip: false, rotation: 0}
    # Esquema de balanceo de clases — memoria 6.2: "todos los modelos compartieron el mismo
    # esquema de balanceo en entrenamiento" (no es opcional, es parte del procedimiento real):
    max_samples_hongos: null           # null = recorte automático de 'hongos' al promedio de las demás categorías (src/training/dataset.py:balance_hongos)
    class_weights: "inverse_frequency, normalizado a num_classes"   # CrossEntropyLoss(weight=...) por categoría
    cereal_weights: "inverse_frequency, normalizado a num_cereales" # CrossEntropyLoss(weight=...) por cereal
    sampler: WeightedRandomSampler     # sample_weights = 1/class_counts[label], sobre train_loader únicamente
    freeze_schedule: "Fase 1: solo neck (Linear 960->1280 + Hardswish + Dropout) + 2 cabezas, features congeladas. Fase 2: todo descongelado (fine-tuning)."
  metrics_returned: [train_samples, val_samples, fase1_epochs, fase2_epochs, best_val_acc_cat, best_val_acc_cer]
  source: "codigo_entrenamiento: src/main.py:run_training + src/training/{dataset,model,train,evaluate,utils}.py + config/config.yaml + notebooks/evaluacion/04_MobileNetV3.ipynb"

metrics_reported:
  dataset: test_hold_out
  split: "70/15/15 (train/val/test), random_seed=42"
  modelo: mobilenet_v3_large   # ganador, seleccionado en memoria 5.3
  n_samples_test_aprox: 7890
  accuracy_categoria_pct: 92.58
  accuracy_cereal_pct: 98.98
  accuracy_combinada_pct: 91.82
  macro_f1: 0.87
  weighted_f1: 0.93
  f1_por_categoria:
    hongos: {precision: 1.00, recall: 0.90, f1: 0.94}
    insectos: {precision: 0.62, recall: 0.98, f1: 0.76}
    sano: {precision: 0.92, recall: 0.99, f1: 0.96}
    otros: {precision: 0.68, recall: 0.97, f1: 0.80}
  latencia_ms_por_imagen_cpu: 34.5
  latencia_ms_por_imagen_gpu_l40: 8.0
  kpi_objetivo: "Acc. categoria >= 90% | Acc. cereal >= 95% | Acc. combinada >= 85%"
  kpi_veredicto: APTO
  source: memoria_tabla_8 + memoria_tabla_9 + memoria_tabla_10 + memoria_tabla_12 (secciones 5.1 y 7.3)

# ACTUALIZACIÓN (2026-10-05): el equipo de IA ha añadido ahora los datasets reales a
# inbox/a08/codigo/data/raw/ (Wheat_Coccinellid/, archive/, "archive (1)".."archive (5)"/
# — ~177k imágenes, 7 datasets públicos distintos de Kaggle/similares mapeados a las 4
# categorías sanitarias vía config.yaml:classification_keywords) y, sobre todo,
# data/processed/<cereal>/{train,validation,test}/<categoria>/*.ext ya generado por el
# pipeline original (src/data_processing/preprocess.py:procesar_dataset — train_test_split
# estratificado, seed=42, ratios 0.7/0.15/0.15 de config.yaml:data.splits). Esto sustituye
# la limitación documentada antes (ver primer known_issues, no se borra el historial).
#
# Fuente PREFERIDA según el skill (Paso 2): el split de test real ya generado por el código
# entregado (data/processed/<cereal>/test/<categoria>/), el mismo que consume
# src/training/dataset.py:cargar_todos_los_datos(processed_dir, cereales, categorias, 'test')
# en la evaluación original — no se ha inventado ni reconstruido ningún split propio.
# No todas las 16 combinaciones cereal×categoría tienen imágenes de test (p. ej. sorgo solo
# tiene 'hongos'; maíz no tiene 'otros' — así es el dataset real, no es un error de carga).
# Se seleccionaron 19 imágenes estratificadas sobre las 12 combinaciones SÍ presentes en el
# test set (2 por combinación de 'hongos' en cada cereal con esa clase, 2 por 'insectos' en
# arroz/maíz/trigo — categoría con peor f1 reportado, 0.76 — y 1 por 'sano'/'otros' donde
# aplica), con random.Random(42).sample() sobre la lista de ficheros ordenada de cada
# carpeta test/<cereal>/<categoria>/.
#
# `expected` se obtuvo EJECUTANDO el checkpoint real servido
# (artifacts/ml8_cereals_img_anomaly_detector/mobilenet_v3_large_cereales_multitask.pth, cargado vía
# app.plugins.ml8_cereals_img_anomaly_detector.model_loader.load_model_bundle()) directamente
# en proceso, con el mismo preprocesado que usa el plugin
# (preprocessing.image_path_to_tensor + postprocessing.build_inline_response) — nunca a mano.
# `ground_truth_categoria`/`ground_truth_cereal` son la etiqueta real del dataset (carpeta
# <categoria>/<cereal> del split de test), distinta de `expected`: el objetivo de `expected`
# es detectar regresiones de *serving* (preprocesado/pesos/postprocesado/device), no medir
# accuracy contra el dataset — eso se reporta aparte en outputs/a08/verification_report.md
# (16/19 aciertan la categoría ground truth, 19/19 el cereal — coherente con el ~92%/~99%
# de metrics_reported).
# Ejecutado con CUDA real (RTX 2070 SUPER) tras corregir el bug de `_safe_device()` descrito
# en known_issues — ver outputs/a08/verification_report.md.
