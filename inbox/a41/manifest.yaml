known_issues:
  - "ALCANCE: inbox/a41/codigo/bearing_metro_preliminar/{bearings_preliminar,metro_preliminar}
     son datasets exploratorios descartados (memoria sección 3.4: 'concluimos este análisis
     con la elección del Dataset MIMII'). No se integran ni documentan como parte de a41."

  - "ARQUITECTURA DE PRODUCCIÓN elegida por decisión humana (2026-09-15): Audio-MAE
     ViT-Tiny, no el Baseline (autoencoder FC), pese a que el Baseline tiene mejor AUC
     medio global (0.800 vs 0.772) y también viene con pesos completos para las 48
     combinaciones. La memoria lo justifica por escalabilidad y compatibilidad XAI, y
     recomienda puntualmente el Baseline como alternativa en casos concretos de bajo AUC
     (p. ej. fan id_00 0dB con Audio-MAE base, AUC=0.45 vs 0.70 del baseline — nota:
     ESE caso concreto es MAE-Base, no MAE-Tiny; para MAE-Tiny fan/id_00/0dB el AUC-maha
     real es 0.7585, ver golden_cases). El plugin NO implementa el Baseline; queda como
     alternativa no desarrollada, a valorar en revisión humana."

  - "SIN DATOS EN LA ENTREGA: inbox/a41/codigo/data/{raw,processed,splits}/ solo tienen
     .gitkeep — no hay ni un WAV ni un .npy en la entrega original. Los golden_cases de
     este manifest salen de sample_data/ (raíz del repo, fuera de inbox/a41), aportado
     aparte. Cobertura de golden cases limitada a UNA sola combinación (fan/id_00/0_dB)
     de las 48 soportadas; las otras 47 no tienen verificación ejecutable, solo el
     metrics.json agregado empaquetado con cada checkpoint."

  - "DISCREPANCIA ENTRE FUENTES AUDITADAS (Baseline): reports/table_auc_por_caso.csv y
