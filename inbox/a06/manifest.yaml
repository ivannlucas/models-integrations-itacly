  source: memoria_tablas_4_5_6 + data/{thermal,fecal}/predictions/*_metrics.csv

verification_tolerance:
  # Fijada ANTES de ejecutar la verificación. Es una clasificación: no hay MAE del que derivar
  # una tolerancia relativa, y la inferencia es determinista (mismos pesos, mismo preprocesado).
  por_caso: >
    La clase del ensemble y el voto de cada modelo base deben coincidir EXACTAMENTE con lo que
    registró el pipeline original para esa misma imagen ({tarea}_predictions.csv y
    {modelo}_predictions.csv). Tolerancia 0: la única fuente legítima de diferencia es la deriva
    numérica entre versiones de librería (torch/torchvision/opencv), y si cambia un voto se
    investiga.
  agregada: >
    Accuracy del ensemble sobre el split de test completo: |obtenida - metrics_reported| <= 1
    muestra (1/40 = 0.025 thermal; 1/192 = 0.0052 rgb), la granularidad mínima de la métrica
    en cada test set.
  contra_etiqueta_real: "Informativo (es el rendimiento del modelo, no un fallo de integración): se reporta aciertos vs true_class."

