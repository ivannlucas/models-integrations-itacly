known_issues:
  - "DATASETS NO ENTREGADOS: data/*/raw y data/*/splits están en el .gitignore del equipo de IA, así que
    la entrega trae solo los CSV de predicciones/métricas. Para los golden cases se descargaron de las
    fuentes públicas de la memoria §3.1 a inbox/a06/codigo/data/ (no se commitea): thermal completo
    (Mendeley, Healthy.rar/Sick.rar, sha256 = el publicado por la API de Mendeley) y, del rgb, solo las 192
    imágenes de test + 10 por clase del train para la prueba de humo de /train (lectura por rangos HTTP de los
    zips de Zenodo; los 4,4 GB completos tardaban horas). El split rgb se calculó con ensure_data_splits sobre
    los nombres reales de los zips. Ambos splits de test coinciden fichero a fichero con los CSV entregados."
  - "README/memoria vs. fuente real del dataset térmico: el README dice que el ZIP de Mendeley trae carpetas
    train/val/test y data.yaml; en realidad son dos RAR (Healthy.rar, Sick.rar) con carpetas en mayúscula
    (Healthy/, Sick/). En Linux OrderedImageFolder exige healthy/ y sick/ en minúscula, así que hay que
    renombrar. tar.exe de Windows se salta los 8 ficheros con nombre en árabe (82+164 en vez de 86+168);
    hace falta 7z/unrar. El /train del plugin acepta los nombres de carpeta sin distinguir mayúsculas."
  - "POSIBLE RUIDO DE ETIQUETAS en el dataset térmico público: A1_1_124_3_0_مصاب.bmp ('infectado' en árabe)
    está en Healthy y cae en el split de TEST (el ensemble lo predice healthy). Tres ficheros
    C5_3_253_*_بعد التعطيش ('tras privación de agua') también están en Healthy (uno en test). Con n_test=40
    cada imagen vale 2,5 pp de accuracy. No se ha tocado ninguna etiqueta: requiere decisión del equipo de IA."
  - "Test sets pequeños: thermal n=40 (14 healthy / 26 sick), intervalo de confianza amplio para
    accuracy=0.80. rgb n=192."
  - "Recall térmico: la memoria (§7) reporta 'recall 0.8000' = recall weighted (= accuracy en binario). El
    recall de la clase sick es 0.8846, el de healthy 0.6429 y el macro 0.7637. El objetivo 'Recall > 0.65'
    no dice cuál; sick y weighted lo cumplen, healthy (0.6429) quedaría por debajo si fuera ese."
  - "requirements.txt del entregable: ASCII con CRLF (no UTF-16), con --index-url de CUDA 12.6 y pins torch
    2.12.0 / torchvision 0.27.0 / opencv-python 4.13.0.92. El repo usa torch>=2.13, torchvision 0.28.0 y
    opencv-python-headless sin pin. El CLAHE de opencv y las convoluciones pueden derivar entre versiones:
    los golden cases por voto lo controlan."
  - "Los wrappers originales (src/training/<modelo>.py) construyen la red con weights='IMAGENET1K_V1', lo que
    descarga los pesos de ImageNet incluso para inferencia. El plugin construye con weights=None y carga el
    state_dict con strict=True (sin red)."
  - "El backbone 'congelado' del original solo congela parámetros: model.train() sigue actualizando las
    estadísticas de BatchNorm durante el entrenamiento, así que los checkpoints servidos tienen estadísticas BN
    distintas de ImageNet. El /train del plugin lo replica igual."
  - "Detalles cosméticos de trainer.py (no afectan al modelo, no se corrigen): el mensaje de early stopping
    imprime la época siguiente a la real y la accuracy de la barra de progreso se calcula con el tamaño del
    último batch."
  - "La puntuación 'confidence' del plugin es la fracción de votos (voto duro, como el original). Las
    probabilidades softmax por modelo se exponen solo como información para la monitorización que propone la
    memoria §10 (rango 0.4-0.6); el original no las calcula."
  - "/train rgb: 2 h 45 min en GPU según la memoria (Tabla 3). /train es síncrono en este repo; con esa
    duración depende del timeout del cliente HTTP y del ingress. Mismo caso que ml5/ml10."
  - "Objetivo de negocio (reducir un 10 % los tratamientos veterinarios): la memoria (§2) dice que solo podrá
    establecerse tras la validación in situ. Los datasets son reales pero públicos y de otro contexto (térmico:
    broilers Cobb de una granja de Kafrelsheikh, Egipto, cámara UNI-T UTi165A; heces: PCR, Zenodo). Ninguna
    cifra de negocio está validada en granjas de Castilla y León."
  - "Grad-CAM y eval_attention no se portan (fases offline según la memoria §6.4). El README avisa además de
    que las conclusiones del notebook grad_cam.ipynb se obtuvieron aplicando CLAHE dos veces por error."
  - "Los checkpoints thermal entregados no se reproducen reentrenando en otra máquina: re-ejecutando
