# Manifest — a06 / ml6-meat-poultry-disease-classification
#
# Fuente del código entregado: inbox/a06/codigo/ (README "CU06 - Detección de Enfermedades en
#   Aves de Galpón"; src/, scripts/, config/config.yaml, models/{thermal,fecal}/artifacts/).
# Fuente de la memoria: inbox/a06/entregable/06 - Modelo de deep ensemble learning para
#   clasificación de defectos y enfermedades en animales - v1.5.docx (versión 1.5, 21/09/2026).
#   La memoria sigue la estructura estándar de secciones (Entradas y Salidas, Arquitectura y
#   Algoritmos, Hiperparámetros Clave, Métricas y Rendimiento, Despliegue e Inferencia,
#   Limitaciones…): no ha hecho falta pedir confirmación por estructura.
#
# Generado con el skill manifest-extraction el 2026-10-16.

model_id: ml6-meat-poultry-disease-classification
sector: carnico
nombre: "Modelo de Deep Ensemble Learning para la clasificación de las enfermedades y defectos en los animales"
acronimo: DEL-Carne-Defect
task_type: image_classification_ensemble   # dos ensembles independientes de clasificación de imagen
framework: [pytorch, torchvision, opencv-python, pillow, numpy, scikit-learn]

# El caso de uso entrega DOS modelos independientes (memoria §1 y §4.1, README "Modelos y
# Arquitectura"): se integran en un único plugin y la petición elige cuál con model_key.
ensembles:
  thermal:
    descripcion: "Clasificación binaria de imágenes térmicas del ave (healthy / sick). Primera etapa: cribado masivo, sin capacidad diagnóstica."
    base_models: [densenet121, efficientnet_v2s, resnet50]   # config.yaml tasks.thermal.models.names (orden = desempate)
    class_names: {0: healthy, 1: sick}                      # config.yaml tasks.thermal.data.class_names
  rgb:
    descripcion: "Clasificación multiclase de imágenes RGB de heces (healthy / cocci / ncd / salmo). Segunda etapa: diagnóstico del ave aislada."
    base_models: [vgg19_bn, efficientnet_b7, mobilenet_v3l]  # config.yaml tasks.rgb.models.names
    class_names: {0: healthy, 1: cocci, 2: ncd, 3: salmo}   # config.yaml tasks.rgb.data.class_names
    folder_map: {healthy: pcrhealthy, cocci: pcrcocci, ncd: pcrncd, salmo: pcrsalmo}
  agregacion: majority_voting   # src/main.py::predict — Counter(votes).most_common(1); voto duro, mismo peso
  desempate: >
    Con 3 modelos y 4 clases (rgb) puede haber empate a tres. Counter.most_common devuelve el
    primero insertado, es decir, el voto del primer modelo de base_models (vgg19_bn en rgb). En
    thermal (2 clases) no hay empates posibles. El plugin replica este comportamiento.

artifacts:
  folder: models/{thermal,fecal}/artifacts/
  files:   # state_dict de torch de cada wrapper (src/training/<modelo>.py); md5 de la entrega
    - {file: thermal/artifacts/densenet121.pt,      md5: 5548bd112a91046073d9dd550f2ed2d7, bytes: 28445509}
    - {file: thermal/artifacts/efficientnet_v2s.pt, md5: 90f0f940c37dc7604e04ae77b3a5bdb3, bytes: 81650647}
    - {file: thermal/artifacts/resnet50.pt,         md5: 57b809bf5d75541befbeaf11f92292c6, bytes: 94371077}
    - {file: fecal/artifacts/vgg19_bn.pt,           md5: bd4ced6023679f9f20fc2c37898747e5, bytes: 558475407}
    - {file: fecal/artifacts/efficientnet_b7.pt,    md5: bc7eda6c16323723109e7a473a94cf3d, bytes: 256914775}
    - {file: fecal/artifacts/mobilenet_v3l.pt,      md5: 05cf7582a63abf945fb192b2cc93828a, bytes: 17043395}
  plugin_layout: >
    artifacts/ml6_meat_poultry_disease_classification/<modelo>.pt (plano: los 6 nombres son
    únicos) y s3://<STORAGE_BUCKET>/artifacts/fixed/ml6_meat_poultry_disease_classification/.

inputs:
  fixed:
    - name: model_key
      type: str
      allowed: [thermal, rgb]
      description: "Ensemble a usar. Obligatorio: las dos modalidades de imagen no son intercambiables."
    - name: image
      type: file
      format: [jpg, jpeg, png, bmp, tiff, tif, webp]   # src/utils/io.py::SUPPORTED_IMAGE_EXTENSIONS (memoria §8.2 cita jpg/jpeg/png/bmp)
      description: >
        thermal: imagen térmica del ave tal como la da la cámara, sin redimensionar (resolución
        nativa 240x320 = ancho x alto; memoria §3.2). rgb: imagen RGB de heces, cualquier tamaño
        (se redimensiona a 256x256).
  control: null              # no hay optimización ni variables de decisión
  derived_if_missing: null   # la imagen se consume directamente
  preprocessing:             # src/data_processing/preprocess.py (idéntico en train y test, sin augmentación)
    comun: "PIL.Image.open(...).convert('RGB') (loader por defecto de ImageFolder) → ToTensor → Normalize(ImageNet mean [0.485, 0.456, 0.406], std [0.229, 0.224, 0.225])"
    thermal: "boost_contrast: RGB→Lab, CLAHE(clipLimit=3.0, tileGridSize=8x8) solo sobre L, Lab→RGB (opencv); sin resize"
    rgb: "transforms.Resize((256, 256))"

outputs:
  predict_inline:
    - task                    # thermal | rgb
    - prediction              # clase del ensemble (voto por mayoría)
    - predicted_class_index
    - confidence              # fracción de modelos que votan la clase ganadora (1/3, 2/3, 1) — no es una probabilidad
    - model_predictions       # voto de cada modelo base (lo que guarda {modelo}_predictions.csv)
    - model_probabilities     # softmax por modelo base; informativo (memoria §10 lo propone para vigilar el rango 0.4-0.6)
    - warnings                # p. ej. imagen térmica que no tiene la resolución nativa 240x320
  predict_batch:
    - "una fila por imagen (filename, prediction, model_predictions, model_probabilities; true_class si la carpeta de la imagen es una clase)"
    - "evaluated_metrics: si todas las imágenes traen clase, accuracy/precision/recall/f1 (weighted y macro) y por clase, por modelo y del ensemble — mismo cálculo que src/predict/predictor.py::save_metrics"
  no_portado: >
    Grad-CAM (scripts/grad_cam.py) y la evaluación de atención (scripts/eval_attention.py) no
    se integran: la memoria (§6.4) los define como fases opcionales offline que "no forman
    parte del pipeline de inferencia y no se ejecutan en producción".

training:
  supported: true
  # El código entregado incluye el procedimiento real que generó los 6 artefactos servidos:
  # scripts/train.py → src/main.py::train → src/training/trainer.py::train_model, con
  # src/data_processing/load_data.py (OrderedImageFolder + WeightedRandomSampler) y
  # src/utils/io.py::ensure_data_splits (split 70/15/15, seed 42). Entrena exactamente los
  # modelos base que sirve el plugin (no es un benchmark aparte).
  task_selector: task        # campo del TrainRequest: thermal | rgb (se reentrenan los 3 modelos de ese ensemble)
  target_column: null        # no hay CSV: la clase es el nombre de la subcarpeta de cada imagen (ImageFolder)
  required_columns: null     # ídem — ver required_layout
  required_layout:
    thermal: "data_path/{healthy,sick}/<imagen>"                                       # data/thermal/raw del original
    rgb: "data_path/{pcrhealthy,pcrcocci,pcrncd,pcrsalmo}/<imagen> (o healthy/cocci/ncd/salmo)"  # data/fecal/raw + folder_map
  split: {train: 0.7, val: 0.15, test: 0.15, seed: 42, algoritmo: "src/utils/io.py::ensure_data_splits (por carpeta ordenada, ficheros ordenados, random.Random(42).shuffle, int(n*0.7) / int(n*0.15) / resto)"}
  hyperparams:
    comunes:   # src/training/trainer.py::train_model + config.yaml
      init: "pesos ImageNet (IMAGENET1K_V1) con todo el backbone congelado (requires_grad=False) y capa final sustituida por Linear(in, num_classes) entrenable"
      optimizer: adam
      loss: cross_entropy
      scheduler: {type: step_lr, step_size: 7, gamma: 0.1}   # un paso por época
      epochs: 100
      early_stopping: {monitor: val_loss, patience: 10, min_delta: 0.0001}
      checkpoint: "mejor val_acc (estrictamente mayor)"
      sampler: weighted_random_sampler   # pesos 1/frecuencia de clase, replacement=True
      seed: 42
    thermal: {learning_rate: 0.0002139312453740547, weight_decay: 0.000689762040038286, batch_size: 4}
    rgb:     {learning_rate: 0.005372828091952831,  weight_decay: 0.0006682955795832878, batch_size: 64}
    origen_valores: "Optuna (notebooks/tuning_hyperparameters/tuning.ipynb; memoria §6.2). /train NO repite la búsqueda."
  metrics_returned: [accuracy, precision_weighted, recall_weighted, f1_weighted, per_class, models, n_train, n_val, n_test, training_time_s]
  source: codigo_entrenamiento   # src/training/trainer.py, src/data_processing/load_data.py, src/utils/io.py, config/config.yaml; memoria §6
  duracion_estimada:
    thermal: "124 s el ensemble completo en GPU RTX 4070 (memoria Tabla 3)"
    rgb: "9 894 s (~2 h 45 min) el ensemble completo en GPU RTX 4070 (memoria Tabla 3). /train es síncrono: depende del timeout del cliente y del ingress de la plataforma."
  divergencias_documentadas:
    - "El original parte de pesos ImageNet con cabeza nueva; el plugin parte del checkpoint base servido (regla del repo: el ajuste fino parte siempre del modelo base). Backbone congelado y cabeza entrenable igual que el original."
    - "El original siembra el RNG global (set_seed) y el WeightedRandomSampler y el Dropout tiran de él; el plugin lo aísla con torch.random.fork_rng + manual_seed(42) para no tocar el RNG del servidor compartido. Mismo orden de consumo: verificado idéntico al original a 4 decimales (ver fidelidad_verificada)."
    - "El split se calcula en memoria con el mismo algoritmo que ensure_data_splits (el original copia los ficheros a data/*/splits/)."

  fidelidad_verificada: >
    2026-10-23: scripts/train.py --task thermal del equipo y el port del plugin, ambos desde ImageNet, en CPU y
    la misma máquina, dan métricas de validación idénticas (4 decimales) y el mismo punto de parada en los 3
    modelos (ver outputs/a06/verification_report.md, «Fidelidad del reentrenamiento»).

constraints:
  hard: null   # la memoria no define ninguna restricción numérica dura de negocio sobre las entradas/salidas
  operativas:  # se documentan; no son verificables desde la imagen, así que no se convierten en excepción
    - "La etapa rgb requiere aislar al ave identificada como enferma para asociar sus heces a ella (memoria §1 y §10)."
    - "Herramienta de apoyo a la decisión veterinaria (human-in-the-loop), no sustituto del diagnóstico (memoria §10)."
    - "thermal: la imagen debe venir de la cámara con su resolución nativa 240x320; otra cámara/resolución introduce un desplazamiento sistemático (memoria §3.2 y §10). El plugin avisa en warnings, no bloquea."
  excepciones_de_dominio:
    - "UnknownImageModalityError (422): model_key ausente o distinto de thermal/rgb."
    - "InvalidImageError (422, ya existente): la imagen no se puede decodificar."

