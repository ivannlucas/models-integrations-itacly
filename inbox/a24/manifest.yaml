# Paridad con la referencia oficial del equipo (no son golden cases de correctitud):
reference_parity:
  source: "data/predictions/spatial_price_model/inference_smoke.csv (51 filas, verify_repro.py PASS en este entorno)"
  input: {mode: inline}   # serie base completa, sin filtros
  expected: "y_pred, y_baseline_calibrated, y_persist_1, y_persist_12, feature_period, period idénticos (tolerancia 1e-9)"

known_issues:
  - "[MODELO — CRÍTICO PARA NEGOCIO] Degradación fuera de muestra desde 2022 (ver
     out_of_sample_evidence): con el código original sin modificar, exactitud 2021-2026 de
     91,0 / 85,3 / 85,6 % (h1/h3/h6) frente al 98 % de la memoria, con sesgo negativo sistemático
     (-7 a -19 % en 2023-2026) y peor que la persistencia ingenua en 2022-2026. Causa: el artefacto
     se entrenó con precios 1999-2020 (0,42-0,98 EUR/l, 2020: 0,63-0,75) y CatBoost no extrapola
     al nivel de 2022-2026 (~0,95-1,12). La inferencia de referencia del entregable
     (inference_smoke.csv, dato hasta 2026-06) ya predice de media un 8,7 / 15,1 / 11,3 % por debajo
     del último precio observado. Requiere decisión: reentrenamiento por el equipo de IA con datos
     posteriores a 2020 (el plugin lo permite con validation_year/test_year) o aceptación explícita
     del riesgo. Afecta a la ficha funcional (limitaciones)."
  - "[CÓDIGO ORIGINAL] Desalineación entrenamiento/inferencia de las exógenas: con
     publication_lag_months=12 el entrenamiento retrasa 12 meses las features MAPA pero NO las
     exógenas (add_monthly_exog_lags usa el periodo de la fila). La fila de entrenamiento de mes t
     ve MAPA hasta t-12 y exógenas hasta t-1; en inferencia la última fila es el último mes MAPA
     (T) y las exógenas se toman hasta T-1, aunque haya exógenas hasta hoy (input_costs_monthly
     llega a 2026-09). Las features MAPA sí cuadran exactamente (fila t de train = fila T=t-12 de
     inferencia). El plugin replica el original; no se corrige sin el equipo de IA."
  - "[CÓDIGO ORIGINAL] Etiqueta temporal ambigua: el modelo aprende a predecir y(t+h) con dato MAPA
     hasta t-12, es decir 12+h meses por delante del último dato; la inferencia etiqueta la salida
     como period = último mes MAPA + h. El README lo justifica ('el CSV de producción ya refleja la
     latencia real'), pero con la latencia real actual (~3-4 meses: MAPA hasta 2026-06) la salida
     etiquetada 2026-07 corresponde en el entrenamiento a 2027-07. En 2020 ambas lecturas dan el
     mismo error (precio estable): golden cases y backtest las reportan las dos. Pendiente de
     aclarar con el equipo qué fecha comunica la plataforma."
  - "[CÓDIGO ORIGINAL] bootstrap_type: No en config.yaml se parsea con yaml.safe_load (YAML 1.1)
     como el booleano False, y build_model solo pasa bootstrap_type si es truthy: todos los modelos
     del equipo (el artefacto servido incluido) se entrenaron con el bootstrap POR DEFECTO de
     CatBoost (MVS en CPU, Bayesian en GPU), no con 'No' como dicen la config y la memoria. El
     plugin reproduce el comportamiento real (TRAINING_CFG.bootstrap_type=False); con 'No' las
     métricas cambiaban hasta 0,02 pp. Corregirlo (comillas en el YAML) cambiaría el modelo:
     decisión del equipo de IA."
  - "[REPRODUCIBILIDAD] El artefacto entregado (GPU del equipo) no se reproduce bit a bit en otra
     GPU: train.py original en una RTX 3060 da h1 test sMAPE 2,019 (memoria 1,871) y ml_alpha
     0,4/0,5/0,55 (entregado 0,4/0,65/0,55). El plugin reproduce EXACTAMENTE al original en la misma
     máquina (GPU y CPU, 6 decimales). El README declaraba variación GPU < 0,1 pp; aquí h1 test
     difiere 0,15 pp. No afecta a la inferencia (se sirve el .cbm entregado tal cual)."
  - "[CÓDIGO ORIGINAL] En inferencia la imputación por mediana usa la mediana del propio frame de
     inferencia (todo el histórico 1999-2026), no las medianas de entrenamiento guardadas en
     missing_value_report. Afecta solo a celdas faltantes (exógenas lácteas en años iniciales); el
     plugin lo replica (paridad exacta con inference_smoke.csv)."
  - "[CÓDIGO ORIGINAL] Si una CCAA no tiene precio ancla en su última fila o menos de 13 meses, el
     original predice igualmente con y_persist imputados por mediana; la memoria 8.4 dice que se
     omite. El plugin la omite con un aviso (InsufficientPriceHistoryError si no queda ninguna). Con
     el dato oficial no afecta a ninguna CCAA."
  - "[CÓDIGO ORIGINAL] validate_inference_input exige 6 columnas, pero build_product_panel exige
     también es_reconstruido: un CSV sin ella pasaba la validación y fallaba después. El plugin la
     exige desde el principio (SeriesContractError, 422)."
  - "[EVALUACIÓN] El artefacto final se reentrena con todo el frame (target hasta 2020-12): el test
     2020 no es ciego para el modelo servido. Las métricas de la memoria son de los modelos de
     etapa. Los golden cases (test 2020) son, por tanto, in-sample para el artefacto desplegado."
  - "[GOLDEN] 5 de 18 golden cases quedan fuera de la tolerancia 2xMAE relativo (CAT h1, RIO h1,
     MUR h6, NAV h6, CTB h6). El modelo de etapa del propio equipo (evaluation_predictions.csv)
     falla en los mismos casos con errores casi idénticos, y deja fuera de esa tolerancia el
     12-15 % de las 204 filas de test (persistencia ingenua: 16-18 %). No es un fallo de
     integración; detalle en outputs/a24/verification_report.md. Tolerancia no ajustada."
  - "[MEMORIA] Inconsistencias menores: (a) la sección 3.1 dice que la serie procesada llega 'hasta
     2023' mientras el resto del documento y el README dicen 1999-2026 (28 ficheros); (b) Python
     3.11.9 en la memoria frente a 3.13.11 en la última verificación del README; (c) algunas tablas
     (2-7) son imágenes o tablas incrustadas no extraíbles como texto: sus cifras se tomaron de
     metrics.csv/metadatos, que la memoria cita como fuente única."
  - "[MEMORIA] Cambio de base metodológica del MAPA en 2021 (base2021, ficheros 2024+): la memoria
     corta el entrenamiento en 2020 por ese motivo. La inferencia sobre 2021-2026 mezcla ambas
     bases; el ETL lo trata automáticamente según el README, pero no hay validación del equipo de
     que los niveles sean comparables. Puede contribuir a la degradación fuera de muestra."
  - "[ENTREGA] No hay Ficha de Valoración del Estado Técnico ni dictamen de aceptación de ITACYL en
     el entregable (sí la había en a18). El KPI (>= 80 %) se cumple en test 2020; ver primer
     known_issue para el comportamiento fuera de muestra."
  - "[PLUGIN] --refresh-source (scrapers MAPA/UE) no se porta: un pod no debe descargar de webs
     externas en cada petición. La frescura depende de que el responsable actualice
     series_consumo_lacteos_ccaa.csv e input_costs_monthly.csv en S3 (o de enviar el CSV en batch).
     Las exógenas no se pueden aportar por petición (igual que en el original)."
  - "[PLUGIN] El modo batch siempre devuelve las 17 CCAA x 3 horizontes: el caso de uso genérico de
     app/application solo reenvía data_path/mlflow_run_id a predict_batch, así que los filtros
     (ccaa, horizons, as_of_period) existen solo en inline."
  - "[ARTEFACTOS] series_consumo_lacteos_ccaa.csv pesa 338 MB; el plugin solo usa los 5 productos
