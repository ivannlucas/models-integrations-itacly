    prediction_species: exact            # especie dominante (ganadora por conteo) debe coincidir exactamente
    confidence: 0.001                    # inferencia determinista (sin augmentation) — debe coincidir casi exacto
    total_detections: exact
  cases:
    - id: caso_001
      input: {image: "data/splits/images/test/10478.jpg"}
      ground_truth_species: cf
      expected: {prediction: cf, confidence: 0.6837, total_detections: 1, species_counts: {cf: 1}}
