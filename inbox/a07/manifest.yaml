model_id: ml7-cereals-grain-pest-detection
sector: cerealista
nombre: "Modelo de CNN para la detección temprana de infestaciones en granos de cereal"
task_type: object_detection
framework:
  - ultralytics==8.4.6
  - numpy==2.2.6
  - opencv-python==4.13.0.90
  - scikit-learn==1.7.2   # solo se usa en src/data_processing/split_dataset.py (train_test_split), no en inferencia
  - PyYAML==6.0.3
# requirements.txt entregado está en UTF-16LE con CRLF — normalizar a UTF-8/LF antes de
# usarlo en pip-audit/pip install (ver known_issues).

# ---------------------------------------------------------------------------
# Ya integrado en app/plugins/ml7_cereals_grain_pest_detection/ y registrado en
# app/registry.py ANTES de pasar por manifest-extraction/verification (irregularidad
# detectada en esta sesión — ver tarea de auditoría). Este manifest se construye
# retroactivamente contra inbox/a07/codigo/ para poder auditar y verificar lo ya
# integrado, igual que si fuera el primer paso.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# ACTUALIZACIÓN (Ciclo 2, 2026-10-06) — dataset real completo añadido
#
# El equipo de IA añadió el dataset PestDataset completo a inbox/a07/codigo/
# (data/splits/{images,labels}/{train,val,test}: 12.597/2.700/2.700 imágenes reales con
# anotaciones YOLO), inexistente en el Ciclo 1 (solo quedaban 6 imágenes embebidas como
# salidas de celda en notebooks/predict.ipynb). Esto permitió re-auditar con datos reales y
# encontró un BUG CRÍTICO invisible sin ellos: ver el known_issue "BUG EN EL PIPELINE DE
# ETL ORIGINAL" más abajo, ahora marcado [CORREGIDO Ciclo 2] — el checkpoint servido
# etiqueta mal la especie en ~3 de cada 5 detecciones. Corregido en
# app/plugins/ml7_cereals_grain_pest_detection/{constants.py,postprocessing.py} y en el
# propio código entregado (inbox/a07/codigo/.../src/data_processing/preprocess.py +
# src/main.py), sin reentrenar ningún checkpoint — la corrección es puramente de
# decodificación id→nombre, el detector (cajas) ya era correcto.
#
# Los `golden_cases` de abajo se reconstruyeron por completo desde el dataset real
# (reemplazando los del Ciclo 1, basados en capturas del notebook que además heredaban el
# mismo bug de nombres al estar renderizadas con `results.names`). El detalle completo del
# hallazgo, la verificación cuantitativa y el fix están en
# outputs/a07/verification_report.md, sección "Ciclo 2".
# ---------------------------------------------------------------------------

artifacts:
  folder: models/artifacts/     # ruta dentro del código entregado
  files:
    - best.pt   # 5,418,978 bytes — único artefacto entregado (checkpoint YOLO ya fine-tuneado)
  # last.pt NO se entrega (memoria sección 9.1: "last.pt: ... este fichero no se proporciona").
  # best.pt YA ESTÁ colocado en artifacts/ml7_cereals_grain_pest_detection/best.pt
  # (md5 idéntico al de inbox/a07/codigo/.../models/artifacts/best.pt — confirmado).

inputs:
  fixed:
    - name: image
      type: file   # image_path o image_base64 en el plugin; jpg/jpeg/png/bmp/tif
      description: >
        Imagen de grano almacenado. El dataset de entrenamiento usa imágenes de
        512×512 px, pero YOLO reescala internamente a imgsz=512 en inferencia
        (ver config/config.yaml: model.img_size) independientemente del tamaño
        original de entrada.
  control: null
  derived_if_missing: null

outputs:
  predict_inline:
    - name: detections
      type: list
      description: "[{class (código 2 letras), class_name (nombre especie), confidence, bbox[x1,y1,x2,y2]}]"
    - name: prediction
      type: str
      description: "Especie dominante (mayor nº de detecciones, desempate por suma de confianzas)"
    - name: confidence
      type: float
      description: "Confianza máxima entre las detecciones de la especie dominante"
    - name: total_detections
      type: int
    - name: species_counts
      type: dict
    - name: annotated_image
      type: str
      description: "Imagen con bounding boxes dibujadas, JPEG base64"

training:
  supported: true
  target_column: null   # no aplica: modelo de detección de objetos, no tabular
  required_columns: null   # no aplica: el entrenamiento consume imágenes + anotaciones, no un CSV
  data_layout_required:
    description: >
      scripts/train.py → src/training/train.py::train_model() entrena con
      model.train(data=<dataset.yaml>, ...) de Ultralytics. El dataset.yaml (generado por
      src/data_processing/preprocess.py::create_dataset_yaml, paso previo obligatorio
      scripts/data_processing.py) describe splits/images/{train,val,test} +
      splits/labels/{train,val,test} en formato YOLO (.txt normalizado por imagen),
      derivados de anotaciones Pascal VOC (XML) en data/raw/annos2/ sobre imágenes en
      data/raw/images/. Reentrenar con datos nuevos implica: (1) organizar
      imágenes JPG + XML Pascal VOC nuevos en esa estructura, (2) ejecutar el pipeline de
      ETL (relabel clases inválidas → eliminar 'unknown' → XML→YOLO → split balanceado
      estratificado → generar dataset.yaml), (3) ejecutar train_model(). No existe una vía
      de "subir un CSV" como en los modelos tabulares del repo.
    source: "codigo_entrenamiento (src/training/train.py, src/data_processing/preprocess.py, src/data_processing/split_dataset.py)"
  hyperparams:
    epochs: 300
    patience: 20          # early stopping
    batch_size: 32
    img_size: 512
    device: 0              # GPU por defecto en el código original (ver known_issues — el
                            # plugin YA integrado lo sobreescribe a "cpu" fijo)
    workers: 0
    optimizer: auto         # el código original NO pasa `optimizer=` explícito a model.train()
                             # (deja el valor por defecto de Ultralytics); la memoria (sección
                             # 6.1) documenta el resultado observado como optimizador AdamW.
                             # No inventar un optimizer= explícito en el plugin: replicar
                             # fielmente omitiendo el kwarg, igual que el código entregado.
    lr0: 0.00868
    momentum: 0.97
    weight_decay: 0.00027
    box: 8.19212
    cls: 0.72124
    dfl: 1.82105
    hsv_h: 0.0017
    hsv_s: 0.64489
    hsv_v: 0.36131
    degrees: 0.00145
    translate: 0.16011
    scale: 0.3
    fliplr: 0.4361
    mosaic: 0.72567
    mixup: 0.00512
    seed: 42
  metrics_returned: [map50, map50_95, precision, recall, n_images]
  source: "codigo_entrenamiento (config/config.yaml bloque model + src/training/train.py) + memoria sección 6.2 Tabla 6 (confirma mismos valores) y sección 6.1 (optimizador AdamW, pérdida box+cls+DFL de Ultralytics)"

constraints: null   # no hay restricciones duras de negocio tipo "PU >= 13" en este modelo;
                     # el umbral de confianza (eval.conf=0.28 en config.yaml) es un
                     # hiperparámetro de postprocesado, no una restricción de dominio.

metrics_reported:
  # Tabla 7 (memoria) — métricas de DETECCIÓN sobre el conjunto de test (2700 imágenes, 4090 instancias)
  deteccion:
    all: {precision: 0.84, recall: 0.81, map50: 0.87}
    cf: {precision: 0.93, recall: 0.71, map50: 0.84}
    os: {precision: 0.84, recall: 0.94, map50: 0.95}
    rd: {precision: 0.74, recall: 0.75, map50: 0.87}
    sz: {precision: 0.86, recall: 0.80, map50: 0.88}
    tc: {precision: 0.83, recall: 0.86, map50: 0.88}
  # Tabla 8 (memoria) — métricas de CLASIFICACIÓN (por clase predicha vs. real, sin bbox) sobre el mismo test
  clasificacion:
    all: {precision: 0.71, recall: 0.87}
    cf: {precision: 0.78, recall: 0.74}
    os: {precision: 0.78, recall: 0.96}
    rd: {precision: 0.60, recall: 0.84}
    sz: {precision: 0.74, recall: 0.83}
    tc: {precision: 0.76, recall: 0.89}
  kpi_negocio: "IDP (Índice de Detección de Plagas) = mAP@0.5, objetivo > 0.8, resultado 0.87 (cumple)"
  source: "memoria, sección 7.2, Tabla 7 y Tabla 8"

# ---------------------------------------------------------------------------
# GOLDEN CASES (Ciclo 2, 2026-10-06 — reconstruidos desde el dataset real)
#
# Los golden cases del Ciclo 1 (basados en capturas de notebooks/predict.ipynb) se
# descartaron por completo: además de depender de imgsz/conf por defecto distintos de
# producción (ya documentado entonces), sus "expected" se leyeron visualmente de
# `results[0].plot()`, que dibuja la etiqueta de texto usando `results.names` — es decir,
# heredaban el mismo bug de decodificación de especie corregido en este ciclo (ver
# known_issues). No eran ground truth fiable.
#
# Fuente real: data/splits/images/test/ + data/splits/labels/test/ (2.700 imágenes reales,
# el split de test oficial ya generado por el pipeline de preprocesado entregado). 20 casos
# de una sola especie (4 por especie, `random.Random(42).sample()` sobre las imágenes de
# test cuyo .txt de etiquetas solo contiene una clase) + 3 casos multi-especie (misma
# semilla). `ground_truth_species` se obtiene decodificando el class_id del .txt con el
# orden REAL de entrenamiento (config.yaml: cf=0,sz=1,rd=2,tc=3,os=4 — el que confirma el
# known_issue de abajo), nunca con `results.names`. `expected` es la salida real del
# checkpoint servido (best.pt) ejecutado en proceso con el mismo pre/postprocesado ya
# corregido del plugin (conf=0.28, imgsz=512) — no tecleada a mano — y se verificó además
# contra el servidor HTTP real (ver outputs/a07/verification_report.md, Ciclo 2): los 23
# casos reproducen exactamente la misma salida vía API que en proceso.
# ---------------------------------------------------------------------------
golden_cases:
