known_issues:
  - "[RESUELTO Ciclo 2, 2026-10-06] ENTREGA SIN DATASET: en el Ciclo 1, inbox/a07/codigo/ no
     incluía ninguna imagen ni anotación real del dataset PestDataset (18.069 imágenes vía
     Google Drive externo, nunca descargado); no existía data/raw, data/processed ni
     data/splits, y los golden cases de aquel ciclo se extrajeron de salidas embebidas en
     notebooks/predict.ipynb. El equipo de IA añadió después el dataset completo con su
     procesamiento ya ejecutado (data/raw/{images,annos2}, data/processed/, data/splits/
     {images,labels}/{train,val,test}: 12.597/2.700/2.700 imágenes reales) — ver sección
     ACTUALIZACIÓN al inicio de este manifest. Los golden cases se reconstruyeron por
     completo desde este dataset real (ver sección GOLDEN CASES arriba) y permitieron
     detectar el bug crítico de decodificación de especie documentado en el known_issue de
     ETL de esta misma lista."

  - "requirements.txt ENTREGADO EN UTF-16LE CON CRLF — romperá pip install/pip-audit si se usa
     tal cual; normalizar a UTF-8/LF primero."

  - "[CORREGIDO Ciclo 2, 2026-10-06] BUG CRÍTICO EN EL PIPELINE DE ETL ORIGINAL
     (src/data_processing/preprocess.py): convert_xmls_to_yolo_labels() asigna class_id a
     cada caja según el ORDEN de config.yaml::valid_classes (cf=0, sz=1, rd=2, tc=3, os=4),
     pero create_dataset_yaml() (llamada después, en el mismo pipeline,
     src/main.py::data_processing()) recalculaba las clases por separado como
     sorted(set(...)) de las clases vistas en los XML = [cf, os, rd, sz, tc] alfabético, y
     escribía ESE orden en dataset.yaml::names — embebido por Ultralytics en el checkpoint
     resultante como `model.names` al entrenar.

     La conclusión original de este known_issue (Ciclo 1, sin dataset real disponible) era
     INCORRECTA: afirmaba que esto 'no afecta a la inferencia del plugin ya integrado porque
     el plugin lee los nombres directamente de results.names... fuente de verdad real'. Con
     el dataset real ya disponible (data/splits/{images,labels}/test/, 2.700 imágenes), se
     confirmó que results.names/model.names del best.pt servido ES la codificación
     alfabética (incorrecta) — exactamente la misma inconsistencia, ya materializada en el
     checkpoint de producción, no solo un riesgo de un reentrenamiento futuro.

     Verificación cuantitativa (best.pt real, 500 imágenes reales de test, 100
     estratificadas por especie, seed=42):
       - decodificando con el `model.names` embebido (orden alfabético, el que usaba el
         plugin hasta este ciclo): accuracy de especie = 195/500 = 39.0%
       - decodificando con el orden real de entrenamiento (config.yaml: cf=0,sz=1,rd=2,
         tc=3,os=4): accuracy de especie = 472/500 = 94.4%
     model.val() sobre el split de test completo (2.700 imágenes) da mAP50=0.871/
     precision=0.876/recall=0.856 — coherente con el 0.87/0.84/0.81 de la memoria,
     confirmando que el detector (regresión de cajas) siempre fue correcto: el bug es
     puramente de decodificación id→nombre, invisible a las métricas de detección
     agnósticas a nombres, y nunca ejercitado por los tests unitarios (usan FakePlugin).

     Corregido en dos sitios:
     1. app/plugins/ml7_cereals_grain_pest_detection/constants.py — nueva constante
        TRAINING_CLASS_ID_TO_CODE con el orden real (config.yaml), documentada con la
        evidencia completa. postprocessing.py::yolo_results_to_dict ya NO usa
        `results.names` para decodificar, solo esta constante.
     2. inbox/a07/codigo/.../src/data_processing/preprocess.py::create_dataset_yaml() —
        ahora recibe `classes` como parámetro (el mismo `valid_classes` de config.yaml que
        ya usa convert_xmls_to_yolo_labels) en vez de recalcular sorted(set(...)) de los
        XML, para que un reentrenamiento futuro desde cero con este código produzca un
        checkpoint ya consistente. src/main.py actualizado para pasar ese parámetro.

     No se ha reentrenado ningún checkpoint — el best.pt servido no cambia (las cajas que
     detecta siguen siendo correctas), solo cambió qué nombre de especie se les asigna al
     decodificar. Verificado end-to-end contra el servidor real (POST /predict) tras el
     fix — ver outputs/a07/verification_report.md sección Ciclo 2."

  - "DEVICE DE INFERENCIA: config/config.yaml fija model.device=0 (GPU) por defecto para
     entrenamiento Y predictor.py::predict_folder() también usa model_cfg.get('device', 0),
     es decir, el pipeline oficial de inferencia del equipo de IA usa GPU por defecto, no CPU.
     El plugin ya integrado fuerza _DEVICE='cpu' con un comentario que afirma incorrectamente
     que 'el source forzaba cpu' — ver auditoría/fix aplicado."

  - "conf_threshold DE NEGOCIO: config/config.yaml::eval.conf=0.28 es el umbral oficial usado
     en evaluate.py/validate_model() y es el valor que replica correctamente el plugin
     (CONF_THRESHOLD=0.28 en constants.py). predictor.py::predict_folder(), en cambio, tiene un
     fallback por defecto distinto (eval_cfg.get('conf', 0.001)) que NO se usa en la práctica
     porque config.yaml siempre define eval.conf=0.28 — no es una discrepancia real, solo un
     default de código muerto si faltara la clave."

  - "imgsz NO SE PASABA EN EL PLUGIN YA INTEGRADO: predictor.py::predict_folder() pasa
     imgsz=img_size (512, el tamaño de entrenamiento) explícitamente a model.predict(). El
     plugin integrado NO pasaba imgsz en absoluto antes de esta sesión (Ultralytics usa 640 por
     defecto) — ver auditoría/fix aplicado, bug de preprocesado real (clase 2 del audit)."

  - "YOLO26n: el nombre usado en config.yaml/memoria ('yolo26n.pt') no es una arquitectura YOLO
     pública estándar en ultralytics==8.4.6 bajo ese nombre exacto a fecha de esta integración;
     no es relevante para el plugin porque éste carga directamente el checkpoint ya entrenado
     (best.pt) vía YOLO(str(path)), sin depender del nombre del modelo base usado para el
     fine-tuning original."
