model_id: ml17_meat_market_price_analysis
sector: carnico
nombre: "Desarrollo de un modelo de análisis de precios de mercado de productos cárnicos"
task_type: time_series_regression
task_type_note: >
  Regresión Ridge (scikit-learn, dentro de un Pipeline con ColumnTransformer ->
  SimpleImputer(median) -> StandardScaler -> Ridge(alpha=1.0)) que predice el precio mensual
  de porcino clase E España (target_price_pigmeat_class_e_es, €/100 kg) a horizonte t+1, a
  partir de 8 features (el propio target en t como lag autorregresivo + 5 covariables
  exógenas + month_sin/month_cos). Formulación one-step-ahead: las observaciones del mes t
  predicen el valor del mes t+1. Seleccionado frente a baselines Naive/Seasonal-Naive y
  frente a Random Forest / XGBoost por mejor MAE/RMSE/MASE/Directional Accuracy fuera de
  muestra (ver reports/official_v1_4/tabular_benchmark.md del código entregado).

  NOTA IMPORTANTE (manifest generado retroactivamente): este modelo ya tenía un plugin
  integrado en app/plugins/ml17_meat_market_price_analysis/ ANTES de que existiera este
  manifest -- viola el orden de trabajo estándar del repo (manifest-extraction siempre antes
  de plugin-integration). Este manifest se generó ahora, a partir del código original
  reordenado en inbox/a17/codigo/a17-retech-lote2-market-price-analysis-carnico/, para poder
  auditar y, si procede, corregir el plugin ya existente contra el código y la memoria reales
  -- ver known_issues para el resultado de esa auditoría.

  El código entregado define también una línea paralela "long_history_v2" (mismo enfoque,
  ventana histórica más larga, otro conjunto de covariables) y líneas supersedidas
  (official_v1_3, long_history, *_exog, *_audit_split). NINGUNA de ellas está integrada ni se
  integra aquí -- el plugin ya desplegado sirve en exclusiva la línea "official_v1_4", que es
  la línea oficial vigente del proyecto (config/official_v1_4.yaml, lifecycle.status:
  official_active, lifecycle.role: current_official_line). Este manifest documenta solo
  official_v1_4.

framework:
  - scikit-learn==1.8.0
  - pandas==3.0.2
  - numpy==2.4.4
  - PyYAML==6.0.3
  - joblib  # usado por el plugin para (de)serializar el Pipeline; no listado explícitamente en
            # requirements.txt del código entregado pero es dependencia transitiva de sklearn
            # y ya está en requirements.txt del repo inference-pan-model.
  # xgboost / matplotlib / websocket-client están en requirements.txt del código entregado
  # mas solo se usan en el benchmark de referencias (xgboost, random_forest) y en
  # notebooks/reporting -- no forman parte de la ruta de inferencia del modelo operativo Ridge.

artifacts:
  folder: models/artifacts/official_v1_4/   # ruta dentro del código entregado
  files:
    - ridge_official_v1_4.pkl        # sklearn.Pipeline completo (preprocessor + Ridge), joblib/pickle
    - ridge_official_v1_4.meta.json  # metadata de entrenamiento (no se sirve en runtime, solo trazabilidad)
  # En el plugin ya integrado: artifacts/ml17_meat_market_price_analysis/ridge_official_v1_4.pkl
  # (ya presente localmente, formato idéntico -- verificado: sklearn.pipeline.Pipeline con
  # ColumnTransformer(SimpleImputer+StandardScaler) + Ridge(alpha=1.0) cargando vía joblib.load).

inputs:
  fixed:
    - name: date
      type: str
      unit: "YYYY-MM-DD"
      description: >
        Fecha de referencia del mes t (observación mensual). Se usa únicamente para derivar
        month_sin/month_cos -- no entra como feature numérica directa al modelo.
    - name: target_price_pigmeat_class_e_es
      type: float
      unit: "€/100kg"
      description: "Precio porcino clase E España en el mes t -- feature autorregresiva (lag)."
      train_range: [140.22, 248.59]   # min/max observado en data/splits/official_v1_4/{train,test}.csv
    - name: eurostat_pigmeat_slaughter_tonnes_es
      type: float
      unit: "miles de toneladas"
      description: "Sacrificio porcino España (Eurostat) en el mes t."
    - name: eurostat_pigmeat_slaughter_tonnes_eu
      type: float
      unit: "miles de toneladas"
      description: "Sacrificio porcino UE (Eurostat) en el mes t."
    - name: cereal_feed_barley_price_monthly
      type: float
      unit: "€/tonelada"
      description: "Precio mensual cebada pienso en el mes t."
    - name: cereal_feed_maize_price_monthly
      type: float
      unit: "€/tonelada"
      description: "Precio mensual maíz pienso en el mes t."
    - name: mapa_porcino_otras_razas_price_monthly
      type: float
      unit: "€/100kg vivo"
      description: "Precio mensual porcino otras razas MAPA en el mes t -- proxy contemporáneo del mismo mercado porcino."
  control: []   # no hay optimización/GA en este modelo -- regresión pura
  derived_if_missing:
    month_sin: "sin(2*pi*mes(date)/12)"
    month_cos: "cos(2*pi*mes(date)/12)"
    # El código original (src/cu05/predict/service.py::_apply_missing_calendar_features)
    # solo las calcula si NO vienen ya informadas en el CSV externo; el plugin ya integrado
    # replica esto correctamente (_seasonal_from_row: usa month_sin/cos si vienen informados,
    # si no los deriva de 'date').

outputs:
  predict_inline:
    - name: y_pred
      type: float
      unit: "€/100kg"
      description: "Precio predicho porcino clase E España en t+1."
  predict_batch:
    - name: y_pred
      type: float
      unit: "€/100kg"
      description: "Precio predicho por fila de CSV, uno por cada observación mensual t -> t+1."
  # Nota: el código CLI original (run_prediction) soporta horizon>1 vía recursión con
  # exog_policy="last_known" (congela covariables exógenas al último valor conocido y solo
  # recalcula month_sin/cos + el lag autorregresivo). El plugin integrado NO expone horizon>1
  # -- solo one-step-ahead (t->t+1), que es el modo operativo nativo y el único evaluado en el
  # benchmark oficial (ver metrics_reported). No se considera un bug: horizon>1 es una
  # funcionalidad CLI adicional no requerida por el contrato ModelPluginPort ni por la memoria
  # (sección "ENTRADAS DEL MODELO": "el mínimo histórico operativo ... es una fila mensual
  # completa ... con esa fila se predice t+1").

training:
  supported: true
  # El código entregado SÍ trae un procedimiento de entrenamiento real y reproducible
  # (src/cu05/training/service.py::run_training + src/cu05/models/ridge.py::build_ridge_pipeline),
  # ejecutable vía CLI (`cu05 official_v1_4 --train` / run_training). No es un modelo
  # "solo artefacto, sin código de reentrenamiento" -- el plugin actualmente integrado
  # (train() -> TrainingNotSupportedError) está IMPLEMENTADO INCORRECTAMENTE: su propio
  # docstring/mensaje de error dice "modelo entrenado externamente", lo cual es falso. Ver
  # known_issues.
  target_column: target_price_pigmeat_class_e_es
  date_column: date
  required_columns:
    # Las columnas que debe traer el CSV de entrenamiento -- igual a train split oficial
    # (data/splits/official_v1_4/train.csv): date + las 6 features "crudas" (target_column
    # incluido, porque se usa como feature autorregresiva) + month_sin/month_cos.
    - date
    - target_price_pigmeat_class_e_es
    - eurostat_pigmeat_slaughter_tonnes_es
    - eurostat_pigmeat_slaughter_tonnes_eu
    - cereal_feed_barley_price_monthly
    - cereal_feed_maize_price_monthly
    - mapa_porcino_otras_razas_price_monthly
    - month_sin
    - month_cos
  procedure: >
    Ajuste supervisado one-step-ahead sobre el split train oficial, ordenado cronológicamente:
    X_train = features[:-1] (todas las filas salvo la última), y_train =
    target_column[1:] (el target desplazado una fila, i.e. el valor en t+1 de cada fila de
    X_train). Pipeline: ColumnTransformer(numeric: SimpleImputer(strategy="median") ->
    StandardScaler()) -> Ridge(alpha). El fit de imputer/scaler se hace EXCLUSIVAMENTE sobre
    el split de entrenamiento (memoria, sección "PROCEDIMIENTO DE ENTRENAMIENTO": "su ajuste
    se realiza exclusivamente sobre el conjunto de entrenamiento"). Requiere al menos 2 filas
    (build_ridge_pipeline / _fit_model levantan ValueError si no).
  hyperparams:
    alpha: 1.0    # config/official_v1_4.yaml: benchmark.tabular_models.ridge.alpha (y config/config.yaml base, coincide)
    imputer_strategy: median
    scaler: StandardScaler
  metrics_returned: [mae, rmse, mase, r2_train, directional_accuracy, n_samples]
  # mae/rmse/r2/directional_accuracy: mismas métricas que reporta la memoria (Tabla 7,
  # "Métricas descriptivas de entrenamiento sobre conjuntos train persistidos"). mase se
  # reporta también porque es la métrica de selección de modelo del proyecto (tabla 6/8).
  source: codigo_entrenamiento  # src/cu05/training/service.py + src/cu05/models/ridge.py
  split_policy: >
    80/20 cronológico estricto, sin mezclar pasado/futuro. official_v1_4: train 2013-05-01 a
    2023-05-01 (121 filas), test 2023-06-01 a 2025-12-01 (31 filas). Memoria, sección
    "ESTRATEGIA DE VALIDACIÓN".

constraints: {}   # no hay restricciones de negocio explícitas (no es un modelo prescriptivo/GA)

metrics_reported:
  # Tabla 8 memoria / data/benchmarks/official_v1_4/full_benchmark.csv -- evaluación fuera de
  # muestra sobre el test split completo (2023-06-01 a 2025-12-01, n=31), usando el artefacto
  # fijo ridge_official_v1_4.pkl y covariables observadas en t para predecir t+1 (idéntico al
  # modo de uso del plugin /predict).
  mae: 4.4605
  rmse: 6.4091
  mase: 0.6405
  directional_accuracy: 0.8710
  r2_oos: 0.9097
  n_test: 31
  source: memoria_tabla_8 + data/benchmarks/official_v1_4/full_benchmark.csv
  # Métricas de TRAIN (no usadas como tolerancia, solo trazabilidad adicional -- memoria Tabla 7):
  train_mae: 5.2979
  train_rmse: 7.1946
  train_mase: 0.7607
  train_r2: 0.9404
  train_directional_accuracy: 0.7833

