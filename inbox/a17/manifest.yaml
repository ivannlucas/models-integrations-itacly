known_issues:
  - >
    BUG CONFIRMADO en app/plugins/ml17_meat_market_price_analysis/plugin.py (antes de esta
    revisión): train() lanzaba TrainingNotSupportedError incondicionalmente, con un mensaje
    ("ml17 usa artefactos Ridge entrenados externamente") que contradice el código entregado
    -- inbox/a17/codigo/.../src/cu05/training/service.py::run_training implementa un
    procedimiento de reentrenamiento real y reproducible (Ridge sobre el split train oficial,
    mismo preprocesado que el artefacto desplegado). app/registry.py tampoco declaraba
    train_request_type/train_response_type para este plugin, igual que el bug #3 encontrado en
    ml21 (ver inbox/a21/manifest.yaml) -- /train habría caído al DTO genérico aunque train()
    se hubiese implementado. Corregido en esta revisión: train() real implementado siguiendo
    exactamente el procedimiento de training.procedure, train_dto.py añadido con
    mlflow_run_id obligatorio (sin default, convención de todo el repo para modelos con
    reentrenamiento real), y registry.py actualizado con train_request_type/train_response_type.
  - >
    Auditoría de predict_inline/predict_batch (plugin.py existente) contra
    src/cu05/predict/service.py y el artefacto .meta.json: NO se encontraron los bugs de tipo
    ml21 (#1 retorno de dict crudo en vez de objeto Pydantic tipado, #2 zero-fill silencioso de
    features). El plugin ya devuelve PredictInlineResponse/PredictBatchResponse tipados, y las
    8 features que construye _build_frame() coinciden exactamente, columna a columna y en el
    mismo orden, con feature_columns del .meta.json del artefacto real
    (models/artifacts/official_v1_4/ridge_official_v1_4.meta.json) y con
    dataset.final_feature_columns de config/official_v1_4.yaml -- no hay un dataset de
    referencia oculto con ~90 columnas como en ml21 (este modelo solo tiene 8 features totales,
    todas explícitas en el request). No se requirió ningún cambio en predict_inline/predict_batch.
  - >
    El código entregado soporta line="long_history_v2" (otra ventana temporal + otro bloque de
    covariables, con inflación) como línea METODOLÓGICA de soporte, no oficial
    (config/long_history_v2.yaml, Directional Accuracy 0.7736 < umbral 80% del KPI, memoria:
    "su función no es sustituir a official_v1_4"). El plugin desplegado sirve únicamente
    official_v1_4 -- correcto, no es un bug, pero se documenta aquí para que quede trazado por
    qué no se integra una segunda línea/modo.
  - >
    requirements.txt del código entregado está en ASCII con CRLF (no UTF-16LE como en otros
    modelos del repo) -- no requirió normalización de encoding.
  - >
    Verificación contra servidor real (18 golden_cases, tolerancia = 2x MAE reportado =
    8.921): 16/18 dentro de tolerancia. Los 2 casos fuera de tolerancia (caso_006, diff=9.55;
    caso_018, diff=26.60) se investigaron comparando la predicción del endpoint /predict
    bit-a-bit contra una invocación directa del mismo .pkl fuera de la API -- ambas coinciden
    exactamente, descartando un bug de wiring/preprocesado. caso_018 (2025-11-01 -> 2025-12-01)
    es el mes con la mayor caída intermensual de todo el dataset (170.45 -> 140.22, -17.7%) --
    un shock de mercado fuera de la variabilidad típica que Ridge (modelo lineal, sin señales
    de ruptura de régimen) no puede capturar; esto coincide con la limitación ya documentada
    en la memoria (sección "SESGOS CONOCIDOS DEL MODELO", punto 3: "riesgo de degradación ante
    cambios de distribución (drift) o episodios de mercado no representados adecuadamente").
    No se ajustó la tolerancia ni se descartó el caso -- ver outputs/a17/verification_report.md.
  - >
    Intento de /train con mlflow_run_id real contra el servidor local: BaseMLflowTracker usa
    por defecto MLFLOW_TRACKING_URI=http://mlflow.mlflow:5000 (hostname interno de k8s), no
    resuelto/alcanzable en este entorno de verificación -- la llamada a tracker.log_params()
    (primera operación de red en train(), antes incluso de leer el CSV) cuelga sin timeout y
    bloquea el único worker de uvicorn. Esto NO es un bug introducido en ml17 -- es el mismo
    patrón (tracker.log_params() como primera llamada de train()) ya usado en ml35/ml25, por
    lo que afecta a cualquier plugin con reentrenamiento real cuando se prueba fuera de un
    clúster con MLflow accesible. Se verificó la lógica de negocio de train() (validación de
    columnas, refit del pipeline, cálculo de métricas) de forma aislada evitando la llamada de
    red; ver outputs/a17/verification_report.md para el detalle.
