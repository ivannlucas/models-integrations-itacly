known_issues:
  - >
    Dataset 100% SINTÉTICO: generado por scripts/data/vid_simulator.py (memoria secciones 3.1-3.2:
    "Ausencia de Datos y Solución propuesta"). No hay telemetría real de parcela; cualquier cifra
    de negocio derivada de este modelo requiere validación pendiente frente a datos reales.
    VOC_ppb admite incluso valores negativos (-18.17), no físicos en un sensor real.
  - >
    TRAIN-SERVING SKEW en GDD_Acumulado y Horas_Humedad_Foliar: en entrenamiento (run_data_processing)
    se calculan sobre la serie completa (GDD acumulado desde el día 1 de la serie, horas de mojado con
    su historial). En inferencia, run_inference trunca a las últimas 168 filas ANTES de aplicar
    apply_feature_engineering, con lo que GDD reinicia a 0 al inicio de la ventana y el contador de
    mojado se reinicia. El plugin DEBE replicar el comportamiento de inferencia (calcular las features
    sobre la ventana de 168 horas) para reproducir el modelo entregado — no "corregirlo" a la versión
    de entrenamiento, o las predicciones diferirán del entregable.
  - >
    El demo data/predictions/inferencia_vid.csv (1 fila, ALTICA 60.91%) proviene de una versión
    anterior del modelo: reejecutando el pipeline actual sobre la misma serie sale ALTICA 93.71%.
    No usar ese CSV como golden case ni como referencia de tolerancia.
  - >
    requirements.txt en UTF-8 con CRLF (no el problema de UTF-16LE visto en otros modelos). Solo
    normalizar a LF antes de usarlo en pip/pip-audit; el encoding es correcto.
  - >
    Ninguna serie de test tiene < 168 filas (mínimo 274), por lo que la rama de PADDING del código
    (serie < 168: repite la primera fila) no está cubierta por los golden_cases. Esa rama solo se
    ejercita en inputs reales cortos y debe verificarse manualmente en plugin-integration.
  - >
    Reproducibilidad numérica de los golden_cases verificada ejecutando el código entregado original
    (inbox/a03/codigo, con sus .keras) en tf 2.17.0 / keras 3.12.4 / numpy 1.26.4. La tolerancia
    float_rtol=0.01 da margen a diferencias de softmax/sigmoid entre versiones de TF/Keras en el
    entorno de verificación; si el entorno coincide, la diferencia esperada es ~1e-7.
  - >
    training.supported=true es un hecho del código (train.py completo, retraining desde cero), pero
    NO implica que el usuario final tenga acceso a reentrenamiento: en el resto de modelos integrados
    el usuario no dispone de fine-tuning, y los artefactos fijos de s3 nunca se sobreescriben. La
    decisión de sesión manifest fue implementar train() como un único endpoint que reentrena TODO
    desde cero (ver training.note); el coste computacional es alto (50 epochs x 3 arquitecturas) y
    el plugin-integration debe ajustar la lógica desacoplada s3/mlflow.
