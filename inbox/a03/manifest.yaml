model_id: ml3-wine-disease-pest-forecast
sector: vitivinicola
nombre: "Desarrollo de un modelo Deep Ensemble Learning para la predicción de enfermedades y plagas en viñas"
task_type: timeseries_multiclass_multitask
  # Deep Ensemble Learning (LSTM + CNN-1D + BiGRU) con doble salida por red:
  #   - clasificación multiclase (softmax, 11 clases) combinada por Soft Voting (media de probabilidades)
  #   - regresión de severidad (sigmoid, 0-1) combinada por media aritmética
  # El input funcional es una ventana temporal de 168 horas (7 días) por ID_Serie.
framework:
  - tensorflow>=2.15.0   # requirements.txt: tensorflow>=2.15.0, keras>=3.0.0 (backend Keras 3)
  - keras>=3.0.0
  - scikit-learn>=1.3.0  # StandardScaler, LabelEncoder, train_test_split
  - joblib>=1.3.0
  - pandas>=2.0.0
  - numpy>=1.24.0
  - pyarrow>=14.0.0      # lectura/escritura parquet
  - PyYAML>=6.0.0

artifacts:
  folder: models/artifacts/
  files:
    - M1_LSTM.keras      # LSTM 8->BN->Dropout0.2->LSTM32->BN; salidas out_class(softmax 11) + out_reg(sigmoid)
    - M2_CNN.keras       # Conv1D 16->BN->Conv1D 32->BN->GAP->Dropout0.2; salidas out_class + out_reg
    - M3_BiGRU.keras     # BiGRU 16->BN->Dropout0.2->Dense8(relu); salidas out_class + out_reg
    - scaler.pkl         # StandardScaler ajustado solo sobre X_train (12 features de modelo)
    - label_encoder.pkl  # LabelEncoder, 11 clases: ALTICA BLACK_ROT BOTRYTIS EMPOASCA ERINOSIS ESCA
                         # HEALTHY LOBESIA MILDIU OIDIO RED_MITE
  # NOTA: no hay extra_files_metrics. Los CSV de models/metrics/* (metrics_DEL_test.csv, etc.) son
  # solo referencia documental de models/metrics/DEL/metrics_DEL_test.csv (fuente de metrics_reported);
  # ningún código de runtime los carga, así que NO se suben a S3 ni entran en ArtifactStore.

inputs:
  window:
    # El input funcional NO es una fila aislada: es una ventana temporal por ID_Serie.
    seq_len: 168             # 7 días x 24h, granularidad horaria (1 registro/hora)
    truncate_pad: >
      run_inference agrupa por ID_Serie; si la serie tiene >168 filas usa las últimas 168
      (tail); si tiene <168, repite la primera fila hasta completar 168 (padding). Solo
      después trunca la ventana aplica apply_feature_engineering.
    note: >
      No existe en el código entregado un modo de predicción de "una sola fila": el mínimo
      operativo es una serie horaria continua de 168 horas. predict_inline recibe
      {"rows": [>=168 filas horarias]} (misma forma que ml46): el plugin toma la última ventana
      de 168 y devuelve una predicción; predict_batch recorre todas las ventanas válidas.
      Los golden_cases referencian la ventana por (ID_Serie, timestamp final) contra
      data/raw/data_vin_raw.parquet.
  fixed:
    - name: Fecha
      type: datetime
      description: "Timestamp de cada registro horario. Obligatorio (de él salen Hora_Sin/Hora_Cos); debe ser ordenable dentro de cada serie."
    - name: Temp_Amb_C
      type: float
      unit: "°C"
      description: "Temperatura ambiente medida por sensor meteorológico."
      train_range: [-8.7, 41.1]
    - name: Hum_Rel_Pct
      type: float
      unit: "%"
      description: "Humedad relativa ambiental; clave para punto de rocío y microgotas."
      train_range: [3.0, 100.0]
    - name: Lluvia_mm
      type: float
      unit: mm
      description: "Pluviosidad en la ventana de muestreo."
      train_range: [0.0, 13.8]
    - name: Viento_kmh
      type: float
      unit: "km/h"
      description: "Velocidad media del viento; dispersa esporas de Oídio/Mildiu/Botrytis."
      train_range: [0.0, 51.6]
    - name: Hum_Suelo_Pct
      type: float
      unit: "%"
      description: "Humedad volumétrica del terreno."
      train_range: [18.42, 35.0]
    - name: pH_Suelo
      type: float
      unit: pH
      description: "Acidez del terreno."
      train_range: [5.92, 7.51]
    - name: CO2_ppm
      type: float
      unit: ppm
      description: "Dióxido de carbono por millón; relacionado con transpiración foliar."
      train_range: [352.92, 522.54]
    - name: VOC_ppb
      type: float
      unit: ppb
      description: "Compuestos orgánicos volátiles emitidos por la planta (biomarcador temprano de infección)."
      train_range: [-18.17, 1983.29]   # admite valores negativos — artefacto del simulador, ver known_issues

  optional:
    - name: ID_Serie
      type: int
      description: >
        Identificador único de serie temporal (sensor/parcela). Recomendado: agrupa las series
        y evita mezclar ventanas entre IDs (leakage). Si no viene, todo el input se trata como
        una sola serie.
    - name: Parcela_ID
      type: string
      description: "Metadato de parcela (no se usa como feature)."

  derived_if_missing:
    Horas_Humedad_Foliar: "horas consecutivas con (Lluvia_mm>0.1 O Hum_Rel_Pct>90.0), por serie; se reinicia a 0 cuando la hoja se seca"
    GDD_Acumulado: "integral térmica diaria acumulada: por cada día, max(0, T_media_dia - 10.0), acumulado por serie desde el inicio del input"
    Hora_Sin: "sin(2*pi*hora/24) a partir de Fecha (hora del día)"
    Hora_Cos: "cos(2*pi*hora/24) a partir de Fecha"

outputs:
  predict_inline:
    # Una fila de salida por ventana (última posición de cada ventana de 168 horas).
    - name: diagnostico_ia
      type: string
      values: [ALTICA, BLACK_ROT, BOTRYTIS, EMPOASCA, ERINOSIS, ESCA, HEALTHY, LOBESIA, MILDIU, OIDIO, RED_MITE]
      description: "Patología/estado ganador tras Soft Voting del ensemble (clase con mayor probabilidad media)."
    - name: confianza_clasificacion
      type: float
      unit: "-"
      description: >
        Probabilidad media (0-1) de la clase ganadora. El código original la formatea como string
        "XX.XX%" (columna Confianza_Clasificacion); el plugin debe devolver float 0-1.
    - name: grado_severidad
      type: float
      unit: "-"
      description: "Grado de infección medio de las 3 regresiones (media aritmética de las salidas out_reg), 0-1."
    - name: tratamiento_recomendado
      type: string
      description: >
        Protocolo químico/biológico/biotecnológico/cultural según la clase predicha, desde
        base_conocimiento_tratamientos (config.yaml, editable). Determinista dado la clase.
    - name: fecha_evaluacion
      type: datetime
      description: "Timestamp de la última fila de la ventana (hora actual de la predicción)."

training:
  supported: true  # train.py completo entregado (retraining desde cero del ensemble, no fine-tuning incremental)
  target_column: [Etiqueta_Num, Grado_Infeccion]
    # Etiqueta_Num = LabelEncoder(Clase_Entrenamiento); Grado_Infeccion = target de regresión (0-1)
  required_columns:
    # train.py consume el dataset YA PROCESADO (data/processed/data_vin_processed.parquet) o los
    # splits pre-existentes en data/splits/; el plugin debe aplicar apply_feature_engineering sobre
    # la serie completa antes de entrenar (igual que a40). Columnas mínimas del contrato:
    - Temp_Amb_C
    - Hum_Rel_Pct
    - Lluvia_mm
    - Viento_kmh
    - Horas_Humedad_Foliar
    - GDD_Acumulado
    - Hum_Suelo_Pct
    - pH_Suelo
    - CO2_ppm
    - VOC_ppb
    - Hora_Sin
    - Hora_Cos
    - Clase_Entrenamiento
    - Etiqueta_Num
    - Grado_Infeccion
    - ID_Serie
    - Fecha
  source: codigo_entrenamiento  # src/main.py::train + src/training/train.py + config/config.yaml
  hyperparams:
    # Valores reales de config.yaml + src/training/train.py (coinciden con memoria sección 6.2).
    window_size: 168
    batch_size: 512
    epochs: 50
    early_stopping_patience: 2          # EarlyStopping sobre val_loss, restore_best_weights=True
    optimizer: Adam
    learning_rate: 0.001                # idéntico para las 3 arquitecturas
    loss:
      out_class: sparse_categorical_crossentropy
      out_reg: mse
    loss_weights: {out_class: 1.0, out_reg: 1.0}
    metrics: {out_class: [accuracy], out_reg: [mae]}
    scaler: StandardScaler              # fit solo sobre train
    split: {test_size: 0.30, val_test_ratio: 0.50, random_seed: 42, stratify_by_series: true}
    architectures:
      lstm: {lstm_1: 8, dropout: 0.2, lstm_2: 32}
      cnn: {filters_1: 16, kernel_1: 3, filters_2: 32, kernel_2: 3, dropout: 0.2}
      bigru: {gru_units: 16, dropout: 0.2, dense_units: 8}
  source: codigo_entrenamiento  # config/config.yaml::params + src/training/train.py::build_models
  metrics_returned:
    - accuracy          # classification_report sobre el split de test (save_metrics=True)
    - precision_macro
    - recall_macro
    - f1_macro
    - mae               # regresión (grado de infección)
    - mse
    - r2
  source: codigo_entrenamiento  # src/training/train.py::run_training(save_metrics=True)
  note: >
    DECISIÓN (sesión manifest): train() se implementa como un ÚNICO endpoint que REENTRENA TODO
    desde cero — pipeline original completo: apply_feature_engineering sobre la serie completa,
    ventanas de 168, StandardScaler refit, las 3 arquitecturas Keras y el ensemble, con los
    hiperparámetros de config.yaml. No es fine-tuning incremental. El código original advierte de
    que el entrenamiento en CPU es x3-5 más lento. El desacoplo s3/mlflow se respeta igualmente:
    los artefactos fijos viven en s3://<STORAGE_BUCKET>/artifacts/fixed/<ARTIFACT_FOLDER_NAME>/ y
    NUNCA se sobreescriben por el usuario; los artefactos del reentrenamiento se sirven/almacenan
    solo vía mlflow_run_id (BaseMLflowTracker). El reentrenamiento por usuario no está expuesto hoy
    en la plataforma (coherente con el resto de modelos integrados), pero train() debe quedar
    implementado (supported: true) y devolver las métricas de metrics_returned.

constraints:
  ventana_minima_horas: 168
  clases_fijas: 11  # clases del label_encoder.pkl entregado; la arquitectura out_class se construye con num_classes=len(le.classes_)
  descripcion: >
    No hay restricción de negocio tipo umbral de seguridad alimentaria (estilo "PU>=13" de a35).
    La restricción dura es de integridad de entrada: cada serie debe aportar al menos 168 registros
    horarios continuos; con menos, el código entregado hace padding repitiendo la primera fila
    (predicción degradada). El skill plugin-integration debe valorar una excepción de dominio
    propia si el histórico es insuficiente.

# Métricas REALES del ensemble entregado sobre test hold-out (70/15/15 por ID_Serie, seed 42).
# Coinciden memoria (Tablas 11 y 12) con el artefacto models/metrics/DEL/metrics_DEL_test.csv.
metrics_reported:
  dataset: test_hold_out
  split: 70/15/15_por_serie
  random_seed: 42
  n_series_test: 149
  n_samples_test_windows: 224374     # sumatorio de (len_serie - 168) sobre las 149 series de test
  classification:
    accuracy: 0.7052
    precision_macro: 0.7494
    recall_macro: 0.7198
    f1_macro: 0.7259
    f1_weighted: 0.7055
  regression:
    mae: 0.0610
    rmse: 0.0936
    r2: 0.8903
  source: models/metrics/DEL/metrics_DEL_test.csv + memoria secciones 7.3 (Tablas 11 y 12)

# 20 casos extraídos ejecutando el CÓDIGO ENTREGADO ORIGINAL (inbox/a03/codigo) sobre las últimas
