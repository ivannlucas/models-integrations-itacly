      raw_snapshot: {Temp_Amb_C: 16.6, Hum_Rel_Pct: 91.0, Lluvia_mm: 0.6, Viento_kmh: 2.2, CO2_ppm: 446.21, VOC_ppb: 69.54, Hum_Suelo_Pct: 34.03, pH_Suelo: 6.857}
    expected:
