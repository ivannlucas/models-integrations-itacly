# expected = salida del modelo entregado (reproducibilidad del plugin), NO la etiqueta real:
# donde pred != true_last_class se documenta con "nota". El "input" referencia la ventana por
# (ID_Serie + timestamp final) contra data/raw/data_vin_raw.parquet en vez de embeber 168 filas
# (mismo patrón que a46). raw_snapshot = última fila de la ventana, solo para lectura humana.
